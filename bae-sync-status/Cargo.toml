[package]
name = "bae-sync-status"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_sync_status"
path = "src/lib.rs"

[dependencies]
# The error categories a person is shown for a failed sync start.
bae-diagnostics = { workspace = true }
# The records' schema, which the test fixtures build on.
bae-records = { workspace = true, optional = true }
# The people's schema, which the test fixtures build on.
bae-people = { workspace = true, optional = true }
# The store every read and write runs through.
bae-store = { workspace = true }
# The counts the copy reset notice names.
bae-types = { workspace = true }
# The store: its connection, schema migrations, sync, files and live queries.
coven = { workspace = true }
rusqlite = { workspace = true }
# How a failure to record a failed start says it holds a bug already reported.
bae-util = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bae-store = { workspace = true, features = ["test-utils"] }
bae-records = { workspace = true, features = ["test-utils"] }
bae-people = { workspace = true, features = ["test-utils"] }
coven = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[features]
default = []
# Test stores on the sync status's schema, for the tests of every crate that
# builds on this one. Dev/test-only: a production build never enables it.
test-utils = [
    "bae-store/test-utils",
    "dep:bae-records",
    "bae-records/test-utils",
    "dep:bae-people",
    "bae-people/test-utils",
    "coven/test-utils",
]

[lints]
workspace = true
