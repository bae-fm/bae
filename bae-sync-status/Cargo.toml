[package]
name = "bae-sync-status"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_sync_status"
path = "src/lib.rs"

[dependencies]
# The error categories a person is shown for a failed sync start.
bae-diagnostics = { workspace = true }
# The records' namespaces the pending rows name.
bae-records = { workspace = true }
# The avatars namespace the pending rows name.
bae-people = { workspace = true }
# The store every read and write runs through.
bae-store = { workspace = true }
# The store: its connection, schema migrations, sync, files and live queries.
coven = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
bae-store = { workspace = true, features = ["test-utils"] }
bae-records = { workspace = true, features = ["test-utils"] }
bae-people = { workspace = true, features = ["test-utils"] }
coven = { workspace = true, features = ["test-utils"] }
uuid = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[features]
default = []
# Test stores on the sync status's schema, for the tests of every crate that
# builds on this one. Dev/test-only: a production build never enables it.
test-utils = [
    "bae-store/test-utils",
    "bae-records/test-utils",
    "bae-people/test-utils",
    "coven/test-utils",
]

[lints]
workspace = true
