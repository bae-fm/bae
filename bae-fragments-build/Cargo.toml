[package]
name = "bae-fragments-build"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_fragments_build"
path = "src/lib.rs"

[dependencies]
# The schema the fragments are checked against, as data.
bae-schema-manifest = { workspace = true }
# coven's schema as SQL text, which needs no coven runtime.
coven-schema = { workspace = true }
# The schema probe, whose test prepares every readable object.
sqlive-reads = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The compiler that checks and composes each crate's fragments.
sqlive-compose = { workspace = true, features = ["compiler"] }
# The macro calls' SQL, read from each source file the compiler read.
syn = { workspace = true }
proc-macro2 = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
