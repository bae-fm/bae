[package]
name = "bae-fragments-build"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_fragments_build"
path = "src/lib.rs"

[dependencies]
# The schema the fragments are checked against, as data.
bae-schema-manifest = { workspace = true }
# What the compiler must know of coven, which needs no coven runtime.
coven-schema = { workspace = true, features = ["compiler"] }
serde = { workspace = true, features = ["derive"] }
# The compiler that checks and composes each crate's fragments.
sqlive-compose = { workspace = true, features = ["compiler"] }
toml = { workspace = true }

[lints]
workspace = true
