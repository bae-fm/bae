# std's File locks return Unsupported on Android; lock through coven::FileLock,
# which takes flock on every Unix.
disallowed-methods = [
    { path = "std::fs::File::lock", reason = "Unsupported on Android; use coven::FileLock" },
    { path = "std::fs::File::lock_shared", reason = "Unsupported on Android; use coven::FileLock" },
    { path = "std::fs::File::try_lock", reason = "Unsupported on Android; use coven::FileLock" },
    { path = "std::fs::File::try_lock_shared", reason = "Unsupported on Android; use coven::FileLock" },
    { path = "std::fs::File::unlock", reason = "Unsupported on Android; use coven::FileLock" },
    # A dropped caller of `blocking` drops its work's panic with the join
    # handle, so nothing hears how the work ended; bae's work runs under
    # Diagnostics::blocking, whose bug sink hears it. The panic hook reports
    # the panic either way.
    { path = "coven::task::blocking", reason = "use Diagnostics::blocking, or blocking_completing with a bug sink" },
    # A dropped JoinHandle drops its work's panic the same way.
    { path = "tokio::task::spawn_blocking", reason = "use Diagnostics::blocking, or blocking_completing with a bug sink" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "use Diagnostics::blocking, or blocking_completing with a bug sink" },
    # A task or thread nothing joins ends on a panic with no one told, and
    # what it served waits on it. The panic hook reports the panic; bae's
    # work runs under a reported spawner, which ends what the work served:
    # Diagnostics::spawn_reported, spawn_ending, spawn_thread_reported or
    # run_on_thread, WorkerThread::spawn, or below bae-diagnostics coven's
    # task::spawn_owned with the owner's bug sink. A test starts its tasks and
    # threads through bae_util::test_spawn.
    { path = "tokio::spawn", reason = "use Diagnostics::spawn_reported, which ends what a task that panics served" },
    { path = "tokio::task::spawn", reason = "use Diagnostics::spawn_reported, which ends what a task that panics served" },
    { path = "std::thread::spawn", reason = "use Diagnostics::spawn_thread_reported or WorkerThread::spawn, which end what a thread that panics served" },
    { path = "std::thread::Builder::spawn", reason = "use Diagnostics::spawn_thread_reported or WorkerThread::spawn, which end what a thread that panics served" },
    { path = "tokio::runtime::Handle::spawn", reason = "use Diagnostics::spawn_reported or spawn_ending, which end what a task that panics served" },
    { path = "tokio::runtime::Runtime::spawn", reason = "use Diagnostics::spawn_reported or spawn_ending, which end what a task that panics served" },
    { path = "tokio::task::JoinSet::spawn", reason = "use Diagnostics::spawn_reported or spawn_ending, unless the set joins every task and hears its panic" },
    { path = "tokio::task::JoinSet::spawn_on", reason = "use Diagnostics::spawn_reported or spawn_ending, unless the set joins every task and hears its panic" },
    { path = "tokio_util::task::TaskTracker::spawn", reason = "use Diagnostics::spawn_reported or spawn_ending and track what it returns, unless the tracker's owner waits for it before it ends and the work reports its own panic" },
    { path = "tokio_util::task::TaskTracker::spawn_on", reason = "use Diagnostics::spawn_reported or spawn_ending and track what it returns, unless the tracker's owner waits for it before it ends and the work reports its own panic" },
    { path = "tokio_util::task::TaskTracker::spawn_local", reason = "use Diagnostics::spawn_reported or spawn_ending and track what it returns, unless the tracker's owner waits for it before it ends and the work reports its own panic" },
    { path = "tokio_util::task::TaskTracker::spawn_local_on", reason = "use Diagnostics::spawn_reported or spawn_ending and track what it returns, unless the tracker's owner waits for it before it ends and the work reports its own panic" },
    { path = "tokio_util::task::TaskTracker::spawn_blocking", reason = "use Diagnostics::blocking, unless the tracker's owner waits for it before it ends" },
    { path = "tokio_util::task::TaskTracker::spawn_blocking_on", reason = "use Diagnostics::blocking, unless the tracker's owner waits for it before it ends" },
    # A worker thread started from a bridge export would outlive the call
    # that made it. A worker thread starts at the composition roots that own
    # it, which mark the call.
    { path = "bae_util::worker_thread::WorkerThread::spawn", reason = "start a worker thread only where its owner is built, and mark the call" },
    # A runtime outlives the function that builds it, and the work on it ends
    # on a panic with no one told, unless its owner reports and stops it. A
    # runtime is built only at a composition root, which keeps and stops it.
    # Builder::new_current_thread and new_multi_thread are not listed:
    # #[tokio::test] and #[tokio::main] expand to them in generated code that
    # no mark can cover, so owner-construction-check.toml keeps those two names.
    { path = "tokio::runtime::Runtime::new", reason = "take the runtime handle the composition root owns: a runtime is built only at a composition root" },
    # Handle::current takes whatever runtime the caller happens to run on, so
    # the work it starts has no owner that stops it. Take the handle as an
    # argument.
    { path = "tokio::runtime::Handle::current", reason = "take a tokio::runtime::Handle as an argument instead of the ambient runtime" },
    { path = "tokio::runtime::Handle::try_current", reason = "take a tokio::runtime::Handle as an argument instead of the ambient runtime" },
    # A local task is a spawn nobody joins, like the spawns above.
    { path = "tokio::task::spawn_local", reason = "use Diagnostics::spawn_reported, which ends what a task that panics served" },
    # Every id bae makes comes from the IdSource its owner was handed, so the
    # clock a test controls times it; the one place that makes ids is
    # bae-util's time_ordered_ids. Parsing an id and Uuid::new_v5 stay free.
    { path = "uuid::Uuid::new_v4", reason = "take a coven::IdSource and call new_id; only bae-util's time_ordered_ids makes ids" },
    { path = "uuid::Uuid::new_v7", reason = "take a coven::IdSource and call new_id; only bae-util's time_ordered_ids makes ids" },
    { path = "uuid::Uuid::now_v7", reason = "take a coven::IdSource and call new_id; only bae-util's time_ordered_ids makes ids" },
    # A builder from Coven::builder has coven's random ids and the system clock
    # unless its caller sets its own. bae's libraries are written with its
    # time-ordered ids on one clock, made once by the process's composition;
    # the one function that takes a builder is bae-store's store_builder, which
    # takes the clock and the ids together. Tests take theirs through
    # bae_store::test_devices.
    { path = "coven::Coven::builder", reason = "use bae_store::store_builder, which sets the clock and the ids together" },
    # coven::Coven::new builds the installation over the OS keychain, where
    # keys, credentials and saved restore codes live: the person's login
    # keychain, iCloud Keychain (which reaches every device on their Apple
    # account) or their phone's Block Store. The one place bae calls it is
    # bae-app-dir's AppDir::coven, which the apps' host starts over. Code that
    # only needs an installation takes Coven::in_memory; a bridge host for a
    # test is BridgeHost::with_test_keyring. BridgeHost::new, the host the apps
    # start over that keychain, is not listed: uniffi's scaffolding calls it
    # in generated code that no mark can cover, so scripts/check-test-keychain.py
    # keeps that name.
    { path = "coven::Coven::new", reason = "use AppDir::coven in production and coven::Coven::in_memory in tests: Coven::new reaches the person's own keychain" },
    # The person's home holds ~/.bae, their libraries. bae's directory is an
    # AppDir the app is handed, and a test puts its own under a temporary
    # folder.
    { path = "dirs::home_dir", reason = "take an AppDir: the person's home holds their own libraries" },
    # A screen's fast values travel on a KeyedValueStream the app pulls, and the
    # bridge builds one only where it feeds it: the screens module, and
    # keyed_values.rs, which defines the stream beside its writer. Code anywhere
    # else gets a stream from those.
    { path = "bae_bridge::keyed_values::KeyedValueStream::new", reason = "build a stream in the bridge's screens module or in keyed_values.rs, beside its writer" },
    { path = "bae_bridge::keyed_values::StreamValues::new", reason = "build a stream's values in the bridge's screens module or in keyed_values.rs, beside its writer" },
    # A Mac asks its owner whether to accept an AirPlay connection whenever
    # something connects to its AirPlay receiver, and the mDNS browse is what
    # leads a test to one. Only bae-cast's Cast and AirPlay discoveries make
    # the daemon; tests list receivers through RendererDiscovery::reported and
    # the fake receivers on 127.0.0.1.
    { path = "mdns_sd::ServiceDaemon::new", reason = "only bae-cast's Cast and AirPlay discoveries browse mDNS; tests list receivers through RendererDiscovery::reported and the fakes on 127.0.0.1" },
    # File system. bae reads and writes a library's files only through coven,
    # which checks that an original still has its recorded size and
    # modification time and reads a stored file from the cache or storage;
    # code that opens the path itself skips those checks and can't read a file
    # kept only in storage. These are every call that opens, reads, writes,
    # lists or stats a path, whichever library makes it. The code that touches
    # only files coven does not own marks its one function with
    # #[expect(clippy::disallowed_methods)] and a reason: the person's folders
    # the scan, the watcher, the import and the preview read before coven
    # records their files, the folders export and save write to, the temporary
    # copies made for readers that open a path, bae's own directory and its
    # catalog image cache, a debug UI test's fixture files, and the repo files
    # bae's dev tools read and write. A test makes its folders and files
    # through bae_util::test_files::TestFolder and reads committed fixtures
    # through read_fixture or fixture_entries. A path that exists on one
    # platform only takes allow-invalid: clippy on another platform finds no
    # such function and has nothing to gate, and clippy on the platform that
    # has it still gates every call.
