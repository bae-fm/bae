# std's File locks return Unsupported on Android; lock through coven::FileLock,
# which takes flock on every Unix.
disallowed-methods = [
    { path = "std::fs::File::lock", reason = "Unsupported on Android; use coven::FileLock" },
    { path = "std::fs::File::lock_shared", reason = "Unsupported on Android; use coven::FileLock" },
    { path = "std::fs::File::try_lock", reason = "Unsupported on Android; use coven::FileLock" },
    { path = "std::fs::File::try_lock_shared", reason = "Unsupported on Android; use coven::FileLock" },
    { path = "std::fs::File::unlock", reason = "Unsupported on Android; use coven::FileLock" },
    # A dropped caller of `blocking` drops its work's panic with the join
    # handle, so nothing hears how the work ended; bae's work runs under
    # Diagnostics::blocking, whose bug sink hears it. The panic hook reports
    # the panic either way.
    { path = "coven::task::blocking", reason = "use Diagnostics::blocking, or blocking_completing with a bug sink" },
    # A dropped JoinHandle drops its work's panic the same way.
    { path = "tokio::task::spawn_blocking", reason = "use Diagnostics::blocking, or blocking_completing with a bug sink" },
    { path = "tokio::runtime::Handle::spawn_blocking", reason = "use Diagnostics::blocking, or blocking_completing with a bug sink" },
    # A task or thread nothing joins ends on a panic with no one told, and
    # what it served waits on it. The panic hook reports the panic; bae's
    # work runs under a reported spawner, which ends what the work served:
    # Diagnostics::spawn_reported, spawn_ending, spawn_thread_reported or
    # run_on_thread, WorkerThread::spawn, or below bae-diagnostics coven's
    # task::spawn_owned with the owner's bug sink.
    { path = "tokio::spawn", reason = "use Diagnostics::spawn_reported, which ends what a task that panics served" },
    { path = "tokio::task::spawn", reason = "use Diagnostics::spawn_reported, which ends what a task that panics served" },
    { path = "std::thread::spawn", reason = "use Diagnostics::spawn_thread_reported or WorkerThread::spawn, which end what a thread that panics served" },
    { path = "std::thread::Builder::spawn", reason = "use Diagnostics::spawn_thread_reported or WorkerThread::spawn, which end what a thread that panics served" },
    { path = "tokio::runtime::Handle::spawn", reason = "use Diagnostics::spawn_reported or spawn_ending, which end what a task that panics served" },
    { path = "tokio::runtime::Runtime::spawn", reason = "use Diagnostics::spawn_reported or spawn_ending, which end what a task that panics served" },
    { path = "tokio::task::JoinSet::spawn", reason = "use Diagnostics::spawn_reported or spawn_ending, unless the set joins every task and hears its panic" },
    { path = "tokio::task::JoinSet::spawn_on", reason = "use Diagnostics::spawn_reported or spawn_ending, unless the set joins every task and hears its panic" },
    { path = "tokio_util::task::TaskTracker::spawn", reason = "use Diagnostics::spawn_reported or spawn_ending and track what it returns, unless the tracker's owner waits for it before it ends and the work reports its own panic" },
    { path = "tokio_util::task::TaskTracker::spawn_on", reason = "use Diagnostics::spawn_reported or spawn_ending and track what it returns, unless the tracker's owner waits for it before it ends and the work reports its own panic" },
    { path = "tokio_util::task::TaskTracker::spawn_local", reason = "use Diagnostics::spawn_reported or spawn_ending and track what it returns, unless the tracker's owner waits for it before it ends and the work reports its own panic" },
    { path = "tokio_util::task::TaskTracker::spawn_local_on", reason = "use Diagnostics::spawn_reported or spawn_ending and track what it returns, unless the tracker's owner waits for it before it ends and the work reports its own panic" },
    { path = "tokio_util::task::TaskTracker::spawn_blocking", reason = "use Diagnostics::blocking, unless the tracker's owner waits for it before it ends" },
    { path = "tokio_util::task::TaskTracker::spawn_blocking_on", reason = "use Diagnostics::blocking, unless the tracker's owner waits for it before it ends" },
]
