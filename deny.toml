[advisories]
ignore = [
    # rsa: phantom dep from sqlx-macros-core optional mysql backend, never compiled.
    # https://github.com/rust-lang/cargo/issues/10801
    "RUSTSEC-2023-0071",
    # rustls-webpki: DoS in CRL parsing. Fix in 0.103.13, not yet on crates.io.
    # Remove once `cargo update -p rustls-webpki` picks up the fix.
    "RUSTSEC-2026-0104",
    # paste: unmaintained proc-macro crate. Compile-time only; no runtime exposure.
    "RUSTSEC-2024-0436",
    # rand: unsound only when a custom global logger races rand::rng(). We use no
    # custom global logger, so this unsoundness path is never reached.
    "RUSTSEC-2026-0097",
    # fxhash: unmaintained hasher, pinned by hashers <- tracing-etw (the Windows
    # ETW logging layer). No upgrade path until tracing-etw drops it.
    "RUSTSEC-2025-0057",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    # FFmpeg's underlying C libs (wrapped by ffmpeg-next / ffmpeg-sys-next) are
    # LGPL-2.1+; bae bundles them and links dynamically (not statically embedded).
    # r-efi is LGPL-2.1-or-later as well.
    "LGPL-2.1",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    # ffmpeg-next / ffmpeg-sys-next: WTFPL is their Rust wrapper's own license.
    "WTFPL",
    # uniffi crates (MPL-2.0) and option-ext (MPL-2.0) — copyleft only when
    # the covered files themselves are modified and distributed.
    "MPL-2.0",
    # webpki-root-certs: CA certificate data, CDLA-Permissive-2.0 (open data license).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# bae's own workspace crates are unpublished (`publish = false`) and not yet
# licensed; skip them so the allow-list above only gates third-party deps.
private = { ignore = true }

[bans]
# Warn on duplicate versions of the same crate — duplicates bloat binaries and
# can hide version-skew bugs. Deny is too strict for a workspace with many
# transitive deps; warn keeps it visible without blocking upgrades.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # bae's uniffi fork (adds Swift task-cancellation support).
    "https://github.com/bae-fm/uniffi-rs",
    # coven: cloud-sync library, private.
    "https://github.com/bae-fm/coven",
    # bae's rustls-platform-verifier fork (Android platform-verifier changes),
    # pinned by coven-storage.
    "https://github.com/bae-fm/rustls-platform-verifier",
]
