name: claude rules review (matrix)

# Manual caller for the Claude-backed shared per-rule matrix reviewer.
# The shared workflow discovers applicable rules from each rule's `paths`
# frontmatter; bae excludes every-bug-fix.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
      checkout_ref:
        description: "bae ref to check out (PR head SHA)"
        required: true

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: hideselfview/agent-instructions/.github/workflows/claude-rules-review.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
      checkout_ref: ${{ inputs.checkout_ref }}
      project: bae
      exclude: '["every-bug-fix-starts-with-a-failing-test"]'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
