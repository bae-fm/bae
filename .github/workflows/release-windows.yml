name: Release Windows

# Cuts a Windows release of both editions × both architectures (x64 + arm64):
# an independent 0.N version line (windows-v* tags). Each versioned release
# carries a Velopack build per edition/arch: a Setup.exe that installs per-user
# and auto-updates, a Portable.zip that runs in place, and the update feed
# (releases.<channel>.json + the .nupkg) the in-app updater reads. Each
# edition/arch pair uses a distinct channel (win, win-arm64, baeium-win,
# baeium-win-arm64) so the feeds don't collide in the one shared windows-v*
# release; the installed package's baked channel selects its own feed, so an
# arm64 install never updates onto an x64 build. Each arch builds natively on
# its own runner — no cross-compiling. Signing engages when the
# WINDOWS_CODESIGN_PFX_BASE64 secret is set; a build without it is unsigned
# and SmartScreen warns on first launch.
# Edition differs only by exe/packId/channel; the baeium dll omits the
# OAuth entry points, which the C# app detects at runtime via
# NativeBae.SupportsOAuthProviders().

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2 (blank = auto-increment from windows-v* tags)'
        required: false
        default: ''

concurrency:
  group: release-windows
  cancel-in-progress: true

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      pack_version: ${{ steps.calc.outputs.pack_version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Determine version
      id: calc
      run: |
        # Explicit input wins; otherwise auto-increment the last component of the
        # latest windows-v* tag (independent of the other platforms). First → 0.1.
        if [[ -n "${{ inputs.version }}" ]]; then
          VERSION="${{ inputs.version }}"
        else
          LATEST=$(git tag -l "windows-v*" | sed 's/^windows-v//' | sort -V | tail -1)
          if [[ -z "$LATEST" ]]; then
            VERSION="0.1"
          else
            VERSION="${LATEST%.*}.$(( ${LATEST##*.} + 1 ))"
          fi
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        # Velopack requires a full SemVer; the tag stays windows-v0.N but the
        # package version is normalized to 0.N.0.
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
          PACK_VERSION="$VERSION.0"
        else
          PACK_VERSION="$VERSION"
        fi
        echo "pack_version=$PACK_VERSION" >> "$GITHUB_OUTPUT"
        echo "::notice::Windows release version $VERSION (pack $PACK_VERSION, build ${{ github.run_number }})"

  build:
    name: Build ${{ matrix.edition }} ${{ matrix.arch.name }} package
    runs-on: ${{ matrix.arch.runner }}
    needs: calculate-version
    env:
      FFMPEG_VERSION: v8.1.2-bae7
      BAE_ENVIRONMENT: production
      BAE_DATADOG_SITE: ${{ secrets.BAE_DATADOG_SITE }}
      BAE_DATADOG_CLIENT_TOKEN: ${{ secrets.BAE_DATADOG_CLIENT_TOKEN }}
      BAE_SENTRY_DSN: ${{ secrets.BAE_SENTRY_DSN }}
    strategy:
      fail-fast: false
      matrix:
        edition: [full, baeium]
        # Each arch builds natively on its own runner (the target is the
        # runner's host arch), mirroring windows.yml's verification matrix.
        arch:
          - name: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rid: win-x64
            msbuild_platform: x64
            ffmpeg_arch: x86_64
            sdk_bin_arch: x64
          - name: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            rid: win-arm64
            msbuild_platform: ARM64
            ffmpeg_arch: aarch64
            sdk_bin_arch: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Resolve edition + arch (cargo features, exe + packaging names)
        shell: pwsh
        run: |
          # full = OAuth providers on (bae.exe); baeium = no features (baeium.exe).
          # The C# app is identical for both; only the dll's exported symbols differ.
          # PACK_ID/CHANNEL are baked into the Velopack package so each installed
          # edition/arch reads only its own feed; SETUP_NAME/PORTABLE_NAME give the
          # website stable asset URLs. The x64 channels keep their pre-arm names
          # (win, baeium-win); arm64 appends -arm64.
          $arch = "${{ matrix.arch.name }}"
          $channelArch = if ($arch -eq "x64") { "" } else { "-$arch" }
          if ("${{ matrix.edition }}" -eq "baeium") {
            "BAE_BRIDGE_FEATURES=desktop" | Out-File $env:GITHUB_ENV -Append
            "BAE_BRIDGE_CSHARP_BINDINGS_DIR=bae-bridge/csharp-bindings-baeium" | Out-File $env:GITHUB_ENV -Append
            "MSBUILD_BRIDGE_BINDINGS_DIR=..\bae-bridge\csharp-bindings-baeium" | Out-File $env:GITHUB_ENV -Append
            "EXE_NAME=baeium.exe" | Out-File $env:GITHUB_ENV -Append
            "STAGE_DIR=baeium" | Out-File $env:GITHUB_ENV -Append
            "PACK_ID=baeium" | Out-File $env:GITHUB_ENV -Append
            "CHANNEL=baeium-win$channelArch" | Out-File $env:GITHUB_ENV -Append
            "SETUP_NAME=baeium-windows-$arch-setup.exe" | Out-File $env:GITHUB_ENV -Append
            "PORTABLE_NAME=baeium-windows-$arch-portable.zip" | Out-File $env:GITHUB_ENV -Append
          } else {
            "BAE_BRIDGE_FEATURES=oauth-providers,desktop" | Out-File $env:GITHUB_ENV -Append
            "BAE_BRIDGE_CSHARP_BINDINGS_DIR=bae-bridge/csharp-bindings-full" | Out-File $env:GITHUB_ENV -Append
            "MSBUILD_BRIDGE_BINDINGS_DIR=..\bae-bridge\csharp-bindings-full" | Out-File $env:GITHUB_ENV -Append
            "EXE_NAME=bae.exe" | Out-File $env:GITHUB_ENV -Append
            "STAGE_DIR=bae" | Out-File $env:GITHUB_ENV -Append
            "PACK_ID=bae" | Out-File $env:GITHUB_ENV -Append
            "CHANNEL=win$channelArch" | Out-File $env:GITHUB_ENV -Append
            "SETUP_NAME=bae-windows-$arch-setup.exe" | Out-File $env:GITHUB_ENV -Append
            "PORTABLE_NAME=bae-windows-$arch-portable.zip" | Out-File $env:GITHUB_ENV -Append
          }

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.arch.target }}

      - name: Install sccache
        # .cargo/config.toml sets rustc-wrapper = "sccache", so cargo needs it on
        # PATH. The action ships a native binary per runner arch; choco's LLVM
        # would be x64-only, so libclang comes from the LLVM preinstalled at the
        # same path on both Windows runners (see windows.yml).
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set LIBCLANG_PATH (LLVM pre-installed on both Windows runners)
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch bae-ffmpeg (Windows ${{ matrix.arch.ffmpeg_arch }})
        shell: pwsh
        run: |
          $dist = "$PWD\bae-ffmpeg\dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $url = "https://github.com/bae-fm/bae-ffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-windows-${{ matrix.arch.ffmpeg_arch }}.zip"
          curl.exe -fsSL --retry 5 --retry-delay 3 $url -o ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath $dist -Force
          New-Item -ItemType Directory -Force -Path "$dist\lib" | Out-Null
          Copy-Item "$dist\bin\*.lib" "$dist\lib\" -Force
          echo "FFMPEG_DIR=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$dist\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "$dist\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install uniffi-bindgen-cs
        run: cargo install --git https://github.com/NordSecurity/uniffi-bindgen-cs.git --tag 'v0.11.0+v0.31.0' uniffi-bindgen-cs --locked

      - name: Build the Windows bridge (release, per edition/arch)
        shell: bash
        run: BAE_BRIDGE_TARGET=${{ matrix.arch.target }} ./bae-bridge/build-windows.sh --release

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Add Windows SDK bin to PATH (makepri for resources.pri)
        shell: pwsh
        run: |
          # makepri.exe ships in the Windows 10 SDK but isn't on PATH on the
          # runner; the csproj's GenerateResourcesPri target invokes it bare
          # (see windows.yml). Add the newest SDK bin for this runner's arch.
          $makepri = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\${{ matrix.arch.sdk_bin_arch }}\makepri.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makepri) { throw "makepri.exe not found in the Windows SDK" }
          Add-Content -Path $env:GITHUB_PATH -Value $makepri.Directory.FullName
          Write-Host "makepri on PATH: $($makepri.FullName)"

      - name: Build the WinUI app (Release, self-contained)
        # Self-contained so the zip runs without a separate .NET install. MSBuild
        # (not `dotnet build`) — the WinUI XAML markup compiler needs the full VS
        # toolchain (WMC1509). Publish to a known dir we then stage from.
        shell: pwsh
        run: |
          $gitCommit = (git rev-parse --short HEAD).Trim()
          msbuild bae-windows\bae-windows.csproj /restore /t:Publish `
            /p:Configuration=Release /p:Platform=${{ matrix.arch.msbuild_platform }} `
            /p:SelfContained=true /p:RuntimeIdentifier=${{ matrix.arch.rid }} `
            /p:PublishDir=publish\ `
            /p:Version=${{ needs.calculate-version.outputs.pack_version }} `
            /p:BAE_ENVIRONMENT="$env:BAE_ENVIRONMENT" `
            /p:BAE_DATADOG_SITE="$env:BAE_DATADOG_SITE" `
            /p:BAE_DATADOG_CLIENT_TOKEN="$env:BAE_DATADOG_CLIENT_TOKEN" `
            /p:BAE_SENTRY_DSN="$env:BAE_SENTRY_DSN" `
            /p:BAE_GIT_COMMIT="$gitCommit" `
            /p:BridgeBindingsDir="$env:MSBUILD_BRIDGE_BINDINGS_DIR"

      - name: Build sentry-native
        if: matrix.edition == 'full'
        shell: pwsh
        run: |
          $version = "0.13.8"
          curl.exe -fsSL --retry 5 --retry-delay 3 "https://github.com/getsentry/sentry-native/releases/download/$version/sentry-native.zip" -o sentry-native.zip
          Expand-Archive -Path sentry-native.zip -DestinationPath sentry-native-src -Force
          cmake -S sentry-native-src -B sentry-native-build -A ${{ matrix.arch.msbuild_platform }} `
            -DSENTRY_BACKEND=crashpad `
            -DSENTRY_BUILD_SHARED_LIBS=ON `
            -DSENTRY_BUILD_TESTS=OFF `
            -DSENTRY_BUILD_EXAMPLES=OFF `
            -DSENTRY_BUILD_BENCHMARKS=OFF
          cmake --build sentry-native-build --config RelWithDebInfo

      - name: Stage the app + native runtime DLLs
        shell: pwsh
        run: |
          $stage = "$PWD\stage\$env:STAGE_DIR"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # The published WinUI app (exe + .NET runtime + managed deps).
          $pub = "bae-windows\publish"
          if (-not (Test-Path $pub)) { Write-Host "FAIL: publish dir not found at $pub"; exit 1 }
          Copy-Item "$pub\*" $stage -Recurse -Force

          # The generated bridge DLLs are resolved from the app directory.
          Copy-Item "target-windows\${{ matrix.arch.target }}\release\bae_bridge.dll" $stage -Force
          Copy-Item "target-windows\${{ matrix.arch.target }}\release\uniffi_bae_bridge.dll" $stage -Force

          # FFmpeg DLLs (the bridge links them). Self-contained as of
          # v8.1.2-bae7 — their codec deps and toolchain runtime are linked in.
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $stage -Force
          if ("${{ matrix.edition }}" -eq "full") {
            $sentryDll = Get-ChildItem sentry-native-build -Recurse -Filter sentry.dll | Select-Object -First 1
            $crashpadHandler = Get-ChildItem sentry-native-build -Recurse -Filter crashpad_handler.exe | Select-Object -First 1
            if (-not $sentryDll) { Write-Host "FAIL: sentry.dll not found"; exit 1 }
            if (-not $crashpadHandler) { Write-Host "FAIL: crashpad_handler.exe not found"; exit 1 }
            Copy-Item $sentryDll.FullName $stage -Force
            Copy-Item $crashpadHandler.FullName $stage -Force
          }

          # Name the launcher per edition (bae.exe / baeium.exe); vpk packs the
          # staged dir into the installer/portable/feed below.
          $exe = Get-ChildItem $stage -Filter "bae-windows.exe" | Select-Object -First 1
          if (-not $exe) { Write-Host "FAIL: bae-windows.exe not found in staged output"; exit 1 }
          Rename-Item $exe.FullName $env:EXE_NAME
          Write-Host "PASS: staged $env:STAGE_DIR"

      - name: Upload Windows symbols to Sentry
        if: matrix.edition == 'full'
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SENTRY_AUTH_TOKEN) -or [string]::IsNullOrWhiteSpace($env:SENTRY_ORG) -or [string]::IsNullOrWhiteSpace($env:SENTRY_PROJECT)) {
            Write-Host "Sentry symbol upload skipped: SENTRY_AUTH_TOKEN, SENTRY_ORG, or SENTRY_PROJECT is unset"
            exit 0
          }
          npm install -g @sentry/cli
          sentry-cli debug-files upload --org "$env:SENTRY_ORG" --project "$env:SENTRY_PROJECT" "$PWD\stage\$env:STAGE_DIR"

      - name: Install the Velopack CLI (vpk)
        # Must match the Velopack NuGet version the app references; the library
        # and CLI are released in lockstep. Global dotnet tools are on PATH here.
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Prepare code-signing material
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: |
          # Signing runs when WINDOWS_CODESIGN_PFX_BASE64 is set: decode it to a
          # .pfx the pack step signs with. Unset: builds are unsigned and
          # SmartScreen warns on first launch (noted in the release body).
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) {
            Write-Host "code signing skipped: WINDOWS_CODESIGN_PFX_BASE64 unset"
            exit 0
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          Write-Host "code signing enabled"

      - name: Pack the Velopack release (installer + portable + feed)
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $packArgs = @(
            "pack",
            "--packId", $env:PACK_ID,
            "--packVersion", "${{ needs.calculate-version.outputs.pack_version }}",
            "--packDir", "$PWD\stage\$env:STAGE_DIR",
            "--mainExe", $env:EXE_NAME,
            "--channel", $env:CHANNEL,
            "--packTitle", $env:PACK_ID,
            "--outputDir", "$PWD\velopack"
          )
          if (Test-Path "$env:RUNNER_TEMP\codesign.pfx") {
            $packArgs += @("--signParams", "/f $env:RUNNER_TEMP\codesign.pfx /p $env:WINDOWS_CODESIGN_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256")
          }
          vpk @packArgs
          if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: vpk pack exited $LASTEXITCODE"; exit 1 }

          # Rename ONLY the Setup and Portable outputs for stable website URLs.
          # releases.<channel>.json references the .nupkg by name, so the feed and
          # nupkg keep vpk's names.
          $setup = Get-ChildItem "$PWD\velopack" -Filter "*Setup.exe" | Select-Object -First 1
          $portable = Get-ChildItem "$PWD\velopack" -Filter "*Portable.zip" | Select-Object -First 1
          if (-not $setup) { Write-Host "FAIL: Setup.exe not produced"; exit 1 }
          if (-not $portable) { Write-Host "FAIL: Portable.zip not produced"; exit 1 }
          Rename-Item $setup.FullName $env:SETUP_NAME
          Rename-Item $portable.FullName $env:PORTABLE_NAME

          # Pin the naming assumptions at release time: fail loud if the feed, the
          # package, or the renamed outputs are missing, rather than shipping a
          # broken feed.
          $nupkg = Get-ChildItem "$PWD\velopack" -Filter "*.nupkg" | Select-Object -First 1
          if (-not (Test-Path "$PWD\velopack\releases.$env:CHANNEL.json")) { Write-Host "FAIL: releases.$env:CHANNEL.json missing"; exit 1 }
          if (-not $nupkg) { Write-Host "FAIL: .nupkg missing"; exit 1 }
          if (-not (Test-Path "$PWD\velopack\$env:SETUP_NAME")) { Write-Host "FAIL: $env:SETUP_NAME missing"; exit 1 }
          if (-not (Test-Path "$PWD\velopack\$env:PORTABLE_NAME")) { Write-Host "FAIL: $env:PORTABLE_NAME missing"; exit 1 }
          Write-Host "PASS: packed $env:PACK_ID ($env:CHANNEL)"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bae-windows-release-${{ matrix.edition }}-${{ matrix.arch.name }}
          path: velopack/
          retention-days: 30

  publish:
    name: Publish release
    needs: [calculate-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout the built commit
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Download all editions' and arches' packages
      # Filenames are distinct across editions and arches (packId/channel are in
      # them), so merging every velopack/ dir into one is collision-free.
      uses: actions/download-artifact@v8
      with:
        pattern: bae-windows-release-*
        path: release-assets
        merge-multiple: true

    - name: Create git tag
      run: |
        VERSION="${{ needs.calculate-version.outputs.version }}"
        if ! git rev-parse "windows-v$VERSION" >/dev/null 2>&1; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "windows-v$VERSION"
          git push origin "windows-v$VERSION"
        fi

    # One immutable release per windows-v* tag carries both editions, so `vpk
    # upload github` (which creates/publishes its own release, once per channel)
    # can't be used — two invocations against one immutable tag would collide.
    # Create the release once with every asset via softprops instead, mirroring
    # release-macos.yml.
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: windows-v${{ needs.calculate-version.outputs.version }}
        files: release-assets/*
        body: |
          Windows builds, x64 and arm64. The setup installer installs bae
          per-user and keeps itself up to date; the portable zip runs in place.
          These builds are not code-signed, so SmartScreen may warn on first
          launch.
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify the update feeds and installers are attached
      # The in-app updater's GithubSource scans releases newest-first for one
      # carrying releases.<channel>.json; a release missing it (other platforms')
      # is skipped. Confirm both channels' feeds and setup installers resolve as
      # release assets before the website redeploys against them.
      run: |
        TAG="windows-v${{ needs.calculate-version.outputs.version }}"
        base="https://github.com/${{ github.repository }}/releases/download/$TAG"
        for asset in \
          releases.win.json \
          releases.win-arm64.json \
          releases.baeium-win.json \
          releases.baeium-win-arm64.json \
          bae-windows-x64-setup.exe \
          bae-windows-arm64-setup.exe \
          baeium-windows-x64-setup.exe \
          baeium-windows-arm64-setup.exe; do
          url="$base/$asset"
          curl -fsIL --retry 5 --retry-delay 3 "$url" -o /dev/null
          echo "asset reachable: $url"
        done
        echo "PASS: both feeds and setup installers are attached"

  refresh-website:
    # Republish the website so its build-time latest.json and download buttons
    # resolve to this new release. Replaces the old rolling `-latest` releases:
    # immutable releases make those impossible to update — a tag, once used by an
    # immutable release, can't be reused, and an immutable release's assets can't
    # be replaced — so the site resolves the newest versioned release instead.
    name: Refresh website downloads
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Trigger website deploy
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run deploy-website.yml --repo ${{ github.repository }} --ref main
