name: Screenshots

# Captures the shots on macOS and Android (`builds shots`, from agent-instructions
# at the commit .github/actions/install-builds pins), checks them against the
# design boards and publishes the report to GitHub Pages. Setup steps mirror
# each platform's build workflow (ci.yml / android-build.yml) — the
# scripts do the building; the jobs provision toolchains.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A capture takes about half an hour, and main moves faster than that, so
# cancelling a running capture for each push meant none ever finished and the
# gallery never published. A run that has started now finishes. GitHub keeps at
# most one run waiting in a group and replaces it with each newer push, so a
# push while a capture runs queues one capture, which takes the newest main.
# (The capture holds a macOS runner for its whole length, so queueing at most
# one keeps the Build workflow's macOS and iOS jobs from starving.) A pull
# request's run is replaced by the next push to it: only the newest commit of a
# branch is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: Capture macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-macos
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/install-builds
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Capture
        # The runner has no one at it, so the scenes shown in their windows,
        # which bring the app to the front, render here too.
        run: builds shots capture --platform mac --windows --out shots-out
      - uses: actions/upload-artifact@v4
        with:
          name: shots-macos
          path: |
            shots-out/*.png
            shots-out/*.json
          if-no-files-found: error

  android:
    name: Capture Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-android
      - name: Cache Android FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: bae-ffmpeg/android
          key: ffmpeg-android-${{ hashFiles('scripts/build-ffmpeg-android.sh', 'scripts/bae-ffmpeg-release') }}
      - name: Download Android FFmpeg (on cache miss)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg-android.sh
      - uses: ./.github/actions/install-builds
      - name: Capture
        run: builds shots capture --platform android --out shots-out
      - uses: actions/upload-artifact@v4
        with:
          name: shots-android
          path: |
            shots-out/*.png
            shots-out/*.json
          if-no-files-found: error

  check:
    name: Check shots against boards
    needs: [macos, android]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/install-builds
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: all-shots
          merge-multiple: true
      # builds shots keeps the Chrome build it pins in the build volume's
      # caches folder, which the install action makes. The install
      # action names the builds commit, so the cache key follows that file.
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/builds-volume/caches/builds-shots
          key: builds-shots-cache-${{ hashFiles('.github/actions/install-builds/action.yml') }}
      # macOS has SF Pro, which the Mac boards are set in. A hard failure fails
      # this job, which is the pull request's check; the step summary holds the
      # findings.
      - name: Check
        run: builds shots check --shots all-shots --out site --sha "${GITHUB_SHA::9}"
      # The report is the run's artifact whether or not the check passed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-report
          path: site
          if-no-files-found: error

  publish:
    name: Publish report
    # Pages shows main's report only, whether or not its check passed.
    if: always() && github.event_name == 'push' && needs.check.result != 'skipped'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shots-report
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
