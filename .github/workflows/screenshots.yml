name: Screenshots

# Captures the shared UI scenes on macOS and Android (scripts/shots/*)
# and publishes the scene x platform gallery to GitHub Pages. Setup steps mirror
# each platform's build workflow (ci.yml / android-build.yml) — the
# scripts do the building; the jobs provision toolchains.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: Capture macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-macos
      - uses: ./.github/actions/setup-rust
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Capture
        run: ./scripts/shots/macos.sh shots-out
      - uses: actions/upload-artifact@v4
        with:
          name: shots-macos
          path: shots-out/*.png
          if-no-files-found: error

  android:
    name: Capture Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-android
      - name: Cache Android FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: bae-ffmpeg/android
          key: ffmpeg-android-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Download Android FFmpeg (on cache miss)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg-android.sh
      - name: Capture
        run: ./scripts/shots/android.sh shots-out
      - uses: actions/upload-artifact@v4
        with:
          name: shots-android
          path: shots-out/*.png
          if-no-files-found: error

  gallery:
    name: Publish gallery
    needs: [macos, android]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: all-shots
      - name: Build gallery site
        run: python3 scripts/shots/gallery.py all-shots site --sha "${GITHUB_SHA::9}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
