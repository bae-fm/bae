name: Screenshots

# Captures the shared UI scenes on macOS, iOS, and Android (scripts/shots/*)
# and publishes the scene x platform gallery to GitHub Pages. Setup steps mirror
# each platform's build workflow (ci.yml / ios.yml / android-build.yml) — the
# scripts do the building; the jobs provision toolchains.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: Capture macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-macos
      - uses: ./.github/actions/setup-rust
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Capture
        run: ./scripts/shots/macos.sh shots-out
      - uses: actions/upload-artifact@v4
        with:
          name: shots-macos
          path: shots-out/*.png
          if-no-files-found: error

  ios:
    name: Capture iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-macos
      - uses: ./.github/actions/setup-rust
      - name: Cache cross-built iOS FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: bae-ffmpeg/ios
          key: ffmpeg-ios-${{ hashFiles('scripts/build-ffmpeg-ios.sh') }}
      - name: Build iOS FFmpeg (on cache miss)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg-ios.sh
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Capture
        run: ./scripts/shots/ios.sh shots-out
      - uses: actions/upload-artifact@v4
        with:
          name: shots-ios
          path: shots-out/*.png
          if-no-files-found: error

  android:
    name: Capture Android
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux
      - uses: ./.github/actions/setup-rust
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android NDK + SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Cache cross-built Android FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: bae-ffmpeg/android
          key: ffmpeg-android-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}
      - name: Build Android FFmpeg (on cache miss)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg-android.sh
      - name: Capture
        run: ./scripts/shots/android.sh shots-out
      - uses: actions/upload-artifact@v4
        with:
          name: shots-android
          path: shots-out/*.png
          if-no-files-found: error

  gallery:
    name: Publish gallery
    needs: [macos, ios, android]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: all-shots
      - name: Build gallery site
        run: python3 scripts/shots/gallery.py all-shots site --sha "${GITHUB_SHA::9}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
