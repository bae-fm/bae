name: Screenshots

# Captures the shots on macOS and Android (bae-shots), checks them against the
# design boards and publishes the report to GitHub Pages. Setup steps mirror
# each platform's build workflow (ci.yml / android-build.yml) — the
# scripts do the building; the jobs provision toolchains.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A capture takes about half an hour, and main moves faster than that, so
# cancelling a running capture for each push meant none ever finished and the
# gallery never published. A run that has started now finishes. GitHub keeps at
# most one run waiting in a group and replaces it with each newer push, so a
# push while a capture runs queues one capture, which takes the newest main.
# (The capture holds a macOS runner for its whole length, so queueing at most
# one keeps the Build workflow's macOS and iOS jobs from starving.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: Capture macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-macos
      - uses: ./.github/actions/setup-rust
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Capture
        # The runner has no one at it, so the scenes shown in their windows,
        # which bring the app to the front, render here too.
        run: scripts/cargo.sh run -p bae-shots -- capture --platform mac --windows --out shots-out
      - uses: actions/upload-artifact@v4
        with:
          name: shots-macos
          path: |
            shots-out/*.png
            shots-out/*.json
          if-no-files-found: error

  android:
    name: Capture Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-android
      - name: Cache Android FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: bae-ffmpeg/android
          key: ffmpeg-android-${{ hashFiles('scripts/build-ffmpeg-android.sh', 'scripts/bae-ffmpeg-release') }}
      - name: Download Android FFmpeg (on cache miss)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg-android.sh
      - name: Capture
        run: scripts/cargo.sh run -p bae-shots -- capture --platform android --out shots-out
      - uses: actions/upload-artifact@v4
        with:
          name: shots-android
          path: |
            shots-out/*.png
            shots-out/*.json
          if-no-files-found: error

  check:
    name: Check shots against boards
    needs: [macos, android]
    runs-on: macos-26
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - name: Point bae-shots at the Chrome cache
        run: echo "BAE_SHOTS_CHROME_CACHE=$RUNNER_TEMP/chrome-for-testing" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: all-shots
          merge-multiple: true
      # The Chrome build is pinned in bae-shots' render/chrome.rs; the cache
      # key follows that file.
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/chrome-for-testing
          key: chrome-for-testing-${{ hashFiles('bae-shots/src/render/chrome.rs') }}
      # macOS has SF Pro, which the Mac boards are set in.
      - name: Check
        run: scripts/cargo.sh run -p bae-shots -- check --shots all-shots --out site --sha "${GITHUB_SHA::9}"
      # The report is the run's artifact whether or not the check passed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-report
          path: site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
