name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'design/system/tokens.json'
      - 'design/theme.toml'
      - 'bae-theme/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: website/package-lock.json

    # The site's build runs theme-gen (npm run theme), which cargo builds.
    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust

    - name: Install Node dependencies
      working-directory: ./website
      run: npm ci

    # Vercel builds here, where theme-gen can run, and is given the built
    # output: a deploy of the source would build on Vercel, which has no
    # Rust and no files outside website/.
    - name: Pull the Vercel project's settings
      working-directory: ./website
      run: npx vercel@65.15.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

    # The Vercel project's own build command may run astro build alone, so
    # the tokens are written first.
    - name: Write the design system's tokens
      working-directory: ./website
      run: npm run theme

    - name: Build website
      working-directory: ./website
      run: npx vercel@65.15.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Deploy to Vercel
      working-directory: ./website
      run: npx vercel@65.15.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
