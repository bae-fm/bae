name: Release macOS

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to release (leave blank for HEAD)'
        required: false
        default: ''
      version:
        description: 'Version, e.g. 0.2 (blank = auto-increment from macos-v* tags)'
        required: false
        default: ''

concurrency:
  group: release-macos
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ inputs.commit || github.sha }}

    - name: Determine version
      id: calc
      run: |
        # Explicit input wins; otherwise auto-increment the last component of the
        # latest macos-v* tag (independent of android-v*). First release → 0.1.
        if [[ -n "${{ inputs.version }}" ]]; then
          VERSION="${{ inputs.version }}"
        else
          LATEST=$(git tag -l "macos-v*" | sed 's/^macos-v//' | sort -V | tail -1)
          if [[ -z "$LATEST" ]]; then
            VERSION="0.1"
          else
            VERSION="${LATEST%.*}.$(( ${LATEST##*.} + 1 ))"
          fi
        fi

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "::notice::macOS release version $VERSION (build ${{ github.run_number }})"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.commit || github.sha }}

  build:
    name: Build macOS (${{ matrix.edition }})
    runs-on: macos-26
    needs: [calculate-version, ci]
    permissions:
      contents: read
    env:
      BAE_ENVIRONMENT: production
      BAE_DATADOG_SITE: ${{ secrets.BAE_DATADOG_SITE }}
      BAE_DATADOG_CLIENT_TOKEN: ${{ secrets.BAE_DATADOG_CLIENT_TOKEN }}
      BAE_SENTRY_DSN: ${{ secrets.BAE_SENTRY_DSN }}
    strategy:
      # Build both editions from the one source: full (bae, OAuth + iCloud) and
      # baeium (S3-only). Each only uploads its signed DMG + appcast as an
      # artifact; the publish job creates the one macos-v* release from both, so
      # they share no remote state and run in parallel.
      matrix:
        edition: [full, baeium]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.commit || github.sha }}

    - name: Resolve edition (features, identity, signing, feeds)
      run: |
        # The full edition keeps every value it ships today; the baeium edition
        # (baeium) gets a sibling identity (.baeium bundle id), the S3-only feature
        # set, the baeium entitlements (no iCloud container), and its own DMG name
        # + Sparkle feed so the two update streams never cross.
        if [ "${{ matrix.edition }}" = "baeium" ]; then
          {
            echo "BAE_BRIDGE_FEATURES=desktop"
            echo "BUNDLE_ID=fm.bae.desktop.baeium"
            echo "PRODUCT_NAME=baeium"
            echo "ENTITLEMENTS=bae-macos/bae/bae/bae-baeium.entitlements"
            echo "DMG_NAME=baeium-macos.dmg"
            echo "APPCAST_FILE=appcast-baeium.xml"
            echo "APPCAST_TITLE=baeium Updates"
            echo "ARTIFACT_NAME=baeium-macOS-native-signed"
            echo "SUFEED_URL=https://raw.githubusercontent.com/${{ github.repository }}/appcast/appcast-baeium.xml"
          } >> "$GITHUB_ENV"
        else
          {
            echo "BAE_BRIDGE_FEATURES=oauth-providers,cloudkit,desktop"
            echo "BUNDLE_ID=fm.bae.desktop"
            echo "PRODUCT_NAME=bae"
            echo "ENTITLEMENTS=bae-macos/bae/bae/bae.entitlements"
            echo "DMG_NAME=bae-macos.dmg"
            echo "APPCAST_FILE=appcast.xml"
            echo "APPCAST_TITLE=bae Updates"
            echo "ARTIFACT_NAME=bae-macOS-native-signed"
            echo "SUFEED_URL=https://raw.githubusercontent.com/${{ github.repository }}/appcast/appcast.xml"
          } >> "$GITHUB_ENV"
        fi

    - name: Setup macOS environment
      uses: ./.github/actions/setup-macos

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust

    - name: Install xcodegen
      run: brew install xcodegen

    - name: Set release version
      run: |
        VERSION="${{ needs.calculate-version.outputs.version }}"
        COVEN_REV=$(scripts/coven-rev.sh)
        {
          echo "BAE_VERSION=$VERSION"
          echo "BAE_GIT_COMMIT=$(git rev-parse --short HEAD)"
          echo "BAE_COVEN_REV=$COVEN_REV"
        } >> "$GITHUB_ENV"
        sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"$VERSION\"/" bae-macos/bae/project.yml
        MACOS_MIN=$(grep 'macOS:' bae-macos/bae/project.yml | head -1 | sed 's/.*"\(.*\)"/\1/')
        # Empty here would stamp an empty sparkle:minimumSystemVersion into the appcast.
        if [[ -z "$MACOS_MIN" ]]; then echo "could not read macOS deployment target from project.yml" >&2; exit 1; fi
        echo "MACOS_MIN=$MACOS_MIN" >> "$GITHUB_ENV"
        echo "Building version $VERSION (macOS $MACOS_MIN+)"

    - name: Build Rust bridge
      run: |
        ./bae-bridge/build-macos.sh --release
        ./bae-bridge/install-swift-bindings.sh macos

    - name: Generate Xcode project
      working-directory: ./bae-macos/bae
      run: xcodegen

    - name: Set version in Info.plist
      run: |
        # CFBundleShortVersionString is the user-facing 0.N; CFBundleVersion is the
        # monotonic build number Sparkle and the App Store use to order builds.
        BUILD_NUMBER="${{ github.run_number }}"
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $BAE_VERSION" bae-macos/bae/bae/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" bae-macos/bae/bae/Info.plist
        /usr/libexec/PlistBuddy -c "Set :BaeGitCommit $BAE_GIT_COMMIT" bae-macos/bae/bae/Info.plist
        /usr/libexec/PlistBuddy -c "Set :BaeCovenRev $BAE_COVEN_REV" bae-macos/bae/bae/Info.plist
        # Per-edition: display name (bae / baeium) and the Sparkle feed this build
        # checks for updates (each edition has its own feed so they never cross).
        /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $PRODUCT_NAME" bae-macos/bae/bae/Info.plist
        /usr/libexec/PlistBuddy -c "Set :SUFeedURL $SUFEED_URL" bae-macos/bae/bae/Info.plist

    - name: Build app
      run: |
        # PRODUCT_BUNDLE_IDENTIFIER + PRODUCT_NAME overrides on the xcodebuild
        # command line win over the pbxproj, giving the baeium build its sibling
        # identity (fm.bae.desktop.baeium) and app name (baeium.app). Signing is
        # CODE_SIGNING_ALLOWED=NO here; the bundle is codesigned by hand below
        # with the edition's entitlements.
        xcodebuild -project bae-macos/bae/bae.xcodeproj \
          -scheme bae \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
          PRODUCT_NAME="$PRODUCT_NAME" \
          DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
          LIBRARY_SEARCH_PATHS="${FFMPEG_DIR}/lib /opt/bae-ffmpeg/lib /opt/homebrew/lib" \
          build
        echo "APP_PATH=build/Build/Products/Release/${PRODUCT_NAME}.app" >> "$GITHUB_ENV"

    - name: Package dSYM
      if: matrix.edition == 'full'
      run: |
        mkdir -p target
        DSYM_PATH="build/Build/Products/Release/${PRODUCT_NAME}.app.dSYM"
        if [[ ! -d "$DSYM_PATH" ]]; then
          echo "dSYM bundle not found at $DSYM_PATH" >&2
          find build/Build/Products/Release -maxdepth 1 -name "*.dSYM" -print || true
          exit 1
        fi
        ditto -c -k --sequesterRsrc --keepParent "$DSYM_PATH" target/bae.dSYM.zip
        echo "BAE_DSYM_PATH=$DSYM_PATH" >> "$GITHUB_ENV"

    - name: Upload dSYM to Sentry
      if: matrix.edition == 'full'
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      run: |
        if [[ -z "${SENTRY_AUTH_TOKEN:-}" || -z "${SENTRY_ORG:-}" || -z "${SENTRY_PROJECT:-}" ]]; then
          echo "Sentry dSYM upload skipped: SENTRY_AUTH_TOKEN, SENTRY_ORG, or SENTRY_PROJECT is unset"
          exit 0
        fi
        curl -sL https://sentry.io/get-cli/ | bash
        sentry-cli debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" "$BAE_DSYM_PATH"

    - name: Bundle dylibs into app
      run: ./bae-macos/scripts/bundle_dylibs.sh "$APP_PATH"

    - name: Embed provisioning profile
      # Only the full edition needs it: the provisioning profile authorizes the
      # iCloud container its entitlements request. The baeium build drops the
      # iCloud-container entitlement, so it signs (Developer ID) without one.
      if: matrix.edition == 'full'
      env:
        PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
      run: |
        echo "$PROVISIONING_PROFILE" | base64 --decode > "$APP_PATH/Contents/embedded.provisionprofile"

    - name: Import Apple certificate
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      run: |
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
        security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"

    - name: Sign app bundle
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        IDENTITY=$(security find-identity -v -p codesigning | grep "$APPLE_TEAM_ID" | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "Using signing identity: $IDENTITY"

        # Sign Sparkle.framework nested components
        SPARKLE_PATH="$APP_PATH/Contents/Frameworks/Sparkle.framework"
        # Shipping without it means a broken updater; fail rather than silently skip.
        if [[ ! -d "$SPARKLE_PATH" ]]; then
          echo "Sparkle.framework not found in app bundle — auto-update would be broken" >&2
          exit 1
        fi
        if [[ -d "$SPARKLE_PATH" ]]; then
          for xpc in "$SPARKLE_PATH/Versions/B/XPCServices"/*.xpc; do
            if [[ -d "$xpc" ]]; then
              echo "Signing $xpc"
              codesign --force --sign "$IDENTITY" --options runtime "$xpc"
            fi
          done
          [[ -f "$SPARKLE_PATH/Versions/B/Autoupdate" ]] && \
            codesign --force --sign "$IDENTITY" --options runtime "$SPARKLE_PATH/Versions/B/Autoupdate"
          [[ -d "$SPARKLE_PATH/Versions/B/Updater.app" ]] && \
            codesign --force --sign "$IDENTITY" --options runtime "$SPARKLE_PATH/Versions/B/Updater.app"
          codesign --force --sign "$IDENTITY" --options runtime "$SPARKLE_PATH"
        fi

        # Sign all dylibs
        find "$APP_PATH/Contents/Frameworks" -name "*.dylib" -exec \
          codesign --force --sign "$IDENTITY" --options runtime {} \;

        # Sign every other embedded framework (e.g. Sentry) with hardened
        # runtime. Sparkle is signed above — it has nested XPC/Autoupdate/
        # Updater.app that must be signed inside-out first, so skip its outer
        # wrapper here. An unsigned nested framework makes notarization Invalid.
        for fw in "$APP_PATH/Contents/Frameworks"/*.framework; do
          [[ "$fw" == *"/Sparkle.framework" ]] && continue
          [[ -d "$fw" ]] && codesign --force --sign "$IDENTITY" --options runtime "$fw"
        done

        # Expand $(AppIdentifierPrefix) in the edition's entitlements (full:
        # bae.entitlements with iCloud container; baeium: bae-baeium.entitlements,
        # keychain only).
        EXPANDED_ENTITLEMENTS=$(mktemp)
        sed "s/\$(AppIdentifierPrefix)/${APPLE_TEAM_ID}./" "$ENTITLEMENTS" > "$EXPANDED_ENTITLEMENTS"

        # Sign main app
        codesign --force --sign "$IDENTITY" --options runtime --entitlements "$EXPANDED_ENTITLEMENTS" "$APP_PATH"
        codesign --verify --verbose "$APP_PATH"

    - name: Create signed DMG
      env:
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        DMG_PATH="target/$DMG_NAME"
        IDENTITY=$(security find-identity -v -p codesigning | grep "$APPLE_TEAM_ID" | head -1 | sed 's/.*"\(.*\)".*/\1/')

        mkdir -p target

        # Create temporary directory for DMG contents
        DMG_TEMP=$(mktemp -d)
        trap 'rm -rf "$DMG_TEMP"' EXIT

        # Copy app bundle to temp directory
        cp -R "$APP_PATH" "$DMG_TEMP/${PRODUCT_NAME}.app"

        # Create Applications folder symlink
        ln -s /Applications "$DMG_TEMP/Applications"

        # Create DMG from temp directory
        hdiutil create -volname "$PRODUCT_NAME" -srcfolder "$DMG_TEMP" -ov -format UDZO "$DMG_PATH"
        codesign --force --sign "$IDENTITY" "$DMG_PATH"

    - name: Notarize DMG
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        DMG_PATH="target/$DMG_NAME"

        xcrun notarytool submit "$DMG_PATH" \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_APP_PASSWORD" \
          --team-id "$APPLE_TEAM_ID" \
          --wait

        xcrun stapler staple "$DMG_PATH"

    - name: Download Sparkle for signing
      run: |
        SPARKLE_VERSION="2.9.0"
        curl -L -o /tmp/sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
        mkdir -p /tmp/sparkle
        tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle

    - name: Sign DMG with Sparkle EdDSA key
      env:
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      run: |
        DMG_PATH="target/$DMG_NAME"

        # Sign the DMG and capture only the signature (-p flag)
        SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | /tmp/sparkle/bin/sign_update "$DMG_PATH" -f - -p)
        # Empty would publish an unsigned appcast entry that every client rejects.
        if [[ -z "$SIGNATURE" ]]; then echo "Sparkle sign_update produced no signature" >&2; exit 1; fi
        echo "SPARKLE_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"

        # Get file size for appcast
        DMG_SIZE=$(stat -f%z "$DMG_PATH")
        echo "DMG_SIZE=$DMG_SIZE" >> "$GITHUB_ENV"

    - name: Generate appcast.xml
      run: |
        VERSION="${{ needs.calculate-version.outputs.version }}"
        BUILD_NUMBER="${{ github.run_number }}"
        DMG_URL="https://github.com/${{ github.repository }}/releases/download/macos-v${VERSION}/${DMG_NAME}"

        cat > "target/$APPCAST_FILE" << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
          <channel>
            <title>${APPCAST_TITLE}</title>
            <link>https://github.com/${{ github.repository }}/releases</link>
            <description>Most recent updates to ${PRODUCT_NAME}</description>
            <language>en</language>
            <item>
              <title>Version ${VERSION}</title>
              <pubDate>$(date -R)</pubDate>
              <sparkle:version>${BUILD_NUMBER}</sparkle:version>
              <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>${MACOS_MIN}</sparkle:minimumSystemVersion>
              <enclosure
                url="${DMG_URL}"
                length="${DMG_SIZE}"
                type="application/octet-stream"
                sparkle:edSignature="${SPARKLE_SIGNATURE}"
              />
            </item>
          </channel>
        </rss>
        EOF

    - name: Upload signed DMG + appcast
      uses: actions/upload-artifact@v7
      with:
        # The publish job pulls both: the DMG to attach to the release, the
        # appcast (its enclosure already points at the macos-v* DMG URL) to push
        # to the appcast branch once that release exists.
        name: ${{ env.ARTIFACT_NAME }}
        path: |
          target/${{ env.DMG_NAME }}
          target/${{ env.APPCAST_FILE }}
        retention-days: 30

    - name: Upload dSYM artifact
      if: matrix.edition == 'full'
      uses: actions/upload-artifact@v7
      with:
        name: bae-macOS-dSYM
        path: target/bae.dSYM.zip
        retention-days: 30

  publish:
    name: Publish release
    needs: [calculate-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout the built commit
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.commit || github.sha }}
        fetch-depth: 0

    - name: Download both editions' DMGs + appcasts
      uses: actions/download-artifact@v8
      with:
        # bae-macOS-native-signed + baeium-macOS-native-signed, each carrying its
        # DMG and appcast, merged into one dir.
        pattern: '*-macOS-native-signed'
        path: dist
        merge-multiple: true

    - name: Download bae dSYM
      uses: actions/download-artifact@v8
      with:
        name: bae-macOS-dSYM
        path: dist

    - name: Create git tag
      run: |
        VERSION="${{ needs.calculate-version.outputs.version }}"
        if ! git rev-parse "macos-v$VERSION" >/dev/null 2>&1; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "macos-v$VERSION"
          git push origin "macos-v$VERSION"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        # One immutable macos-v* release carrying both editions' signed DMGs.
        # Created once with both files — an immutable release rejects a later
        # append, so the second edition can't be added after the fact.
        tag_name: macos-v${{ needs.calculate-version.outputs.version }}
        files: |
          dist/bae-macos.dmg
          dist/baeium-macos.dmg
          dist/bae.dSYM.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish appcasts to the appcast branch
      run: |
        # The Sparkle feeds live on a dedicated orphan `appcast` branch — each
        # app's SUFeedURL is the raw URL of its file. Pushed after the release
        # exists so each enclosure points at a live macos-v* DMG. Both editions'
        # feeds land in one commit; a single job, so no push race.
        VERSION="${{ needs.calculate-version.outputs.version }}"
        BUILD_NUMBER="${{ github.run_number }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin appcast
        git worktree add "$RUNNER_TEMP/appcast-wt" FETCH_HEAD
        cp dist/appcast.xml "$RUNNER_TEMP/appcast-wt/appcast.xml"
        cp dist/appcast-baeium.xml "$RUNNER_TEMP/appcast-wt/appcast-baeium.xml"
        git -C "$RUNNER_TEMP/appcast-wt" add appcast.xml appcast-baeium.xml
        git -C "$RUNNER_TEMP/appcast-wt" commit -m "appcast: macos-v$VERSION (build $BUILD_NUMBER)"
        git -C "$RUNNER_TEMP/appcast-wt" push origin HEAD:appcast

    - name: Verify Sparkle feeds resolve
      run: |
        # Each DMG (a release asset) must resolve hard; the raw feed files are the
        # source of truth once pushed — their CDN copies may lag a few minutes.
        VERSION="${{ needs.calculate-version.outputs.version }}"
        for pair in "appcast.xml:bae-macos.dmg" "appcast-baeium.xml:baeium-macos.dmg"; do
          FEED_FILE="${pair%%:*}"
          DMG_NAME="${pair##*:}"
          DMG="https://github.com/${{ github.repository }}/releases/download/macos-v${VERSION}/${DMG_NAME}"
          curl -fsIL --retry 5 --retry-delay 3 "$DMG" -o /dev/null
          echo "DMG reachable: $DMG"
          FEED="https://raw.githubusercontent.com/${{ github.repository }}/appcast/${FEED_FILE}"
          if curl -fsSL --retry 8 --retry-delay 5 "$FEED" | grep -q "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>"; then
            echo "feed live with $VERSION: $FEED"
          else
            echo "::warning::appcast $FEED_FILE pushed but raw feed not yet showing $VERSION (CDN lag); it will catch up"
          fi
        done

  refresh-website:
    # Republish the website so its build-time latest.json and download buttons
    # resolve to this new release. Replaces the old rolling `-latest` releases:
    # immutable releases make those impossible to update — a tag, once used by an
    # immutable release, can't be reused, and an immutable release's assets can't
    # be replaced — so the site resolves the newest versioned release instead.
    name: Refresh website downloads
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Trigger website deploy
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run deploy-website.yml --repo ${{ github.repository }} --ref main
