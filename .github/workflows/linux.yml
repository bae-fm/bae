name: Linux

# The Rust lint and test suite, on Linux runners, and the Avalonia skeleton's
# build and smoke test.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Free disk space
      # Several Rust build profiles don't fit the default disk.
      uses: ./.github/actions/free-ubuntu-runner-disk

    - name: Setup Linux environment
      uses: ./.github/actions/setup-linux

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust

    - name: Install cargo-nextest
      id: nextest
      uses: taiki-e/install-action@nextest

    - name: Check Rust formatting
      run: cargo fmt --all -- --check

    - name: Check source file layout
      run: scripts/check-source-file-size.py

    - name: Check restricted-path Rust visibility
      run: scripts/check-rust-visibility.sh

    - name: Check reqwest error causes
      run: scripts/check-reqwest-error-display.py

    - name: Test the bundled-library checker
      run: python3 scripts/tests/check-bundled-libraries-test.py

    - name: Check owner dependency boundaries
      run: scripts/owner-dependency-boundary.sh

    - name: Check UniFFI runtime boundaries
      run: scripts/check-uniffi-runtime-boundary.py

    - name: Check that screens get their values only by pull
      run: |
        python3 scripts/check-screen-pulls.py
        python3 scripts/tests/check-screen-pulls-test.py

    - name: Check that every Rust file in a crate is compiled
      run: |
        python3 scripts/check-rust-files-compiled.py
        python3 scripts/tests/check-rust-files-compiled-test.py

    - name: Check that test code never reaches the person's keychain
      run: |
        python3 scripts/check-test-keychain.py
        python3 scripts/tests/check-test-keychain-test.py

    - name: Check for unused Rust dependencies
      run: |
        cargo binstall cargo-machete --no-confirm
        cargo machete

    - name: Check Rust dependency licenses and advisories (cargo-deny)
      run: |
        cargo binstall cargo-deny --no-confirm
        cargo deny check

    - name: Run Clippy
      run: |
        cargo clippy --workspace -- -D warnings
        cargo clippy -p bae-library --tests --features bae-library/test-utils -- -D warnings
        cargo clippy -p bae-util --tests --features bae-util/test-utils -- -D warnings
        cargo clippy -p bae-audio --tests --features test-utils,test-instrumentation -- -D warnings
        cargo clippy -p bae-types --tests --features bae-types/test-utils -- -D warnings
        cargo clippy -p bae-catalogs --tests --features test-utils,test-instrumentation -- -D warnings
        cargo clippy -p bae-diagnostics --tests --features bae-diagnostics/test-utils -- -D warnings
        cargo clippy -p bae-app-dir --tests --features bae-app-dir/test-utils -- -D warnings
        cargo clippy -p bae-db --tests --features bae-db/test-utils -- -D warnings
        cargo clippy -p bae-preferences --tests --features bae-preferences/test-utils -- -D warnings
        cargo clippy -p bae-track-audio --tests --features bae-track-audio/test-utils -- -D warnings
        cargo clippy -p bae-transfers --tests --features bae-transfers/test-utils -- -D warnings
        cargo clippy -p bae-views --tests --features bae-views/test-utils -- -D warnings
        cargo clippy -p bae-identify --tests --features bae-identify/test-utils -- -D warnings
        cargo clippy -p bae-playback --tests --features bae-playback/test-utils -- -D warnings
        cargo clippy -p bae-import --tests --features bae-import/test-utils -- -D warnings
        cargo clippy -p bae-app --tests --features bae-app/test-utils -- -D warnings
        cargo clippy -p bae-bridge -- -D warnings

    - name: Dead-code (bae-app, bae-library, the crates below them and bae-cast, lib only)
      # Each crate's production code alone, so an item only its tests use fails
      # as dead code. The flag goes to the one crate: RUSTFLAGS would recompile
      # every dependency for this one check.
      run: |
        cargo rustc -p bae-library --lib --profile check -- -D warnings
        cargo rustc -p bae-util --lib --profile check -- -D warnings
        cargo rustc -p bae-audio --lib --profile check -- -D warnings
        cargo rustc -p bae-types --lib --profile check -- -D warnings
        cargo rustc -p bae-catalogs --lib --profile check -- -D warnings
        cargo rustc -p bae-diagnostics --lib --profile check -- -D warnings
        cargo rustc -p bae-app-dir --lib --profile check -- -D warnings
        cargo rustc -p bae-db --lib --profile check -- -D warnings
        cargo rustc -p bae-preferences --lib --profile check -- -D warnings
        cargo rustc -p bae-track-audio --lib --profile check -- -D warnings
        cargo rustc -p bae-transfers --lib --profile check -- -D warnings
        cargo rustc -p bae-views --lib --profile check -- -D warnings
        cargo rustc -p bae-identify --lib --profile check -- -D warnings
        cargo rustc -p bae-playback --lib --profile check -- -D warnings
        cargo rustc -p bae-import --lib --profile check -- -D warnings
        cargo rustc -p bae-app --lib --profile check -- -D warnings
        cargo rustc -p bae-cast --lib --profile check -- -D warnings

    - name: Check for new #[allow(dead_code)]
      # New #[allow(dead_code)] is banned in every .rs file of the workspace.
      run: |
        offenders=$(grep -rn --include='*.rs' --exclude-dir='target*' \
          'allow(dead_code)' . \
          || true)
        if [ -n "$offenders" ]; then
          echo "New #[allow(dead_code)] is banned (delete the code or #[cfg]-restrict it):"
          echo "$offenders"
          exit 1
        fi

    # Each test step below runs once nextest is in, whatever failed before it,
    # and runs every test and command in it, failing at the end if any did: a
    # run that stopped at its first failure hid every failure after it.
    - name: Run util, audio, types, catalogs, localization, theme and bridge tests
      if: ${{ !cancelled() && steps.nextest.conclusion == 'success' }}
      run: |
        status=0
        cargo nextest run --no-fail-fast -p bae-util || status=1
        cargo nextest run --no-fail-fast -p bae-audio || status=1
        cargo nextest run --no-fail-fast -p bae-types || status=1
        cargo nextest run --no-fail-fast -p bae-catalogs || status=1
        cargo nextest run --no-fail-fast -p bae-diagnostics || status=1
        cargo nextest run --no-fail-fast -p bae-app-dir || status=1
        cargo nextest run --no-fail-fast -p bae-db || status=1
        cargo nextest run --no-fail-fast -p bae-preferences || status=1
        cargo nextest run --no-fail-fast -p bae-track-audio || status=1
        cargo nextest run --no-fail-fast -p bae-transfers || status=1
        cargo nextest run --no-fail-fast -p bae-views || status=1
        cargo nextest run --no-fail-fast -p bae-identify || status=1
        cargo nextest run --no-fail-fast -p bae-playback || status=1
        cargo nextest run --no-fail-fast -p bae-import || status=1
        cargo nextest run --no-fail-fast -p bae-app --features bae-app/test-utils || status=1
        cargo nextest run --no-fail-fast -p bae-loc || status=1
        cargo nextest run --no-fail-fast -p bae-theme || status=1
        # Both editions: default features are baeium's, `desktop` the full build's,
        # with the debug Mac app's dev reset, so its tests run too.
        cargo nextest run --no-fail-fast -p bae-bridge --lib || status=1
        cargo nextest run --no-fail-fast -p bae-bridge --lib --features desktop,dev-reset || status=1
        cargo nextest run --no-fail-fast -p bae-automation || status=1
        cargo nextest run --no-fail-fast -p bae-subsonic || status=1
        cargo nextest run --no-fail-fast -p bae-cast || status=1
        cargo nextest run --no-fail-fast -p bae-desktop || status=1
        # Chrome strings no code references; core.* keys are covered by the bridge
        # test above.
        python3 scripts/loc-chrome-orphans.py || status=1
        # Translations still carrying the English, glued morphology, or mismatched
        # placeholders, in all three catalogs.
        python3 scripts/loc-english-skeleton.py || status=1
        # spec/words.md: title case outside the macOS menu bar, sentence case
        # in it, and "cloud" on screen.
        python3 scripts/loc-words.py || status=1
        python3 scripts/tests/loc-words-test.py || status=1
        exit $status

    - name: Check Rust documentation
      # Broken intra-doc links and invalid rustdoc syntax fail the build.
      if: ${{ !cancelled() && steps.nextest.conclusion == 'success' }}
      run: |
        status=0
        RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps || status=1
        cargo test --doc --no-fail-fast --workspace --features bae-library/test-utils || status=1
        cargo test --doc --no-fail-fast -p bae-bridge --features desktop || status=1
        exit $status

    - name: Run bae-library tests
      if: ${{ !cancelled() && steps.nextest.conclusion == 'success' }}
      run: |
        status=0
        # The CPU test reads process-wide getrusage, so it runs alone, in release: it
        # measures the playback that ships.
        cargo nextest run --no-fail-fast -p bae-library --features bae-library/test-utils -- --skip test_playback_cpu || status=1
        # The runner's disk can't hold the debug and release trees at once.
        rm -rf target/debug
        cargo nextest run --no-fail-fast -p bae-library --release --features bae-library/test-utils --test test_playback_cpu -j 1 || status=1
        exit $status

  avalonia:
    # The Avalonia skeleton on Linux, in its own job for the disk.
    name: Avalonia skeleton
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Setup Linux environment
      uses: ./.github/actions/setup-linux

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust

    - name: Install uniffi-bindgen-cs
      uses: ./.github/actions/install-uniffi-bindgen-cs

    - name: Build the Linux bridge (full edition, OAuth + desktop)
      run: BAE_BRIDGE_FEATURES=oauth-providers,desktop BAE_BRIDGE_CSHARP_BINDINGS_DIR=bae-bridge/csharp-bindings-full ./bae-bridge/build-linux.sh

    - name: Install .NET 8 SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "8.0.x"

    - name: Build the Avalonia skeleton
      run: dotnet build bae-avalonia/bae-avalonia.csproj -c Debug -p:EnforceCodeStyleInBuild=true

    - name: Smoke-test the Avalonia skeleton
      # The bridge .so is in build-linux.sh's target dir; FFmpeg is already on
      # LD_LIBRARY_PATH.
      run: |
        export LD_LIBRARY_PATH="$PWD/target-linux/x86_64-unknown-linux-gnu/debug:$LD_LIBRARY_PATH"
        dotnet test bae-avalonia/bae-avalonia.Tests -c Debug
