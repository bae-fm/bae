name: Linux

# Cross-platform Rust lint + test suite on a Linux runner. The Rust core is
# portable; running it here (instead of on a scarce macOS runner) is cheaper and
# faster, and leaves the macOS runners for the Xcode-only work. macOS still
# builds the macOS app; this job owns the Rust gates and tests.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Setup Linux environment
      uses: ./.github/actions/setup-linux

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Check Rust formatting
      run: cargo fmt --all -- --check

    - name: Check source file layout
      run: scripts/check-source-file-size.py

    - name: Check restricted-path Rust visibility
      run: scripts/check-rust-visibility.sh

    - name: Check owner dependency boundaries
      run: scripts/owner-dependency-boundary.sh

    - name: Check for unused Rust dependencies
      run: |
        cargo binstall cargo-machete --no-confirm
        cargo machete

    - name: Check Rust dependency licenses and advisories (cargo-deny)
      run: |
        cargo binstall cargo-deny --no-confirm
        cargo deny check

    - name: Run Clippy
      run: |
        cargo clippy --workspace -- -D warnings
        cargo clippy -p bae-core --tests --features bae-core/test-utils -- -D warnings
        cargo clippy -p bae-bridge -- -D warnings

    - name: Dead-code (bae-core lib only)
      # Default features, no --tests, no --all-targets, no test-utils: the one
      # config that compiles bae-core's production code without also compiling
      # the #[cfg(test)] unit tests that keep some pub(crate) items looking
      # used. A production item reached only by those tests is dead weight in
      # the shipping library.
      run: RUSTFLAGS="-D warnings" cargo check -p bae-core

    - name: Check for new #[allow(dead_code)]
      # Banned everywhere, with no carve-out. The shared integration-test
      # helpers used to need one: as a `tests/support/mod.rs` include they were
      # recompiled into each of bae-core's test binaries, so helpers a given
      # binary didn't call read as dead. They are the bae-test-support crate
      # now -- compiled once, helpers are its public API -- so that false
      # positive is gone rather than tolerated. dead_code is denied in
      # [workspace.lints]; an allow here is the way back around that deny.
      run: |
        offenders=$(grep -rn --include='*.rs' 'allow(dead_code)' \
          bae-core bae-bridge bae-mcp bae-automation bae-desktop bae-loc \
          bae-test-support third-party \
          || true)
        if [ -n "$offenders" ]; then
          echo "New #[allow(dead_code)] is banned (delete the code or #[cfg]-restrict it):"
          echo "$offenders"
          exit 1
        fi

    - name: Run localization + bridge tests
      run: |
        cargo nextest run -p bae-loc
        # Both editions' surfaces. Default features are what the baeium build
        # compiles; `desktop` is what the full build compiles, and the conversions
        # behind it (the metadata-edit round trips, the identify-progress mirror)
        # have no other test run.
        cargo nextest run -p bae-bridge --lib
        cargo nextest run -p bae-bridge --lib --features desktop
        cargo nextest run -p bae-automation
        cargo nextest run -p bae-subsonic
        cargo nextest run -p bae-cast
        cargo nextest run -p bae-desktop
        # chrome-string orphan gate (core.* keys are covered by the bae-bridge
        # loc_key_coverage test above); fails on unreferenced, un-allowlisted keys.
        python3 scripts/loc-chrome-orphans.py
        # English-skeleton gate: an it/tr/vi/nl value still carrying the English
        # sentence, glued morphology ("Sincronizzazioneing"), or a placeholder
        # multiset that doesn't match its source. Covers all four catalogs
        # (macOS/iOS xcstrings, Android strings.xml, bae-avalonia resx).
        python3 scripts/loc-english-skeleton.py

    - name: Check Rust documentation
      # Broken intra-doc links and invalid rustdoc syntax fail the build.
      run: |
        RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
        cargo test --doc --workspace --features bae-core/test-utils
        cargo test --doc -p bae-bridge --features desktop

    - name: Run bae-core tests
      run: |
        # The CPU test reads process-wide getrusage, so it runs as its own
        # invocation after the rest of the suite. Everything else runs at
        # default parallelism; tests that share process-global state (the
        # import integration suite's metadata caches) serialize themselves
        # with #[serial]. The CPU test's probe sink pulls and discards at
        # real time with no audio device, so it runs here too.
        #
        # --release, matching scripts/check.sh: the CPU test measures the cost of
        # real playback, which is the optimized build. An unoptimized decode is a
        # different workload, so measuring it here and the optimized one locally
        # would mean the gate never guards the code that ships.
        cargo nextest run -p bae-core --features bae-core/test-utils -- --skip test_playback_cpu
        cargo nextest run -p bae-core --release --features bae-core/test-utils --test test_playback_cpu -j 1
