name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: macOS app
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Setup macOS environment
      uses: ./.github/actions/setup-macos

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust

    - name: Build macOS app
      id: build_macos
      run: |
        brew install xcodegen peripheryapp/periphery/periphery
        ./bae-bridge/build-macos.sh
        ./bae-bridge/install-swift-bindings.sh macos
        cd bae-macos/bae && xcodegen
        xcodebuild -project bae.xcodeproj -scheme bae -configuration Debug \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          SWIFT_EMIT_LOC_STRINGS=YES \
          -derivedDataPath .build/derivedData build

    # Each post-build check below runs whenever the build itself succeeded,
    # independent of the other checks. Without these gates, a periphery
    # failure short-circuits the audit step (`skipped`) and a real env-binding
    # bug slips through — exactly how the OutboxStore crash in #738 reached
    # main.

    - name: Check localizable strings against the catalog
      if: ${{ !cancelled() && steps.build_macos.conclusion == 'success' }}
      run: python3 scripts/check_localizable_strings.py

    - name: Run macOS unit tests (baeTests)
      if: ${{ !cancelled() && steps.build_macos.conclusion == 'success' }}
      run: |
        cd bae-macos/bae && xcodebuild -project bae.xcodeproj -scheme bae \
          -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          -derivedDataPath .build/derivedData test

    - name: Check Swift formatting
      if: ${{ !cancelled() }}
      run: |
        find bae-macos/bae/bae BaeKit/Sources/BaeKit -name "*.swift" \
          -not -name 'bae_bridge_*.swift' -print0 \
          | xargs -0 xcrun swift-format lint -s

    - name: Swift lint (swiftlint)
      if: ${{ !cancelled() }}
      run: |
        brew install swiftlint
        swiftlint lint --strict --config .swiftlint.yml \
          bae-macos/bae/bae BaeKit/Sources/BaeKit

    - name: Dead code check (periphery)
      if: ${{ !cancelled() && steps.build_macos.conclusion == 'success' }}
      run: |
        cd bae-macos/bae
        periphery scan --strict --skip-build \
          --index-store-path .build/derivedData/Index.noindex/DataStore

    # CI-only by design: adds ~5s to every macOS-touching commit, so
    # pre-commit isn't worth it; CI is the right gate.
    - name: Missing-environment check (swiftui-environment-audit)
      if: ${{ !cancelled() && steps.build_macos.conclusion == 'success' }}
      env:
        AUDIT_VERSION: v0.4.0
      run: |
        set -euo pipefail
        archive="swiftui-environment-audit-${AUDIT_VERSION}-macos-arm64.tar.gz"
        base="https://github.com/bae-fm/swiftui-environment-audit/releases/download/${AUDIT_VERSION}"
        cd /tmp
        curl -fsSL "${base}/SHA256SUMS" -o SHA256SUMS
        curl -fsSL "${base}/${archive}" -o "${archive}"
        shasum -a 256 -c SHA256SUMS
        tar -xzf "${archive}"
        cd "${GITHUB_WORKSPACE}"
        /tmp/swiftui-environment-audit \
          --index-store-path bae-macos/bae/.build/derivedData/Index.noindex/DataStore \
          bae-macos/bae/bae

  feature-parity:
    # The split between the baeium (S3-only) build and the full build is enforced
    # only by cargo features + Swift #if, from one source tree. The `test` job
    # exercises the default (baeium) Rust config and builds the FULL macOS app, so
    # on its own it can't catch an edit that breaks the config it doesn't run.
    # This job covers the opposite two cells: the full Rust config must compile
    # clean, and the baeium macOS app (no OAuth/CloudKit Swift) must build. A
    # feature-gate edit that breaks either config fails here.
    name: Feature config parity
    runs-on: macos-26
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Setup macOS environment
      uses: ./.github/actions/setup-macos

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust

    - name: Clippy (full feature set)
      run: |
        cargo clippy -p bae-core --features oauth-providers -- -D warnings
        cargo clippy -p bae-bridge --features oauth-providers,cloudkit -- -D warnings

    - name: Build macOS app (baeium, S3-only)
      # Exported for the whole step, not just the bridge line: xcodebuild's
      # scheme pre-action reruns build-macos.sh, and with the variable unset it
      # would rebuild with its full-feature default and rewrite
      # Features.xcconfig mid-build.
      env:
        BAE_BRIDGE_FEATURES: desktop
      run: |
        brew install xcodegen
        ./bae-bridge/build-macos.sh
        ./bae-bridge/install-swift-bindings.sh macos
        cd bae-macos/bae && xcodegen
        xcodebuild -project bae.xcodeproj -scheme bae -configuration Debug \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          SWIFT_EMIT_LOC_STRINGS=YES \
          -derivedDataPath .build/derivedData build

    # The baeium flavor compiles the other side of every BAE_* #if; the same
    # catalog must cover both.
    - name: Check localizable strings against the catalog (baeium)
      run: python3 scripts/check_localizable_strings.py

    - name: Guard — baeium bridge exports no OAuth/CloudKit binding
      run: |
        # The baeium bridge build above must omit every feature-gated function.
        # availableCloudProviders stays (always compiled in); these must not.
        gated='oauthAuthorize|oauthBegin|oauthCancel|oauthComplete|setOauthClientCreds|signInCloudProvider|useCloudkit'
        if grep -nE "func ($gated)" bae-bridge/swift-bindings-macos/bae_bridge.swift; then
          echo "::error::baeium bridge exported a feature-gated symbol (above): the gate leaked into the S3-only build."
          exit 1
        fi
        echo "baeium bridge is clean: no OAuth/CloudKit bindings exported."
