name: Build

# Per-commit debug gate for every platform, as one workflow run instead of four.
# Each platform is a job that calls its reusable workflow on its own runner, all
# in parallel. Release builds live in the release-* workflows.

on:
  push:
    branches: [main]
  pull_request:
    # Bottom-of-chain only: non-bottom chain PRs target their predecessor branch
    # and get validated once the chain rebases onto main.
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Rust lint + test suite on Linux. Runs alongside CI during validation; once
  # proven green it takes over the Rust gates and CI keeps only the macOS build.
  linux:
    name: Linux
    uses: ./.github/workflows/linux.yml

  android:
    name: Android
    # Build both editions so a feature-gate or source-set edit can't break the
    # one this push doesn't exercise: full (the bae product) and baeium (the
    # S3-only F-Droid app).
    strategy:
      fail-fast: false
      matrix:
        edition: [full, baeium]
    uses: ./.github/workflows/android-build.yml
    with:
      profile: debug
      edition: ${{ matrix.edition }}

  ios:
    name: iOS
    # Build both editions so a feature-gate or #if edit can't break the one this
    # push doesn't exercise: full (OAuth + CloudKit) and baeium (S3-only). The
    # iOS Swift app has its own OAuth/CloudKit #if surface, distinct from macOS,
    # so the baeium iOS app must build on its own.
    strategy:
      fail-fast: false
      matrix:
        edition: [full, baeium]
    uses: ./.github/workflows/ios.yml
    with:
      edition: ${{ matrix.edition }}

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yml
