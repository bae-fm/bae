name: iOS build

# Reusable debug CI gate, called per-commit by build.yml: cross-compiles
# bae-bridge for iOS, builds the Xcode app (simulator), and runs format and
# clippy checks. Mirrors the Android gate. Release-specific steps (versioning,
# archive, IPA packaging, GitHub Release) live in release-ios.yml.

on:
  workflow_call:
    inputs:
      edition:
        description: "full (the bae product, OAuth providers + CloudKit on) or baeium (S3-only). Selects the cargo feature set the bridge compiles with and the Swift #if conditions derived from it."
        type: string
        default: full

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: iOS
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup macOS environment
      uses: ./.github/actions/setup-macos

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust

    - name: Resolve edition (cargo feature set)
      # build-ios.sh and the clippy step below read BAE_BRIDGE_FEATURES to pick the
      # edition. An explicitly-empty value is baeium (S3-only) — build-ios.sh's
      # default-when-UNSET is the full set (oauth-providers,cloudkit); iOS has no
      # `desktop` feature, so baeium is the empty set.
      run: |
        if [ "${{ inputs.edition }}" = "baeium" ]; then
          echo "BAE_BRIDGE_FEATURES=" >> "$GITHUB_ENV"
        else
          echo "BAE_BRIDGE_FEATURES=oauth-providers,cloudkit" >> "$GITHUB_ENV"
        fi

    - name: Check Rust formatting
      run: cargo fmt --all -- --check

    - name: Cache cross-built iOS FFmpeg
      id: ffmpeg-cache
      uses: actions/cache@v5
      with:
        path: bae-ffmpeg/ios
        # Keyed on the build recipe: rebuild only when the FFmpeg cross-build
        # script changes (mirrors the Android FFmpeg cache).
        key: ffmpeg-ios-${{ hashFiles('scripts/build-ffmpeg-ios.sh') }}

    - name: Build iOS FFmpeg (on cache miss)
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      run: ./scripts/build-ffmpeg-ios.sh

    - name: Clippy (iOS target)
      # Run clippy against the iOS target so cfg(target_os = "ios")-gated
      # dead-code warnings are caught. The host clippy in ci.yml targets macOS,
      # where not(any(target_os = "ios", target_os = "android")) is true and those
      # warnings don't fire. One target is enough; dead-code warnings are
      # target-specific, not ABI-specific — but they ARE feature-specific, so this
      # runs per edition (the matrix's full and baeium cells) against this cell's
      # BAE_BRIDGE_FEATURES.
      run: |
        rustup target add aarch64-apple-ios 2>/dev/null || true
        FFMPEG_PREFIX="$(pwd)/bae-ffmpeg/ios/aarch64-apple-ios"
        DEVICE_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
        FEATURES_ARG=""
        [ -n "$BAE_BRIDGE_FEATURES" ] && FEATURES_ARG="--features $BAE_BRIDGE_FEATURES"
        IPHONEOS_DEPLOYMENT_TARGET=16.0 \
        FFMPEG_DIR="$FFMPEG_PREFIX" \
        BINDGEN_EXTRA_CLANG_ARGS="--target=arm64-apple-ios16.0 -isysroot $DEVICE_SDK -I$FFMPEG_PREFIX/include" \
        CARGO_TARGET_DIR="target-ios" \
        cargo clippy --target aarch64-apple-ios -p bae-bridge $FEATURES_ARG -- -D warnings

    - name: Install xcodegen
      run: brew install xcodegen

    - name: Install periphery + swiftlint
      # Only the full cell runs the Swift lints (below): they read every .swift
      # file's text regardless of which #if branch this edition compiles, so the
      # result is edition-invariant — running them once is enough, and it keeps
      # the baeium cell off the extra brew installs.
      if: ${{ inputs.edition == 'full' }}
      run: brew install peripheryapp/periphery/periphery swiftlint

    - name: Build Rust bridge (iOS xcframework)
      run: ./bae-bridge/build-ios.sh

    - name: Generate Xcode project
      working-directory: ./bae-ios/bae
      run: xcodegen

    - name: Build iOS app
      id: build_ios
      run: |
        xcodebuild -project bae-ios/bae/bae.xcodeproj \
          -scheme bae \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          -sdk iphonesimulator \
          -arch arm64 \
          -derivedDataPath bae-ios/bae/.build/derivedData \
          build

    - name: Check Swift formatting
      if: ${{ inputs.edition == 'full' && !cancelled() }}
      run: |
        find bae-ios/bae/bae -name "*.swift" -not -name bae_bridge.swift -print0 \
          | xargs -0 xcrun swift-format lint -s

    - name: Swift lint (swiftlint)
      if: ${{ inputs.edition == 'full' && !cancelled() }}
      run: swiftlint lint --strict --config .swiftlint.yml bae-ios/bae/bae

    - name: Dead code check (periphery)
      if: ${{ inputs.edition == 'full' && !cancelled() && steps.build_ios.conclusion == 'success' }}
      run: |
        cd bae-ios/bae
        periphery scan --strict --skip-build \
          --index-store-path .build/derivedData/Index.noindex/DataStore
