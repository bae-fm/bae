name: Release Android

# Cuts a signed Android release: an independent 0.N version line (android-v*
# tags) and a monotonic versionCode (the run number). The build itself is the
# shared android-build reusable workflow (same cross-compile + tests as CI) in
# release mode; this workflow only computes the version and publishes the result.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2 (blank = auto-increment from android-v* tags)'
        required: false
        default: ''

concurrency:
  group: release-android
  cancel-in-progress: true

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Determine version
      id: calc
      run: |
        # Explicit input wins; otherwise auto-increment the last component of the
        # latest android-v* tag (independent of macos-v*). First release → 0.1.
        if [[ -n "${{ inputs.version }}" ]]; then
          VERSION="${{ inputs.version }}"
        else
          LATEST=$(git tag -l "android-v*" | sed 's/^android-v//' | sort -V | tail -1)
          if [[ -z "$LATEST" ]]; then
            VERSION="0.1"
          else
            VERSION="${LATEST%.*}.$(( ${LATEST##*.} + 1 ))"
          fi
        fi

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "::notice::Android release version $VERSION (build ${{ github.run_number }})"

  build:
    name: Build signed APK
    needs: calculate-version
    # Build both editions from the one source: full (bae, OAuth providers on,
    # applicationId fm.bae.app) and baeium (S3-only, fm.bae.app.baeium).
    # They install side by side. android-build.yml names the output per edition
    # (bae-android.apk / baeium-android.apk) and uploads a per-edition artifact.
    strategy:
      matrix:
        edition: [full, baeium]
    uses: ./.github/workflows/android-build.yml
    with:
      profile: release
      edition: ${{ matrix.edition }}
      version: ${{ needs.calculate-version.outputs.version }}
      version_code: ${{ github.run_number }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [calculate-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout the built commit
      # github.sha is fixed for the whole run, so the tag points at exactly the
      # commit the build job assembled the APK from.
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}

    - name: Download both editions' signed APKs
      uses: actions/download-artifact@v8
      with:
        # Both per-edition artifacts (bae-android-release-full / -baeium) into one
        # dir → bae-android.apk + baeium-android.apk.
        pattern: bae-android-release-*
        merge-multiple: true

    - name: Create git tag
      run: |
        VERSION="${{ needs.calculate-version.outputs.version }}"
        if ! git rev-parse "android-v$VERSION" >/dev/null 2>&1; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "android-v$VERSION"
          git push origin "android-v$VERSION"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: android-v${{ needs.calculate-version.outputs.version }}
        # Both editions on the one versioned release.
        files: |
          bae-android.apk
          baeium-android.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Refresh the per-edition -latest downloads
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Stable per-edition download links for the website:
        #   releases/download/android-latest/bae-android.apk        (full)
        #   releases/download/baeium-android-latest/baeium-android.apk (baeium)
        # Each rolling release is created once and never moves; only its asset is
        # replaced. --latest=false keeps the global "Latest" badge on the real
        # versioned releases.
        gh release view android-latest >/dev/null 2>&1 \
          || gh release create android-latest --latest=false --title "Android — latest (bae)" \
               --notes "Stable download link that always serves the newest full bae Android build."
        gh release upload android-latest bae-android.apk --clobber

        gh release view baeium-android-latest >/dev/null 2>&1 \
          || gh release create baeium-android-latest --latest=false --title "Android — latest (baeium)" \
               --notes "Stable download link that always serves the newest baeium baeium Android build."
        gh release upload baeium-android-latest baeium-android.apk --clobber
