name: Windows build

# Builds the native Windows stack for both architectures — x86_64-pc-windows-msvc
# on the x64 runner and aarch64-pc-windows-msvc on the native ARM64 runner:
# bae-core → bae-bridge (uniffi metadata + bae_bridge.dll/uniffi_bae_bridge.dll) →
# generated C# bindings, plus the Avalonia app compile check. The macOS host can't
# cross-compile the native deps, so this is the verification loop. Each arch builds
# natively on its own runner (the ARM64 runner is arm64, so aarch64 is its host
# target — no cross-compile).
# FFmpeg is a prebuilt release CI fetches (bae-ffmpeg) — no compiling here. The
# MusicBrainz disc ID is computed in pure Rust (bae-core), so there is no
# libdiscid to fetch or link.

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ffmpeg_arch: x86_64
          - arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            ffmpeg_arch: aarch64
    env:
      # Overrides .cargo/config.toml's repo-wide sccache wrapper: wrapping
      # rustc flattens its response file, and ffmpeg-sys-next's argument list
      # then exceeds Windows' 32K limit (os error 206).
      RUSTC_WRAPPER: ""
      FFMPEG_VERSION: v8.1.2-bae7
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
          components: clippy

      - name: Set LIBCLANG_PATH (LLVM pre-installed on both Windows runners)
        # The standalone LLVM install ships at the same path on windows-latest and
        # windows-11-arm; on the ARM runner it's the arm64-native libclang bindgen
        # needs (bindgen runs as the arm64 host process).
        shell: pwsh
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch bae-ffmpeg (Windows ${{ matrix.ffmpeg_arch }})
        shell: pwsh
        run: |
          $dist = "$PWD\bae-ffmpeg\dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $url = "https://github.com/bae-fm/bae-ffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-windows-${{ matrix.ffmpeg_arch }}.zip"
          curl.exe -fsSL --retry 5 --retry-delay 3 $url -o ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath $dist -Force
          # The Windows build ships the .lib import libs in bin/ next to the DLLs,
          # with no lib/ or pkgconfig/; ffmpeg-sys-next expects the libs under lib/.
          New-Item -ItemType Directory -Force -Path "$dist\lib" | Out-Null
          Copy-Item "$dist\bin\*.lib" "$dist\lib\" -Force
          echo "FFMPEG_DIR=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Point bindgen (ffmpeg-sys) at the ffmpeg headers, overriding the macOS
          # Homebrew include args .cargo/config.toml sets with force=false.
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$dist\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "$dist\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Enforce the bae-avalonia bridge boundary
        # The compiler can't see dependency direction; this fails if a view or
        # store reaches for NativeBae outside the sanctioned composition boundary,
        # and prints the full-surface-port parity backlog (unconsumed delegates).
        run: python scripts/avalonia-bridge-boundary.py

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Test bae-avalonia model logic
        # Unit tests for the app's pure logic (locale formatters, store models,
        # update flow). They compile against plain BCL types — no Avalonia and no
        # bridge bindings — and so run before the native stack is built. These
        # also run on the macOS dev host; this repeats them on the real net8.0
        # runtime.
        run: dotnet test bae-avalonia\bae-avalonia.Tests -c Debug

      - name: Install uniffi-bindgen-cs
        run: cargo install --git https://github.com/bae-fm/uniffi-bindgen-cs --branch uniffi-0.32-bae uniffi-bindgen-cs --locked

      - name: Build the Windows bridge (full edition, OAuth + desktop)
        # Windows has no cloudkit (Apple-only); full here is OAuth plus desktop.
        shell: bash
        run: BAE_BRIDGE_TARGET=${{ matrix.target }} BAE_BRIDGE_FEATURES=oauth-providers,desktop BAE_BRIDGE_CSHARP_BINDINGS_DIR=bae-bridge/csharp-bindings-full ./bae-bridge/build-windows.sh

      - name: Confirm the bridge DLL was produced
        shell: pwsh
        run: |
          $dlls = @(
            "target-windows\${{ matrix.target }}\debug\bae_bridge.dll",
            "target-windows\${{ matrix.target }}\debug\uniffi_bae_bridge.dll"
          )
          foreach ($dll in $dlls) {
            if (Test-Path $dll) { Write-Host "PASS: $dll ($((Get-Item $dll).Length) bytes)" }
            else { Write-Host "FAIL: $dll not found"; exit 1 }
          }

      - name: Check C# formatting
        # dotnet format uses .editorconfig rules. --verify-no-changes exits non-zero
        # if any file would be reformatted, failing the build.
        #
        # Run whitespace only — style and analyzer formatters trigger IDE0051 false
        # positives for markup-bound event handlers (dotnet format analyzes C# in
        # isolation, without the XAML compiler's generated partial classes that
        # reference those methods). The build with EnforceCodeStyleInBuild=true
        # (below) enforces all style and dead-code rules after markup compilation,
        # where those references are visible.
        run: dotnet format whitespace bae-avalonia\bae-avalonia.csproj --verify-no-changes

      - name: Build the Avalonia app
        # Both target frameworks: plain net8.0 (what ships on Linux) and the
        # Windows target framework whose WinRT projection the SMTC now-playing
        # backend binds. EnforceCodeStyleInBuild=true makes IDE-level dead-code
        # diagnostics (IDE0051 unused private members, IDE0052 unread private
        # members) fire as build errors via .editorconfig severity settings.
        run: dotnet build bae-avalonia\bae-avalonia.csproj -c Debug -p:EnforceCodeStyleInBuild=true

      - name: Test bae-avalonia views
        # The view tests drive real controls through Avalonia's headless
        # platform, so they need the app and its C# bindings — hence here rather
        # than beside the model tests above.
        run: dotnet test bae-avalonia\bae-avalonia.ViewTests -c Debug

      - name: Run bae-core unit tests (Windows)
        # The only place bae's Rust actually EXECUTES on Windows. Windows-only
        # code paths (the atomic-write directory handling, path semantics) shipped
        # broken while CI merely compiled them; this is the regression gate.
        run: cargo test -p bae-core --lib --target ${{ matrix.target }}

      - name: Clippy (baeium / default features)
        # The host clippy in ci.yml targets macOS, so lint the Windows target too.
        run: cargo clippy -p bae-core -p bae-bridge --target ${{ matrix.target }} -- -D warnings

      - name: Clippy (full edition, OAuth + desktop)
        # Dead-code warnings are feature-specific, so lint the OAuth/desktop code
        # on the Windows target too. No cloudkit on Windows.
        run: cargo clippy -p bae-core -p bae-bridge --target ${{ matrix.target }} --features oauth-providers,desktop -- -D warnings
