name: Android build (reusable)

# Shared Android build, called by build.yml (per-commit debug gate) and
# release-android.yml (signed release). Cross-compiles bae-bridge for the NDK
# targets, runs the app unit tests, and assembles the APK — debug or, with
# profile=release, a signed APK uploaded as the `bae-android-release` artifact.
#
# Runs on Linux: the NDK cross-compiles for Android from a Linux host (the build
# scripts derive the toolchain's prebuilt/linux-x86_64 dir), and Linux runners
# are far cheaper than macOS. The host ffmpeg from setup-linux backs the
# `cargo run --bin uniffi-bindgen` host build, which builds bae-bridge → bae-core
# for the host to read the cross-built .so's metadata.

on:
  workflow_call:
    inputs:
      profile:
        description: 'debug or release. release passes --release to build-android.sh, assembles a signed APK, and uploads it.'
        type: string
        default: debug
      edition:
        description: "full (the bae product, OAuth providers on) or baeium (S3-only). Picks the cargo feature set and the matching Gradle product flavor."
        type: string
        default: full
      version:
        description: 'BAE_VERSION stamped into the build. Blank keeps build.gradle.kts / build.rs dev defaults.'
        type: string
        default: ''
      version_code:
        description: 'versionCode stamped into the build (monotonic run number for releases). Blank keeps the dev default.'
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      BAE_DATADOG_SITE:
        required: false
      BAE_DATADOG_CLIENT_TOKEN:
        required: false
      BAE_SENTRY_DSN:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT:
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned NDK: build-android.sh and build-ffmpeg-android.sh default to this exact
  # version and honor ANDROID_NDK_HOME. Keep in sync with both scripts.
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Free disk space
      # The NDK, cross-built FFmpeg, and Gradle outputs do not fit alongside
      # toolchains this job never uses on the GitHub-hosted Ubuntu image.
      uses: ./.github/actions/free-ubuntu-runner-disk

    - name: Setup Linux environment
      # Host ffmpeg for the uniffi-bindgen host build.
      uses: ./.github/actions/setup-linux

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust

    - name: Check Rust formatting
      run: cargo fmt --all -- --check

    - name: Resolve edition (cargo feature set + Gradle flavor)
      # build-android.sh reads BAE_BRIDGE_FEATURES to pick the bindings; the
      # Gradle flavor must match (full → OAuth bindings + src/full; baeium →
      # S3-only bindings + the always-null OAuthLinker). Casting ships in every
      # edition, so `cast` is in both sets and is what makes the baeium set
      # non-empty.
      run: |
        if [ "${{ inputs.edition }}" = "baeium" ]; then
          {
            echo "BAE_BRIDGE_FEATURES=cast"
            echo "GRADLE_FLAVOR=Baeium"
            echo "APK_FLAVOR=baeium"
            echo "EDITION_APK=baeium-android.apk"
          } >> "$GITHUB_ENV"
        else
          {
            echo "BAE_BRIDGE_FEATURES=oauth-providers,cast"
            echo "GRADLE_FLAVOR=Full"
            echo "APK_FLAVOR=full"
            echo "EDITION_APK=bae-android.apk"
          } >> "$GITHUB_ENV"
        fi

    - name: Setup JDK 17
      # bae-android targets JavaVersion.VERSION_17 (app/build.gradle.kts).
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Install pinned Android NDK + SDK platform
      # build-tools provides apksigner, used to verify the signed release APK.
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses >/dev/null
        "$SDKMANAGER" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

    - name: Cache cross-built Android FFmpeg
      id: ffmpeg-cache
      uses: actions/cache@v5
      with:
        path: bae-ffmpeg/android
        # Keyed on the build script + NDK version: rebuild only when the recipe
        # or the toolchain that produced the libs changes.
        key: ffmpeg-android-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}

    - name: Build Android FFmpeg (on cache miss)
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      run: ./scripts/build-ffmpeg-android.sh

    - name: Clippy (Android target)
      # Run clippy against the Android target so cfg(target_os = "android")-gated
      # dead-code warnings are caught. The host clippy in linux.yml targets the
      # host, where not(any(target_os = "ios", target_os = "android")) is true and
      # those warnings don't fire. One ABI is enough; dead-code warnings are
      # target-specific, not ABI-specific.
      run: |
        NDK_HOME="${ANDROID_NDK_HOME}"
        # ubuntu-latest is x86_64, so the NDK's prebuilt host toolchain is linux-x86_64.
        TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
        FFMPEG_PREFIX="$(pwd)/bae-ffmpeg/android"
        rustup target add aarch64-linux-android 2>/dev/null || true
        CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/aarch64-linux-android35-clang" \
        CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android35-clang" \
        AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar" \
        BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android35 --sysroot=$TOOLCHAIN/sysroot -I$FFMPEG_PREFIX/aarch64/include" \
        FFMPEG_DIR="$FFMPEG_PREFIX/aarch64" \
        CARGO_TARGET_DIR="target-android" \
        cargo clippy --target aarch64-linux-android -p bae-bridge -- -D warnings

    - name: Set release version + stamps
      # Release stamps an explicit version/code and the source commits into the
      # build; debug leaves these unset so build.gradle.kts / build.rs use their
      # dev defaults.
      if: inputs.profile == 'release'
      env:
        BAE_DATADOG_SITE: ${{ secrets.BAE_DATADOG_SITE }}
        BAE_DATADOG_CLIENT_TOKEN: ${{ secrets.BAE_DATADOG_CLIENT_TOKEN }}
        BAE_SENTRY_DSN: ${{ secrets.BAE_SENTRY_DSN }}
      run: |
        {
          echo "BAE_VERSION=${{ inputs.version }}"
          echo "BAE_VERSION_CODE=${{ inputs.version_code }}"
          echo "BAE_GIT_COMMIT=$(git rev-parse --short HEAD)"
          echo "BAE_COVEN_REV=$(scripts/coven-rev.sh)"
          echo "BAE_ENVIRONMENT=production"
          echo "BAE_DATADOG_SITE=$BAE_DATADOG_SITE"
          echo "BAE_DATADOG_CLIENT_TOKEN=$BAE_DATADOG_CLIENT_TOKEN"
          echo "BAE_SENTRY_DSN=$BAE_SENTRY_DSN"
        } >> "$GITHUB_ENV"

    - name: Cross-compile bae-bridge for Android
      # Builds bae-bridge for aarch64 + x86_64 android, generates the Kotlin
      # bindings, and stages the .so files into the app's jniLibs.
      run: ./bae-bridge/build-android.sh ${{ inputs.profile == 'release' && '--release' || '' }}

    - name: Run app unit tests
      # Robolectric/JVM tests (no device) over the app's playback and reducer
      # logic — including the audio-focus resume policy. Needs the generated
      # bindings from the cross-compile step above to compile the test sources.
      run: cd bae-android && ./gradlew "test${GRADLE_FLAVOR}DebugUnitTest" --no-daemon

    - name: Check Kotlin formatting
      # ktlint on hand-written sources only. Generated bindings live under
      # bae-bridge/kotlin-bindings-*, not bae-android/, so they're not touched.
      # Pinned to the version Homebrew shipped when this ran on macOS, so the
      # ruleset doesn't drift now that it's a downloaded binary.
      run: |
        curl -sSL https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint -o /usr/local/bin/ktlint
        chmod +x /usr/local/bin/ktlint
        ktlint "bae-android/app/src/**/*.kt"

    - name: Kotlin dead code check (detekt)
      # detekt static analysis: unused code, unused imports, unused private
      # members. --build-upon-default-config applies the standard Kotlin ruleset;
      # bae-android/detekt.yml relaxes the opinionated rules the codebase doesn't
      # adopt (and allows Compose's PascalCase @Composable function names).
      # Same scope as ktlint: hand-written sources only. Pinned version; runs on
      # the JDK 17 set up above.
      run: |
        DETEKT_VERSION=1.23.8
        curl -sSL "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip" -o detekt-cli.zip
        unzip -q detekt-cli.zip
        "detekt-cli-${DETEKT_VERSION}/bin/detekt-cli" --input bae-android/app/src/main/java \
          --config bae-android/detekt.yml --build-upon-default-config

    - name: Android Lint
      # lint { abortOnError = true } is set in app/build.gradle.kts; only errors
      # block the build, warnings are visible in the HTML report.
      run: cd bae-android && ./gradlew "lint${GRADLE_FLAVOR}Debug" --no-daemon

    - name: Decode signing keystore
      if: inputs.profile == 'release'
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bae-release.jks"
        echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/bae-release.jks" >> "$GITHUB_ENV"

    - name: Assemble debug APK
      if: inputs.profile != 'release'
      # Compiles the Kotlin app against the generated bindings and staged .so's,
      # catching binding drift on top of the Rust cross-compile.
      run: cd bae-android && ./gradlew "assemble${GRADLE_FLAVOR}Debug" --no-daemon

    - name: Assemble signed release APK
      if: inputs.profile == 'release'
      working-directory: bae-android
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: ./gradlew "assemble${GRADLE_FLAVOR}Release" --no-daemon

    - name: Locate and verify signed APK
      if: inputs.profile == 'release'
      run: |
        # app-<flavor>-release.apk is the signed output; an -unsigned suffix means
        # the signing config did not apply, so target the signed name explicitly
        # and confirm the signature rather than shipping an uninstallable APK.
        APK="bae-android/app/build/outputs/apk/${APK_FLAVOR}/release/app-${APK_FLAVOR}-release.apk"
        if [[ ! -f "$APK" ]]; then
          echo "no signed release APK at $APK — signing config did not apply" >&2
          ls -la "bae-android/app/build/outputs/apk/${APK_FLAVOR}/release" || true
          exit 1
        fi
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
        "$APKSIGNER" verify --verbose "$APK"
        cp "$APK" "$EDITION_APK"
        echo "Verified signed APK: $APK -> $EDITION_APK"

    - name: Upload Android native symbols to Sentry
      if: inputs.profile == 'release' && inputs.edition == 'full'
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      run: |
        if [[ -z "${SENTRY_AUTH_TOKEN:-}" || -z "${SENTRY_ORG:-}" || -z "${SENTRY_PROJECT:-}" ]]; then
          echo "Sentry native symbol upload skipped: SENTRY_AUTH_TOKEN, SENTRY_ORG, or SENTRY_PROJECT is unset"
          exit 0
        fi
        curl -sL https://sentry.io/get-cli/ | bash
        sentry-cli debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" bae-android/debug-symbols

    - name: Upload signed APK artifact
      if: inputs.profile == 'release'
      uses: actions/upload-artifact@v7
      with:
        # Edition-specific so the full and baeium release jobs don't collide.
        name: bae-android-release-${{ inputs.edition }}
        path: ${{ env.EDITION_APK }}
        retention-days: 30
