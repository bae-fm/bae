name: Android build

# Debug CI gate: on every push/PR, builds the Android app (cross-compile + unit
# tests + debug APK) via the shared android-build reusable workflow. See
# android-build.yml for what the build covers and why it runs on macOS.

on:
  push:
    branches: [main, develop]
  pull_request:
    # Bottom-of-chain only, matching ci.yml: non-bottom chain PRs target their
    # predecessor and get validated once the chain rebases onto main.
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/android-build.yml
    with:
      profile: debug
