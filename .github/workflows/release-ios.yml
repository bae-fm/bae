name: Release iOS

# Cuts an iOS release of both editions: an independent 0.N version line (ios-v*
# tags). Each versioned release carries an UNSIGNED .ipa per edition
# (bae-ios.ipa + baeium-ios.ipa) for sideload install (AltStore / Sideloadly /
# Xcode re-sign with the user's own Apple ID). App Store / TestFlight is a later
# upgrade: it needs the owner's Apple Developer Program enrollment, an App Store
# Connect app record per bundle id, and an iOS distribution certificate — none of
# which the GitHub-release sideload path requires.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to release (leave blank for HEAD)'
        required: false
        default: ''
      version:
        description: 'Version, e.g. 0.2 (blank = auto-increment from ios-v* tags)'
        required: false
        default: ''

concurrency:
  group: release-ios
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ inputs.commit || github.sha }}

    - name: Determine version
      id: calc
      run: |
        # Explicit input wins; otherwise auto-increment the last component of the
        # latest ios-v* tag (independent of macos-v* / android-v*). First → 0.1.
        if [[ -n "${{ inputs.version }}" ]]; then
          VERSION="${{ inputs.version }}"
        else
          LATEST=$(git tag -l "ios-v*" | sed 's/^ios-v//' | sort -V | tail -1)
          if [[ -z "$LATEST" ]]; then
            VERSION="0.1"
          else
            VERSION="${LATEST%.*}.$(( ${LATEST##*.} + 1 ))"
          fi
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "::notice::iOS release version $VERSION (build ${{ github.run_number }})"

  build:
    name: Build iOS (${{ matrix.edition }})
    runs-on: macos-26
    needs: calculate-version
    permissions:
      contents: read
    env:
      BAE_ENVIRONMENT: production
      BAE_DATADOG_SITE: ${{ secrets.BAE_DATADOG_SITE }}
      BAE_DATADOG_CLIENT_TOKEN: ${{ secrets.BAE_DATADOG_CLIENT_TOKEN }}
      BAE_SENTRY_DSN: ${{ secrets.BAE_SENTRY_DSN }}
    strategy:
      # Both editions from one source: full (bae, fm.bae.bae) and baeium (
      # fm.bae.bae.baeium). Each only uploads its .ipa as an artifact; the publish
      # job creates the one ios-v* release from both, so they run in parallel.
      matrix:
        edition: [full, baeium]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.commit || github.sha }}

    - name: Resolve edition (features, identity, asset names)
      run: |
        # The full edition keeps its identity; baeium gets the .baeium
        # bundle id, the S3-only feature set (empty BAE_BRIDGE_FEATURES — build-ios.sh
        # treats unset as full and empty as baeium), and its own asset + rolling link.
        if [ "${{ matrix.edition }}" = "baeium" ]; then
          {
            echo "BAE_BRIDGE_FEATURES="
            echo "BUNDLE_ID=fm.bae.bae.baeium"
            echo "PRODUCT_NAME=baeium"
            echo "IPA_NAME=baeium-ios.ipa"
            echo "ARTIFACT_NAME=baeium-iOS-unsigned"
          } >> "$GITHUB_ENV"
        else
          {
            echo "BAE_BRIDGE_FEATURES=oauth-providers,cloudkit"
            echo "BUNDLE_ID=fm.bae.bae"
            echo "PRODUCT_NAME=bae"
            echo "IPA_NAME=bae-ios.ipa"
            echo "ARTIFACT_NAME=bae-iOS-unsigned"
          } >> "$GITHUB_ENV"
        fi

    - name: Setup macOS environment
      uses: ./.github/actions/setup-macos

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust

    - name: Install xcodegen
      run: brew install xcodegen

    - name: Cache cross-built iOS FFmpeg
      id: ffmpeg-cache
      uses: actions/cache@v5
      with:
        path: bae-ffmpeg/ios
        # Keyed on the build recipe: rebuild only when the FFmpeg cross-build
        # script changes (mirrors the Android FFmpeg cache).
        key: ffmpeg-ios-${{ hashFiles('scripts/build-ffmpeg-ios.sh') }}

    - name: Build iOS FFmpeg (on cache miss)
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      run: ./scripts/build-ffmpeg-ios.sh

    - name: Set release version
      run: |
        echo "BAE_VERSION=${{ needs.calculate-version.outputs.version }}" >> "$GITHUB_ENV"
        echo "BAE_GIT_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

    - name: Build Rust bridge (iOS xcframework)
      run: |
        # build-ios.sh cross-compiles device + simulator, merges FFmpeg, and copies
        # the Swift bindings into bae-ios. BAE_BRIDGE_FEATURES (set above) selects
        # the edition; for baeium it also writes the bae-baeium.entitlements override
        # into Features.xcconfig.
        ./bae-bridge/build-ios.sh --release

    - name: Generate Xcode project
      working-directory: ./bae-ios/bae
      run: xcodegen

    - name: Set version + display name in Info.plist
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        BUILD_NUMBER="${{ github.run_number }}"
        PLIST=bae-ios/bae/bae/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $BAE_VERSION" "$PLIST"
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
        # CFBundleDisplayName may not exist in the iOS Info.plist; Add if missing.
        /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $PRODUCT_NAME" "$PLIST" \
          || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $PRODUCT_NAME" "$PLIST"
        /usr/libexec/PlistBuddy -c "Add :BAEGitCommit string $SHORT_SHA" "$PLIST" || true

    - name: Archive app (unsigned)
      run: |
        # Unsigned device archive. CODE_SIGNING_ALLOWED=NO produces an unsigned
        # .app; the PRODUCT_BUNDLE_IDENTIFIER + PRODUCT_NAME overrides give the
        # baeium build its sibling identity (fm.bae.bae.baeium / baeium.app). The
        # signing identity is supplied by whoever sideloads (AltStore/Sideloadly/
        # Xcode re-sign with a free Apple ID).
        xcodebuild -project bae-ios/bae/bae.xcodeproj \
          -scheme bae \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath build/bae.xcarchive \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
          PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
          PRODUCT_NAME="$PRODUCT_NAME" \
          DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
          archive

    - name: Package dSYM
      if: matrix.edition == 'full'
      run: |
        DSYM_DIR="build/bae.xcarchive/dSYMs"
        if [[ ! -d "$DSYM_DIR" ]]; then
          echo "archive dSYM directory not found at $DSYM_DIR" >&2
          exit 1
        fi
        ditto -c -k --sequesterRsrc --keepParent "$DSYM_DIR" bae-ios.dSYM.zip
        echo "BAE_DSYM_DIR=$DSYM_DIR" >> "$GITHUB_ENV"

    - name: Upload dSYM to Sentry
      if: matrix.edition == 'full'
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      run: |
        if [[ -z "${SENTRY_AUTH_TOKEN:-}" || -z "${SENTRY_ORG:-}" || -z "${SENTRY_PROJECT:-}" ]]; then
          echo "Sentry dSYM upload skipped: SENTRY_AUTH_TOKEN, SENTRY_ORG, or SENTRY_PROJECT is unset"
          exit 0
        fi
        curl -sL https://sentry.io/get-cli/ | bash
        sentry-cli debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" "$BAE_DSYM_DIR"

    - name: Package unsigned IPA
      run: |
        APP="build/bae.xcarchive/Products/Applications/${PRODUCT_NAME}.app"
        if [[ ! -d "$APP" ]]; then
          echo "archived app not found at $APP" >&2
          ls -la build/bae.xcarchive/Products/Applications || true
          exit 1
        fi
        rm -rf Payload && mkdir -p Payload
        cp -R "$APP" "Payload/"
        # An IPA is a zip with a top-level Payload/<App>.app.
        rm -f "$IPA_NAME"
        zip -qr "$IPA_NAME" Payload
        rm -rf Payload
        echo "Built unsigned IPA: $IPA_NAME"

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.IPA_NAME }}
        retention-days: 30

    - name: Upload dSYM artifact
      if: matrix.edition == 'full'
      uses: actions/upload-artifact@v7
      with:
        name: bae-iOS-dSYM
        path: bae-ios.dSYM.zip
        retention-days: 30

  publish:
    name: Publish release
    needs: [calculate-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout the built commit
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.commit || github.sha }}
        fetch-depth: 0

    - name: Download both editions' IPAs
      uses: actions/download-artifact@v8
      with:
        # bae-iOS-unsigned + baeium-iOS-unsigned → bae-ios.ipa + baeium-ios.ipa.
        pattern: '*-iOS-unsigned'
        path: dist
        merge-multiple: true

    - name: Download bae dSYM
      uses: actions/download-artifact@v8
      with:
        name: bae-iOS-dSYM
        path: dist

    - name: Create git tag
      run: |
        VERSION="${{ needs.calculate-version.outputs.version }}"
        if ! git rev-parse "ios-v$VERSION" >/dev/null 2>&1; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "ios-v$VERSION"
          git push origin "ios-v$VERSION"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        # One immutable ios-v* release carrying both editions' unsigned .ipa files.
        # Created once with both — an immutable release rejects a later append.
        tag_name: ios-v${{ needs.calculate-version.outputs.version }}
        files: |
          dist/bae-ios.ipa
          dist/baeium-ios.ipa
          dist/bae-ios.dSYM.zip
        body: |
          iOS builds are **unsigned** .ipa files for sideloading — install with
          AltStore, Sideloadly, or Xcode (they re-sign with your own Apple ID, no
          paid Developer account needed for the baeium build). App Store
          distribution is not yet set up.
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  refresh-website:
    # Republish the website so its build-time latest.json and download buttons
    # resolve to this new release. Replaces the old rolling `-latest` releases:
    # immutable releases make those impossible to update — a tag, once used by an
    # immutable release, can't be reused, and an immutable release's assets can't
    # be replaced — so the site resolves the newest versioned release instead.
    name: Refresh website downloads
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Trigger website deploy
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run deploy-website.yml --repo ${{ github.repository }} --ref main
