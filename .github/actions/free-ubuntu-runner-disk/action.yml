name: Free Ubuntu runner disk
description: Remove preinstalled toolchains unused by bae's Linux jobs

runs:
  using: composite
  steps:
    - name: Remove unused preinstalled toolchains
      shell: bash
      run: |
        df -h /
        sudo rm -rf \
          /usr/share/dotnet \
          /opt/ghc /usr/local/.ghcup \
          /usr/local/share/powershell \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h /
