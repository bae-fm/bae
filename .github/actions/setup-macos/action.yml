name: 'Setup macOS Build Environment'
description: 'Install macOS dependencies and configure environment for building bae'

runs:
  using: 'composite'
  steps:
    - name: Install macOS dependencies
      shell: bash
      run: |
        brew install pkg-config switchaudio-osx

    - name: Download bae-ffmpeg
      shell: bash
      run: |
        # The release scripts/bae-ffmpeg-release pins, checked and stamped by
        # the same installer local checkouts use. It stages the download beside
        # the dist and swaps it in, so the runner's user owns /opt itself (not
        # what is already under it).
        FFMPEG_DIR=/opt/bae-ffmpeg
        sudo mkdir -p /opt
        sudo chown "$(id -u)" /opt
        ./scripts/setup-ffmpeg.sh "$FFMPEG_DIR"
        echo "FFMPEG_DIR=$FFMPEG_DIR" >> $GITHUB_ENV
        # Only the dist: a Homebrew lib or include folder here would let the
        # link take whatever Homebrew has installed under a name bae links.
        echo "PKG_CONFIG_PATH=$FFMPEG_DIR/lib/pkgconfig" >> $GITHUB_ENV
        echo "LIBRARY_PATH=$FFMPEG_DIR/lib" >> $GITHUB_ENV
        echo "DYLD_LIBRARY_PATH=$FFMPEG_DIR/lib" >> $GITHUB_ENV
        echo "BINDGEN_EXTRA_CLANG_ARGS=-I$FFMPEG_DIR/include" >> $GITHUB_ENV
        echo "$FFMPEG_DIR/bin" >> $GITHUB_PATH

    - name: Cache bae-libvips
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/bae-libvips
          ~/.cache/bae-libvips-build
        key: bae-libvips-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bae-libvips-release', 'scripts/build-libvips.sh', 'scripts/libvips/**') }}

    - name: Build bae-libvips
      shell: bash
      run: |
        # The release scripts/bae-libvips-release pins, built from source into
        # ~/.cache/bae-libvips when the cache holds none, and linked at
        # bae-libvips, where .cargo/config.toml and the Xcode project find it.
        ./scripts/prepare-libvips.sh

    - name: Setup virtual audio device
      shell: bash
      run: |
        SwitchAudioSource -a
        SwitchAudioSource -s "Null Audio Device"
