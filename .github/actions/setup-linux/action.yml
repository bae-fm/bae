name: 'Setup Linux Build Environment'
description: 'Install Linux dependencies and configure environment for building bae'

inputs:
  ffmpeg-version:
    description: 'bae-ffmpeg release tag'
    required: false
    default: 'v8.1.2-bae6'

runs:
  using: 'composite'
  steps:
    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo rm -f \
          /etc/apt/sources.list.d/azure-cli.* \
          /etc/apt/sources.list.d/microsoft-prod.* \
          /etc/apt/sources.list.d/packages-microsoft-prod.*
        sudo apt-get update
        # libasound2-dev: cpal builds its ALSA backend on Linux.
        # clang/libclang-dev: ffmpeg-sys-next runs bindgen against the headers.
        # nasm: aws-lc-sys assembles its primitives.
        # pulseaudio: a null sink so device-gated playback tests find an output
        #   device instead of skipping (the CPU test's probe needs none).
        sudo apt-get install -y --no-install-recommends \
          libasound2-dev \
          pkg-config \
          clang \
          libclang-dev \
          nasm \
          pulseaudio

    - name: Download bae-ffmpeg
      shell: bash
      run: |
        ARCH=$(uname -m)
        FFMPEG_DIR=/opt/bae-ffmpeg
        sudo mkdir -p "$FFMPEG_DIR"
        curl -L "https://github.com/bae-fm/bae-ffmpeg/releases/download/${{ inputs.ffmpeg-version }}/ffmpeg-linux-$ARCH.tar.gz" | \
          sudo tar xz -C "$FFMPEG_DIR"
        # The pinned FFmpeg 8.0 bae-core links against. Its bundled ffmpeg CLI
        # (anoisesrc + flac + libmp3lame encoders) also generates the test
        # fixtures, so the CLI and the link libs are one consistent version.
        echo "FFMPEG_DIR=$FFMPEG_DIR" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=$FFMPEG_DIR/lib/pkgconfig" >> $GITHUB_ENV
        echo "LIBRARY_PATH=$FFMPEG_DIR/lib" >> $GITHUB_ENV
        # Shared .so libs, so the test binaries need them at runtime too.
        echo "LD_LIBRARY_PATH=$FFMPEG_DIR/lib" >> $GITHUB_ENV
        echo "BINDGEN_EXTRA_CLANG_ARGS=-I$FFMPEG_DIR/include" >> $GITHUB_ENV
        echo "$FFMPEG_DIR/bin" >> $GITHUB_PATH

    - name: Start virtual audio device
      shell: bash
      run: |
        pulseaudio --start --exit-idle-time=-1
        pactl load-module module-null-sink sink_name=DummyOutput sink_properties=device.description="Virtual_Output"
