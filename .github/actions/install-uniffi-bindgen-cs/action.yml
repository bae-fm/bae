name: 'Install uniffi-bindgen-cs'
description: 'Install the C# bindings generator from the bae fork, cached by the fork commit'

# Cache the binary by the commit that scripts/csharp-bindgen.sh installs.
runs:
  using: 'composite'
  steps:
    - name: Resolve the fork commit
      id: rev
      shell: bash
      run: |
        rev=$(scripts/csharp-bindgen.sh --revision)
        echo "rev=$rev" >> "$GITHUB_OUTPUT"

    - name: Restore the built generator
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.tool_cache }}/uniffi-bindgen-cs
        key: uniffi-bindgen-cs-${{ runner.os }}-${{ runner.arch }}-${{ steps.rev.outputs.rev }}

    - name: Build the generator (on cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ROOT: ${{ runner.tool_cache }}/uniffi-bindgen-cs
      run: scripts/csharp-bindgen.sh --install --root "$ROOT"

    # Saved as soon as it is built: actions/cache's own post-job save is skipped
    # when the job is cancelled, which on main is most runs.
    - name: Save the built generator
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.tool_cache }}/uniffi-bindgen-cs
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Put the generator on the path
      shell: bash
      env:
        ROOT: ${{ runner.tool_cache }}/uniffi-bindgen-cs
      run: echo "$ROOT/bin" >> "$GITHUB_PATH"
