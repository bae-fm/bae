# A runtime is built only at a listed root, which keeps it and stops it.
# clippy.toml holds the rest of the work that runs on after its caller returns
# (the other runtime constructor, the ambient runtime and every spawn), but not
# these two names: #[tokio::test] and #[tokio::main] expand to them in
# generated code that no clippy mark can cover.
[[background_starts]]
kind = "runtime construction"
paths = ["Builder::new_current_thread", "Builder::new_multi_thread"]

# SQLite: the store and the crates whose domains keep tables in it. Only
# these name a raw rusqlite handle.
[[capabilities]]
name = "SQLite"
homes = [
    "bae-store/src/",
    "bae-records/src/",
    "bae-people/src/",
    "bae-sync-status/src/",
    "bae-preferences/src/row.rs",
    "bae-playback/src/tables.rs",
    "bae-playback/src/tables/",
    "bae-playback/src/renderer/picker.rs",
    "bae-import/src/tables.rs",
    "bae-import/src/tables/",
    "bae-transfers/src/download_entry.rs",
    "bae-transfers/src/queued_releases/",
    "bae-views/src/",
]

# The bridge's async exports run on their owner's runtime: each is declared
# here to call one of these runs, which the typed lint checks in the types.
[async_exports]
runs = [
    "bae_bridge::operation_runtime::OperationRuntime::run",
    "bae_bridge::operation_runtime::OperationRuntime::run_to_completion",
    "bae_bridge::handle::AppHandle::run_exported",
]

# The library's tables by the domain that writes them. SQL anywhere may read
# a table; only its domain's homes write it, in a statement or a trigger's
# body, create it and its indexes, and hold the tests that write it. Each
# domain names the owner that does its work, and every table a crate's `.sql`
# file creates is in one domain.
[database]
capability = "SQLite"
# Each scan of a watched folder takes the next number, which keys the rows it
# writes, so finishing it can prune the rows of every other scan and a late
# write of an older scan is refused.
counters = [
    { column = "folder_scan_generation_sequence.last_generation", reason = "numbers the scans of watched folders" },
]

[[database.domains]]
name = "catalog image cache"
owner = "bae_catalogs::remote_image::cache::DiskImageCache"
homes = ["bae-catalogs/src/remote_image/cache.rs", "bae-catalogs/src/remote_image/cache.sql"]
tables = ["cached_image"]

[[database.domains]]
name = "records"
owner = "bae_records::records::Records"
homes = [
    "bae-records/src/records.rs",
    "bae-records/src/records.sql",
    "bae-records/src/records/",
    "bae-records/src/test_fixtures.rs",
    "bae-records/src/test_fixtures/",
]
tables = [
    "artists",
    "artist_credits",
    "artist_merges",
    "artist_shown_as",
    "artist_images",
    "albums",
    "album_artists",
    "works",
    "work_artists",
    "work_parts",
    "releases",
    "labels",
    "label_merges",
    "label_shown_as",
    "release_labels",
    "release_barcodes",
