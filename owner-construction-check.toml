# coreaudio-rs is `coreaudio` in source.
[library_names]
"coreaudio-rs" = "coreaudio"

# The read rule (read-shapes): what a read is, the types that keep memory or
# run a live query, and the read plumbing that is no read code. A read
# returns what the screen shows; the lists below hold the findings the rule
# finds today (frozen: they only shrink) and the ones that are not a read's
# work (allowed).
[read_shapes]
rule = "projects/bae-rules/reactive-screens-read-plain-live-queries.md in agent-instructions"
read_types = ["SqlReadContext", "ReadFor", "StoreRead", "LiveQuery", "ReconfigurableLiveQuery"]
live_query_types = ["LiveQuery", "ReconfigurableLiveQuery", "CancellableLiveQuery", "LiveRead", "LiveValues", "WithSyncState"]
request_query_types = ["ReconfigurableLiveQuery", "CancellableLiveQuery", "LiveRead"]
value_stream_types = ["TransferWatch", "ReleaseTransfersWatch", "LocalBytesWatch", "KeyedValueStream"]
kept_state_types = ["Mutex", "RefCell", "Cell", "OnceLock", "OnceCell", "AtomicBool", "AtomicU8", "AtomicU32", "AtomicU64", "AtomicUsize"]
plumbing = [
    "bae-store/src/live_query.rs",
    "bae-store/src/live_query/",
    "bae-store/src/store.rs",
    "bae-store/src/store_read.rs",
    "bae-store/src/store/coven_capabilities.rs",
    "bae-store/src/with_sync_state.rs",
]
frozen = [
    { path = "bae-app/src/live_reads/import_candidate.rs", item = "LiveImportCandidate", shape = "kept-state", count = 1, finding = "`LiveImportCandidate` keeps `shown`, which holds `Mutex` state, beside its live query (found by the check)" },
    { path = "bae-app/src/live_reads/import_candidate.rs", item = "LiveImportCandidate::new", shape = "kept-state", count = 1, finding = "`LiveImportCandidate::new` reads through `LiveImportCandidate`, which keeps `Mutex` state (found by the check)" },
    { path = "bae-bridge/src/screens/import_list.rs", item = "ImportListSubscription", shape = "kept-state", count = 1, finding = "`ImportListSubscription` keeps `selection_progress`, which holds `Mutex` state, beside its live query (found by the check)" },
    { path = "bae-catalogs/src/album_links.rs", item = "apply", shape = "pick", count = 1, finding = "`apply` picks with `find` (found by the check)" },
    { path = "bae-catalogs/src/album_links.rs", item = "read_groups", shape = "filter", count = 2, finding = "`read_groups` filters with `filter` (found by the check)" },
