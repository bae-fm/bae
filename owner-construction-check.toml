# Handles (Appendix F.3): what an owner makes from its own state to hand out.
# Only the owner makes and returns one; a holder receives it when it is built
# and keeps it for its one piece of work.
[handles]
# Where one close or removal writes its steps: the send end of the stream
# the app pulls from the closing it made.
ClosingSteps = "ClosingFeed"
# Where one setup call writes its steps, the same way.
SetupSteps = "SetupFeed"
# Where one call writes how far it has got: the send end of the progress
# stream the app last took.
ProgressWriter = "ProgressStream"
# One release's progress, listed among every release's transfer of its kind
# while that transfer runs; dropping it removes the release. And a watch on
# every release's progress.
ReleaseTransferReport = "ReleaseTransfers"
ReleaseTransfersWatch = "ReleaseTransfers"
# One read's wait on storage, counted in the storage waits while it runs,
# and a watch on the track whose load waits on storage.
FetchProgress = "StorageWaits"
StorageWaitWatch = "StorageWaits"
# Every progress event playback reports, and where playback is.
PlaybackProgressFeed = "PlaybackProgressHandle"
PlaybackPositionsWatch = "PlaybackProgressHandle"
# The ranges one sparse buffer holds, and the playing track's held
# stretches, which the playback handle follows from the bytes the service
# tells it.
HeldRangesWatch = "SparseStreamingBuffer"
TrackBufferedFollow = "PlaybackHandle"
# A watch on one discovery's device list.
DeviceListWatch = "PublishedDevices"
# A watch on a server's status, and on the Subsonic server with the networks
# and password it adds.
ServerWatch = "ServerController"
SubsonicWatch = "SubsonicServerController"
# Import events off the bus, and one import's progress and the scan events
# the bus filters from them; the percents of the running imports, and a
# test's feeds of the runtime's changes and counts; and the snapshots of the
# extraction feeding one identify run.
ImportEvents = "ImportEventBus"
ImportProgressFeed = "ImportEventBus"
ScanEvents = "ImportEventBus"
ImportPercentsWatch = "CandidateRuntime"
CandidateRuntimeChanges = "CandidateRuntime"
IdentificationCounts = "CandidateRuntime"
ExtractionWatch = "ExtractionService"
# Where one pane tells the identification queue which candidate it shows,
# held while the pane's read lives.
ShownCandidate = "IdentificationHandle"
# One request a rate limiter let through, settled against the limiter.
Admitted = "RateLimiter"
# One reader of a sparse buffer, with its own slot in the buffer's demands.
BufferReader = "SparseStreamingBuffer"
# One output's lease on the device format, and one stream's format, held
# while the stream plays.
FormatLease = "DeviceFormats"
StreamFormat = "PlayerFormat"
# One image a test's remote image host holds back until the test lets it go.
ImageHold = "RemoteImageHost"
# An open library's place in the host's record, held by its session while it
# is open, and one close of a store, recorded until it ends; dropping either
# takes it out of the record.
OpenRecord = "LibrarySessions"
CloseUnderWay = "LibrarySessions"
# The calls running on a library that left the record, which its close waits
# for before it runs.
OpenCalls = "LibrarySessions"

# Where the app opens: the bootstrap builds the runtime, the clock, the ids,
# the HTTP client and the library's owners once, and starts the services that
# run while the library is open. The bridge's opening calls are where the
# platform apps start that bootstrap and receive the handle on what it built.
# Task starts are listed with them: each starts a service's long-lived work,
# which the handle it returns stops.
[composition_roots]
# Starts the services that run while a library is open: its tables, views and
# cast picker, playback, and on desktop the import service.
"bae-app/src/assembly.rs" = ["start_library_services"]
"bae-app/src/lib.rs" = [
    "bootstrap",
    "bootstrap_prepared",
    "bootstrap_on_fixture",
    "bootstrap_opening",
    "bootstrap_inner",
]
# A test's library with the app's services started over it.
"bae-app/src/test_services.rs" = [
    "runtime_with_services",
    # The same, over the runtime a #[tokio::test] already runs on.
    "start_services_on",
]
# The platform hands its artwork analyzer in once at launch; the adapter is
# built where it arrives.
"bae-bridge/src/handle/desktop.rs" = ["AppHandle::register_artwork_analyzer"]
"bae-bridge/src/host.rs" = [
    "BridgeHost::open_prepared",
    "BridgeHost::create_library",
    "BridgeHost::open_app",
    "BridgeHost::open_app_on_fixture",
    "BridgeHost::new",
    "BridgeHost::start",
    "BridgeHost::with_test_keyring",
    "BridgeHost::set_oauth_presenter",
    "start_handle",
    # A released library's store closes on a thread the host records and waits for before the
    # store opens or is removed.
    "BridgeHost::close_released",
]
# Restoring, joining and resetting a device open the library they leave.
"bae-bridge/src/host/bootstrap.rs" = [
    "BridgeHost::restore_from_code",
    "BridgeHost::restore_replacing_device",
    "BridgeHost::restore_from_saved_code",
    "BridgeHost::join_with_invite",
    "BridgeHost::join_with_pairing",
    "BridgeHost::resume_join",
    "BridgeHost::resume_replacement",
    "BridgeHost::resume_restore",
    "BridgeDeviceReset::confirm",
    "BootstrapCancellation::new",
    "BridgeJoinControl::new",
]
# The clock and ids a test makes once, builds its store from and opens its
# library on.
"bae-store/src/test_sources.rs" = [
    "TestSources::system",
    "TestSources::on",
    "TestSources::ids",
]
# An owner's constructor builds the owner and the parts it holds that nothing
# else shares.
"bae-bridge/src/host/library_sessions.rs" = ["LibrarySessions::new", "OpenLibrary::new"]
# A dev reset creates the library and opens it.
"bae-bridge/src/host/dev_reset.rs" = ["BridgeHost::run_dev_reset"]
# The sink, clock and id source the app built at launch, taken back as core's
# by the host the app builds on it.
"bae-bridge/src/init.rs" = [
    "BridgeDiagnostics::core",
    "BridgeDiagnostics::sources",
    "configure_diagnostics",
]
# A library just set up opens.
"bae-bridge/src/setup.rs" = ["OpenedLibrary::open", "OpenedLibrary::new"]
# A bootstrap's outcome carries the library it opened.
"bae-bridge/src/types/bootstrap.rs" = [
    "BridgeBootstrapResult::opened",
    "BridgeBootstrapResult::joined",
    "BridgeBootstrapResult::failure",
]
# The design-board renderer builds its runtime, serves its pages and starts its
# browser once around all the boards it draws; they run in the caller's
# futures and end with the call.
"bae-shots/src/render.rs" = ["boards"]
"bae-shots/src/render/chrome.rs" = ["with_chrome"]
"bae-shots/src/render/serve.rs" = ["with_server"]
# A protocol's discovery starts not browsing and listing no device.
"bae-cast/src/renderer/protocol_discovery.rs" = ["ProtocolDiscovery::new"]
# A test's catalog fakes: the providers its library asks are built over
# them, once per library the test opens.
"bae-catalogs/src/fake_catalogs.rs" = [
    "FakeCatalogs::providers",
    "FakeCatalogs::offline",
    "FakeCatalogs::over",
]
# A rate-limiter test's load: the tasks it starts are joined or aborted
# before it returns.
"bae-catalogs/src/rate_limiter/load_model.rs" = ["sustain"]
# The one place a task that reports its panic starts, and the one for a
# thread: each hands its handle to the caller, which aborts or joins it.
"bae-diagnostics/src/background.rs" = [
    "Diagnostics::spawn_ending",
    "Diagnostics::spawn_thread_reported",
    "Diagnostics::run_on_thread",
]
# A test's candidate runtime opens its own tables.
"bae-import/src/candidate_runtime.rs" = ["CandidateRuntime::for_test"]
# Scoped threads: the scope joins them before the function returns.
"bae-import/src/folder_scanner/folder_times.rs" = ["read_each_at_once"]
# Scoped threads: the scope joins them before the function returns.
"bae-import/src/folder_scanner/scan/root.rs" = ["read_folders_at_once"]
# The folder-state commit lock is built once with the import services; clones share it.
"bae-import/src/folder_state_commit.rs" = ["FolderStateCommit::new"]
# One candidate write, awaited before the call returns.
"bae-import/src/handle/commit.rs" = ["ImportServiceHandle::committed"]
# One read per watched folder, in a set the call drains before it returns.
"bae-import/src/handle/watch.rs" = ["ImportServiceHandle::read_watched_folders"]
# Starts the identification queue with the services it runs on; its handle
# stops it.
"bae-import/src/identification.rs" = ["start"]
# A settling answer runs in the queue's set, which the queue's loop joins
# and, when it ends, drops and so aborts.
"bae-import/src/identification/queue/reactions.rs" = ["advance"]
# The imports a person can cancel are tracked in one shared set, built with the import
# services.
"bae-import/src/import_cancel.rs" = ["ImportCancels::new"]
# An owner's constructor builds the owner and the parts it holds that nothing
# else shares.
"bae-import/src/watching/folder_watcher.rs" = ["FolderWatcher::new"]
# Opens the library manager over the store, building its transfer queues once.
"bae-library/src/assembly.rs" = ["open_library_manager"]
# The UI-test fixture seeds the library through the tables of the store it was
# opened on. It exists only in debug and test builds, like the test fixtures
# listed here.
"bae-library/src/manager/fixture/import_list.rs" = [
    "LibraryManager::write_fixture_watched_folders",
    "LibraryManager::write_fixture_candidate_state",
