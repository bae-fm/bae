# SQLite: the store and the crates whose domains keep tables in it. Only
# these name a raw rusqlite handle.
[[capabilities]]
name = "SQLite"
homes = [
    "bae-store/src/",
    "bae-records/src/",
    "bae-people/src/",
    "bae-sync-status/src/",
    "bae-preferences/src/row.rs",
    "bae-playback/src/tables.rs",
    "bae-playback/src/tables/",
    "bae-playback/src/renderer/picker.rs",
    "bae-import/src/tables.rs",
    "bae-import/src/tables/",
    "bae-transfers/src/queued_releases/",
    "bae-transfers/src/release_storage_action.rs",
    "bae-views/src/",
]

[[capabilities.gates]]
kind = "SQLite library (rusqlite / libsqlite3-sys)"
crates = ["rusqlite", "libsqlite3_sys"]

# The library's tables by the domain that writes them. SQL anywhere may read
# a table; only its domain's homes write it, in a statement or a trigger's
# body, create it and its indexes, and hold the tests that write it. Each
# domain names the owner that does its work, and every table a crate's `.sql`
# file creates is in one domain.
[database]
capability = "SQLite"

[[database.domains]]
name = "records"
owner = "Records"
homes = [
    "bae-records/src/records.rs",
    "bae-records/src/records.sql",
    "bae-records/src/records/",
    "bae-records/src/test_fixtures.rs",
    "bae-records/src/test_fixtures/",
]
tables = [
    "artists",
    "artist_credits",
    "artist_merges",
    "artist_shown_as",
    "artist_images",
    "albums",
    "album_artists",
