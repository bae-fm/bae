    "bae-people",
    "bae-sync-status",
    "bae-preferences",
    "bae-track-audio",
    "bae-identify",
    "bae-playback",
    "bae-import",
    "bae-transfers",
    "bae-views",
    "bae-library",
    "bae-app",
    "bae-automation",
    "bae-subsonic",
    "bae-cast",
    "bae-mcp",
    "bae-desktop",
    "bae-bridge",
]

