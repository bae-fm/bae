# The read rule, which coven's typed lints hold (clippy::read_sort and the
# rest): a read does no work its SQL can do and keeps no memory between reads.
# These rows tell the lints what a read is, by each type's path: the types a
# read receives, the live queries, the row a statement hands its row mapper,
# the traits of one column's value, the live queries asked with a request,
# the keyed latest-value streams a holder of a live query may hold beside it,
# and the types that keep memory. The plumbing files run every live query and
# are no read code. Each finding bae keeps is an `#[expect]` on its item,
# with its reason.
[read_shapes]
rule = "projects/bae-rules/screen-reads/reactive-screens-read-plain-live-queries.md in agent-instructions"
read_types = ["coven::SqlRead", "coven::SqlReadContext", "bae_store::live_query::read::ReadFor", "bae_store::store_read::StoreRead", "coven::LiveQuery", "coven::ReconfigurableLiveQuery"]
live_query_types = ["coven::LiveQuery", "coven::ReconfigurableLiveQuery", "bae_store::live_results::LiveResults", "bae_store::live_query::CancellableLiveQuery", "bae_store::live_query::read::LiveRead", "bae_store::live_query::values::LiveValues"]
statement_rows = ["coven::Row"]
column_values = ["coven::types::FromSql"]
request_query_types = ["coven::ReconfigurableLiveQuery", "bae_store::live_query::CancellableLiveQuery", "bae_store::live_query::read::LiveRead"]
value_stream_types = ["coven::TransferWatch", "bae_transfers::release_transfers::ReleaseTransfersWatch", "bae_bridge::keyed_values::KeyedValueStream"]
kept_state_types = ["std::sync::Mutex", "tokio::sync::Mutex", "std::cell::RefCell", "std::cell::Cell", "std::sync::OnceLock", "std::cell::OnceCell", "std::sync::atomic::AtomicBool", "std::sync::atomic::AtomicU8", "std::sync::atomic::AtomicU32", "std::sync::atomic::AtomicU64"]
plumbing = [
    "bae-store/src/live_query.rs",
    "bae-store/src/live_query/",
    "bae-store/src/live_results.rs",
    "bae-store/src/store.rs",
    "bae-store/src/store_read.rs",
    "bae-store/src/store/coven_capabilities.rs",
]
