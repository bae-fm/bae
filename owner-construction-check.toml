# bae's policy for coven's structural checker (owner-construction-check),
# which scripts/owner-construction-check.sh installs at a pinned coven
# revision and runs on this workspace.

# The rule groups bae holds itself to: its crates depend only downward, no
# struct exists only to be taken apart, each library table is written only
# from its domain's homes (the [database] rows below), and an owner never
# hands out what it holds.
rules = ["component-bundles", "crate-dependencies", "database-boundary", "owner-dependencies"]

# The code generator for the bindings answers only to the conventions.
tools = ["bae-uniffi-bindgen"]

# The crates in dependency order: each depends, dev-dependencies included,
# only on crates before it. bae-views sits below bae-library because the
# library's tests read the views.
crate_order = [
    "bae-loc",
    "bae-mirror",
    "bae-theme",
    "bae-types",
    "bae-util",
    "bae-audio",
    "bae-diagnostics",
    "bae-catalogs",
    "bae-app-dir",
    "bae-store",
    "bae-records",
    "bae-people",
    "bae-sync-status",
    "bae-preferences",
    "bae-track-audio",
    "bae-identify",
    "bae-playback",
    "bae-import",
    "bae-transfers",
    "bae-views",
    "bae-library",
    "bae-app",
    "bae-automation",
    "bae-subsonic",
    "bae-cast",
    "bae-mcp",
    "bae-desktop",
    "bae-bridge",
]

# These are retained service capabilities, not values passed between
# operations. The checker also follows fields containing them, so an owner made
# from another owner is covered. Records and configuration values are omitted;
# shared in-memory state has its own rows below.
capability_types = [
    "AbortHandle",
    "AirPlaySink",
    "AirPlayStreamControl",
    "AppServices",
    "ArtworkAnalyzer",
    "ArtworkAnalyzerCallback",
    "AudioDataReader",
    # An AudioOutputDevice opens a new output for each player that asks. The
    # system device owns what its outputs share: on a Mac, the formats bae's
    # streams set the output devices to, which only one owner of both players'
    # outputs can put back.
    "AudioOutput",
    "AudioStream",
    "CancellationToken",
    "CandidateRuntime",
    "CastController",
    "CoverUrlProvider",
    # This app's stores on this device: the keychain and the network watch
    # every store opens with.
    "Coven",
    "CovenHandle",
    "Diagnostics",
    "DiagnosticsTransport",
    "DiscogsClient",
    "DiscogsValidationObserver",
    "DiskImageCache",
    "FetchArbiter",
    "FileStream",
    "FolderWatcher",
    "Handle",
    "IdSource",
    "IdSourceRef",
    "IdentifyService",
    "ImportService",
    "ImportServiceHandle",
    "LibraryManager",
    "LruCache",
    "McpServerController",
    "MediaUrlProvider",
    "MonotonicClock",
    "PcmSource",
    "PlaybackQueue",
    "PlaybackService",
    "RemoteImageCache",
    "Renderer",
    "RendererChannel",
    "RootRemovalBackend",
    "RtspConnection",
    "Runtime",
    "ServiceDaemon",
    "SessionCache",
    "SparseStreamingBuffer",
    "Store",
    "SubsonicPasswordProvider",
    "SubsonicServerController",
    "TrackStream",
    "WatchBackend",
    "Write",
    "WriteAvioContext",
    "WriteSeek",
]

# Shared in-memory state: whoever holds one shares it with the others that
# do, so an owner shares it on purpose, and it leaves that owner only inside
# a handle the owner makes.
shared_state_types = [
    "AtomicBool",
    "AtomicU8",
    "AtomicU32",
    "AtomicU64",
    "AtomicUsize",
    "JoinHandle",
    "Notify",
    "OnceCell",
    "OnceLock",
    "Receiver",
    "Semaphore",
    "Sender",
    "UnboundedReceiver",
    "UnboundedSender",
]
# Locks an owner keeps to itself while it holds them by value; held through
# a shared pointer they are shared state.
private_state_types = ["Condvar", "Mutex"]
# Every holder of one of these shares what it points at with the others.
shared_pointer_types = ["Arc", "Weak"]

# Types that bae's dependencies declare: std and tokio's locks, atomics,
# shared pointers, channels, tasks and runtimes, coven's handle, and the
# libraries' own services.
external_types = [
    "AbortHandle",
    "Arc",
    "AtomicBool",
    "AtomicU32",
    "AtomicU64",
    "AtomicU8",
    "AtomicUsize",
    "CancellationToken",
    "Condvar",
    "Coven",
    "CovenHandle",
    "Handle",
    "IdSource",
    "IdSourceRef",
    "JoinHandle",
    "LruCache",
    "Mutex",
    "Notify",
    "OnceCell",
    "OnceLock",
    "Receiver",
    "Runtime",
    "Semaphore",
    "Sender",
    "ServiceDaemon",
    "UnboundedReceiver",
    "UnboundedSender",
    "Weak",
    "Write",
]

# Values that name a capability or shared state in a field but own no
# lifetime of it: a message sent to a thread or task, the parameters one
# operation is started with, and an operation's result.
non_owner_types = [
    # Messages to the playback thread and the services' coordinators; they
    # carry reply channels for the one request they hold.
    "PlaybackCommand",
    "PlaybackMessage",
    "Wake",
    "WatcherCommand",
    "CoordinatorEvent",
    "WorkerMessage",
    "Command",
    # What one scan pass or one folder reading is asked to do.
    "RootPass",
    "FolderReadingRequest",
    # What one decode is started with.
    "StreamDecodeParams",
    "SegmentDecodeParams",
    "DecoderSetup",
    "DecodeFailureReport",
    "PreparedAudioSegment",
    "PlaybackPreparedTrack",
    # What opening a library hands the app.
    "BridgeBootstrapResult",
    # What a call was passed to follow it, if the app shows the call: the
    # app's object, held for the one call, and the call's writer made from it.
    "ClosingFeed",
    "SetupFeed",
    # Plain data the owner that holds it guards with its own lock: the
    # holder is built at its root, the data starts empty inside it.
    "WorkInFlight",
    "DiscogsKey",
    "Queue",
    "Queued",
    # The recorded routes and requests of the test host, behind its lock.
    "FakeState",
    # A server controller's state, plain data behind its lock.
    "ServerState",
    # The hold on one image path, kept in the test image host's map.
    "HeldPath",
]

