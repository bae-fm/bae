# Work that runs on after its caller returns starts only at a listed root,
# which keeps it and stops it: a runtime, the ambient runtime a task would
# take without being handed one, and a thread or task spawn.
[[background_starts]]
kind = "runtime construction"
paths = ["Runtime::new", "Builder::new_current_thread", "Builder::new_multi_thread"]

[[background_starts]]
kind = "ambient runtime acquisition"
paths = ["Handle::current", "Handle::try_current"]

[[background_starts]]
kind = "thread or future spawn"
paths = ["tokio::spawn", "task::spawn", "task::spawn_blocking", "task::spawn_local", "thread::spawn"]
methods = ["spawn", "spawn_blocking", "spawn_local"]

# SQLite: the store and the crates whose domains keep tables in it. Only
# these name a raw rusqlite handle.
[[capabilities]]
name = "SQLite"
homes = [
    "bae-store/src/",
    "bae-records/src/",
    "bae-people/src/",
    "bae-sync-status/src/",
    "bae-preferences/src/row.rs",
    "bae-playback/src/tables.rs",
    "bae-playback/src/tables/",
    "bae-playback/src/renderer/picker.rs",
    "bae-import/src/tables.rs",
    "bae-import/src/tables/",
    "bae-transfers/src/download_entry.rs",
    "bae-transfers/src/queued_releases/",
    "bae-views/src/",
]

[[capabilities.gates]]
kind = "SQLite library (rusqlite / libsqlite3-sys)"
crates = ["rusqlite", "libsqlite3_sys"]

# Only generation is gated: name-based ids (`Uuid::new_v5`), parsing and
# validating an id are deterministic transformations any module may perform.
# Everything else is handed an id source (`coven::IdSource`).
[[capabilities]]
name = "new ids"
homes = ["bae-util/src/time_ordered_ids.rs"]

[[capabilities.gates]]
kind = "id generation (uuid)"
paths = ["Uuid::new_v4", "Uuid::new_v7", "Uuid::now_v7"]

# The library's tables by the domain that writes them. SQL anywhere may read
# a table; only its domain's homes write it, in a statement or a trigger's
# body, create it and its indexes, and hold the tests that write it. Each
# domain names the owner that does its work, and every table a crate's `.sql`
# file creates is in one domain.
[database]
capability = "SQLite"
# Items gated on test support take a raw connection: a bare library's schema is
# applied in one place, `Schema::open_bare_library`, for every crate's tests.
test_support_features = ["test-utils"]

[[database.domains]]
name = "records"
owner = "Records"
homes = [
    "bae-records/src/records.rs",
    "bae-records/src/records.sql",
    "bae-records/src/records/",
    "bae-records/src/test_fixtures.rs",
    "bae-records/src/test_fixtures/",
]
tables = [
    "artists",
    "artist_credits",
    "artist_merges",
    "artist_shown_as",
    "artist_images",
    "albums",
    "album_artists",
    "works",
    "work_artists",
    "work_parts",
    "releases",
