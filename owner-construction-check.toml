# This table tells the read-shapes rule what a read is, which types keep memory
# or run a live query, and which store files run every live query and are not
# themselves read code. A read returns what the screen shows; the lists below
# hold the findings the rule finds today (frozen: they only shrink) and, in
# `allowed`, the matches whose values are not a read's rows.
[read_shapes]
rule = "projects/bae-rules/screen-reads/reactive-screens-read-plain-live-queries.md in agent-instructions"
read_types = ["SqlRead", "SqlReadContext", "ReadFor", "StoreRead", "LiveQuery", "ReconfigurableLiveQuery"]
live_query_types = ["LiveQuery", "ReconfigurableLiveQuery", "LiveResults", "CancellableLiveQuery", "LiveRead", "LiveValues", "WithSyncState"]
request_query_types = ["ReconfigurableLiveQuery", "CancellableLiveQuery", "LiveRead"]
value_stream_types = ["TransferWatch", "ReleaseTransfersWatch", "LocalBytesWatch", "KeyedValueStream"]
kept_state_types = ["Mutex", "RefCell", "Cell", "OnceLock", "OnceCell", "AtomicBool", "AtomicU8", "AtomicU32", "AtomicU64"]
plumbing = [
    "bae-store/src/live_query.rs",
    "bae-store/src/live_query/",
    "bae-store/src/live_results.rs",
    "bae-store/src/store.rs",
    "bae-store/src/store_read.rs",
    "bae-store/src/store/coven_capabilities.rs",
    "bae-store/src/with_sync_state.rs",
]
frozen = [
    { path = "bae-app/src/live_reads/import_candidate.rs", item = "LiveImportCandidate", shape = "kept-state", count = 1, finding = "`LiveImportCandidate` keeps `shown`, which holds `Mutex` state, beside its live query (found by the check)" },
    { path = "bae-bridge/src/screens/detail.rs", item = "ImportCandidateSubscription::cancel", shape = "kept-state", count = 1, finding = "reads through `inner`, the `LiveImportCandidate` that keeps the candidate it last showed in a `Mutex` between reads" },
    { path = "bae-bridge/src/screens/detail.rs", item = "ImportCandidateSubscription::next", shape = "kept-state", count = 1, finding = "reads through `inner`, the `LiveImportCandidate` that keeps the candidate it last showed in a `Mutex` between reads" },
    { path = "bae-catalogs/src/remote_image/covers.rs", item = "RemoteImageSet::with_copies", shape = "filter", count = 1, finding = "`RemoteImageSet::with_copies` filters with `dedup_by_key` (found by the check)" },
    { path = "bae-catalogs/src/remote_image/covers.rs", item = "RemoteImageSet::with_copies", shape = "sort", count = 1, finding = "`RemoteImageSet::with_copies` sorts with `sort_by_key` (found by the check)" },
    { path = "bae-catalogs/src/remote_image/covers.rs", item = "push_unique_cover", shape = "pick", count = 1, finding = "`push_unique_cover` picks with `find` (found by the check)" },
    { path = "bae-identify/src/release_group/labels.rs", item = "Pressing::document_failure", shape = "pick", count = 1, finding = "picks the first document failure among a pressing's catalog releases with `find_map`" },
    { path = "bae-identify/src/release_group/pressing.rs", item = "Pressing::claims", shape = "pick", count = 1, finding = "tests whether a partner pressing's releases share a catalog with `any`" },
    { path = "bae-identify/src/release_group/pressing.rs", item = "Pressing::sources", shape = "filter", count = 1, finding = "keeps the catalogs some release of the pressing comes from (`filter`)" },
    { path = "bae-identify/src/release_group/pressing.rs", item = "Pressing::sources", shape = "pick", count = 1, finding = "tests each catalog against the pressing's releases with `any`" },
    { path = "bae-identify/src/shared_album.rs", item = "AlbumLink::new", shape = "length-branch", count = 1, finding = "makes no album link when a release's album rows are empty (`is_empty`)" },
    { path = "bae-identify/src/shared_album.rs", item = "AlbumLink::new", shape = "pick", count = 1, finding = "tests that the album rows are in catalog rank order with `all` over `windows(2)`" },
