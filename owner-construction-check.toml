# bae's policy for coven's structural checker (owner-construction-check) and
# coven's typed lints, which scripts/owner-construction-check.sh and
# tools/typed-lints/tool.sh fetch at one pinned coven revision. The typed
# lints hold the owner rules, whose rows name each type by its path.

# The rule groups bae holds itself to: its crates depend only downward, no
# struct exists only to be taken apart, each library table is written only
# from its domain's homes (the [database] rows below), and an owner never
# hands out what it holds. A capability (the capability_types below) is built
# only at a composition root or inside a task made for one operation
# (capability-construction), and handed on only along the paths the policy
# lists (capability-boundaries). Work that runs on after its caller returns
# (the [[background_starts]] below, and clippy.toml) starts only at a listed
# root.
rules = ["capability-boundaries", "capability-construction", "component-bundles", "crate-dependencies", "database-boundary", "owner-dependencies"]

# The code generator for the bindings answers only to the conventions.
tools = ["bae-uniffi-bindgen"]

# Items gated on test support take a raw connection: `Schema::open_bare_library`
# applies a bare library's schema for every crate's tests.
test_support_features = ["test-utils"]

# The crates in dependency order: each depends, dev-dependencies included,
# only on crates before it. bae-views sits below bae-library because the
# library's tests read the views.
crate_order = [
    "bae-desktop-cfg",
    "bae-loc",
    "bae-mirror",
    "bae-theme",
    "bae-types",
    "bae-util",
    "bae-audio",
    "bae-diagnostics",
    "bae-app-dir",
    "bae-store",
    "bae-catalogs",
