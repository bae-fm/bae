# bae's policy for coven's structural checker (owner-construction-check),
# which scripts/owner-construction-check.sh installs at a pinned coven
# revision and runs on this workspace.

# The rule groups bae holds itself to: its crates depend only downward, no
# struct exists only to be taken apart, each library table is written only
# from its domain's homes (the [database] rows below), and an owner never
# hands out what it holds. A capability (the capability_types below) is built
# only at a composition root or inside a task made for one operation
# (capability-construction), and handed on only along the paths the policy
# lists (capability-boundaries). Work that runs on after its caller returns
# (the [[background_starts]] below) starts only at a listed root.
rules = ["capability-boundaries", "capability-construction", "component-bundles", "crate-dependencies", "database-boundary", "owner-dependencies", "read-shapes"]

# The code generator for the bindings answers only to the conventions.
tools = ["bae-uniffi-bindgen"]

# The crates in dependency order: each depends, dev-dependencies included,
# only on crates before it. bae-views sits below bae-library because the
# library's tests read the views.
crate_order = [
    "bae-desktop-cfg",
    "bae-shots",
    "bae-loc",
    "bae-mirror",
    "bae-theme",
    "bae-types",
    "bae-util",
    "bae-audio",
    "bae-diagnostics",
    "bae-catalogs",
    "bae-app-dir",
    "bae-store",
    "bae-records",
    "bae-people",
    "bae-sync-status",
    "bae-preferences",
    "bae-track-audio",
    "bae-identify",
    "bae-playback",
    "bae-import",
    "bae-transfers",
    "bae-views",
    "bae-library",
    "bae-app",
    "bae-automation",
    "bae-subsonic",
    "bae-cast",
    "bae-mcp",
    "bae-desktop",
    "bae-bridge",
]

