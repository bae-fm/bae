# bae's policy for coven's structural checker (owner-construction-check),
# which scripts/owner-dependency-boundary.sh installs at a pinned coven
# revision and runs on this workspace.

# The rule groups bae holds itself to: its crates depend only downward, no
# struct exists only to be taken apart, and an owner never hands out what it
# holds.
rules = ["component-bundles", "crate-dependencies", "owner-dependencies"]

# The code generator for the bindings answers only to the conventions.
tools = ["bae-uniffi-bindgen"]

# The crates in dependency order: each depends, dev-dependencies included,
# only on crates before it. bae-views sits below bae-library because the
# library's tests read the views.
crate_order = [
    "bae-loc",
    "bae-mirror",
    "bae-theme",
    "bae-types",
    "bae-util",
    "bae-audio",
    "bae-diagnostics",
    "bae-catalogs",
    "bae-app-dir",
    "bae-db",
    "bae-preferences",
    "bae-track-audio",
    "bae-identify",
    "bae-playback",
    "bae-import",
    "bae-transfers",
    "bae-views",
    "bae-library",
    "bae-app",
    "bae-automation",
    "bae-subsonic",
    "bae-cast",
    "bae-mcp",
    "bae-desktop",
    "bae-bridge",
]

# These are retained service capabilities, not values passed between
# operations. The checker also follows fields containing them, so an owner made
# from another owner is covered. Records and configuration values are omitted;
# shared in-memory state has its own rows below.
capability_types = [
    "AbortHandle",
    "AirPlaySink",
    "AirPlayStreamControl",
    "AppServices",
    "ArtworkAnalyzer",
    "ArtworkAnalyzerCallback",
    "AudioDataReader",
    # An AudioOutputDevice opens a new output for each player that asks. The
    # system device owns what its outputs share: on a Mac, the formats bae's
    # streams set the output devices to, which only one owner of both players'
    # outputs can put back.
    "AudioOutput",
    "AudioStream",
    "CancellationToken",
    "CandidateRuntime",
    "CastController",
    "CoverUrlProvider",
    # This app's stores on this device: the keychain and the network watch
    # every store opens with.
    "Coven",
    "CovenHandle",
    "Database",
    "Diagnostics",
    "DiagnosticsTransport",
    "DiscogsClient",
    "DiscogsValidationObserver",
    "DiskImageCache",
    "ExtractionService",
    "FetchArbiter",
    "FileStream",
    "FolderWatcher",
    "Handle",
    "IdSource",
    "IdSourceRef",
    "IdentifyService",
    "ImportService",
    "ImportServiceHandle",
    "LibraryManager",
    "LocalSessionManager",
    "LruCache",
    "McpServerController",
    "MediaUrlProvider",
    "MonotonicClock",
    "PcmSource",
    "PlaybackQueue",
    "PlaybackService",
    "RemoteImageCache",
    "Renderer",
    "RendererChannel",
    "RootRemovalBackend",
    "RtspConnection",
    "Runtime",
    "SaveService",
    "ServiceDaemon",
    "SessionCache",
    "SparseStreamingBuffer",
    "SrpClient",
    "SubsonicPasswordProvider",
    "SubsonicServerController",
    "TrackStream",
    "UploadThroughput",
    "WatchBackend",
    "Write",
    "WriteAvioContext",
    "WriteSeek",
]

# Shared in-memory state: whoever holds one shares it with the others that
# do, so an owner shares it on purpose, and it leaves that owner only inside
# a handle the owner makes.
shared_state_types = [
    "AtomicBool",
    "AtomicU8",
    "AtomicU32",
    "AtomicU64",
    "AtomicUsize",
    "JoinHandle",
    "Notify",
    "OnceCell",
    "OnceLock",
    "Receiver",
    "Semaphore",
    "Sender",
    "UnboundedReceiver",
    "UnboundedSender",
]
# Locks an owner keeps to itself while it holds them by value; held through
# a shared pointer they are shared state.
private_state_types = ["Condvar", "Mutex"]
# Every holder of one of these shares what it points at with the others.
shared_pointer_types = ["Arc", "Weak"]

# Types that bae's dependencies declare: std and tokio's locks, atomics,
# shared pointers, channels, tasks and runtimes, coven's handle and store
# files, and the libraries' own services.
external_types = [
    "AbortHandle",
    "Arc",
    "AtomicBool",
    "AtomicU32",
    "AtomicU64",
    "AtomicU8",
    "AtomicUsize",
    "CancellationToken",
    "Condvar",
    "Coven",
    "CovenHandle",
    "FileStream",
    "Handle",
    "IdSource",
    "IdSourceRef",
    "JoinHandle",
    "LocalSessionManager",
    "LruCache",
    "Mutex",
    "Notify",
    "OnceCell",
    "OnceLock",
    "Receiver",
    "Runtime",
    "Semaphore",
    "Sender",
    "ServiceDaemon",
    "UnboundedReceiver",
    "UnboundedSender",
    "Weak",
    "Write",
]

# Values an owner makes for its caller's one operation, view or read and
# that are dropped when it ends, so an owner may return a new one. Those that
# are capability types stay listed there too, so retained fields and getters
# are still checked.
task_types = [
    # One read of a file's audio, one output stream, and the stream's control.
    "AudioDataReader",
    "AudioOutput",
    "AudioStream",
    "AirPlayStreamControl",
    # One open file's bytes from coven.
    "FileStream",
    # A client asking Discogs with the library's stored key, for one call.
    "DiscogsClient",
    # A screen's live read of the library, for as long as the screen shows it,
    # and the bridge's subscription the app holds over each one.
    "LiveAlbumBrowse",
    "LiveArtistBrowse",
    "LiveComposerBrowse",
    "LiveComposerDetailRows",
    "LiveDownloadBrowse",
    "LiveAlbumSelection",
    "LiveArtistSearch",
    "LiveLibrarySearch",
    "LiveLibraryStatus",
    "LiveImportList",
    "LiveQueueUpcoming",
    "LiveReleaseFiles",
    "LiveStorageBrowse",
    "LiveDetail",
    "LiveValues",
    "WithSyncState",
    "CancellableLiveQuery",
    "AddedDeviceSubscription",
    "AdminChangesSubscription",
    "AlbumBrowseSubscription",
    "AlbumDetailSubscription",
    "AlbumSelectionSubscription",
    "ArtistBrowseSubscription",
    "ArtistDetailSubscription",
    "ArtistSearchSubscription",
    "CandidateRuntimeSubscription",
    "CastDevicesSubscription",
    "ComposerBrowseSubscription",
    "ComposerDetailSubscription",
    "ComposerDetailRowsSubscription",
    "ConfigSubscription",
    "DownloadBrowseSubscription",
    "DownloadCountsSubscription",
    "FolderScansSubscription",
    "ImportCandidateSubscription",
    "ImportCountsSubscription",
    "ImportListSubscription",
    "InvalidCandidateSubscription",
    "InvitesSubscription",
    "LibraryNameSubscription",
    "LibrarySearchSubscription",
    "LibraryStatusSubscription",
    "MembersSubscription",
    "PlaybackTimelineSubscription",
    "PlaybackValuesSubscription",
    "ProfilesSubscription",
    "QueueAdditionsSubscription",
    "QueueSubscription",
    "QueueUpcomingSubscription",
    "ReleaseDetailSubscription",
    "ReleaseFilesSubscription",
    "RequestedProfileSubscription",
    "StorageBrowseSubscription",
    "StorageInspectorSubscription",
    "SyncActivitySubscription",
    "SyncStatusSubscription",
    "UploadsPausedSubscription",
    "WorkDetailSubscription",
    # One fast-changing value feed a screen pulls from while it is open.
    "KeyedValueStream",
    # One subscriber's watch on the outbox's transfers.
    "OutboxTransfersWatch",
    "OutboxTotalTransferWatch",
    # One editor's session on one release, and the bridge's object the app
    # holds over it.
    "ReleaseEdit",
    "ReleaseEditSession",
    # One operation's view of the catalogs.
    "CatalogSession",
    # One file stream's shared buffer, and the fetch that fills one read.
    "SharedSparseBuffer",
    "FillTask",
    # One track's decode for a caller outside the library.
    "TrackDecode",
    # One background task or thread a caller started, reporting its failure.
    "ReportedTask",
    "ReportedThread",
    # One running pin of a release.
    "RunningOp",
    # One scan pass's file reads, and what one finished removal leaves to
    # announce.
    "FileReads",
    "RemovalOutcome",
]

# Handles (Appendix F.3): what an owner makes from its own state to hand out.
# Only the owner makes and returns one; a holder receives it when it is built
# and keeps it for its one piece of work.
[handles]
# Where one close or removal writes its steps: the send end of the stream
# the app pulls from the closing it made.
ClosingSteps = "BridgeLibraryClosing"
# Where one setup call writes its steps, the same way.
SetupSteps = "BridgeLibrarySetup"
# Where one call writes how far it has got: the send end of the progress
# stream the app last took.
ProgressWriter = "ProgressStream"
# One release's progress, listed among every release's transfer of its kind
# while that transfer runs; dropping it removes the release. And a watch on
# every release's progress.
ReleaseTransferReport = "ReleaseTransfers"
ReleaseTransfersWatch = "ReleaseTransfers"
# A release's place in the transfers this process can stop between files,
# held while its transfer runs; dropping it removes the release's token.
DetachRegistration = "DetachCancels"
# One read's wait on storage, counted in the storage waits while it runs,
# and a watch on the track whose load waits on storage.
FetchProgress = "StorageWaits"
StorageWaitWatch = "StorageWaits"
# Every progress event playback reports, and where playback is.
PlaybackProgressFeed = "PlaybackProgressHandle"
PlaybackPositionsWatch = "PlaybackProgressHandle"
# The ranges one sparse buffer holds, and the playing track's held
# stretches, which the playback handle follows from the bytes the service
# tells it.
HeldRangesWatch = "SparseStreamingBuffer"
TrackBufferedFollow = "PlaybackHandle"
# A watch on one discovery's device list.
DeviceListWatch = "PublishedDevices"
# Import events off the bus, and one import's progress and the scan events
# the bus filters from them; the percents of the running imports, and a
# test's feeds of the runtime's changes and counts; and the snapshots of the
# extraction feeding one identify run.
ImportEvents = "ImportEventBus"
ImportProgressFeed = "ImportEventBus"
ScanEvents = "ImportEventBus"
ImportPercentsWatch = "CandidateRuntime"
CandidateRuntimeChanges = "CandidateRuntime"
IdentificationCounts = "CandidateRuntime"
ExtractionWatch = "ExtractionService"
# One pin, unpin or audio detachment's progress.
TransferProgressFeed = "LibraryManager"
# One request a rate limiter let through, settled against the limiter.
Admitted = "RateLimiter"
# One reader of a sparse buffer, with its own slot in the buffer's demands.
BufferReader = "SparseStreamingBuffer"
# One output's lease on the device format, and one stream's format, held
# while the stream plays.
FormatLease = "DeviceFormats"
StreamFormat = "PlayerFormat"
# One image a test's remote image host holds back until the test lets it go.
ImageHold = "RemoteImageHost"

# Where the app opens: the bootstrap builds the runtime, the clock, the ids,
# the HTTP client and the library's owners once, and starts the services that
# run while the library is open. The bridge's opening calls are where the
# platform apps start that bootstrap and receive the handle on what it built.
# Task starts are listed with them: each starts a service's long-lived work,
# which the handle it returns stops.
[composition_roots]
"bae-app/src/lib.rs" = [
    "bootstrap",
    "bootstrap_prepared",
    "bootstrap_on_fixture",
    "bootstrap_opening",
    "bootstrap_inner",
]
"bae-bridge/src/host.rs" = [
    "BridgeHost::open_prepared",
    "BridgeHost::create_library",
    "BridgeHost::open_app",
    "BridgeHost::open_app_on_fixture",
]
# Restoring, joining and resetting a device open the library they leave.
"bae-bridge/src/host/bootstrap.rs" = [
    "BridgeHost::restore_from_code",
    "BridgeHost::restore_replacing_device",
    "BridgeHost::restore_from_saved_code",
    "BridgeHost::join_with_invite",
    "BridgeHost::resume_join",
    "BridgeHost::prepare_device_reset",
    "BridgeDeviceReset::confirm",
]
# The sink the app built at launch, taken back as core's by the host the app
# builds on it.
"bae-bridge/src/init.rs" = ["BridgeDiagnostics::core"]
# A library just set up opens.
"bae-bridge/src/setup.rs" = ["OpenedLibrary::open"]
# A test's catalog fakes: the providers its library asks are built over
# them, once per library the test opens.
"bae-catalogs/src/fake_catalogs.rs" = ["FakeCatalogs::providers"]
# Two stores a test syncs over shared memory storage: it creates the first
# and restores the second from it, and hands the test, the final owner of
# what it built, each store to write and read. It is test-utils code, which
# the views' tests compile, so the checker reads it as production code.
"bae-db/src/test_devices.rs" = ["TwoStores::a", "TwoStores::b"]
# One person's devices of a test library, syncing over shared memory storage:
# it creates the first device and restores more from its code, and hands the
# test, the final owner of what it built, each device and the manager and
# store it runs. It is test-utils code, which the library's integration tests
# compile, so the checker reads it as production code.
"bae-library/src/test_libraries/devices.rs" = [
    "TestDevice::manager",
    "TestDevice::database",
    "TwoDevices::a",
    "TwoDevices::b",
    "TwoDevices::a_mut",
    "TwoDevices::b_mut",
    "DeviceLibrary::first",
    "DeviceLibrary::restore",
]
# A test's library: it opens the library as the app's opening step does, and
# hands the test, the final owner of what it built, the manager, the parts the
# app's step hands the library's services, and the services it builds over
# them. It is test-utils code, which the tests of the crates above
# compile, so the checker reads it as production code.
"bae-library/src/test_libraries.rs" = [
    "TestLibrary::deref",
    "TestLibrary::database",
    "TestLibrary::catalogs",
    "TestLibrary::closing",
    "TestLibrary::clock",
    "TestLibrary::ids",
    "TestLibrary::diagnostics",
    "TestLibrary::remote_images",
    "TestLibrary::cast_picker",
    "TestLibrary::start_playback",
    "TestLibrary::start_playback_on",
]
# Starts a worker's thread: it opens the worker's channel and moves the
# receiving end into the thread it starts, so the sender the worker keeps
# is always the one paired with that thread. Its handle stops the thread.
"bae-util/src/worker_thread.rs" = ["WorkerThread::spawn"]
# Starts the playback service's task; its handle stops it.
"bae-playback/src/service/runtime.rs" = [
    "PlaybackService::start",
    "PlaybackService::start_with_audio_device",
    "PlaybackService::start_inner",
]
# Starts the identification queue's task; its handle stops it.
"bae-import/src/handle/identification.rs" = [
    "ImportServiceHandle::start_identification_queue",
]
