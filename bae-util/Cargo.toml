[package]
name = "bae-util"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_util"
path = "src/lib.rs"

[build-dependencies]
# Sets the `desktop` cfg for the crate's desktop-only code.
bae-desktop-cfg = { workspace = true }

[dependencies]
# Work apart from its caller whose panic comes back as a value
# (src/task_failure.rs re-exports `coven::task`).
coven = { workspace = true }
# The outbound client every provider shares (src/http.rs). `rustls`: the
# providers it reaches are HTTPS.
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# The embedded servers' graceful-shutdown token (src/server.rs).
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The log subscriber every app installs (src/logging.rs), with its per-sink
# filters; also the test log capture (src/test_logs.rs).
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Carries dependencies' `log` crate records into that subscriber, admitting no
# level finer than a sink keeps of them.
tracing-log = { workspace = true }
# HTTP-date and epoch arithmetic for a response's asked-for wait (src/http.rs).
chrono = { workspace = true }
# The jitter drawn into each retry wait (src/retry.rs).
rand = { workspace = true }
# The version-7 ids bae makes (src/time_ordered_ids.rs).
uuid = { workspace = true, features = ["v7"] }
lru = { workspace = true }
# Natural, case-insensitive name order (src/natural_order.rs).
natord = { workspace = true }
# The sort keys names are ordered by, in the viewer's language (src/name_key.rs).
icu_collator = { workspace = true }
icu_locale_core = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Image downscaling at store time (src/stored_image.rs) runs on every
# platform — imports, change-cover and artist pictures store a ≤600 JPEG
# everywhere, so a stored image file is uniform regardless of which device
# imported it. Decode JPEG, PNG, GIF and WebP without default features (no
# rayon), including mobile.
image = { workspace = true, features = ["jpeg", "png", "gif", "webp"] }
# A JPEG decodes at 1/2, 1/4 or 1/8 scale (src/stored_image.rs), so the memory
# a camera photo takes follows the 600-pixel output; the image crate's decoder
# has no scaled decode.
jpeg-decoder = { workspace = true }

# The open-file limit (src/open_file_limit.rs) is a Unix resource limit, and the
# frame clock (src/frame_clock.rs) reads the Unix monotonic clocks.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The frame clock (src/frame_clock.rs) is the platform's monotonic clock; on Windows
# that is the performance counter.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Performance"] }

# Text encoding detection (src/text_encoding.rs) serves the import pipeline,
# which a mobile build does not compile; the predicate is the `desktop` cfg's
# (build.rs), which gates the module.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
chardetng = { workspace = true }
encoding_rs = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "io-util", "test-util"] }
# The budget of open files (`FileBudget::for_test`) the test places come from
# (src/test_files.rs).
coven = { workspace = true, features = ["test-utils"] }

[features]
default = []
# The test transport (`Http::for_test`, `serve`, its clock whose waits pass
# as they are armed, and the local servers and canned errors tests answer
# with), a local host that answers, records and holds a test's requests, and
# the places of the open-files budget a test opens a file in, for the tests of
# every crate that builds on this one. Dev/test-only: a production build
# never enables it.
test-utils = ["tokio/net", "tokio/io-util", "coven/test-utils"]

[lints]
workspace = true
