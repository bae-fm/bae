[package]
name = "bae-util"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_util"
path = "src/lib.rs"

[dependencies]
# Work apart from its caller whose panic comes back as a value
# (src/task_failure.rs re-exports `coven::task`).
coven = { workspace = true }
# The outbound client every provider shares (src/http.rs). `rustls`: the
# providers it reaches are HTTPS.
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# The embedded servers' graceful-shutdown token (src/server.rs).
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# HTTP-date and epoch arithmetic for a response's asked-for wait (src/http.rs).
chrono = { workspace = true }
# The jitter drawn into each retry wait (src/retry.rs).
rand = { workspace = true }
lru = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Image downscaling at store time (src/stored_image.rs) runs on every
# platform — imports, change-cover and artist pictures store a ≤600 JPEG
# everywhere, so a stored image file is uniform regardless of which device
# imported it. Decode JPEG, PNG, GIF and WebP without default features (no
# rayon), including mobile.
image = { workspace = true, features = ["jpeg", "png", "gif", "webp"] }

# The open-file limit (src/open_file_limit.rs) is a Unix resource limit.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Text encoding detection (src/text_encoding.rs) serves the import pipeline,
# which a mobile build does not compile; the predicate is the `desktop` cfg's
# (build.rs), which gates the module.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
chardetng = { workspace = true }
encoding_rs = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "io-util"] }

[features]
default = []
# The test transport (`Http::for_test`, `serve`, and the local servers and
# canned errors tests answer with) and a retry that sleeps no real time, for
# the tests of every crate that builds on this one. Dev/test-only: a
# production build never enables it.
test-utils = ["tokio/net", "tokio/io-util"]

[lints]
workspace = true
