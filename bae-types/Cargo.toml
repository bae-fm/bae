[package]
name = "bae-types"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false
# Sets the `desktop` cfg; see that file.
build = "../bae-util/build.rs"

[lib]
name = "bae_types"
path = "src/lib.rs"

[dependencies]
# Every pressing value is stored and serialized by its key.
serde = { version = "1.0", features = ["derive"] }
# Text is compared with its diacritics folded away (src/text_match/fold.rs).
unicode-normalization = "0.1"

# Album and track titles are read for the brackets that name an edition
# (src/text_match/title.rs), which only the import pipeline compares; the
# predicate is spelled as the code that gates the module spells it.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
regex = "1.11"

[features]
default = []
# The values the tests of the crates above this one build their fixtures from
# (`ReleaseLabel::of`, `pressing::area`, `pressing::made_of`,
# `barcode::with_check_digit`). Dev/test-only: a production build never enables
# it.
test-utils = []

[lints]
workspace = true
