[package]
name = "bae-types"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_types"
path = "src/lib.rs"

[build-dependencies]
# Sets the `desktop` cfg for the crate's desktop-only code.
bae-desktop-cfg = { workspace = true }

[dependencies]
# Every pressing value is stored and serialized by its key.
serde = { workspace = true, features = ["derive"] }
# A credit's qualifiers are stored as a JSON list.
serde_json = { workspace = true }
# The refusals this crate names.
thiserror = { workspace = true }
# Text is compared with its diacritics folded away (src/text_match/fold.rs).
unicode-normalization = { workspace = true }

# Album and track titles are read for the brackets that name an edition
# (src/text_match/title.rs), which only the import pipeline compares; the
# predicate is the `desktop` cfg's (bae-desktop-cfg), which gates the module.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
regex = { workspace = true }

[features]
default = []
# The values the tests of the crates above this one build their fixtures from
# (`ReleaseLabel::of`, `pressing::area`, `pressing::made_of`,
# `barcode::with_check_digit`). Dev/test-only: a production build never enables
# it.
test-utils = []

[lints]
workspace = true
