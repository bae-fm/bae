project: bae.xcodeproj
schemes:
  - bae
targets:
  - bae
index_exclude:
  # The shared BaeKit package (data/service/domain layer + generated bindings).
  # The iOS app uses only its launch infrastructure, so checking BaeKit here
  # would report everything the macOS app uses as dead.
  - "**/BaeKit/**"
disable_update_check: true
