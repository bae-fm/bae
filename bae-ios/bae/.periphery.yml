project: bae.xcodeproj
schemes:
  - bae
targets:
  - bae
index_exclude:
  # The shared BaeKit package (data/service/domain layer + generated bindings).
  # The macOS periphery run owns shared-code liveness; the iOS target uses a
  # subset of BaeKit's members, so re-checking it here only surfaces
  # macOS-only code as false iOS dead code.
  - "**/BaeKit/**"
disable_update_check: true
