name: bae
options:
  bundleIdPrefix: fm.bae
  deploymentTarget:
    # BaeKit, which the app links, uses Observation (`@Observable`): iOS 17.
    iOS: "17.0"
  xcodeVersion: "26.0"
packages:
  # The shared layer, the bridge bindings and the BaeBridgeFFI xcframework.
  BaeKit:
    path: ../../BaeKit
targets:
  bae:
    type: application
    platform: iOS
    # Config.xcconfig pulls in the Features.xcconfig build-ios.sh generates, so the
    # #if conditions match the bridge's feature set.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      # A stale gitignored bae/bae_bridge.swift from before BaeKit existed would
      # collide with the BaeBridge module.
      - path: bae
        excludes:
          - bae_bridge.swift
    preBuildScripts:
      - name: Build Rust Bridge
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./scripts/build-layout.sh
          MARKER="BaeKit/Frameworks/BaeBridgeFFI-ios.xcframework/Info.plist"
          BINDINGS_SOURCE="bae-bridge/swift-bindings-ios/bae_bridge.swift"
          BINDINGS="BaeKit/Sources/BaeBridge/bae_bridge_ios.swift"
          # Every file the last device build of the bridge read, as cargo
          # recorded it, plus the lockfile and the crates' manifests, which
          # decide what it reads.
          DEP_INFO="target-ios/aarch64-apple-ios/debug/libbae_bridge.d"
          NEEDS_BUILD=0
          if [ ! -f "$MARKER" ] || [ ! -f "$BINDINGS_SOURCE" ] || [ ! -f "$DEP_INFO" ]; then
            NEEDS_BUILD=1
          else
            # A dep-info line is "<output>: <input> <input> ...", with a space
            # inside a path written as "\ ".
            CHANGED=$(
              {
                awk '{
                  sub(/^[^:]*: /, "")
                  gsub(/\\ /, "\001")
                  n = split($0, inputs, " ")
                  for (i = 1; i <= n; i++) {
                    gsub("\001", " ", inputs[i])
                    print inputs[i]
                  }
                }' "$DEP_INFO"
                for manifest in Cargo.lock Cargo.toml */Cargo.toml; do
                  echo "$manifest"
                done
              } | while IFS= read -r input; do
                if [ "$input" -nt "$MARKER" ]; then
                  echo "$input"
                  break
                fi
              done
            )
            [ -n "$CHANGED" ] && NEEDS_BUILD=1
          fi
          if [ "$NEEDS_BUILD" -eq 1 ]; then
            echo "Bridge inputs changed (${CHANGED:-no recorded build}), rebuilding..."
            ./bae-bridge/build-ios.sh
          fi
          # A fresh worktree can have the xcframework cached but no bindings file.
          if [ ! -f "$BINDINGS" ] || [ "$BINDINGS_SOURCE" -nt "$BINDINGS" ]; then
            ./bae-bridge/install-swift-bindings.sh ios
          fi
          # The generator runs from build-ios.sh's own target dir: `cargo run`
          # executes the binary at a shared dir's top level, which another
          # checkout's build can overwrite with an older generator.
          export CARGO_TARGET_DIR=target-ios
          cargo run -q -p bae-theme --bin theme-gen -- emit --target apple --out-dir BaeKit/Sources/BaeKit/Generated
    dependencies:
      - package: BaeKit
    settings:
      base:
        # The app's identity, overridden per edition by run.sh and the release
        # workflow through these private names. Only this target maps them to
        # the standard settings: passing PRODUCT_NAME or
        # PRODUCT_BUNDLE_IDENTIFIER on xcodebuild's command line would also
        # override the Swift package targets, building BaeKit's resource bundle
        # as bae.bundle while the app copies BaeKit_BaeKit.bundle.
        BAE_APP_BUNDLE_IDENTIFIER: fm.bae.bae
        BAE_APP_PRODUCT_NAME: bae
        PRODUCT_BUNDLE_IDENTIFIER: $(BAE_APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: $(BAE_APP_PRODUCT_NAME)
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: bae/Info.plist
        SWIFT_VERSION: "6.2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        BAE_DATADOG_SITE: $(BAE_DATADOG_SITE)
        BAE_DATADOG_CLIENT_TOKEN: $(BAE_DATADOG_CLIENT_TOKEN)
        BAE_ENVIRONMENT: $(BAE_ENVIRONMENT)
        BAE_GIT_COMMIT: $(BAE_GIT_COMMIT)
        BAE_SENTRY_DSN: $(BAE_SENTRY_DSN)
        # CODE_SIGN_ENTITLEMENTS comes from the xcconfig layer the feature set drives;
        # a setting here would override it. There is no bundled app icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        OTHER_LDFLAGS:
          - -lz
          - -liconv
          - -lsqlite3
          - -framework Security
          - -framework SystemConfiguration
          - -framework CoreAudio
          - -framework AudioToolbox
          - -framework AVFoundation
          - -framework AVFAudio
schemes:
  bae:
    build:
      targets:
        bae: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
