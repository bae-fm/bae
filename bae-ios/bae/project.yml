name: bae
options:
  bundleIdPrefix: fm.bae
  deploymentTarget:
    # Observation (`@Observable`) needs iOS 17.
    iOS: "17.0"
  xcodeVersion: "26.0"
packages:
  # The shared layer, the bridge bindings and the BaeBridgeFFI xcframework.
  BaeKit:
    path: ../../BaeKit
targets:
  bae:
    type: application
    platform: iOS
    # Config.xcconfig pulls in the Features.xcconfig build-ios.sh generates, so the
    # #if conditions match the bridge's feature set.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      # A stale gitignored bae/bae_bridge.swift from before BaeKit existed would
      # collide with the BaeBridge module.
      - path: bae
        excludes:
          - bae_bridge.swift
      - path: ../../BaeKit/Sources/AppleHost/CloudKitService.swift
      - path: ../../BaeKit/Sources/AppleHost/CloudKitService+Account.swift
      - path: ../../BaeKit/Sources/AppleHost/CloudKitRecordReplacement.swift
      - path: ../../BaeKit/Sources/AppleHost/CloudKitFailure.swift
    preBuildScripts:
      - name: Build Rust Bridge
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          MARKER="BaeKit/Frameworks/BaeBridgeFFI-ios.xcframework/Info.plist"
          BINDINGS_SOURCE="bae-bridge/swift-bindings-ios/bae_bridge.swift"
          BINDINGS="BaeKit/Sources/BaeBridge/bae_bridge_ios.swift"
          NEEDS_BUILD=0
          if [ ! -f "$MARKER" ] || [ ! -f "$BINDINGS_SOURCE" ]; then
            NEEDS_BUILD=1
          else
            for src in bae-bridge/src/*.rs bae-core/src/**/*.rs; do
              if [ "$src" -nt "$MARKER" ]; then
                NEEDS_BUILD=1
                break
              fi
            done
          fi
          if [ "$NEEDS_BUILD" -eq 1 ]; then
            echo "Bridge sources changed, rebuilding..."
            ./bae-bridge/build-ios.sh
          fi
          # A fresh worktree can have the xcframework cached but no bindings file.
          if [ ! -f "$BINDINGS" ] || [ "$BINDINGS_SOURCE" -nt "$BINDINGS" ]; then
            ./bae-bridge/install-swift-bindings.sh ios
          fi
          # The generators run from build-ios.sh's own target dir: `cargo run`
          # executes the binary at a shared dir's top level, which another
          # checkout's build can overwrite with an older generator.
          export CARGO_TARGET_DIR=target-ios
          cargo run -q -p bae-loc --bin loc-gen -- emit --target apple --out-dir bae-ios/bae/bae
          cargo run -q -p bae-theme --bin theme-gen -- emit --target apple --out-dir BaeKit/Sources/BaeKit/Generated
    dependencies:
      - package: BaeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.bae.bae
        PRODUCT_NAME: bae
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: bae/Info.plist
        SWIFT_VERSION: "6.2"
        # The compiler writes each file's localizable strings to .stringsdata, which
        # scripts/check_localizable_strings.py --platform ios checks the catalog against.
        SWIFT_EMIT_LOC_STRINGS: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        BAE_DATADOG_SITE: $(BAE_DATADOG_SITE)
        BAE_DATADOG_CLIENT_TOKEN: $(BAE_DATADOG_CLIENT_TOKEN)
        BAE_ENVIRONMENT: $(BAE_ENVIRONMENT)
        BAE_GIT_COMMIT: $(BAE_GIT_COMMIT)
        BAE_SENTRY_DSN: $(BAE_SENTRY_DSN)
        # CODE_SIGN_ENTITLEMENTS comes from the xcconfig layer the feature set drives;
        # a setting here would override it. There is no bundled app icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        OTHER_LDFLAGS:
          - -lz
          - -liconv
          - -lsqlite3
          - -framework Security
          - -framework SystemConfiguration
          - -framework CoreAudio
          - -framework AudioToolbox
          - -framework AVFoundation
          - -framework AVFAudio
  baeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - baeTests
    dependencies:
      - target: bae
    # The app's config layer, so the tests' #if conditions match the bridge.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fm.bae.baeTests
  # Screenshot capture, hosted in the app to reach PreviewScenes; only its own
  # `baeShots` scheme runs it, driven by scripts/shots/ios.sh.
  baeShots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - baeShots
    dependencies:
      - target: bae
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fm.bae.baeShots
# An explicit scheme so `xcodebuild -scheme bae test` runs the unit tests.
schemes:
  bae:
    build:
      targets:
        bae: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - baeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Screenshot capture only, run by scripts/shots/ios.sh.
  baeShots:
    build:
      targets:
        bae: all
        baeShots: [test]
    test:
      config: Debug
      targets:
        - baeShots
