name: bae
options:
  bundleIdPrefix: fm.bae
  deploymentTarget:
    # 17.0: the shared macOS data layer is built on the Observation framework
    # (`@Observable`), which requires iOS 17. The bridge static libs are minos
    # 16.0 (the FFmpeg link floor), which a 17.0 app target satisfies.
    iOS: "17.0"
  xcodeVersion: "26.0"
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: "9.18.0"
targets:
  bae:
    type: application
    platform: iOS
    # Config.xcconfig optionally pulls in the gitignored Features.xcconfig that
    # bae-bridge/build-ios.sh generates, so the app's #if guards
    # (BAE_OAUTH_PROVIDERS / BAE_CLOUDKIT) match the cargo feature set the bridge
    # was built with (see Config.xcconfig).
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      # iOS app sources (includes the gitignored bae_bridge.swift bindings,
      # which build-ios.sh copies here — built with BAE_BRIDGE_FEATURES
      # (default oauth-providers,cloudkit), matching the iOS xcframework's
      # exported symbols; the shared bae-bridge/swift-bindings/ dir is scratch a
      # macOS build regenerates with desktop methods).
      - bae
      # Shared data/service/domain layer compiled directly from the macOS app
      # — one copy serves both platforms. Each is AppKit-free and references
      # only bridge methods present on the iOS xcframework (or guards the
      # desktop-only ones behind `#if !os(iOS)`).
      - path: ../../bae-macos/bae/bae/BaeDiagnostics.swift
      - path: ../../bae-macos/bae/bae/BaeCrashReporting.swift
      - path: ../../bae-macos/bae/bae/BaeLogger.swift
      - path: ../../bae-macos/bae/bae/Theme.swift
      # AppKit/UIKit-bridged via a `PlatformImage` typealias behind
      # `#if canImport`, so it compiles AppKit-free on iOS.
      - path: ../../bae-macos/bae/bae/ImageLoader.swift
      - path: ../../bae-macos/bae/bae/BridgeSortField+CaseIterable.swift
      - path: ../../bae-macos/bae/bae/DurationClock.swift
      - path: ../../bae-macos/bae/bae/Services/PlaybackStore.swift
      - path: ../../bae-macos/bae/bae/Services/PlaybackPositionEvent.swift
      - path: ../../bae-macos/bae/bae/Services/ConfigStore.swift
      - path: ../../bae-macos/bae/bae/Services/LibraryStore.swift
      - path: ../../bae-macos/bae/bae/Services/PaginatedList.swift
      - path: ../../bae-macos/bae/bae/Services/Library.swift
      - path: ../../bae-macos/bae/bae/Services/Playback.swift
      - path: ../../bae-macos/bae/bae/Services/Queue.swift
      - path: ../../bae-macos/bae/bae/Services/MediaPaths.swift
      - path: ../../bae-macos/bae/bae/Services/Sync.swift
      - path: ../../bae-macos/bae/bae/Services/CloudKitService.swift
      - path: ../../bae-macos/bae/bae/Services/KeychainService.swift
      # Typed core failures rendered for the locale. DisplayError builds a
      # localized line + opaque detail from a BridgeError / BridgePlaybackError-
      # Reason; BridgeError+Localized resolves the generic per-category line
      # through the generated Core string table. Both AppKit-free.
      - path: ../../bae-macos/bae/bae/Services/DisplayError.swift
      - path: ../../bae-macos/bae/bae/BridgeError+Localized.swift
      - path: ../../bae-macos/bae/bae/Services/Store/Config.swift
      - path: ../../bae-macos/bae/bae/Services/Store/AlbumSummary.swift
      - path: ../../bae-macos/bae/bae/Services/Store/ReleaseSummary.swift
      - path: ../../bae-macos/bae/bae/Services/Store/ReleaseDetail.swift
      - path: ../../bae-macos/bae/bae/Services/Store/Track.swift
      - path: ../../bae-macos/bae/bae/Services/Store/TrackGroup.swift
      - path: ../../bae-macos/bae/bae/Services/Store/QueueItem.swift
      - path: ../../bae-macos/bae/bae/Services/Store/RepeatMode.swift
      - path: ../../bae-macos/bae/bae/Services/Store/SearchResults.swift
      - path: ../../bae-macos/bae/bae/Views/UnlockView.swift
      - path: ../../bae-macos/bae/bae/Views/PlayPauseControl.swift
    preBuildScripts:
      - name: Build Rust Bridge
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          MARKER="bae-ios/BaeBridgeFFI-ios.xcframework/Info.plist"
          BINDINGS="bae-ios/bae/bae/bae_bridge.swift"
          NEEDS_BUILD=0
          if [ ! -f "$MARKER" ]; then
            NEEDS_BUILD=1
          else
            for src in bae-bridge/src/*.rs bae-core/src/**/*.rs; do
              if [ "$src" -nt "$MARKER" ]; then
                NEEDS_BUILD=1
                break
              fi
            done
          fi
          if [ "$NEEDS_BUILD" -eq 1 ]; then
            echo "Bridge sources changed, rebuilding..."
            ./bae-bridge/build-ios.sh
          fi
          # Always ensure the iOS-flavored bindings are in the source tree.
          # Without this, a fresh worktree (xcframework cached, bindings file
          # absent) skips the copy and the build fails to find generated types.
          if [ ! -f "$BINDINGS" ] || [ "bae-bridge/swift-bindings/bae_bridge.swift" -nt "$BINDINGS" ]; then
            cp bae-bridge/swift-bindings/bae_bridge.swift "$BINDINGS"
          fi
          # Same copy-if-newer for the generated localization String Catalog.
          XCSTRINGS="bae-ios/bae/bae/Core.xcstrings"
          STAGED="bae-bridge/loc/generated/apple/Core.xcstrings"
          if [ -f "$STAGED" ] && { [ ! -f "$XCSTRINGS" ] || [ "$STAGED" -nt "$XCSTRINGS" ]; }; then
            cp "$STAGED" "$XCSTRINGS"
          fi
    dependencies:
      - framework: ../BaeBridgeFFI-ios.xcframework
      - package: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.bae.bae
        PRODUCT_NAME: bae
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: bae/Info.plist
        SWIFT_VERSION: "6.2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        BAE_DATADOG_SITE: $(BAE_DATADOG_SITE)
        BAE_DATADOG_CLIENT_TOKEN: $(BAE_DATADOG_CLIENT_TOKEN)
        BAE_ENVIRONMENT: $(BAE_ENVIRONMENT)
        BAE_GIT_COMMIT: $(BAE_GIT_COMMIT)
        BAE_SENTRY_DSN: $(BAE_SENTRY_DSN)
        # CODE_SIGN_ENTITLEMENTS is set in Config.xcconfig (full) and overridden
        # by the generated Features.xcconfig (baeium), not here — a setting in this
        # block lands in the pbxproj and would override the xcconfig layer the
        # feature set drives.
        # No bundled app icon yet — drop xcodegen's default `AppIcon` lookup so
        # the asset catalog compiles without one.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        OTHER_LDFLAGS:
          - -lz
          - -liconv
          - -lsqlite3
          - -framework Security
          - -framework SystemConfiguration
          - -framework CoreAudio
          - -framework AudioToolbox
          - -framework AVFoundation
          - -framework AVFAudio
