name: bae
options:
  bundleIdPrefix: fm.bae
  deploymentTarget:
    # 17.0: the shared macOS data layer is built on the Observation framework
    # (`@Observable`), which requires iOS 17. The bridge static libs are minos
    # 16.0 (the FFmpeg link floor), which a 17.0 app target satisfies.
    iOS: "17.0"
  xcodeVersion: "26.0"
packages:
  # The shared data/service/domain layer plus the generated bridge bindings and
  # the platform-conditional BaeBridgeFFI xcframework. BaeKit re-exports the
  # bridge types and depends on Sentry, so both come in transitively.
  BaeKit:
    path: ../../BaeKit
targets:
  bae:
    type: application
    platform: iOS
    # Config.xcconfig optionally pulls in the gitignored Features.xcconfig that
    # bae-bridge/build-ios.sh generates, so the app's #if guards
    # (BAE_OAUTH_PROVIDERS / BAE_CLOUDKIT) match the cargo feature set the bridge
    # was built with (see Config.xcconfig).
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      # iOS app sources. The shared data/service/domain layer and the generated
      # bridge bindings now live in the BaeKit package (see packages/BaeKit),
      # imported as a module rather than pulled in as cross-tree file references.
      # A tree that built before the package move still has the old gitignored
      # bae/bae_bridge.swift on disk; excluding it keeps xcodegen from sweeping
      # it in and colliding with the BaeBridge module.
      - path: bae
        excludes:
          - bae_bridge.swift
      - path: ../../BaeKit/Sources/AppleHost/CloudKitService.swift
    preBuildScripts:
      - name: Build Rust Bridge
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          MARKER="BaeKit/Frameworks/BaeBridgeFFI-ios.xcframework/Info.plist"
          BINDINGS_SOURCE="bae-bridge/swift-bindings-ios/bae_bridge.swift"
          BINDINGS="BaeKit/Sources/BaeBridge/bae_bridge_ios.swift"
          NEEDS_BUILD=0
          if [ ! -f "$MARKER" ] || [ ! -f "$BINDINGS_SOURCE" ]; then
            NEEDS_BUILD=1
          else
            for src in bae-bridge/src/*.rs bae-core/src/**/*.rs; do
              if [ "$src" -nt "$MARKER" ]; then
                NEEDS_BUILD=1
                break
              fi
            done
          fi
          if [ "$NEEDS_BUILD" -eq 1 ]; then
            echo "Bridge sources changed, rebuilding..."
            ./bae-bridge/build-ios.sh
          fi
          # Always ensure the iOS-flavored bindings are installed into the
          # BaeBridge target. Without this, a fresh worktree (xcframework cached,
          # bindings file absent) skips the install and the build fails to find
          # generated types.
          if [ ! -f "$BINDINGS" ] || [ "$BINDINGS_SOURCE" -nt "$BINDINGS" ]; then
            ./bae-bridge/install-swift-bindings.sh ios
          fi
          cargo run -q -p bae-loc --bin loc-gen -- emit --target apple --out-dir bae-ios/bae/bae
    dependencies:
      - package: BaeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.bae.bae
        PRODUCT_NAME: bae
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: bae/Info.plist
        SWIFT_VERSION: "6.2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        BAE_DATADOG_SITE: $(BAE_DATADOG_SITE)
        BAE_DATADOG_CLIENT_TOKEN: $(BAE_DATADOG_CLIENT_TOKEN)
        BAE_ENVIRONMENT: $(BAE_ENVIRONMENT)
        BAE_GIT_COMMIT: $(BAE_GIT_COMMIT)
        BAE_SENTRY_DSN: $(BAE_SENTRY_DSN)
        # CODE_SIGN_ENTITLEMENTS is set in Config.xcconfig (full) and overridden
        # by the generated Features.xcconfig (baeium), not here — a setting in this
        # block lands in the pbxproj and would override the xcconfig layer the
        # feature set drives.
        # No bundled app icon yet — drop xcodegen's default `AppIcon` lookup so
        # the asset catalog compiles without one.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        OTHER_LDFLAGS:
          - -lz
          - -liconv
          - -lsqlite3
          - -framework Security
          - -framework SystemConfiguration
          - -framework CoreAudio
          - -framework AudioToolbox
          - -framework AVFoundation
          - -framework AVFAudio
  baeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - baeTests
    dependencies:
      - target: bae
    # Same config layer as the app so the test target's `#if BAE_OAUTH_PROVIDERS`
    # guards match the feature set the bridge (and the app it links) was built
    # with — otherwise the OAuth tests would compile out on a full build or fail
    # to compile on a baeium (S3-only) one.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fm.bae.baeTests
  # Screenshot-capture bundle for the cross-platform gallery. Hosted in the app
  # (like baeTests) so it can `@testable import bae` and reach the DEBUG
  # PreviewScenes builders + fixtures. Kept out of the `bae` scheme's test
  # action — it runs only via its own `baeShots` scheme, which
  # scripts/shots/ios.sh drives; the test writes PNGs into the app container and
  # the script copies them out.
  baeShots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - baeShots
    dependencies:
      - target: bae
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fm.bae.baeShots
# Explicit scheme so `xcodebuild -scheme bae test` runs the unit-test bundle;
# xcodegen's autogenerated per-target schemes carry no test action.
schemes:
  bae:
    build:
      targets:
        bae: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - baeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Screenshot capture only. `scripts/shots/ios.sh` runs
  # `xcodebuild -scheme baeShots test`; the test writes one PNG per scene.
  baeShots:
    build:
      targets:
        bae: all
        baeShots: [test]
    test:
      config: Debug
      targets:
        - baeShots
