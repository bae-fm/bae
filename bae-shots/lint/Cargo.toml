[package]
name = "bae-shots-lint"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_shots_lint"
path = "src/lib.rs"

[[bin]]
name = "bae-shots-lint"
path = "src/main.rs"

[dependencies]
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
