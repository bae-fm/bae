# The library's schema: the crates whose parts make the one migration, in
# order, run inside coven's migration transaction, so a trigger's part runs
# after the part creating the table it fires on.
#
# The list is the catalog image cache's part, records' and release
# storage's parts, people's and membership's, the sync status's, then
# preferences', playback's, import's, the transfers' and the library views'.
# A phone's library holds no import tables, since they never sync and nothing
# on a phone reads them. It keeps the image cache's table, which stays empty on
# a phone, because the Storage page's query sums it.
crates = [
    "bae-catalogs",
    "bae-records",
    "bae-people",
    "bae-sync-status",
    "bae-preferences",
    "bae-playback",
    "bae-import",
    "bae-transfers",
    "bae-views",
]
desktop_only = ["bae-import"]
