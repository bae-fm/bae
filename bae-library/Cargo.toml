[package]
name = "bae-library"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false
# The `desktop` cfg, defined once in bae-util's build script for every crate
# with desktop-only code.
build = "../bae-util/build.rs"

[lib]
name = "bae_library"
path = "src/lib.rs"

[dependencies]
bae-app-dir = { workspace = true }
bae-audio = { workspace = true }
bae-catalogs = { workspace = true }
bae-sync-status = { workspace = true }
bae-store = { workspace = true }
bae-people = { workspace = true }
bae-records = { workspace = true }
bae-diagnostics = { workspace = true }
# The identify reducer, its view and its verdicts, which only the desktop
# import pipeline drives; the crate is empty on mobile.
bae-identify = { workspace = true }
bae-playback = { workspace = true }
bae-preferences = { workspace = true }
bae-track-audio = { workspace = true }
# The transfer queues and storage transitions the manager drives and its
# reads show.
bae-transfers = { workspace = true }
bae-types = { workspace = true }
bae-util = { workspace = true }
# The library views' part of the library's schema, which a library's store is
# created, opened and restored on.
bae-views = { workspace = true }
coven = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["full"] }
thiserror = { workspace = true }
# The S3 endpoint a library connects to, parsed for coven's location.
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
chrono = { workspace = true, features = ["serde"] }
hex = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true, features = ["io", "rt"] }
rand = { workspace = true }
tracing = { workspace = true }
# The app directory's files are staged in a temporary file before an atomic
# persist.
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }

# Saving and exporting a release write its tags, and import and the release
# editor are the desktop's: a phone browses, plays and casts.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Import: watched folders, candidates, identification and the import that
# writes a release into the store, and the release-edit model.
bae-import = { workspace = true }
lofty = { workspace = true }

[dev-dependencies]
# The open-file limit the import open-files test lowers, and the CPU time the
# playback CPU test reads.
libc = { workspace = true }
# The sign-in test parses the address a provider's sign-in presents.
reqwest = { workspace = true }
# The test codec helpers (WAV reader, whole-buffer encoder), and the
# instrumentation bae-library's unit tests read: probe counts, buffer ranges and
# reads.
bae-audio = { workspace = true, features = ["test-utils", "test-instrumentation"] }
# An app directory at a path the test picks.
bae-app-dir = { workspace = true, features = ["test-utils"] }
# Test databases with bae's schema and the rows db's fixtures seed them with.
bae-sync-status = { workspace = true, features = ["test-utils"] }
bae-store = { workspace = true, features = ["test-utils"] }
bae-people = { workspace = true, features = ["test-utils"] }
bae-records = { workspace = true, features = ["test-utils"] }
# The capture devices and manual clock the playback tests run on.
bae-playback = { workspace = true, features = ["test-utils"] }
# A new library's preferences, built without a library.
bae-preferences = { workspace = true, features = ["test-utils"] }
# What the import tests read back of an identify run.
bae-identify = { workspace = true, features = ["test-utils"] }
# The fixture audio and the import service's test seams the library's import
# tests drive.
bae-import = { workspace = true, features = ["test-utils"] }
# The library's views, which the tests read the library's state back
# through.
bae-views = { workspace = true, features = ["test-utils"] }
# A queue entry started without a worker, and a release's transition read
# back.
bae-transfers = { workspace = true, features = ["test-utils"] }
# What a decode's windows read, for the playback tests.
bae-track-audio = { workspace = true, features = ["test-utils"] }
# The bug reporter and telemetry transport that record what they are handed.
bae-diagnostics = { workspace = true, features = ["test-utils"] }
# The test transport and the retry that sleeps no real time, for bae-library's
# own unit tests.
bae-util = { workspace = true, features = ["test-utils"] }
# The pressing values bae-library's unit tests build their fixtures from.
bae-types = { workspace = true, features = ["test-utils"] }
# The catalog clients' and the image cache's test constructors, the catalog
# fakes and documents, and the requests the rate limiter queued and admitted,
# which its unit tests read.
bae-catalogs = { workspace = true, features = ["test-utils", "test-instrumentation"] }
tokio = { workspace = true, features = ["test-util"] }
# The log output of the bench examples and of the tests that time a
# library's creation and restore.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serial_test = { workspace = true }
# The local HTTP servers tests stand in for catalogs and cover archives with.
axum = { workspace = true, features = ["http1", "tokio", "json", "form"] }
# The examples resolve the running user's home once, at the top, to build the
# app directory they read.
dirs = { workspace = true }
# coven's deterministic clock/id fakes for bae's tests (off in production
# builds), and the S3 prefix emptying the bench examples delete their library
# from storage with.
coven = { workspace = true, features = ["test-utils", "dev-tools"] }
# Builds the native keychain refusal coven wraps in `KeychainError`, for the
# tests of how a missing keychain entitlement is reported.
keyring-core = { workspace = true }
# Decodes the stored covers and pictures the tests check, and builds the
# images they import.
image = { workspace = true, features = ["jpeg", "png", "gif", "webp"] }

# An artist credit test compares names with their combining marks set aside.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dev-dependencies]
unicode-normalization = { workspace = true }

# The scrub-point test reads a FLAC's frames straight off FFmpeg's demuxer.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "android", target_os = "ios"))'.dev-dependencies]
ffmpeg-next = { workspace = true, features = ["codec", "format", "software-resampling"] }

# bae-library's integration tests, one binary of modules (tests/integration/).
[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["test-utils"]

# Its own binary: it reads the process's CPU time, and runs in the release
# profile.
[[test]]
name = "test_playback_cpu"
path = "tests/test_playback_cpu.rs"
required-features = ["test-utils"]

[features]
default = []
# Enables OAuth cloud providers (Dropbox, OneDrive) through coven. Off
# by default → S3-only, matching the baeium build; the bae build turns it
# on. bae-library's own oauth call sites (provider sign-in and setup) gate on this,
# and bae-store's calls they make.
oauth-providers = ["bae-store/oauth-providers"]
# A debug app's dev reset: the profile it recreates its library from. Debug
# macOS bridge builds turn it on; release builds leave it out.
dev-reset = ["bae-app-dir/dev-reset"]
# Forwards coven's test-utils so bae-library's own integration tests get the
# re-exported clock/id fakes (FixedClock, …), bae-app-dir's so the fixtures
# can put an app directory at a test's path, bae-store's, bae-records', bae-people's and
# bae-sync-status's so they get their test databases and the rows they seed, bae-playback's so they get its capture
# devices and manual clock, bae-preferences' so they get a new
# library's preferences without a library, bae-track-audio's so they read a
# decode's windows back, bae-transfers' so they follow a whole queue and
# start an entry without a worker, bae-util's so they get its test
# transport and a retry that sleeps no real time, bae-audio's so they get its
# test codec helpers, bae-import's so they get the fixture audio and the import
# service's test seams, bae-types's so they get the pressing values their
# fixtures are built from, and bae-catalogs's so they get the catalog clients'
# and the image cache's test constructors.
test-utils = ["coven/test-utils", "bae-app-dir/test-utils", "bae-sync-status/test-utils", "bae-store/test-utils", "bae-people/test-utils", "bae-records/test-utils", "bae-import/test-utils", "bae-playback/test-utils", "bae-preferences/test-utils", "bae-track-audio/test-utils", "bae-transfers/test-utils", "bae-util/test-utils", "bae-audio/test-utils", "bae-types/test-utils", "bae-catalogs/test-utils"]

[lints]
workspace = true
