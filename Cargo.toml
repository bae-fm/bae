[workspace]
members = [
    "bae-app",
    "bae-app-dir",
    "bae-audio",
    "bae-automation",
    "bae-bridge",
    "bae-catalogs",
    "bae-cast",
    "bae-library",
    "bae-people",
    "bae-sync-status",
    "bae-records",
    "bae-store",
    "bae-desktop",
    "bae-diagnostics",
    "bae-identify",
    "bae-import",
    "bae-loc",
    "bae-mcp",
    "bae-mirror",
    "bae-playback",
    "bae-preferences",
    "bae-subsonic",
    "bae-theme",
    "bae-track-audio",
    "bae-transfers",
    "bae-types",
    "bae-uniffi-bindgen",
    "bae-util",
    "bae-views",
]
resolver = "2"

# One lint config for the whole workspace; every crate takes it verbatim via
# `[lints] workspace = true`. Cargo does not let a crate inherit this table and
# override part of it, which is the point: a lint decision is made once, here,
# and applies everywhere.
[workspace.lints.rust]
# Every `pub` not reachable from its crate's own root must be `pub(crate)` (or
# narrower). This keeps `dead_code` armed on internal items — `pub` silences
# that lint unconditionally, so an unreachable `pub` item can rot unused and
# unnoticed. Fix by narrowing visibility, never by widening it to escape the
# lint.
unreachable_pub = "deny"
dead_code = "deny"
# uniffi's generated scaffolding emits cfgs cargo does not know about.
unexpected_cfgs = "allow"

[workspace.lints.clippy]
too_many_arguments = "allow"
new_without_default = "allow"
large_enum_variant = "allow"
# `let _ = <must_use value>` drops a Result or a must-use value without a word;
# a site where dropping it is right says why with `#[expect(..., reason)]`.
let_underscore_must_use = "deny"
# `.map_err(|_| ...)` discards the error it replaces, and with it the cause.
map_err_ignore = "deny"

[workspace.dependencies]
# Every dependency of every member is declared here, once: its version or
# path, its package name, and whether default features are on, which then
# holds for every member. A member names it with `workspace = true` and, at
# most, the features it needs and whether it is optional.

# Every consumer, including tests, uses coven's application facade.
coven = { git = "https://github.com/bae-fm/coven", rev = "4fafaf0a2035c50eed7ceb96d46e0109c19a8d5f" }
# OptionalExtension, dynamic parameters and SQLite callback errors are not
# re-exported by coven. This is the version coven's SQL contexts use.
rusqlite = { version = "0.41.1", features = ["functions", "fallible_uint"] }
# HTTP
reqwest = { version = "0.13", default-features = false }
# Logging
tracing = "0.1.41"
# Error enums: `#[derive(Error)]` writes the Display/Error/From impls.
thiserror = "2"

# The workspace's own crates.
bae-app = { path = "bae-app" }
bae-app-dir = { path = "bae-app-dir" }
bae-audio = { path = "bae-audio" }
bae-automation = { path = "bae-automation" }
bae-cast = { path = "bae-cast" }
bae-catalogs = { path = "bae-catalogs" }
bae-library = { path = "bae-library" }
bae-people = { path = "bae-people" }
bae-sync-status = { path = "bae-sync-status" }
bae-records = { path = "bae-records" }
bae-store = { path = "bae-store" }
bae-desktop = { path = "bae-desktop" }
bae-diagnostics = { path = "bae-diagnostics" }
bae-identify = { path = "bae-identify" }
bae-import = { path = "bae-import" }
bae-loc = { path = "bae-loc" }
bae-mcp = { path = "bae-mcp" }
bae-mirror = { path = "bae-mirror" }
bae-playback = { path = "bae-playback" }
bae-preferences = { path = "bae-preferences" }
bae-subsonic = { path = "bae-subsonic" }
bae-track-audio = { path = "bae-track-audio" }
bae-transfers = { path = "bae-transfers" }
bae-types = { path = "bae-types" }
bae-util = { path = "bae-util" }
bae-views = { path = "bae-views" }

