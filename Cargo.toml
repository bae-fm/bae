[profile.release]
lto = true
codegen-units = 1
strip = true
split-debuginfo = "packed"
debug = "line-tables-only"

# Line tables are enough debuginfo for a debug build: backtraces and panics
# keep their file:line, and every workspace rlib and test binary shrinks
# several-fold. Full DWARF made the bae-library rlib 0.6 GB, plus a test binary
# of the same size, in every checkout's target dir. Local-variable inspection
# under lldb is what this gives up.
[profile.dev]
debug = "line-tables-only"
# Measured 2x-2.4x less CPU per edit-and-check (bae: 20/10 s off, 10/4 s on).
# sccache never caches workspace crates' clippy runs anyway, and cargo applies
# incremental only to workspace members, so dependencies still go through
# sccache. Set it here, never via CARGO_INCREMENTAL, which makes sccache refuse
# every compile. The app checkout builds without it: agents move it between
# branches, so `builds cargo` (scripts/cargo.sh) passes
# --config build.incremental=false there and sccache caches its workspace crates.
incremental = true

# Keep dependency implementations optimized in Debug builds while bae's
# workspace crates retain debug assertions. Several
# dependencies perform CPU-heavy work whose unoptimized implementations distort
# app behavior: audio true-peak interpolation, retained replay parsing and
# decompression, SQLite traversal, hashing, and signature verification.
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
# Android's platform verifier treats unavailable revocation data as a soft
# failure while preserving confirmed revocation. The published 0.7.1 verifier
# misclassifies every revocation-check exception as a revoked certificate. The
# fork's branch commits its Android AAR in android-release-support/maven,
# where the Android app's settings.gradle.kts finds it.
rustls-platform-verifier = { git = "https://github.com/bae-fm/rustls-platform-verifier", rev = "47a4336458b70db9c92a40ba8e0e30ca5fef0b29" }
# v0.17.0 plus a scanner that builds a token's debug position only when it is
# logged, which took scanning 001_initial.sql at debug level from 2 s to 1 ms.
sqlite3-parser = { git = "https://github.com/bae-fm/lemon-rs", rev = "c0fc0b12a08a8bab5cdd93182e99344dca796cd3" }

# notify 8.2's FSEvents callback is `extern "C"` and panics on a path that is
# not UTF-8 and on any event flag bit it doesn't know (a newer macOS can add
# one), which aborts the process. The fork reads the path as bytes, drops
# unknown bits and catches a panic at the callback. Upstream fixed the first
# two after 8.2 (in the 9.0 line); drop this entry once bae moves to it.
notify = { git = "https://github.com/bae-fm/notify", rev = "673d0932ccdcfa3944860171caf9b611403ba2ff" }

# Fork carrying the Swift `Task.cancel()` propagation work we're upstreaming
# (mozilla/uniffi-rs PR branch): cancellation flows through
# `withTaskCancellationHandler` into Rust drop, opted into per function with
# `#[uniffi::export(cancellable)]`. The branch is mozilla/main plus those
# commits, so bae dogfoods exactly what upstream is reviewing. Drop these
# entries once the PR lands and a uniffi release ships with it.
#
# On uniffi bump: regenerate bindings, then confirm
# `bae-macos/bae/bae/bae_bridge.swift` still contains
# `uniffiRustCallAsyncCancellable` and `cancelFunc:`. If the upstream Swift
# template changed shape, the branch needs rebasing.
uniffi = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_bindgen = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_core = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_internal_macros = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_macros = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_meta = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_pipeline = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_udl = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
