[workspace]
members = [
    "bae-automation",
    "bae-bridge",
    "bae-cli",
    "bae-core",
    "bae-desktop",
    "bae-loc",
    "bae-mcp",
    "bae-test-support",
]
resolver = "2"

# One lint config for the whole workspace; every crate takes it verbatim via
# `[lints] workspace = true`. Cargo does not let a crate inherit this table and
# override part of it, which is the point: a lint decision is made once, here,
# and applies everywhere.
[workspace.lints.rust]
# Every `pub` not reachable from its crate's own root must be `pub(crate)` (or
# narrower). This keeps `dead_code` armed on internal items — `pub` silences
# that lint unconditionally, so an unreachable `pub` item can rot unused and
# unnoticed. Fix by narrowing visibility, never by widening it to escape the
# lint.
unreachable_pub = "deny"
dead_code = "deny"
# uniffi's generated scaffolding emits cfgs cargo does not know about.
unexpected_cfgs = "allow"

[workspace.lints.clippy]
too_many_arguments = "allow"
new_without_default = "allow"
large_enum_variant = "allow"

[workspace.dependencies]
# coven: bae's data layer (local-first store + cloud sync). Pinned by rev here so
# every crate that touches it (bae-core, and bae-bridge's CloudKit adapter, which
# implements coven's CloudKitOps) resolves the same instance.
coven = { git = "https://github.com/bae-fm/coven", rev = "bb0e3985cbf4d422c0978b41e21d40cc2af7e5c7" }
# coven-core: coven's inner engine crate, pinned to the SAME git rev so cargo
# unifies it with coven's own transitive copy into one instance. bae reaches
# coven only through the `coven` facade in production; the one exception is
# bae-core's test-only `MockCloudHome`, which implements coven's `CloudHome`
# trait and must name that trait's `RevokeOutcome` return type — a type the
# facade's curated public API does not re-export. Test-scoped (dev-dependency)
# so no production code depends on it.
coven-core = { git = "https://github.com/bae-fm/coven", rev = "bb0e3985cbf4d422c0978b41e21d40cc2af7e5c7" }
# HTTP
reqwest = { version = "0.13", default-features = false }
# Logging
tracing = "0.1.41"

[profile.release]
lto = true
codegen-units = 1
strip = true
split-debuginfo = "packed"
debug = "line-tables-only"

# Optimize the CPU-heavy audio loudness dependency even in dev/test builds.
# ebur128's pure-Rust true-peak interpolator runs ~80x slower unoptimized, which
# made loudness measurement of a full album take minutes in `run.sh` debug
# builds. It's a leaf dependency (compiled once, cached), so dev iteration on
# bae's own code stays fast.
[profile.dev.package.ebur128]
opt-level = 3

# Fork carrying two Swift template fixes we plan to upstream:
# - `nonisolated(unsafe)` on callback `vtablePtr` for Swift 6 strict
#   concurrency
# - Swift `Task.cancel()` propagation through `withTaskCancellationHandler`
#   into Rust drop
# Branch is based on the v0.31.1 tag (not mozilla/main HEAD) so its
# manifest version matches what bae's resolver picks. Drop these `[patch]`
# entries once both upstream PRs land and a uniffi release ships with
# them.
#
# On uniffi bump: regenerate bindings, then confirm
# `bae-macos/bae/bae/bae_bridge.swift` still contains
# `withTaskCancellationHandler` and `cancelFunc:`. If the upstream Swift
# template changed shape, the bae-fm fork needs rebasing.
[patch.crates-io]
# discid + discid-sys assume libdiscid's C feature enum is unsigned, which holds
# for clang but not MSVC (where C enums are signed `int`), so neither published
# crate compiles for Windows. Vendored with the signedness casts
# (third-party/discid{,-sys}); same versions, so they satisfy bae-core's `discid`
# dependency. Drop once upstream ships an MSVC fix.
discid = { path = "third-party/discid" }
discid-sys = { path = "third-party/discid-sys" }
uniffi = { git = "https://github.com/bae-fm/uniffi-rs", branch = "bae-swift-cancel" }
uniffi_bindgen = { git = "https://github.com/bae-fm/uniffi-rs", branch = "bae-swift-cancel" }
uniffi_core = { git = "https://github.com/bae-fm/uniffi-rs", branch = "bae-swift-cancel" }
uniffi_internal_macros = { git = "https://github.com/bae-fm/uniffi-rs", branch = "bae-swift-cancel" }
uniffi_macros = { git = "https://github.com/bae-fm/uniffi-rs", branch = "bae-swift-cancel" }

uniffi_meta = { git = "https://github.com/bae-fm/uniffi-rs", branch = "bae-swift-cancel" }
uniffi_pipeline = { git = "https://github.com/bae-fm/uniffi-rs", branch = "bae-swift-cancel" }
uniffi_udl = { git = "https://github.com/bae-fm/uniffi-rs", branch = "bae-swift-cancel" }
