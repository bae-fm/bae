[workspace]
members = [
    "bae-automation",
    "bae-bridge",
    "bae-cast",
    "bae-core",
    "bae-desktop",
    "bae-loc",
    "bae-mcp",
    "bae-subsonic",
    "bae-test-support",
]
resolver = "2"

# One lint config for the whole workspace; every crate takes it verbatim via
# `[lints] workspace = true`. Cargo does not let a crate inherit this table and
# override part of it, which is the point: a lint decision is made once, here,
# and applies everywhere.
[workspace.lints.rust]
# Every `pub` not reachable from its crate's own root must be `pub(crate)` (or
# narrower). This keeps `dead_code` armed on internal items — `pub` silences
# that lint unconditionally, so an unreachable `pub` item can rot unused and
# unnoticed. Fix by narrowing visibility, never by widening it to escape the
# lint.
unreachable_pub = "deny"
dead_code = "deny"
# uniffi's generated scaffolding emits cfgs cargo does not know about.
unexpected_cfgs = "allow"

[workspace.lints.clippy]
too_many_arguments = "allow"
new_without_default = "allow"
large_enum_variant = "allow"

[workspace.dependencies]
# coven: bae's data layer (local-first store + cloud sync). Pinned by rev here so
# every crate that touches it (bae-core, and bae-bridge's CloudKit adapter, which
# implements coven's CloudKitOps) resolves the same instance. bae reaches coven
# only through this facade — in tests too, via its InMemoryCloudHome double.
coven = { git = "https://github.com/bae-fm/coven", rev = "5822f7402d3933e76a3808412d678c1407920734" }
# HTTP
reqwest = { version = "0.13", default-features = false }
# Logging
tracing = "0.1.41"

[profile.release]
lto = true
codegen-units = 1
strip = true
split-debuginfo = "packed"
debug = "line-tables-only"

# Optimize the CPU-heavy audio loudness dependency even in dev/test builds.
# ebur128's pure-Rust true-peak interpolator runs ~80x slower unoptimized, which
# made loudness measurement of a full album take minutes in `run.sh` debug
# builds. It's a leaf dependency (compiled once, cached), so dev iteration on
# bae's own code stays fast.
[profile.dev.package.ebur128]
opt-level = 3

# Fork carrying the Swift `Task.cancel()` propagation work we're upstreaming
# (mozilla/uniffi-rs PR branch): cancellation flows through
# `withTaskCancellationHandler` into Rust drop, opted into per function with
# `#[uniffi::export(cancellable)]`. The branch is mozilla/main plus those
# commits, so bae dogfoods exactly what upstream is reviewing. Drop these
# `[patch]` entries once the PR lands and a uniffi release ships with it.
#
# On uniffi bump: regenerate bindings, then confirm
# `bae-macos/bae/bae/bae_bridge.swift` still contains
# `uniffiRustCallAsyncCancellable` and `cancelFunc:`. If the upstream Swift
# template changed shape, the branch needs rebasing.
[patch.crates-io]
# Android's platform verifier treats unavailable revocation data as a soft
# failure while preserving confirmed revocation. The published 0.6.2 verifier
# misclassifies every revocation-check exception as a revoked certificate.
rustls-platform-verifier = { git = "https://github.com/bae-fm/rustls-platform-verifier", rev = "c0649fc1bb3e653c9261a3a0672938444b457bc2" }

uniffi = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_bindgen = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_core = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_internal_macros = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_macros = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }

uniffi_meta = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_pipeline = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
uniffi_udl = { git = "https://github.com/bae-fm/uniffi-rs", branch = "upstream-swift-cancel" }
