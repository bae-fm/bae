[package]
name = "bae-subsonic"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_subsonic"
path = "src/lib.rs"

[dependencies]
bae-core = { workspace = true }
bae-diagnostics = { workspace = true }
# The catalog a release's links name.
bae-catalogs = { workspace = true }
# The transcode encoder and the buffer a served track streams from.
bae-audio = { workspace = true }
bae-util = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "query"] }
bytes = { workspace = true }
hex = { workspace = true }
# Keyed `md5` (its lib name) so cargo-machete resolves `use md5::…` — the crate
# is `md-5` but exposes `md5`, which machete's package-name heuristic misreads.
md5 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "rt", "macros"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bae-test-support = { workspace = true }
# The catalog fakes and releases the server tests seed.
bae-catalogs = { workspace = true, features = ["test-utils"] }
bae-core = { workspace = true, features = ["test-utils"] }
# The bug reporter that keeps what it is handed.
bae-diagnostics = { workspace = true, features = ["test-utils"] }
# The pressing values the server tests seed releases with.
bae-types = { workspace = true }
# The stable fixture ids the server tests name rows by.
bae-util = { workspace = true, features = ["test-utils"] }
# The WAV reader the transcode tests check served bytes with.
bae-audio = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "rt", "rt-multi-thread", "macros", "time"] }
md5 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
chrono = { workspace = true }

[lints]
workspace = true
