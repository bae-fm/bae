[package]
name = "bae-subsonic"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_subsonic"
path = "src/lib.rs"

[dependencies]
# The app's services over an open library, which this crate calls.
bae-app = { workspace = true }
bae-library = { workspace = true }
# The library's views the endpoints list and search, and the shapes they show.
bae-views = { workspace = true }
# The credit lines the API flattens into names, and the pressing values the
# tests seed releases with.
bae-types = { workspace = true }
# The library's records the API serves.
bae-store = { workspace = true }
bae-records = { workspace = true }
# The Subsonic server's settings and credential.
bae-preferences = { workspace = true }
bae-diagnostics = { workspace = true }
# The catalog a release's links name.
bae-catalogs = { workspace = true }
# The transcode encoder and the buffer a served track streams from.
bae-audio = { workspace = true }
bae-util = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "query"] }
bytes = { workspace = true }
hex = { workspace = true }
# The networks the server can listen on, read from the machine, and the
# notice of one gaining, losing or changing its address.
if-addrs = { workspace = true }
if-watch = { workspace = true }
# Keyed `md5` (its lib name) so cargo-machete resolves `use md5::…` — the crate
# is `md-5` but exposes `md5`, which machete's package-name heuristic misreads.
md5 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "rt", "macros"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The catalog pick the import tests seed releases with.
bae-identify = { workspace = true }
# The import the server tests land their releases with, and its fixture
# audio.
bae-import = { workspace = true, features = ["test-utils"] }
# The readers and read errors the streaming tests drive.
bae-track-audio = { workspace = true }
# The catalog fakes and releases the server tests seed.
bae-catalogs = { workspace = true, features = ["test-utils"] }
# A test library's services, started through the app's own step.
bae-app = { workspace = true, features = ["test-utils"] }
bae-library = { workspace = true, features = ["test-utils"] }
# The bug reporter that keeps what it is handed.
bae-diagnostics = { workspace = true, features = ["test-utils"] }
# The ids the credit and medium rows the server tests seed are made with.
coven = { workspace = true }
# The stable fixture ids the server tests name rows by.
bae-util = { workspace = true, features = ["test-utils"] }
# The WAV reader the transcode tests check served bytes with.
bae-audio = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "rt", "rt-multi-thread", "macros", "time"] }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
chrono = { workspace = true }

[lints]
workspace = true
