[package]
name = "bae-subsonic"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_subsonic"
path = "src/lib.rs"

[dependencies]
bae-core = { path = "../bae-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
bytes = "1"
futures = "0.3"
hex = "0.4"
md-5 = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "rt", "macros"] }
tokio-util = "0.7"
tokio-stream = "0.1"
tracing = { workspace = true }

[dev-dependencies]
bae-test-support = { path = "../bae-test-support" }
bae-core = { path = "../bae-core", features = ["test-utils"] }
tempfile = "3"
tokio = { version = "1", features = ["net", "sync", "rt", "rt-multi-thread", "macros", "time"] }
md-5 = "0.10"
hex = "0.4"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
coven = { workspace = true }
chrono = "0.4"

[lints]
workspace = true
