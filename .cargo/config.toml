[build]
rustc-wrapper = "sccache"

[env]
# FFmpeg comes exclusively from the bae-ffmpeg fork's prebuilt dist, never from a
# system/Homebrew install -- local dev links the same artifacts CI and release
# do. scripts/setup-ffmpeg.sh populates bae-ffmpeg/dist; it is required local
# setup. Pointing pkg-config only there means ffmpeg-sys-next can't resolve a
# Homebrew ffmpeg even if one is installed. relative=true resolves against the
# repo root (the parent of this .cargo dir). force=false lets setup-ffmpeg.sh's
# shell exports take over when present.
PKG_CONFIG_PATH = { value = "bae-ffmpeg/dist/lib/pkgconfig", relative = true, force = false }
# The fork's shipped .pc files carry a dead CI-baked prefix (/Users/runner/...),
# so pkg-config alone resolves wrong include/lib paths. FFMPEG_DIR makes
# ffmpeg-sys-next read $FFMPEG_DIR/{include,lib} directly, bypassing that prefix.
# Every host cargo build then finds FFmpeg with no shell export -- the pre-commit
# hook, plain cargo, and the Android build's host uniffi-bindgen/loc-gen steps
# (its per-ABI cross-builds override this inline with the android prefix, which
# wins as a real env var over this force=false value).
FFMPEG_DIR = { value = "bae-ffmpeg/dist", relative = true, force = false }
# bae reads none of SQLite's process-wide allocation counters or heap limits.
# Left on, they serialize every allocation across bae's otherwise independent
# connections through one mutex. coven sets the same for its own builds; the
# workspace that builds libsqlite3-sys decides, so bae sets it here.
LIBSQLITE3_FLAGS = { value = "SQLITE_DEFAULT_MEMSTATUS=0", force = true }

# A Windows build links the C runtime into each binary. The default links it
# dynamically, making bae's DLL import vcruntime140.dll, which is the Visual
# C++ redistributable's and not part of Windows: a machine without it could
# not load the bridge. cc-built C dependencies follow this flag too.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
