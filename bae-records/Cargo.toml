[package]
name = "bae-records"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_records"
path = "src/lib.rs"

[build-dependencies]
# Sets the `desktop` cfg for the crate's desktop-only code.
bae-desktop-cfg = { workspace = true }

[dependencies]
# The catalogs a record names and ranks, and the release values the row
# writers store.
bae-catalogs = { workspace = true }
# The store every read and write runs through.
bae-store = { workspace = true }
# Mediums, pressings, credits and track times: the values the records hold.
bae-types = { workspace = true }
# Content types and the text matching keys the rows are written with.
bae-util = { workspace = true }
# The store: its connection, schema migrations, sync, files and live queries.
coven = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Row ids, and the ids derived from catalog ids.
uuid = { workspace = true, features = ["v4", "v5"] }
chrono = { workspace = true, features = ["serde"] }
# Stored paths are hex-encoded bytes.
hex = { workspace = true }
# The temporary directory a test database lives in.
tempfile = { workspace = true, optional = true }

[dev-dependencies]
bae-store = { workspace = true, features = ["test-utils"] }
bae-catalogs = { workspace = true, features = ["test-utils"] }
bae-util = { workspace = true, features = ["test-utils"] }
bae-types = { workspace = true, features = ["test-utils"] }
coven = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
# The schema tests read the tables the schema creates.
regex = { workspace = true }

[features]
default = []
# Test databases with records' schema, the rows and fixtures tests seed them
# with, for the tests of every crate that builds on this one. Dev/test-only: a
# production build never enables it.
test-utils = [
    "bae-store/test-utils",
    "bae-catalogs/test-utils",
    "bae-types/test-utils",
    "bae-util/test-utils",
    "coven/test-utils",
    "dep:tempfile",
]

[lints]
workspace = true
