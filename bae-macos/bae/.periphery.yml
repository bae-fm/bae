project: bae.xcodeproj
schemes:
  - bae
targets:
  - bae
index_exclude:
  # The generated uniffi bindings.
  - "**/BaeKit/Sources/BaeBridge/**"
  # The generated theme, which holds roles only another platform draws with.
  - "**/BaeKit/Sources/BaeKit/Generated/**"
# Types held only for their lifetime: the property keeps the object alive and
# nothing reads it. Periphery matches the declared type as written, less a
# trailing `?`. Dropping a LatestFeed stops the stream it fills; dropping a
# ScreenSubscription stops its pulls and ends the subscription.
retain_assign_only_property_types:
  - SPUStandardUpdaterController
  - "[LatestFeed]"
  - ScreenSubscription<ImportCountsSubscription>
  - ScreenSubscription<CandidateRuntimeSubscription>
  - ScreenSubscription<LibraryStatusSubscription>
  - ScreenSubscription<PlaybackValuesSubscription>
  - ScreenSubscription<SubsonicSubscription>
disable_update_check: true
