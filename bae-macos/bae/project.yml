name: bae
options:
  bundleIdPrefix: fm.bae
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEAD_CODE_STRIPPING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.0"
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.4.1"
  # The shared data/service/domain layer plus the generated bridge bindings and
  # the platform-conditional BaeBridgeFFI xcframework. BaeKit re-exports the
  # bridge types and depends on Sentry, so both come in transitively.
  BaeKit:
    path: ../../BaeKit
targets:
  bae:
    type: application
    platform: macOS
    # Signing.xcconfig optionally pulls in a gitignored Signing.local.xcconfig
    # for DEVELOPMENT_TEAM, so the team isn't committed (see Signing.xcconfig).
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      # The generated bindings live in the BaeKit package (BaeBridge target),
      # not the app tree. A tree that built before the package move still has
      # the old gitignored bae/bae_bridge.swift on disk; excluding it keeps
      # xcodegen from sweeping it in and colliding with the BaeBridge module.
      - path: bae
        excludes:
          - bae_bridge.swift
          - Info.plist
      - path: ../../BaeKit/Sources/AppleHost/CloudKitService.swift
      - path: ../../BaeKit/Sources/AppleHost/CloudKitService+Account.swift
    info:
      path: bae/Info.plist
      properties:
        CFBundleDisplayName: bae
        CFBundleDevelopmentRegion: en
        # The shipping locales aren't listed here: the generated Core.xcstrings
        # carries a slot per locale (single-sourced in bae-loc's TARGET_LOCALES),
        # and xcstringstool's compiled per-language resources drive the bundle's
        # known regions — so the set lives in exactly one place.
        SUFeedURL: https://raw.githubusercontent.com/bae-fm/bae/appcast/appcast.xml
        SUPublicEDKey: cYiouOrDxmQrHspLwOf/XpQOQOMt3isdYDs6xEDBGs8=
        SUEnableAutomaticChecks: true
        BaeDatadogSite: $(BAE_DATADOG_SITE)
        BaeDatadogClientToken: $(BAE_DATADOG_CLIENT_TOKEN)
        BaeEnvironment: $(BAE_ENVIRONMENT)
        BaeGitCommit: $(BAE_GIT_COMMIT)
        BaeCovenRev: $(BAE_COVEN_REV)
        BaeSentryDsn: $(BAE_SENTRY_DSN)
        NSCameraUsageDescription: bae uses the camera to scan codes when pairing or recovering a library.
        NSLocalNetworkUsageDescription: bae pairs devices and finds speakers and TVs on your local network.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            LSItemContentTypes:
              - public.folder
            LSHandlerRank: Alternate
        CFBundleURLTypes:
          - CFBundleURLName: fm.bae.url
            CFBundleURLSchemes:
              - bae
    dependencies:
      - package: BaeKit
      - package: Sparkle
      - package: swift-collections
        product: OrderedCollections
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: MediaPlayer.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        # Only this target maps the private run.sh inputs to standard Xcode
        # settings. Passing the standard names on xcodebuild's command line
        # would also override Swift package resource-bundle targets.
        PRODUCT_BUNDLE_IDENTIFIER: $(BAE_RUN_APP_BUNDLE_IDENTIFIER)
        # DEVELOPMENT_TEAM comes from the gitignored Signing.local.xcconfig (via
        # configFiles above), not from here, so the team isn't committed.
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: $(BAE_RUN_APP_PRODUCT_NAME)
        GENERATE_INFOPLIST_FILE: $(BAE_RUN_APP_GENERATE_INFOPLIST_FILE)
        INFOPLIST_FILE: $(BAE_RUN_APP_INFOPLIST_FILE)
        INFOPLIST_KEY_LSUIElement: $(BAE_RUN_APP_LSUIELEMENT)
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.2"
        SWIFT_OBJC_BRIDGING_HEADER: bae/bae-Bridging-Header.h
        # The compiler writes each file's localizable strings to .stringsdata
        # during compilation; scripts/check_localizable_strings.py compares
        # that ground truth against Localizable.xcstrings. (Xcode's
        # parser-based catalog sync misses strings in some closure shapes —
        # only the compile-emitted data is trustworthy.)
        SWIFT_EMIT_LOC_STRINGS: YES
        # CODE_SIGN_ENTITLEMENTS is set in Signing.xcconfig (full) and overridden
        # by the generated Features.xcconfig (baeium), not here — a setting in this
        # block lands in the pbxproj and would override the xcconfig layer the
        # feature set drives.
        # FFmpeg is linked from the bae-ffmpeg fork's prebuilt dist, never a
        # system/Homebrew install. The local path is scripts/setup-ffmpeg.sh's
        # bae-ffmpeg/dist; /opt/bae-ffmpeg is where the setup-macos CI action
        # unpacks the same release. Non-existent search paths are harmless to the
        # linker.
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../../bae-ffmpeg/dist/lib
          - /opt/bae-ffmpeg/lib
        OTHER_LDFLAGS:
          - -lavcodec
          - -lavformat
          - -lavutil
          - -lswresample
          - -lc++
        # Runtime counterpart to LIBRARY_SEARCH_PATHS. The fork's libav* dylibs
        # carry @rpath install names (@rpath/libavcodec.*.dylib), so point @rpath
        # at the same fork dirs a local Debug build launches without bundling.
        # Release rewrites these refs to @executable_path via bundle_dylibs.sh, so
        # a dev-only path here is harmless there, and dyld ignores runpaths that
        # don't exist.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
          - $(SRCROOT)/../../bae-ffmpeg/dist/lib
          - /opt/bae-ffmpeg/lib
      configs:
        Debug:
          BAE_RUN_APP_BUNDLE_IDENTIFIER: fm.bae.desktop.xcode
          BAE_RUN_APP_PRODUCT_NAME: bae
          BAE_RUN_APP_GENERATE_INFOPLIST_FILE: YES
          BAE_RUN_APP_INFOPLIST_FILE: ""
          BAE_RUN_APP_LSUIELEMENT: YES
          # Xcode previews run an app process; a separate identity lets that
          # process coexist with the app launched by run.sh.
          # XCTest suspends its app host before injecting the test bundle. A
          # generated agent-app plist keeps that pre-start process out of the
          # Dock; run.sh supplies runnable values through the private inputs.
        Release:
          BAE_RUN_APP_BUNDLE_IDENTIFIER: fm.bae.desktop
          BAE_RUN_APP_PRODUCT_NAME: bae
          BAE_RUN_APP_GENERATE_INFOPLIST_FILE: NO
          BAE_RUN_APP_INFOPLIST_FILE: bae/Info.plist
          BAE_RUN_APP_LSUIELEMENT: NO
  baeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - baeTests
    dependencies:
      - target: bae
    settings:
      base:
        SWIFT_VERSION: "6.2"
        GENERATE_INFOPLIST_FILE: YES
  baeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - baeUITests
    dependencies:
      - target: bae
    settings:
      base:
        SWIFT_VERSION: "6.2"
        GENERATE_INFOPLIST_FILE: YES
  # Screenshot-capture bundle for the cross-platform gallery. Hosted in the app
  # (like baeTests) so it can `@testable import bae` and reach the DEBUG
  # PreviewScenes builders + fixtures. Kept out of the `bae` scheme's test
  # action — it runs only via its own `baeShots` scheme, which scripts/shots/
  # macos.sh drives with an output directory; run without one it fails loud.
  baeShots:
    type: bundle.unit-test
    platform: macOS
    sources:
      - baeShots
    dependencies:
      - target: bae
    settings:
      base:
        SWIFT_VERSION: "6.2"
        GENERATE_INFOPLIST_FILE: YES
# Explicit scheme so `xcodebuild -scheme bae test` runs the unit-test bundle;
# xcodegen's autogenerated per-target schemes carry no test action.
schemes:
  bae:
    build:
      preActions:
        - name: Prepare Rust Bridge
          settingsTarget: bae
          script: '"$SRCROOT/../prepare-build.sh"'
      targets:
        bae: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - baeTests
        - baeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Screenshot capture only. `scripts/shots/macos.sh` runs
  # `xcodebuild -scheme baeShots test`; the test writes one PNG per scene.
  baeShots:
    build:
      preActions:
        - name: Prepare Rust Bridge
          settingsTarget: bae
          script: '"$SRCROOT/../prepare-build.sh"'
      targets:
        bae: all
        baeShots: [test]
    test:
      config: Debug
      targets:
        - baeShots
