name: bae
options:
  bundleIdPrefix: fm.bae
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    DEAD_CODE_STRIPPING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.0"
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.4.1"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: "9.18.0"
targets:
  bae:
    type: application
    platform: macOS
    # Signing.xcconfig optionally pulls in a gitignored Signing.local.xcconfig
    # for DEVELOPMENT_TEAM, so the team isn't committed (see Signing.xcconfig).
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: bae/bae_bridge.swift
      - bae
    info:
      path: bae/Info.plist
      properties:
        CFBundleDisplayName: bae
        CFBundleDevelopmentRegion: en
        # The shipping locales aren't listed here: the generated Core.xcstrings
        # carries a slot per locale (single-sourced in bae-loc's TARGET_LOCALES),
        # and xcstringstool's compiled per-language resources drive the bundle's
        # known regions — so the set lives in exactly one place.
        SUFeedURL: https://raw.githubusercontent.com/bae-fm/bae/appcast/appcast.xml
        SUPublicEDKey: cYiouOrDxmQrHspLwOf/XpQOQOMt3isdYDs6xEDBGs8=
        SUEnableAutomaticChecks: true
        BaeDatadogSite: $(BAE_DATADOG_SITE)
        BaeDatadogClientToken: $(BAE_DATADOG_CLIENT_TOKEN)
        BaeEnvironment: $(BAE_ENVIRONMENT)
        BaeGitCommit: $(BAE_GIT_COMMIT)
        BaeSentryDsn: $(BAE_SENTRY_DSN)
        NSCameraUsageDescription: bae uses the camera to scan a device's code when adding it to your library.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            LSItemContentTypes:
              - public.folder
            LSHandlerRank: Alternate
        CFBundleURLTypes:
          - CFBundleURLName: fm.bae.url
            CFBundleURLSchemes:
              - bae
    preBuildScripts:
      - name: Build Rust Bridge
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          MARKER="bae-macos/BaeBridgeFFI.xcframework/Info.plist"
          BINDINGS_SOURCE="bae-bridge/swift-bindings-macos/bae_bridge.swift"
          BINDINGS="bae-macos/bae/bae/bae_bridge.swift"
          NEEDS_BUILD=0
          if [ ! -f "$MARKER" ] || [ ! -f "$BINDINGS_SOURCE" ]; then
            NEEDS_BUILD=1
          else
            for src in bae-bridge/src/*.rs bae-core/src/**/*.rs bae-automation/src/**/*.rs bae-mcp/src/**/*.rs; do
              if [ "$src" -nt "$MARKER" ]; then
                NEEDS_BUILD=1
                break
              fi
            done
          fi
          if [ "$NEEDS_BUILD" -eq 1 ]; then
            echo "Bridge sources changed, rebuilding..."
            ./bae-bridge/build-macos.sh
          fi
          # Always ensure the macOS-flavored bindings are in the source tree.
          # Without this, a fresh worktree (xcframework cached, bindings file
          # absent) skips the copy and the build fails to find generated types.
          if [ ! -f "$BINDINGS" ] || [ "$BINDINGS_SOURCE" -nt "$BINDINGS" ]; then
            cp "$BINDINGS_SOURCE" "$BINDINGS"
          fi
          cargo run -q -p bae-loc --bin loc-gen -- emit --target apple --out-dir bae-macos/bae/bae
    dependencies:
      - framework: ../BaeBridgeFFI.xcframework
        embed: false
      - package: Sparkle
      - package: Sentry
      - package: swift-collections
        product: OrderedCollections
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: MediaPlayer.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fm.bae.desktop
        # DEVELOPMENT_TEAM comes from the gitignored Signing.local.xcconfig (via
        # configFiles above), not from here, so the team isn't committed.
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: bae
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.2"
        # CODE_SIGN_ENTITLEMENTS is set in Signing.xcconfig (full) and overridden
        # by the generated Features.xcconfig (baeium), not here — a setting in this
        # block lands in the pbxproj and would override the xcconfig layer the
        # feature set drives.
        LIBRARY_SEARCH_PATHS:
          - /opt/homebrew/lib
          - /opt/homebrew/opt/ffmpeg/lib
        OTHER_LDFLAGS:
          - -lavcodec
          - -lavformat
          - -lavutil
          - -lswresample
          - -ldiscid
          - -lc++
  baeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - baeTests
    dependencies:
      - target: bae
    settings:
      base:
        SWIFT_VERSION: "6.2"
        GENERATE_INFOPLIST_FILE: YES
