[package]
name = "bae-store"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_store"
path = "src/lib.rs"

[build-dependencies]
# Sets the `desktop` cfg for the crate's desktop-only code.
bae-desktop-cfg = { workspace = true }

[dependencies]
# The natural order and the search folding the schema's functions compute.
bae-util = { workspace = true }
# The store: its connection, schema migrations, sync, files and live queries.
coven = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The cancellation that ends a live query with the library.
tokio-util = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
# Stored paths are hex-encoded bytes.
hex = { workspace = true }
# The select and channels the sync-state follower waits on.
tokio = { workspace = true, features = ["sync"] }
# A test store's app directory, and the temporary directory it lives in.
bae-app-dir = { workspace = true, features = ["test-utils"], optional = true }
tempfile = { workspace = true, optional = true }
# The schema checks read the triggers' `UPDATE OF` columns.
regex = { workspace = true, optional = true }
# The kept seeds' folder is named by a hash of what built them, and a kept
# store's id is read back from the file beside it.
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
bae-app-dir = { workspace = true, features = ["test-utils"] }
bae-util = { workspace = true, features = ["test-utils"] }
coven = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
# The schema tests read the tables the schema creates.
regex = { workspace = true }

[features]
default = []
# The OAuth cloud providers' (Dropbox, OneDrive) sign-in and folder calls
# through coven; bae-library's feature of the same name turns it on.
oauth-providers = []
# Test stores on a schema, the rows and fixtures tests seed them with, and
# the store-level harness two-device sync tests run on, for the tests of every
# crate that builds on this one. Dev/test-only: a production build never
# enables it.
test-utils = [
    "dep:bae-app-dir",
    "dep:tempfile",
    "dep:regex",
    "dep:sha2",
    "dep:uuid",
    "bae-util/test-utils",
    "coven/test-utils",
    "tokio/rt",
    "tokio/rt-multi-thread",
    "tokio/time",
]

[lints]
workspace = true
