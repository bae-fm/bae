[package]
name = "bae-audio"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_audio"
path = "src/lib.rs"

[build-dependencies]
# Sets the `desktop` cfg for the crate's desktop-only code.
bae-desktop-cfg = { workspace = true }

[dependencies]
# Content types, which a probe and a decoded stream name.
bae-util = { workspace = true }
# The places of the open-files budget a probe opens its file in (src/probe.rs).
coven = { workspace = true }
# The lock-free ring a decode writes one track's PCM into (src/track_stream.rs).
rtrb = { workspace = true }
# The fill's wake signal (src/sparse_buffer.rs) and a track's ready signal
# (src/track_stream.rs).
tokio = { workspace = true, features = ["sync"] }
thiserror = { workspace = true }
tracing = { workspace = true }

# FFmpeg decode/encode. On desktop it is the whole decode engine; on Android and
# iOS it is the in-core decode path (Android additionally has an offload
# fast-path that skips it for hardware-supported codecs). Linked for the cross
# targets via ffmpeg-sys-next's FFMPEG_DIR path — see
# scripts/build-ffmpeg-{android,ios}.sh and the FFMPEG_DIR/BINDGEN_EXTRA_CLANG_ARGS
# exports in bae-bridge/build-{android,ios}.sh.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "android", target_os = "ios"))'.dependencies]
ffmpeg-next = { workspace = true, features = ["codec", "format", "software-resampling"] }
ffmpeg-sys-next = { workspace = true, features = ["avcodec", "avformat", "swresample"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
# The hang guard the buffer's and the stream's test waits are bounded by.
bae-util = { workspace = true, features = ["test-utils"] }

[features]
default = []
# The WAV reader and the whole-buffer i32 encoder bae-library's and bae-subsonic's
# tests build and check audio with, and the buffer, sample conversion and
# comparison they check a decode or a capture against a reference with, and
# the wait for a drain to be waiting on its stream wake.
test-utils = ["bae-util/test-utils"]
# What bae-library's own unit tests read back and drive: the files each probe
# opened (for tests that assert a second look at a folder opens nothing), where
# a buffer's readers read and what it holds, and a non-blocking push into a
# track's stream. It records as it runs, so only bae-library's dev-dependency turns
# it on, never a build that ships or a debug app.
test-instrumentation = ["bae-util/test-utils"]

[lints]
workspace = true
