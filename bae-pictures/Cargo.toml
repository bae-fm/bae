[package]
name = "bae-pictures"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false
# The crates that depend on this one receive its fragments through this key.
links = "bae_pictures_sql"

[lib]
name = "bae_pictures"
path = "src/lib.rs"

[build-dependencies]
# Checks the crate's read fragments against the schema and writes the Rust they include.
bae-fragments-build = { workspace = true }
# Writes the schema this crate declares from its `schema.toml`.
bae-schema-manifest = { workspace = true }

[dependencies]
# Runs a picture's job under the reporter that tells of a panic in it.
bae-diagnostics = { workspace = true }
# The sizes a copy is made at, which the library's rows state too.
bae-types = { workspace = true }
# The tile cache's rows, in the library's store.
bae-store = { workspace = true }
coven = { workspace = true }
# The folder name of a picture's tiles.
bae-util = { workspace = true }
# The spool folder a cut writes before the cache keeps it.
tempfile = { workspace = true }
# What a job waits on while it shares its result.
tokio = { workspace = true, features = ["rt", "sync"] }
thiserror = { workspace = true }
# The signal that ends a picture job.
tokio-util = { workspace = true }
# What a failed read or seek says, which libvips reduces to its own message.
tracing = { workspace = true }

[dev-dependencies]
# The runtime the job tests run their requests on.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
# The test folder the test pictures are made in.
bae-util = { workspace = true, features = ["test-utils"] }
# The test store the tile cache's rows are kept in.
bae-store = { workspace = true, features = ["test-utils"] }
# Decodes the thumbnail a test makes, to read its pixels.
jpeg-decoder = { workspace = true }
# Writes the large test picture one row at a time.
png = { workspace = true }

# Measures a job's peak memory: wait4 returns the child's resource usage.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

# On Windows, the peak working set of the child's process.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus"] }

[features]
# A tile cache over a temporary folder, for the tests of crates that hold one.
test-utils = ["bae-util/test-utils"]

[lints]
workspace = true
