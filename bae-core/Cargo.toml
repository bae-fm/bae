[package]
name = "bae-core"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false
# The `desktop` cfg, defined once in bae-util's build script for every crate
# with desktop-only code.
build = "../bae-util/build.rs"

[lib]
name = "bae_core"
path = "src/lib.rs"

[dependencies]
bae-audio = { path = "../bae-audio" }
bae-catalogs = { path = "../bae-catalogs" }
bae-types = { path = "../bae-types" }
bae-util = { path = "../bae-util" }
coven = { workspace = true }
rusqlite = { workspace = true }
# The telemetry upload's request and the provider errors import classifies;
# the transport is bae-util's.
reqwest = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.8"
tokio = { version = "1.0", features = ["full"] }
thiserror = { workspace = true }
# The S3 endpoint a library connects to, parsed for coven's location.
url = "2.5"
uuid = { version = "1.0", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
# Natural, case-insensitive file-name order: the release file list every
# platform shows (detail, gallery) and the desktop import scan share it.
natord = "1.0"
base64 = "0.22"
async-trait = "0.1"
regex = "1.11"
libc = "0.2"
rtrb = "0.3.2"
tokio-util = { version = "0.7", features = ["io", "rt"] }
rand = "0.9"
tracing = { workspace = true }
# The app directory's files are staged in a temporary file before an atomic
# persist. Desktop extraction also stages cover files for barcode OCR.
tempfile = "3.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# CoreAudio bindings for the default-output-device change listener
# (src/playback/cpal_output.rs, macOS only): re-resolves the default device and
# rebuilds the persistent output stream when the user switches outputs. Pinned to
# the version cpal already links (via coreaudio-rs) so there's no second copy.
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# AAudio output sink for the in-core decode path (src/playback/aaudio_output.rs).
ndk = { version = "0.9", features = ["audio"] }

# The import pipeline's dependencies. The predicate is the pipeline's own, the
# `desktop` cfg's (bae-util/build.rs): a mobile build is a sync/playback client
# and compiles none of this. Naming the desktop targets positively instead
# would let a new non-mobile target compile the pipeline while its
# dependencies stayed behind.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
lofty = "0.25"
# A scanned file's name is matched against a sheet's or a tag's with its
# Unicode composition set aside (src/import/folder_scanner.rs).
unicode-normalization = "0.1"
notify = "8.2.0"
strsim = "0.11"
# The MusicBrainz Disc ID is a SHA-1 of the disc's table of contents
# (src/import/discid_hash.rs).
sha1 = "0.10"
# Dev-mode `.env` loading (src/config/dev.rs).
# Loudness + true-peak measurement at import (src/loudness.rs). Pure Rust, no
# system libs. Import-only: playback derives its gain from the stored
# measurements with plain arithmetic (no ebur128 at playback). true_peak returns
# a linear ratio (1.0 = 0 dBTP), stored verbatim as `*_peak_linear`.
ebur128 = "0.1.10"

# cpal drives the audio sink on desktop and iOS (its CoreAudio/AudioUnit backend
# covers both). Android uses AAudio (the `ndk` dep above) instead, so cpal is off
# there.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "ios"))'.dependencies]
cpal = "0.15"

# Whether a watched folder is on a network volume (src/import/volume.rs): a
# drive letter mapped to a share looks local by spelling, and only
# `GetDriveTypeW` tells it apart.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
# The test codec helpers (WAV reader, whole-buffer encoder), and the
# instrumentation bae-core's unit tests read: probe counts, buffer ranges and
# reads.
bae-audio = { path = "../bae-audio", features = ["test-utils", "test-instrumentation"] }
# The test transport and the retry that sleeps no real time, for bae-core's
# own unit tests.
bae-util = { path = "../bae-util", features = ["test-utils"] }
# The pressing values bae-core's unit tests build their fixtures from.
bae-types = { path = "../bae-types", features = ["test-utils"] }
# The catalog clients' and the image cache's test constructors, and the
# requests the rate limiter queued and admitted, which its unit tests read.
bae-catalogs = { path = "../bae-catalogs", features = ["test-utils", "test-instrumentation"] }
# Shared integration-test helpers. A real crate rather than a `tests/support`
# include so they compile once and `dead_code` stays armed on them; the cycle
# back to bae-core is dev-only, which Cargo allows.
bae-test-support = { path = "../bae-test-support" }
tokio = { version = "1.0", features = ["test-util"] }
serial_test = "3.4.0"
# The local HTTP servers tests stand in for catalogs and cover archives with.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "form"] }
# The test log capture (`test_logs`) and the sync bench example's log output.
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
# The examples resolve the running user's home once, at the top, to build the
# app directory they read.
dirs = "5.0"
# coven's deterministic clock/id fakes for bae's tests (off in production builds).
coven = { workspace = true, features = ["test-utils"] }
# Builds the native keychain refusal coven wraps in `KeychainError`, for the
# tests of how a missing keychain entitlement is reported.
keyring-core = "1.0.1"
# Decodes the stored covers and pictures the tests check, and builds the
# images they import.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Encodes the non-UTF-8 tags the import tests read back.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dev-dependencies]
encoding_rs = "0.8"

# The scrub-point test reads a FLAC's frames straight off FFmpeg's demuxer.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "android", target_os = "ios"))'.dev-dependencies]
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "software-resampling"] }

[[test]]
name = "test_close_open_files"
path = "tests/test_close_open_files.rs"
required-features = ["test-utils"]

[[test]]
name = "test_playback_behavior"
path = "tests/test_playback_behavior.rs"
required-features = ["test-utils"]

[[test]]
name = "test_playback_cpu"
path = "tests/test_playback_cpu.rs"
required-features = ["test-utils"]

[[test]]
name = "test_transfer"
path = "tests/test_transfer.rs"
required-features = ["test-utils"]

[[test]]
name = "test_album_sort"
path = "tests/test_album_sort.rs"
required-features = ["test-utils"]

[[test]]
name = "test_save_s3_config"
path = "tests/test_save_s3_config.rs"
required-features = ["test-utils"]

[[test]]
name = "test_bootstrap_pointer"
path = "tests/test_bootstrap_pointer.rs"
required-features = ["test-utils"]

[[test]]
name = "test_bootstrap_fixture"
path = "tests/test_bootstrap_fixture.rs"
required-features = ["test-utils"]

[[test]]
name = "test_cue_ape"
path = "tests/test_cue_ape.rs"
required-features = ["test-utils"]

[[test]]
name = "alac_fixtures"
path = "tests/alac_fixtures.rs"
required-features = ["test-utils"]

[[test]]
name = "test_candidate_text_fixtures"
path = "tests/test_candidate_text_fixtures.rs"
required-features = ["test-utils"]

[[test]]
name = "test_import_open_files"
path = "tests/test_import_open_files.rs"
required-features = ["test-utils"]

[features]
default = []
# Enables OAuth cloud providers (Dropbox, OneDrive) through coven. Off
# by default → S3-only, matching the baeium build; the bae build turns it
# on. bae-core's own oauth call sites (provider sign-in and setup) gate on this.
oauth-providers = []
# A debug app's dev reset: the profile it recreates its library from. Debug
# macOS bridge builds turn it on; release builds leave it out.
dev-reset = []
# Forwards coven's test-utils so bae-core's own integration tests get the
# re-exported clock/id fakes (FixedClock, …), bae-util's so they get its test
# transport and a retry that sleeps no real time, bae-audio's so they get its
# test codec helpers, bae-types's so they get the pressing values their
# fixtures are built from, and bae-catalogs's so they get the catalog clients'
# and the image cache's test constructors.
test-utils = ["coven/test-utils", "bae-util/test-utils", "bae-audio/test-utils", "bae-types/test-utils", "bae-catalogs/test-utils"]

[lints]
workspace = true
