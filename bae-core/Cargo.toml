[package]
name = "bae-core"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false
build = "build.rs"

[lib]
name = "bae_core"
path = "src/lib.rs"

[dependencies]
coven = { workspace = true }
# `blocking` powers the DLNA control point (src/dlna/): its SSDP search thread
# and the SOAP channel drive blocking HTTP off the async runtime, the same way
# the Cast session owns its device on its own OS thread.
reqwest = { workspace = true, features = ["blocking", "form", "json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
keyring-core = "0.7"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
dirs = "5.0"
axum = "0.7"
natord = "1.0"
regex = "1.11"
strsim = "0.11"
unicode-normalization = "0.1"
libc = "0.2"
chardetng = "0.1"
encoding_rs = "0.8"
rtrb = "0.3.2"
# Cover-art resizing at store time (src/util/cover.rs) runs on every platform —
# imports and change-cover normalize to a ≤600 JPEG thumbnail everywhere, so the
# stored cover blob is uniform regardless of which device imported it. jpeg+png
# only, no default features (no rayon), so it builds on mobile and wasm.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
futures = "0.3.31"
tokio-util = { version = "0.7", features = ["io", "rt"] }
rand = "0.9"
# Embedded-tag reads and writes: the Unknown-import file-tag projection and the
# library exporter both run on every platform, so this is not a desktop dep.
lofty = "0.24"
lru = "0.17"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
# Staging a coven-held cover blob to a real file for the barcode-OCR reader,
# which needs a path (the bytes come back through `read_image_blob`).
tempfile = "3.8"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# Google Cast sender (src/cast/): the CASTV2 protocol over TLS to Chromecast/Nest
# devices, and mDNS service discovery of them. `thread_safe` makes rust_cast's
# `CastDevice` Send so the session can own it on its own OS thread. Compiled on
# every platform (only desktop wires the UI), so the cast module builds
# everywhere; the receiver fetches audio itself over HTTP.
rust_cast = { version = "0.21", features = ["thread_safe"] }
mdns-sd = "0.20"
# UPnP/DLNA control point (src/dlna/): parses device-description and SOAP
# response XML. Read-only DOM, pure Rust (builds on every platform). Outgoing
# SOAP envelopes are hand-built with explicit escaping, so this is parse-only.
roxmltree = "0.20"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "0.2", features = ["protected"] }

# CoreAudio bindings for the default-output-device change listener
# (src/playback/cpal_output.rs, macOS only): re-resolves the default device and
# rebuilds the persistent output stream when the user switches outputs. Pinned to
# the version cpal already links (via coreaudio-rs) so there's no second copy.
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "0.5"
# AAudio output sink for the in-core decode path (src/playback/aaudio_output.rs).
ndk = { version = "0.9", features = ["audio"] }

# Windows Credential Manager store for keyring-core (encryption key, Discogs
# token). 0.5.x targets keyring-core ^0.7 to match
# the rest of the workspace. Without this, `init_keyring` registers no default
# store on Windows and every credential read fails.
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "0.5.1"

# The import pipeline's dependencies. The predicate is the pipeline's own — a
# mobile build is a sync/playback client and compiles none of this — and it is
# spelled here exactly as the code that uses these crates spells it
# (`cfg(not(any(target_os = "ios", target_os = "android")))`). Naming the desktop
# targets positively instead would let a new non-mobile target compile the
# pipeline while its dependencies stayed behind.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Dev-mode `.env` loading (src/config/dev.rs).
dotenvy = "0.15"
# Disc-ID computation from a candidate's LOG/CUE (src/signals/disc_id.rs).
discid = "0.5"
# Loudness + true-peak measurement at import (src/loudness.rs). Pure Rust, no
# system libs. Import-only: playback derives its gain from the stored
# measurements with plain arithmetic (no ebur128 at playback). true_peak returns
# a linear ratio (1.0 = 0 dBTP), stored verbatim as `*_peak_linear`.
ebur128 = "0.1.10"

# cpal drives the audio sink on desktop and iOS (its CoreAudio/AudioUnit backend
# covers both). Android uses AAudio (the `ndk` dep above) instead, so cpal is off
# there.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "ios"))'.dependencies]
cpal = "0.15"

# FFmpeg decode/encode powers in-process audio playback. On desktop it is the
# whole decode engine; on Android and iOS it is the in-core decode path (Android
# additionally has an offload fast-path that skips it for hardware-supported
# codecs). Linked for the cross targets via ffmpeg-sys-next's FFMPEG_DIR path —
# see scripts/build-ffmpeg-{android,ios}.sh and the FFMPEG_DIR/BINDGEN_EXTRA_CLANG_ARGS
# exports in bae-bridge/build-{android,ios}.sh.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "android", target_os = "ios"))'.dependencies]
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "software-resampling"] }
ffmpeg-sys-next = { version = "8.1", default-features = false, features = ["avcodec", "avformat", "swresample"] }

[dev-dependencies]
# Shared integration-test helpers. A real crate rather than a `tests/support`
# include so they compile once and `dead_code` stays armed on them; the cycle
# back to bae-core is dev-only, which Cargo allows.
bae-test-support = { path = "../bae-test-support" }
tokio = { version = "1.0", features = ["test-util"] }
serial_test = "3.4.0"
# coven's deterministic clock/id fakes for bae's tests (off in production builds).
coven = { workspace = true, features = ["test-utils"] }

[[test]]
name = "test_playback_behavior"
path = "tests/test_playback_behavior.rs"
required-features = ["test-utils"]

[[test]]
name = "test_playback_cpu"
path = "tests/test_playback_cpu.rs"
required-features = ["test-utils"]

[[test]]
name = "test_transfer"
path = "tests/test_transfer.rs"
required-features = ["test-utils"]

[[test]]
name = "test_album_sort"
path = "tests/test_album_sort.rs"
required-features = ["test-utils"]

[[test]]
name = "test_save_s3_config"
path = "tests/test_save_s3_config.rs"
required-features = ["test-utils"]

[[test]]
name = "test_bootstrap_pointer"
path = "tests/test_bootstrap_pointer.rs"
required-features = ["test-utils"]

[[test]]
name = "test_cue_ape"
path = "tests/test_cue_ape.rs"
required-features = ["test-utils"]

[[test]]
name = "alac_fixtures"
path = "tests/alac_fixtures.rs"
required-features = ["test-utils"]

[features]
default = []
# Enables coven's OAuth cloud providers (Google Drive, Dropbox, OneDrive). Off
# by default → S3-only, matching the baeium build; the bae build turns it
# on. bae-core's own oauth call sites (sign_in_cloud_provider) gate on this.
oauth-providers = ["coven/oauth-providers"]
# Forwards coven's test-utils so bae-core's own integration tests get the
# re-exported clock/id fakes (FixedClock, …).
test-utils = ["coven/test-utils"]

[lints]
workspace = true
