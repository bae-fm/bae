[package]
name = "bae-automation"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false
# The `desktop` cfg, defined once in bae-util's build script for every crate
# with desktop-only code.
build = "../bae-util/build.rs"

[lib]
name = "bae_automation"
path = "src/lib.rs"

[dependencies]
# The app's services over an open library, which this crate calls.
bae-app = { workspace = true }
bae-library = { workspace = true }
# The library's records its answers carry.
bae-store = { workspace = true }
bae-records = { workspace = true }
# The identify views its answers carry.
bae-identify = { workspace = true }
# The import queue, candidates and release drafts its tools read and drive.
bae-import = { workspace = true }
# The MCP server's settings.
bae-preferences = { workspace = true }
bae-diagnostics = { workspace = true }
# The catalogs and covers its records carry.
bae-catalogs = { workspace = true }
# The pressing values its records carry.
bae-types = { workspace = true }
# The export queue its export status reads.
bae-transfers = { workspace = true }
# The library's views and the shapes the screens show.
bae-views = { workspace = true }
bae-mirror = { workspace = true }
# The text that shows a path, and a candidate key's bytes as text.
coven = { workspace = true }
hex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
# The test libraries the tools are driven over.
# A test library's services, started through the app's own step.
bae-app = { workspace = true, features = ["test-utils"] }
bae-library = { workspace = true, features = ["test-utils"] }
# The import runs the import tests land releases with.
bae-import = { workspace = true, features = ["test-utils"] }
# The catalog fakes and releases the import tests seed.
bae-catalogs = { workspace = true, features = ["test-utils"] }
bae-types = { workspace = true, features = ["test-utils"] }
bae-util = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
