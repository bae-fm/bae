[package]
name = "bae-automation"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_automation"
path = "src/lib.rs"

[dependencies]
bae-core = { path = "../bae-core" }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[lints]
workspace = true
