# The Default heuristic splits calls, struct literals and chains at limits far
# below max_width; Max lets them stay on one line up to the line width.
use_small_heuristics = "Max"
# Every crate is edition 2021. cargo fmt passes each crate's edition, but a bare
# `rustfmt <file>` defaults to 2015 and rewrites files cargo fmt left alone.
edition = "2021"
