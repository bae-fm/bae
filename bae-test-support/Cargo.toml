[package]
name = "bae-test-support"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_test_support"
path = "src/lib.rs"

# Helpers shared by bae-core's two integration test binaries and by the unit
# tests of the crates above bae-core, so a library of their own.
[dependencies]
# test-utils gives `Database::new_test` and the in-memory keyring the helpers
# below build on. bae-core dev-depends back on this crate; Cargo permits that
# cycle because it runs only through dev-dependencies.
bae-core = { workspace = true, features = ["test-utils"] }
# The app directory the libraries the helpers open live under.
bae-app-dir = { workspace = true }
# The store the libraries the helpers open hold.
bae-db = { workspace = true }
# The playback service the helpers start, on a capture device.
bae-playback = { workspace = true, features = ["test-utils"] }
# The catalog pick an import draft names.
bae-identify = { workspace = true }
# The preferences the import helpers set.
bae-preferences = { workspace = true }
# The diagnostics sink the libraries the helpers open report to.
bae-diagnostics = { workspace = true }
# The catalog fakes the helpers open libraries over, and the image cache they
# build through its test constructor.
bae-catalogs = { workspace = true, features = ["test-utils"] }
# test-utils gives the test transport whose hosts `RemoteImageHost::route`
# sends here.
bae-util = { workspace = true, features = ["test-utils"] }
# The local stand-in for the Cover Art Archive: cover addresses are derived, so
# a test that wants bytes at one has to answer it.
axum = { workspace = true, features = ["http1", "tokio"] }
coven = { workspace = true, features = ["test-utils"] }
# For synthesizing a folder-cover image in tests that need a release with art.
image = { workspace = true, features = ["png"] }
lofty = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
