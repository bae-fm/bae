[package]
name = "bae-test-support"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_test_support"
path = "src/lib.rs"

# Helpers shared by bae-core's integration tests. This is a library rather than
# a `tests/support/mod.rs` include on purpose: that file was textually compiled
# into each of the 16 `tests/*.rs` binaries, so every helper a given binary
# didn't call read as dead and the module needed a blanket `#![allow(dead_code)]`
# to stay quiet. As a real crate it compiles once and its helpers are a genuine
# public API, so `dead_code` and `unreachable_pub` both hold without an allow.
[dependencies]
# test-utils gives `Database::new_test` and the in-memory keyring the helpers
# below build on. bae-core dev-depends back on this crate; Cargo permits that
# cycle because it runs only through dev-dependencies.
bae-core = { path = "../bae-core", features = ["test-utils"] }
coven = { workspace = true, features = ["test-utils"] }
hex = "0.4"
# For synthesizing a folder-cover image in tests that need a release with art.
image = { version = "0.25", default-features = false, features = ["png"] }
lofty = "0.24"
# The Discogs release fixtures are rendered as the endpoint's own JSON so the
# production parser is what turns them into a release.
serde_json = "1.0"
tempfile = "3.8"
tokio = { version = "1.0", features = ["full"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }

[lints]
workspace = true
