[package]
name = "bae-bridge"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false
# The `desktop` cfg, defined once in bae-util's build script for every crate
# with desktop-only code.
build = "../bae-util/build.rs"

[package.metadata.cargo-machete]
# libsqlite3-sys is a link/build dependency (bundled SQLite with the session
# extension); it has no direct `use` here, so cargo-machete misreads it as unused.
ignored = ["libsqlite3-sys"]

[lib]
name = "bae_bridge"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
async-trait = { workspace = true }
bae-desktop = { workspace = true, optional = true }
bae-cast = { workspace = true, optional = true }
# The identify views and verdicts the desktop import screens mirror.
bae-identify = { workspace = true, optional = true }
# The app's services over an open library, which this crate calls.
bae-app = { workspace = true }
bae-library = { workspace = true }
# The import screens' candidates, drafts and queue, and the release-edit
# model the desktop editors mirror.
bae-import = { workspace = true, optional = true }
bae-app-dir = { workspace = true }
# The library's records and the store the bridge mirrors.
bae-db = { workspace = true }
# The preferences the settings screens mirror.
# The playback service, its values and the renderers the bridge mirrors.
bae-playback = { workspace = true }
bae-preferences = { workspace = true }
# The stretch of a file a preview plays.
bae-track-audio = { workspace = true }
# The transfer queues' rows and counts the bridge mirrors.
bae-transfers = { workspace = true }
# The library's views and the shapes the screens show.
bae-views = { workspace = true }
bae-diagnostics = { workspace = true }
# The catalogs, covers and image sets the bridge mirrors.
bae-catalogs = { workspace = true }
# The pressing values and barcode refusals the bridge mirrors.
bae-types = { workspace = true }
bae-util = { workspace = true }
bae-mirror = { workspace = true }
# Boundary records mirror the same coven instance used by bae-library.
coven = { workspace = true }
uniffi = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror = { workspace = true }
serde_json = { workspace = true }
libsqlite3-sys = { workspace = true, features = ["session", "bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# ETW (TraceLogging) output for tracing — Windows' unified-logging equivalent.
# Provider "bae-bridge", GUID derived from the name, so a capture session names
# it as `logman ... -p "*bae-bridge"`.
tracing-etw = { workspace = true }

# The remaining desktop target (Linux) logs to the systemd journal, read with
# `journalctl --user -t bae`.
[target.'cfg(not(any(target_os = "macos", target_os = "ios", target_os = "android", target_os = "windows")))'.dependencies]
tracing-journald = { workspace = true }

[dev-dependencies]
# The validation-reason ↔ catalog cross-check test loads the master catalog.
bae-loc = { workspace = true }
# A test library's services, started through the app's own step.
bae-app = { workspace = true, features = ["test-utils"] }
bae-library = { workspace = true, features = ["test-utils"] }
# The fixture audio the import list tests scan.
bae-import = { workspace = true, features = ["test-utils"] }
# The bug reporter that keeps what it is handed, and whether a diagnostics
# setting sends events.
bae-diagnostics = { workspace = true, features = ["test-utils"] }
bae-util = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
# Builds the native keychain refusal coven wraps in `KeychainError`, for the
# tests of how a missing keychain entitlement is reported.
keyring-core = { workspace = true }

[features]
default = []
# Enables the OAuth cloud-provider surface (sign-in + the desktop/host OAuth
# flows) via bae-library/coven. Off by default → the baeium build; the bae
# build turns it on.
oauth-providers = ["bae-app/oauth-providers", "bae-library/oauth-providers"]
cloudkit = []
# Casting to network receivers: the device picker, the session, and the
# host-reported discovery seam. Off by default; every shipping platform turns it
# on, and desktop implies it.
cast = ["dep:bae-cast"]
desktop = ["cast", "dep:bae-desktop", "dep:bae-identify", "dep:bae-import"]
# An in-memory keychain a debug app can start its host with, so UI tests never
# touch the login keychain. Debug macOS builds turn it on.
test-keyring = ["bae-library/test-utils", "bae-app-dir/test-utils"]
# A debug app's dev reset, which recreates its library from a profile file.
# Debug macOS builds turn it on.
dev-reset = ["bae-library/dev-reset"]

[lints]
workspace = true
