[package]
name = "bae-bridge"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[package.metadata.cargo-machete]
# libsqlite3-sys is a link/build dependency (bundled SQLite with the session
# extension); it has no direct `use` here, so cargo-machete misreads it as unused.
ignored = ["libsqlite3-sys"]

[lib]
name = "bae_bridge"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
bae-desktop = { path = "../bae-desktop", optional = true }
bae-cast = { path = "../bae-cast", optional = true }
bae-core = { path = "../bae-core" }
# The CloudKit adapter implements coven's CloudKitOps, so it names coven types
# directly (same pinned instance bae-core uses, via the workspace dep).
coven = { workspace = true }
uniffi = { version = "0.32", features = ["cli", "tokio"] }
tokio = { version = "1.0", features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde_json = "1.0"
libsqlite3-sys = { version = "0.38.0", features = ["session", "bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog = "0.3"

[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# ETW (TraceLogging) output for tracing — Windows' unified-logging equivalent.
# Provider "bae-core", GUID derived from the name, so a capture session names
# it as `logman ... -p "*bae-core"`.
tracing-etw = "0.2"

[dev-dependencies]
# The validation-reason ↔ catalog cross-check test loads the master catalog.
bae-loc = { path = "../bae-loc" }
bae-core = { path = "../bae-core", features = ["test-utils"] }

[features]
default = []
# Enables the OAuth cloud-provider surface (sign-in + the desktop/host OAuth
# flows) via bae-core/coven. Off by default → the baeium build; the bae
# build turns it on.
oauth-providers = ["bae-core/oauth-providers", "coven/oauth-providers"]
cloudkit = []
# Casting to network receivers: the device picker, the session, and the
# host-reported discovery seam. Off by default; every shipping platform turns it
# on, and desktop implies it.
cast = ["dep:bae-cast"]
desktop = ["cast", "dep:bae-desktop"]

[lints]
workspace = true
