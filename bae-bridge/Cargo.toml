[package]
name = "bae-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "bae_bridge"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
bae-core = { path = "../bae-core" }
uniffi = { version = "0.31", features = ["cli", "tokio"] }
tokio = { version = "1.0", features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde_json = "1.0"
libsqlite3-sys = { version = "0.38.0", features = ["session", "bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog = "0.3"

[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[features]
default = []
# Enables the OAuth cloud-provider surface (sign-in + the desktop/host OAuth
# flows) via bae-core/coven. Off by default → the baeium build; the bae
# build turns it on.
oauth-providers = ["bae-core/oauth-providers"]
cloudkit = []
desktop = []

[lints.clippy]
large_enum_variant = "allow"

[lints.rust]
unexpected_cfgs = "allow"
