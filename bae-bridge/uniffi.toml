# Read by uniffi-bindgen from this crate's root when it generates the bindings.

[bindings.swift]
# uniffi's own `LocalizedError` conformance gives every error an
# `errorDescription` of `String(reflecting: self)`, a dump of the Rust value, so
# a bridge error's `localizedDescription` would read as the enum, untranslated.
# Leaving it out lets BaeKit declare the conformance itself, with core's keyed
# line in the current locale (`BaeKit/Sources/BaeKit/BridgeError+Localized.swift`).
omit_localized_error_conformance = true

# Every generated record, enum and error without an object inside conforms to
# `Codable`, synthesized beside its declaration: the macOS app saves its sort
# choices in UserDefaults by encoding the bridge's own sort types. Swift can't
# synthesize the conformance from an extension in another file.
generate_codable_conformance = true

# Swift's `Task.cancel()` reaches Rust for exactly these async callables
# (`Type.method`, by their Rust names): the generated call runs inside
# `withTaskCancellationHandler`, whose handler drops the Rust future, and the
# call throws `CancellationError`. Every other async callable runs to its end
# once started: `AppHandle.save_playback_state` is left out because dropping it
# partway leaves the queue, current track and position unwritten.
async_cancellable = [
