[messages."core.playback.pause.side_ended.message.vinyl".translations]
es = "La reproducción se pausó entre lados. Dale la vuelta al vinilo y pulsa Reproducir."
fr = "La lecture est en pause entre les faces. Retournez le vinyle, puis appuyez sur Lecture."
de = "Die Wiedergabe pausiert zwischen den Seiten. Drehe die Schallplatte um und drücke Wiedergabe."
pt-BR = "A reprodução pausou entre os lados. Vire o vinil e toque em Reproduzir."
ja = "面の間で再生を一時停止しました。レコードを裏返してから再生を押してください。"
ko = "면 사이에서 재생이 일시 정지되었습니다. 레코드를 뒤집은 다음 재생을 누르세요."
zh-Hans = "播放已在两面之间暂停。请翻转黑胶唱片，然后按播放。"
ar = "تم إيقاف التشغيل مؤقتًا بين الجانبين. اقلب أسطوانة الفينيل ثم اضغط تشغيل."
he = "ההשמעה הושהתה בין הצדדים. הפוך את התקליט ואז לחץ על הפעלה."
uk = "Відтворення призупинено між сторонами. Переверніть вініл і натисніть Відтворити."
bg = "Възпроизвеждането е на пауза между страните. Обърнете плочата и натиснете Възпроизвеждане."
pl = "Odtwarzanie wstrzymano między stronami. Odwróć winyl i naciśnij Odtwórz."
cs = "Přehrávání je pozastaveno mezi stranami. Otočte vinyl a stiskněte Přehrát."
hr = "Reprodukcija je pauzirana između strana. Okrenite vinil i pritisnite Reproduciraj."
zh-Hant = "播放已在兩面之間暫停。請翻轉黑膠唱片，然後按播放。"
it = "La riproduzione è in pausa tra i lati. Gira il vinile, poi premi Riproduci."
tr = "Çalma yüzler arasında duraklatıldı. Plağı çevirin, sonra Oynat'a basın."
vi = "Phát lại đã tạm dừng giữa các mặt. Lật đĩa vinyl rồi nhấn Phát."
nl = "Het afspelen is gepauzeerd tussen kanten. Draai de plaat om en druk op Afspelen."
hi = "साइडों के बीच प्लेबैक रोक दिया गया है। विनाइल को पलटें, फिर प्ले दबाएँ।"
bn = "সাইডের মাঝে প্লেব্যাক বিরত হয়েছে। ভিনাইলটি উল্টে দিন, তারপর প্লে চাপুন।"
ta = "பக்கங்களுக்கு இடையில் இயக்கம் இடைநிறுத்தப்பட்டது. வினைலைத் திருப்பி, பிறகு இயக்கு என்பதை அழுத்தவும்."
te = "సైడ్‌ల మధ్య ప్లేబ్యాక్ నిలిపివేయబడింది. వినైల్‌ను తిప్పి, ఆపై ప్లే నొక్కండి."
mr = "बाजूंमध्ये प्लेबॅक थांबवला आहे. विनाइल उलटा करा, मग प्ले दाबा."
ur = "سائیڈز کے درمیان پلے بیک روک دیا گیا ہے۔ ونائل کو پلٹیں، پھر پلے دبائیں۔"
gu = "સાઇડ વચ્ચે પ્લેબેક રોકાયું છે. વિનાઇલને ફેરવો, પછી પ્લે દબાવો."
kn = "ಸೈಡ್‌ಗಳ ನಡುವೆ ಪ್ಲೇಬ್ಯಾಕ್ ವಿರಾಮಗೊಂಡಿದೆ. ವಿನೈಲ್ ಅನ್ನು ತಿರುಗಿಸಿ, ನಂತರ ಪ್ಲೇ ಒತ್ತಿರಿ."
ml = "സൈഡുകൾക്കിടയിൽ പ്ലേബാക്ക് നിർത്തി. വിനൈൽ തിരിച്ച്, തുടർന്ന് പ്ലേ അമർത്തുക."
pa = "ਸਾਈਡਾਂ ਵਿਚਕਾਰ ਪਲੇਬੈਕ ਰੁਕ ਗਿਆ ਹੈ। ਵਿਨਾਇਲ ਨੂੰ ਉਲਟੋ, ਫਿਰ ਪਲੇ ਦਬਾਓ।"
th = "การเล่นหยุดพักระหว่างด้าน พลิกแผ่นไวนิล แล้วกดเล่น"
