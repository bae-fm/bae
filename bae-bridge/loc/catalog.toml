value = "This release is still uploading — try again when it finishes."

[messages."core.playback.error.upload_pending".translations]
es = "Esta edición todavía se está subiendo: inténtalo de nuevo cuando termine."
fr = "Cette édition est encore en cours d'envoi — réessayez une fois terminé."
de = "Diese Veröffentlichung wird noch hochgeladen — versuche es erneut, wenn sie fertig ist."
pt-BR = "Esta edição ainda está sendo enviada — tente novamente quando terminar."
ja = "このリリースはまだアップロード中です。完了してからもう一度お試しください。"
ko = "이 릴리스는 아직 업로드 중입니다. 완료되면 다시 시도하세요."
zh-Hans = "此发行版仍在上传中——完成后请重试。"
ar = "لا يزال هذا الإصدار قيد الرفع — أعد المحاولة عند انتهائه."
he = "ההוצאה הזו עדיין מועלית — נסה שוב כשהיא תסתיים."
uk = "Це видання ще вивантажується — спробуйте знову, коли завершиться."
bg = "Това издание още се качва — опитайте отново, когато приключи."
pl = "To wydanie jest jeszcze przesyłane — spróbuj ponownie po zakończeniu."
cs = "Toto vydání se ještě nahrává — zkuste to znovu po dokončení."
hr = "Ovo izdanje se još učitava — pokušajte ponovno kad završi."
zh-Hant = "此發行仍在上傳 — 完成後再試一次。"
it = "Questa pubblicazione è ancora in caricamento — riprova al termine."
tr = "Bu yayın hâlâ yükleniyor — bittiğinde yeniden deneyin."
vi = "Bản phát hành này vẫn đang tải lên — hãy thử lại khi hoàn tất."
nl = "Deze release wordt nog geüpload — probeer het opnieuw wanneer dit klaar is."
hi = "यह रिलीज अभी अपलोड हो रही है — पूरा होने पर फिर कोशिश करें।"
bn = "এই রিলিজ এখনও আপলোড হচ্ছে — শেষ হলে আবার চেষ্টা করুন।"
ta = "இந்த வெளியீடு இன்னும் பதிவேற்றப்படுகிறது — முடிந்த பிறகு மீண்டும் முயற்சிக்கவும்."
te = "ఈ విడుదల ఇంకా అప్‌లోడ్ అవుతోంది — పూర్తయ్యాక మళ్లీ ప్రయత్నించండి."
mr = "हे प्रकाशन अजून अपलोड होत आहे — पूर्ण झाल्यावर पुन्हा प्रयत्न करा."
ur = "یہ اشاعت ابھی اپ لوڈ ہو رہی ہے — مکمل ہونے پر دوبارہ کوشش کریں۔"
gu = "આ પ્રકાશન હજી અપલોડ થઈ રહ્યું છે — તે પૂર્ણ થાય પછી ફરી પ્રયાસ કરો."
kn = "ಈ ಬಿಡುಗಡೆ ಇನ್ನೂ ಅಪ್‌ಲೋಡ್ ಆಗುತ್ತಿದೆ — ಮುಗಿದ ನಂತರ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ."
ml = "ഈ പതിപ്പ് ഇപ്പോഴും അപ്ലോഡ് ചെയ്യുന്നു — പൂർത്തിയായാൽ വീണ്ടും ശ്രമിക്കുക."
pa = "ਇਹ ਰਿਲੀਜ਼ ਹਾਲੇ ਅੱਪਲੋਡ ਹੋ ਰਹੀ ਹੈ — ਮੁਕੰਮਲ ਹੋਣ ਤੇ ਮੁੜ ਕੋਸ਼ਿਸ਼ ਕਰੋ।"
th = "รีลีสนี้ยังกำลังอัปโหลด — ลองอีกครั้งเมื่อเสร็จ"
