nl = "Geef deze cloudgegevens toestemming om objecten in deze bucket te lezen, schrijven, weergeven en verwijderen."
hi = "इन क्लाउड क्रेडेंशियल को इस बकेट में ऑब्जेक्ट पढ़ने, लिखने, सूचीबद्ध करने और मिटाने की अनुमति दें।"
bn = "এই ক্লাউড শংসাপত্রকে এই বাকেটের অবজেক্ট পড়া, লেখা, তালিকাভুক্ত করা ও মুছে ফেলার অনুমতি দিন।"
ta = "இந்த கிளவுட் சான்றுகளுக்கு இந்த பக்கெட்டில் உள்ள பொருட்களைப் படிக்க, எழுத, பட்டியலிட மற்றும் நீக்க அனுமதி வழங்கவும்."
te = "ఈ క్లౌడ్ ఆధారాలకు ఈ బకెట్‌లోని ఆబ్జెక్టులను చదవడానికి, వ్రాయడానికి, జాబితా చేయడానికి మరియు తొలగించడానికి అనుమతి ఇవ్వండి."
mr = "या क्लाउड क्रेडेन्शियल्सना या बकेटमधील ऑब्जेक्ट वाचण्याची, लिहिण्याची, सूचीबद्ध करण्याची आणि हटवण्याची परवानगी द्या."
ur = "ان کلاؤڈ اسناد کو اس بکٹ میں آبجیکٹس پڑھنے، لکھنے، فہرست بنانے اور حذف کرنے کی اجازت دیں۔"
