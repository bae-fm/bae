bn = "সাইডের মাঝে প্লেব্যাক বিরত হয়েছে। ক্যাসেটটি উল্টে দিন, তারপর প্লে চাপুন।"
ta = "பக்கங்களுக்கு இடையில் இயக்கம் இடைநிறுத்தப்பட்டது. கேசெட்டைப் திருப்பி, பிறகு இயக்கு என்பதை அழுத்தவும்."
te = "సైడ్‌ల మధ్య ప్లేబ్యాక్ నిలిపివేయబడింది. క్యాసెట్‌ను తిప్పి, ఆపై ప్లే నొక్కండి."
mr = "बाजूंमध्ये प्लेबॅक थांबवला आहे. कॅसेट उलटी करा, मग प्ले दाबा."
ur = "سائیڈز کے درمیان پلے بیک روک دیا گیا ہے۔ کیسٹ کو پلٹیں، پھر پلے دبائیں۔"
gu = "સાઇડ વચ્ચે પ્લેબેક રોકાયું છે. કેસેટને ફેરવો, પછી પ્લે દબાવો."
kn = "ಸೈಡ್‌ಗಳ ನಡುವೆ ಪ್ಲೇಬ್ಯಾಕ್ ವಿರಾಮಗೊಂಡಿದೆ. ಕ್ಯಾಸೆಟ್ ಅನ್ನು ತಿರುಗಿಸಿ, ನಂತರ ಪ್ಲೇ ಒತ್ತಿರಿ."
ml = "സൈഡുകൾക്കിടയിൽ പ്ലേബാക്ക് നിർത്തി. കാസെറ്റ് തിരിച്ച്, തുടർന്ന് പ്ലേ അമർത്തുക."
pa = "ਸਾਈਡਾਂ ਵਿਚਕਾਰ ਪਲੇਬੈਕ ਰੁਕ ਗਿਆ ਹੈ। ਕੈਸੇਟ ਨੂੰ ਉਲਟੋ, ਫਿਰ ਪਲੇ ਦਬਾਓ।"
