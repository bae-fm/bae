uk = "Обкладинка та інші файли поруч із цими папками належали б кільком об’єднаним релізам. Розділіть усі, крім одного."
bg = "Обложката и другите файлове до тези папки биха принадлежали на повече от едно обединено издание. Разделете всички освен едно."
pl = "Okładka i inne pliki obok tych folderów należałyby do więcej niż jednego połączonego wydania. Rozdziel wszystkie oprócz jednego."
cs = "Obal a další soubory vedle těchto složek by patřily k více než jednomu spojenému vydání. Rozdělte všechna kromě jednoho."
hr = "Omot i ostale datoteke uz ove mape pripadale bi više od jednom spojenom izdanju. Razdvojite sva osim jednog."
zh-Hant = "這些資料夾旁的封面和其他檔案會屬於多個合併的發行版本。請只保留一個，拆分其餘發行版本。"
it = "La copertina e gli altri file accanto a queste cartelle apparterrebbero a più di una pubblicazione combinata. Separale tutte tranne una."
