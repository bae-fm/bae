el = "Το μπρελόκ αυτής της συσκευής είναι κλειδωμένο. Ξεκλειδώστε τη συσκευή και το bae θα συνεχίσει από εκεί που σταμάτησε."
pt-PT = "O porta-chaves deste dispositivo está bloqueado. Desbloqueie o dispositivo e o bae continua de onde ficou."
sv = "Den här enhetens nyckelring är låst. Lås upp enheten så fortsätter bae där den slutade."
da = "Denne enheds nøglering er låst. Lås enheden op, så fortsætter bae, hvor den slap."
nb = "Nøkkelringen på denne enheten er låst. Lås opp enheten, så fortsetter bae der den slapp."
