[messages."core.playback.pause.side_ended.message.vinyl".translations]
es = "La reproducción se pausó entre lados. Dale la vuelta al vinilo y pulsa Reproducir."
fr = "La lecture est en pause entre les faces. Retournez le vinyle, puis appuyez sur Lecture."
de = "Die Wiedergabe pausiert zwischen den Seiten. Drehe die Schallplatte um und drücke Wiedergabe."
