it = "Consenti a queste credenziali di leggere, scrivere, elencare ed eliminare gli oggetti in questo bucket."
tr = "Bu kimlik bilgilerinin bu bucket’taki nesneleri okumasına, yazmasına, listelemesine ve silmesine izin verin."
