[messages."core.error.changed_meanwhile"]
comment = "Why a change to the library did nothing: what it acted on changed between being read and being written. A release or album it names was deleted, a cover or artist image it replaces was replaced again, a release picked as its album's primary moved to another album, or an artist given a printed name was deleted or merged. Nothing was written; asking again acts on what now stands."
value = "What this acted on changed before it went through, so nothing changed. Try again."

[messages."core.error.changed_meanwhile".translations]
es = "Aquello sobre lo que actuaba cambió antes de completarse, así que no cambió nada. Vuelve a intentarlo."
fr = "Ce sur quoi portait cette action a changé avant qu’elle n’aboutisse, donc rien n’a changé. Réessayez."
de = "Worauf sich dies bezog, hat sich geändert, bevor es ausgeführt wurde, daher wurde nichts geändert. Versuche es erneut."
pt-BR = "O que isto afetava mudou antes de ser concluído, então nada foi alterado. Tente novamente."
ja = "対象が処理の完了前に変更されたため、何も変更されませんでした。もう一度お試しください。"
ko = "작업 대상이 완료되기 전에 바뀌어서 아무것도 변경되지 않았습니다. 다시 시도하세요."
zh-Hans = "操作对象在完成之前已更改，因此没有任何更改。请重试。"
ar = "تغيّر ما كان هذا يعمل عليه قبل أن يكتمل، لذا لم يتغيّر شيء. حاول مرة أخرى."
he = "מה שהפעולה הזאת חלה עליו השתנה לפני שהיא הושלמה, ולכן שום דבר לא השתנה. נסה שוב."
uk = "Те, чого це стосувалося, змінилося до завершення, тому нічого не змінилося. Спробуйте ще раз."
bg = "Това, върху което действаше, се промени, преди да приключи, затова нищо не се промени. Опитайте отново."
pl = "To, czego to dotyczyło, zmieniło się przed zakończeniem, więc nic się nie zmieniło. Spróbuj ponownie."
cs = "To, čeho se to týkalo, se změnilo dřív, než se to dokončilo, takže se nic nezměnilo. Zkuste to znovu."
hr = "Ono na što se ovo odnosilo promijenilo se prije nego što je dovršeno, pa ništa nije promijenjeno. Pokušajte ponovno."
zh-Hant = "操作對象在完成之前已變更，因此沒有任何變更。請再試一次。"
it = "Ciò su cui agiva è cambiato prima che fosse completato, quindi non è cambiato nulla. Riprova."
tr = "Bunun etkilediği şey işlem tamamlanmadan önce değişti, bu yüzden hiçbir şey değişmedi. Yeniden deneyin."
