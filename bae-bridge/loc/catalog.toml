[messages."core.playback.error.sync_disconnected".translations]
es = "Vuelve a conectarte para reproducir esta edición: aún no se ha descargado en este dispositivo."
fr = "Reconnectez-vous pour lire cette édition — elle n'est pas encore téléchargée sur cet appareil."
de = "Stelle die Verbindung wieder her, um diese Veröffentlichung abzuspielen — sie ist noch nicht auf dieses Gerät heruntergeladen."
pt-BR = "Reconecte-se para reproduzir esta edição — ela ainda não foi baixada neste dispositivo."
ja = "このリリースを再生するには再接続してください。まだこのデバイスにダウンロードされていません。"
ko = "이 릴리스를 재생하려면 다시 연결하세요. 아직 이 기기에 다운로드되지 않았습니다."
zh-Hans = "请重新连接以播放此发行版——它尚未下载到此设备。"
ar = "أعد الاتصال لتشغيل هذا الإصدار — لم يُنزَّل إلى هذا الجهاز بعد."
he = "התחבר מחדש כדי לנגן את ההוצאה הזו — היא עדיין לא הורדה למכשיר הזה."
uk = "Підключіться знову, щоб відтворити це видання — воно ще не завантажене на цей пристрій."
bg = "Свържете се отново, за да възпроизведете това издание — то още не е изтеглено на това устройство."
pl = "Połącz się ponownie, aby odtworzyć to wydanie — nie zostało jeszcze pobrane na to urządzenie."
cs = "Pro přehrání tohoto vydání se znovu připojte — ještě není staženo do tohoto zařízení."
hr = "Ponovno se povežite za reprodukciju ovog izdanja — još nije preuzeto na ovaj uređaj."
zh-Hant = "重新連線以播放此發行 — 尚未下載到此裝置。"
it = "Riconnettiti per riprodurre questa pubblicazione — non è ancora scaricata su questo dispositivo."
tr = "Bu yayını çalmak için yeniden bağlanın — henüz bu cihaza indirilmedi."
vi = "Kết nối lại để phát bản phát hành này — nó chưa được tải xuống thiết bị này."
nl = "Maak opnieuw verbinding om deze release af te spelen — deze is nog niet naar dit apparaat gedownload."
hi = "इस रिलीज को चलाने के लिए फिर जुड़ें — यह अभी इस उपकरण पर डाउनलोड नहीं हुई है।"
bn = "এই রিলিজ চালাতে আবার সংযোগ করুন — এটি এখনও এই ডিভাইসে ডাউনলোড হয়নি।"
ta = "இந்த வெளியீட்டை இயக்க மீண்டும் இணைக்கவும் — இது இன்னும் இந்த சாதனத்தில் பதிவிறக்கப்படவில்லை."
te = "ఈ విడుదలను ప్లే చేయడానికి మళ్లీ కనెక్ట్ చేయండి — ఇది ఇంకా ఈ పరికరానికి డౌన్‌లోడ్ కాలేదు."
mr = "हे प्रकाशन वाजवण्यासाठी पुन्हा जोडा — ते अजून या डिव्हाइसवर डाउनलोड झालेले नाही."
ur = "یہ اشاعت چلانے کے لیے دوبارہ منسلک ہوں — یہ ابھی اس آلے پر ڈاؤن لوڈ نہیں ہوئی۔"
gu = "આ પ્રકાશન વગાડવા ફરી જોડાઓ — તે હજી આ ઉપકરણ પર ડાઉનલોડ થયું નથી."
kn = "ಈ ಬಿಡುಗಡೆ ಪ್ಲೇ ಮಾಡಲು ಮರುಸಂಪರ್ಕಿಸಿ — ಇದು ಇನ್ನೂ ಈ ಸಾಧನಕ್ಕೆ ಡೌನ್‌ಲೋಡ್ ಆಗಿಲ್ಲ."
ml = "ഈ പതിപ്പ് പ്ലേ ചെയ്യാൻ വീണ്ടും ബന്ധിപ്പിക്കുക — ഇത് ഈ ഉപകരണത്തിലേക്ക് ഇതുവരെ ഡൗൺലോഡ് ചെയ്തിട്ടില്ല."
pa = "ਇਹ ਰਿਲੀਜ਼ ਚਲਾਉਣ ਲਈ ਮੁੜ ਜੁੜੋ — ਇਹ ਹਾਲੇ ਇਸ ਡਿਵਾਈਸ ਤੇ ਡਾਊਨਲੋਡ ਨਹੀਂ ਹੋਈ।"
th = "เชื่อมต่อใหม่เพื่อเล่นรีลีสนี้ — ยังไม่ได้ดาวน์โหลดลงอุปกรณ์นี้"
[messages."core.playback.error.upload_pending"]
