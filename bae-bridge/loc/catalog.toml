ar = "تحتوي هذه الحاوية وبادئة المفتاح بالفعل على مكتبة مختلفة. استخدم بادئة مفتاح فارغة، أو انضم إلى تلك المكتبة أو استعدها."
he = "המכל וקידומת המפתח האלה כבר מכילים ספרייה אחרת. השתמש בקידומת ריקה, או הצטרף לספרייה הזאת או שחזר אותה."
uk = "Це сховище та префікс ключа вже містять іншу медіатеку. Використайте порожній префікс або приєднайтеся до тієї медіатеки чи відновіть її."
bg = "Тази кофа и префикс на ключ вече съдържат друга библиотека. Използвайте празен префикс или се присъединете към нея, или я възстановете."
pl = "Ten zasobnik i prefiks klucza zawierają już inną bibliotekę. Użyj pustego prefiksu albo dołącz do tej biblioteki lub ją przywróć."
cs = "Tento bucket a předpona klíče už obsahují jinou knihovnu. Použijte prázdnou předponu nebo se k této knihovně připojte či ji obnovte."
hr = "Ovaj spremnik i prefiks ključa već sadrže drugu biblioteku. Upotrijebite prazan prefiks ili se pridružite toj biblioteci ili je obnovite."
zh-Hant = "此儲存桶和金鑰前置字串已包含另一個資料庫。請使用空的金鑰前置字串，或加入或還原該資料庫。"
it = "Questo bucket e prefisso della chiave contengono già un’altra libreria. Usa un prefisso vuoto oppure unisciti a quella libreria o ripristinala."
tr = "Bu bucket ve anahtar öneki zaten farklı bir arşiv içeriyor. Boş bir anahtar öneki kullanın ya da o arşive katılın veya onu geri yükleyin."
vi = "Bộ chứa và tiền tố khóa này đã có một thư viện khác. Hãy dùng tiền tố khóa trống, hoặc tham gia hay khôi phục thư viện đó."
nl = "Deze bucket en dit sleutelvoorvoegsel bevatten al een andere bibliotheek. Gebruik een leeg voorvoegsel, of neem deel aan die bibliotheek of herstel deze."
hi = "इस बकेट और कुंजी प्रीफ़िक्स में पहले से दूसरी लाइब्रेरी है। खाली कुंजी प्रीफ़िक्स का उपयोग करें, या उस लाइब्रेरी से जुड़ें या उसे बहाल करें।"
bn = "এই বাকেট এবং কী প্রিফিক্সে ইতিমধ্যে অন্য একটি লাইব্রেরি রয়েছে। খালি কী প্রিফিক্স ব্যবহার করুন, অথবা সেই লাইব্রেরিতে যোগ দিন বা সেটি পুনরুদ্ধার করুন।"
ta = "இந்த பக்கெட்டிலும் விசை முன்னொட்டிலும் ஏற்கனவே வேறு நூலகம் உள்ளது. காலியான விசை முன்னொட்டைப் பயன்படுத்தவும் அல்லது அந்த நூலகத்தில் சேரவும் அல்லது அதை மீட்டெடுக்கவும்."
te = "ఈ బకెట్ మరియు కీ ప్రిఫిక్స్‌లో ఇప్పటికే వేరే లైబ్రరీ ఉంది. ఖాళీ కీ ప్రిఫిక్స్‌ను ఉపయోగించండి లేదా ఆ లైబ్రరీలో చేరండి లేదా దాన్ని పునరుద్ధరించండి."
mr = "या बकेट आणि की प्रीफिक्समध्ये आधीच दुसरी लायब्ररी आहे. रिकामा की प्रीफिक्स वापरा किंवा त्या लायब्ररीत सामील व्हा किंवा ती पुनर्संचयित करा."
ur = "اس بکٹ اور کلید کے سابقے میں پہلے سے دوسری لائبریری موجود ہے۔ خالی کلید کا سابقہ استعمال کریں، یا اس لائبریری میں شامل ہوں یا اسے بحال کریں۔"
gu = "આ બકેટ અને કી પ્રિફિક્સમાં પહેલેથી બીજી લાઇબ્રેરી છે. ખાલી કી પ્રિફિક્સ વાપરો અથવા તે લાઇબ્રેરીમાં જોડાઓ અથવા તેને પુનઃસ્થાપિત કરો."
kn = "ಈ ಬಕೆಟ್ ಮತ್ತು ಕೀ ಪ್ರಿಫಿಕ್ಸ್‌ನಲ್ಲಿ ಈಗಾಗಲೇ ಬೇರೆ ಲೈಬ್ರರಿ ಇದೆ. ಖಾಲಿ ಕೀ ಪ್ರಿಫಿಕ್ಸ್ ಬಳಸಿ ಅಥವಾ ಆ ಲೈಬ್ರರಿಗೆ ಸೇರಿ ಅಥವಾ ಅದನ್ನು ಮರುಸ್ಥಾಪಿಸಿ."
ml = "ഈ ബക്കറ്റിലും കീ പ്രിഫിക്സിലും ഇതിനകം മറ്റൊരു ലൈബ്രറിയുണ്ട്. ഒഴിഞ്ഞ കീ പ്രിഫിക്സ് ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ആ ലൈബ്രറിയിൽ ചേരുകയോ അത് പുനഃസ്ഥാപിക്കുകയോ ചെയ്യുക."
pa = "ਇਸ ਬਕੇਟ ਅਤੇ ਕੁੰਜੀ ਅਗੇਤਰ ਵਿੱਚ ਪਹਿਲਾਂ ਹੀ ਹੋਰ ਲਾਇਬ੍ਰੇਰੀ ਹੈ। ਖਾਲੀ ਕੁੰਜੀ ਅਗੇਤਰ ਵਰਤੋ ਜਾਂ ਉਸ ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ ਸ਼ਾਮਲ ਹੋਵੋ ਜਾਂ ਉਸਨੂੰ ਮੁੜ-ਬਹਾਲ ਕਰੋ।"
th = "บักเก็ตและคำนำหน้าคีย์นี้มีคลังอื่นอยู่แล้ว ใช้คำนำหน้าคีย์ที่ว่าง หรือเข้าร่วมหรือกู้คืนคลังนั้น"

[messages."core.error.identity_missing"]
comment = "The local library has no established device identity and cannot participate in sync."
value = "This library has no device identity. Create, join, or restore the library again."

[messages."core.error.identity_missing".translations]
es = "Esta biblioteca no tiene identidad de dispositivo. Vuelve a crearla, unirte a ella o restaurarla."
fr = "Cette bibliothèque n’a pas d’identité d’appareil. Créez-la, rejoignez-la ou restaurez-la de nouveau."
de = "Diese Mediathek hat keine Geräteidentität. Erstelle sie neu, tritt ihr erneut bei oder stelle sie wieder her."
pt-BR = "Esta biblioteca não tem uma identidade de dispositivo. Crie-a, entre nela ou restaure-a novamente."
ja = "このライブラリにはデバイスIDがありません。ライブラリを作成、参加、または復元し直してください。"
ko = "이 라이브러리에 기기 ID가 없습니다. 라이브러리를 다시 생성하거나 참여 또는 복원하세요."
zh-Hans = "此资料库没有设备身份。请重新创建、加入或恢复该资料库。"
ar = "لا تحتوي هذه المكتبة على هوية جهاز. أنشئ المكتبة أو انضم إليها أو استعدها من جديد."
he = "לספרייה הזאת אין זהות מכשיר. צור אותה, הצטרף אליה או שחזר אותה מחדש."
uk = "Ця медіатека не має ідентифікатора пристрою. Створіть її, приєднайтеся до неї або відновіть її знову."
bg = "Тази библиотека няма идентичност на устройство. Създайте я, присъединете се към нея или я възстановете отново."
pl = "Ta biblioteka nie ma tożsamości urządzenia. Utwórz ją, dołącz do niej lub przywróć ją ponownie."
cs = "Tato knihovna nemá identitu zařízení. Znovu ji vytvořte, připojte se k ní nebo ji obnovte."
hr = "Ova biblioteka nema identitet uređaja. Ponovno je stvorite, pridružite joj se ili je obnovite."
zh-Hant = "此資料庫沒有裝置身分。請重新建立、加入或還原該資料庫。"
it = "Questa libreria non ha un’identità del dispositivo. Creala, accedi o ripristinala di nuovo."
tr = "Bu arşivin cihaz kimliği yok. Arşivi yeniden oluşturun, arşive katılın veya arşivi geri yükleyin."
vi = "Thư viện này không có danh tính thiết bị. Hãy tạo, tham gia hoặc khôi phục lại thư viện."
nl = "Deze bibliotheek heeft geen apparaatidentiteit. Maak de bibliotheek opnieuw, neem er opnieuw aan deel of herstel deze."
hi = "इस लाइब्रेरी की कोई डिवाइस पहचान नहीं है। लाइब्रेरी को फिर से बनाएँ, उससे जुड़ें या उसे बहाल करें।"
bn = "এই লাইব্রেরির কোনো ডিভাইস পরিচয় নেই। লাইব্রেরিটি আবার তৈরি করুন, এতে যোগ দিন বা এটি পুনরুদ্ধার করুন।"
ta = "இந்த நூலகத்திற்கு சாதன அடையாளம் இல்லை. நூலகத்தை மீண்டும் உருவாக்கவும், அதில் சேரவும் அல்லது அதை மீட்டெடுக்கவும்."
te = "ఈ లైబ్రరీకి పరికర గుర్తింపు లేదు. లైబ్రరీని మళ్లీ సృష్టించండి, దానిలో చేరండి లేదా దాన్ని పునరుద్ధరించండి."
mr = "या लायब्ररीला डिव्हाइस ओळख नाही. लायब्ररी पुन्हा तयार करा, तिच्यात सामील व्हा किंवा ती पुनर्संचयित करा."
ur = "اس لائبریری کی کوئی آلہ شناخت نہیں ہے۔ لائبریری کو دوبارہ بنائیں، اس میں شامل ہوں یا اسے بحال کریں۔"
gu = "આ લાઇબ્રેરી પાસે ઉપકરણ ઓળખ નથી. લાઇબ્રેરીને ફરી બનાવો, તેમાં જોડાઓ અથવા તેને પુનઃસ્થાપિત કરો."
kn = "ಈ ಲೈಬ್ರರಿಗೆ ಸಾಧನ ಗುರುತು ಇಲ್ಲ. ಲೈಬ್ರರಿಯನ್ನು ಮತ್ತೆ ರಚಿಸಿ, ಅದಕ್ಕೆ ಸೇರಿ ಅಥವಾ ಅದನ್ನು ಮರುಸ್ಥಾಪಿಸಿ."
ml = "ഈ ലൈബ്രറിക്ക് ഉപകരണ ഐഡന്റിറ്റി ഇല്ല. ലൈബ്രറി വീണ്ടും സൃഷ്ടിക്കുകയോ അതിൽ ചേരുകയോ പുനഃസ്ഥാപിക്കുകയോ ചെയ്യുക."
pa = "ਇਸ ਲਾਇਬ੍ਰੇਰੀ ਦੀ ਕੋਈ ਡੀਵਾਈਸ ਪਛਾਣ ਨਹੀਂ ਹੈ। ਲਾਇਬ੍ਰੇਰੀ ਨੂੰ ਮੁੜ ਬਣਾਓ, ਇਸ ਵਿੱਚ ਸ਼ਾਮਲ ਹੋਵੋ ਜਾਂ ਇਸਨੂੰ ਮੁੜ-ਬਹਾਲ ਕਰੋ।"
th = "คลังนี้ไม่มีข้อมูลประจำตัวของอุปกรณ์ โปรดสร้าง เข้าร่วม หรือกู้คืนคลังอีกครั้ง"

[messages."core.error.category.credentials"]
comment = "Generic error line: the cloud provider rejected the credentials or the setup is misconfigured."
value = "Check your cloud credentials and try again."

[messages."core.error.category.credentials".translations]
es = "Comprueba tus credenciales de la nube e inténtalo de nuevo."
fr = "Vérifiez vos identifiants cloud et réessayez."
de = "Überprüfe deine Cloud-Zugangsdaten und versuche es erneut."
pt-BR = "Verifique suas credenciais da nuvem e tente novamente."
ja = "クラウドの認証情報を確認して、もう一度お試しください。"
ko = "클라우드 자격 증명을 확인하고 다시 시도해 주세요."
zh-Hans = "请检查你的云凭据后重试。"
ar = "تحقّق من بيانات اعتماد التخزين السحابي وحاول مرة أخرى."
he = "בדוק את פרטי הגישה לענן ונסה שוב."
uk = "Перевірте облікові дані хмари та повторіть спробу."
bg = "Проверете идентификационните си данни за облака и опитайте отново."
pl = "Sprawdź swoje dane logowania do chmury i spróbuj ponownie."
cs = "Zkontrolujte přihlašovací údaje ke cloudu a zkuste to znovu."
hr = "Provjerite svoje vjerodajnice za oblak i pokušajte ponovno."
zh-Hant = "請檢查你的雲端憑證後重試。"
it = "Controlla le tue credenziali del cloud e riprova."
tr = "Bulut kimlik bilgilerinizi kontrol edip yeniden deneyin."
vi = "Hãy kiểm tra thông tin đăng nhập đám mây và thử lại."
nl = "Controleer je cloudgegevens en probeer het opnieuw."
hi = "अपने क्लाउड क्रेडेंशियल जाँचें और फिर से प्रयास करें।"
bn = "আপনার ক্লাউড শংসাপত্র যাচাই করে আবার চেষ্টা করুন।"
ta = "உங்கள் கிளவுட் அனுமதிச் சான்றுகளைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்."
te = "మీ క్లౌడ్ ఆధారాలను తనిఖీ చేసి మళ్లీ ప్రయత్నించండి."
mr = "तुमची क्लाउड क्रेडेन्शियल्स तपासा आणि पुन्हा प्रयत्न करा."
ur = "اپنی کلاؤڈ اسناد چیک کریں اور دوبارہ کوشش کریں۔"
gu = "તમારી ક્લાઉડ ઓળખપત્રો તપાસો અને ફરી પ્રયાસ કરો."
kn = "ನಿಮ್ಮ ಕ್ಲೌಡ್ ರುಜುವಾತುಗಳನ್ನು ಪರಿಶೀಲಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ."
ml = "നിങ്ങളുടെ ക്ലൗഡ് ക്രെഡൻഷ്യലുകൾ പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക."
pa = "ਆਪਣੇ ਕਲਾਊਡ ਪ੍ਰਮਾਣ ਪੱਤਰ ਜਾਂਚੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।"
th = "ตรวจสอบข้อมูลรับรองระบบคลาวด์ของคุณแล้วลองอีกครั้ง"

[messages."core.error.category.network"]
comment = "Generic error line: the cloud backend or the network to it was unreachable."
value = "Couldn't reach the cloud. Check your connection and try again."

[messages."core.error.category.network".translations]
es = "No se pudo conectar con la nube. Comprueba tu conexión e inténtalo de nuevo."
fr = "Impossible de joindre le cloud. Vérifiez votre connexion et réessayez."
de = "Die Cloud ist nicht erreichbar. Überprüfe deine Verbindung und versuche es erneut."
pt-BR = "Não foi possível conectar à nuvem. Verifique sua conexão e tente novamente."
ja = "クラウドに接続できませんでした。接続を確認して、もう一度お試しください。"
ko = "클라우드에 연결할 수 없습니다. 연결 상태를 확인하고 다시 시도해 주세요."
zh-Hans = "无法连接到云端。请检查你的网络后重试。"
ar = "تعذّر الوصول إلى التخزين السحابي. تحقّق من اتصالك وحاول مرة أخرى."
he = "לא ניתן היה להתחבר לענן. בדוק את החיבור ונסה שוב."
uk = "Не вдалося зʼєднатися з хмарою. Перевірте підключення та повторіть спробу."
bg = "Връзката с облака е неуспешна. Проверете връзката си и опитайте отново."
pl = "Nie można połączyć się z chmurą. Sprawdź połączenie i spróbuj ponownie."
cs = "Ke cloudu se nepodařilo připojit. Zkontrolujte připojení a zkuste to znovu."
hr = "Nije moguće doći do oblaka. Provjerite vezu i pokušajte ponovno."
zh-Hant = "無法連線到雲端。請檢查你的連線後重試。"
it = "Impossibile raggiungere il cloud. Controlla la connessione e riprova."
tr = "Buluta ulaşılamadı. Bağlantınızı kontrol edip yeniden deneyin."
vi = "Không thể kết nối tới đám mây. Hãy kiểm tra kết nối và thử lại."
nl = "Kan de cloud niet bereiken. Controleer je verbinding en probeer het opnieuw."
hi = "क्लाउड तक नहीं पहुँच सके। अपना कनेक्शन जाँचें और फिर से प्रयास करें।"
bn = "ক্লাউডে পৌঁছানো যায়নি। আপনার সংযোগ যাচাই করে আবার চেষ্টা করুন।"
ta = "கிளவுட்டை அணுக முடியவில்லை. உங்கள் இணைப்பைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்."
te = "క్లౌడ్‌ను చేరుకోలేకపోయాం. మీ కనెక్షన్‌ను తనిఖీ చేసి మళ్లీ ప్రయత్నించండి."
mr = "क्लाउडपर्यंत पोहोचता आले नाही. तुमचे कनेक्शन तपासा आणि पुन्हा प्रयत्न करा."
ur = "کلاؤڈ تک رسائی نہیں ہو سکی۔ اپنا کنکشن چیک کریں اور دوبارہ کوشش کریں۔"
gu = "ક્લાઉડ સુધી પહોંચી શકાયું નહીં. તમારું કનેક્શન તપાસો અને ફરી પ્રયાસ કરો."
kn = "ಕ್ಲೌಡ್ ತಲುಪಲಾಗಲಿಲ್ಲ. ನಿಮ್ಮ ಸಂಪರ್ಕವನ್ನು ಪರಿಶೀಲಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ."
ml = "ക്ലൗഡിലേക്ക് എത്താനായില്ല. നിങ്ങളുടെ കണക്ഷൻ പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക."
pa = "ਕਲਾਊਡ ਤੱਕ ਨਹੀਂ ਪਹੁੰਚ ਸਕੇ। ਆਪਣਾ ਕਨੈਕਸ਼ਨ ਜਾਂਚੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।"
th = "เชื่อมต่อระบบคลาวด์ไม่ได้ ตรวจสอบการเชื่อมต่อของคุณแล้วลองอีกครั้ง"

[messages."core.error.category.keyring"]
comment = "Generic error line: the OS keyring (secure credential store) couldn't be read or written."
value = "Couldn't access your device's secure storage."

[messages."core.error.category.keyring".translations]
es = "No se pudo acceder al almacenamiento seguro de tu dispositivo."
fr = "Impossible d'accéder au stockage sécurisé de votre appareil."
de = "Auf den sicheren Speicher deines Geräts konnte nicht zugegriffen werden."
pt-BR = "Não foi possível acessar o armazenamento seguro do seu dispositivo."
ja = "デバイスの安全なストレージにアクセスできませんでした。"
ko = "기기의 보안 저장소에 접근할 수 없습니다."
zh-Hans = "无法访问你设备的安全存储。"
ar = "تعذّر الوصول إلى التخزين الآمن لجهازك."
he = "לא ניתן היה לגשת לאחסון המאובטח של המכשיר שלך."
uk = "Не вдалося отримати доступ до захищеного сховища пристрою."
bg = "Достъпът до защитеното хранилище на устройството ви е неуспешен."
pl = "Nie można uzyskać dostępu do bezpiecznego magazynu urządzenia."
cs = "K zabezpečenému úložišti zařízení se nepodařilo přistoupit."
hr = "Nije moguće pristupiti sigurnoj pohrani vašeg uređaja."
zh-Hant = "無法存取你裝置的安全儲存空間。"
it = "Impossibile accedere all'archivio sicuro del dispositivo."
tr = "Cihazınızın güvenli depolamasına erişilemedi."
vi = "Không thể truy cập bộ nhớ bảo mật của thiết bị."
nl = "Kan geen toegang krijgen tot de beveiligde opslag van je apparaat."
hi = "आपके डिवाइस के सुरक्षित संग्रहण तक नहीं पहुँच सके।"
bn = "আপনার ডিভাইসের সুরক্ষিত স্টোরেজে প্রবেশ করা যায়নি।"
ta = "உங்கள் சாதனத்தின் பாதுகாப்பான சேமிப்பகத்தை அணுக முடியவில்லை."
te = "మీ పరికరం సురక్షిత నిల్వను యాక్సెస్ చేయలేకపోయాం."
mr = "तुमच्या डिव्हाइसच्या सुरक्षित संचयनात प्रवेश करता आला नाही."
ur = "آپ کے آلے کے محفوظ اسٹوریج تک رسائی نہیں ہو سکی۔"
gu = "તમારા ઉપકરણના સુરક્ષિત સ્ટોરેજને ઍક્સેસ કરી શકાયું નહીં."
kn = "ನಿಮ್ಮ ಸಾಧನದ ಸುರಕ್ಷಿತ ಸಂಗ್ರಹಣೆಯನ್ನು ಪ್ರವೇಶಿಸಲಾಗಲಿಲ್ಲ."
ml = "നിങ്ങളുടെ ഉപകരണത്തിന്റെ സുരക്ഷിത സംഭരണം ആക്‌സസ് ചെയ്യാനായില്ല."
pa = "ਤੁਹਾਡੇ ਡੀਵਾਈਸ ਦੇ ਸੁਰੱਖਿਅਤ ਸਟੋਰੇਜ ਤੱਕ ਪਹੁੰਚ ਨਹੀਂ ਹੋ ਸਕੀ।"
th = "เข้าถึงที่จัดเก็บข้อมูลที่ปลอดภัยของอุปกรณ์ไม่ได้"

[messages."core.error.category.airplay_unsupported"]
comment = "Error line shown in the device picker when an AirPlay receiver can't be driven — it demands a PIN, or offers only audio encryption the sender doesn't implement."
value = "This AirPlay receiver isn't supported."

[messages."core.error.join.expired"]
comment = "The device-pairing join ended because the pairing code passed its deadline; a retry needs a fresh code."
value = "This pairing code expired. Show a new code on the other device and try again."

[messages."core.error.join.expired".translations]
es = "Este código de emparejamiento caducó. Muestra un código nuevo en el otro dispositivo e inténtalo de nuevo."
fr = "Ce code d’association a expiré. Affichez un nouveau code sur l’autre appareil, puis réessayez."
de = "Dieser Kopplungscode ist abgelaufen. Zeige auf dem anderen Gerät einen neuen Code an und versuche es erneut."
pt-BR = "Este código de pareamento expirou. Mostre um novo código no outro dispositivo e tente novamente."
ja = "このペアリングコードは期限切れです。もう一方のデバイスで新しいコードを表示して、もう一度お試しください。"
ko = "이 페어링 코드가 만료되었습니다. 다른 기기에서 새 코드를 표시한 다음 다시 시도하세요."
zh-Hans = "此配对码已过期。请在另一台设备上显示新的配对码后重试。"
ar = "انتهت صلاحية رمز الاقتران هذا. اعرض رمزًا جديدًا على الجهاز الآخر ثم أعد المحاولة."
he = "קוד הצימוד הזה פג. הצג קוד חדש במכשיר האחר ונסה שוב."
uk = "Цей код сполучення застарів. Покажіть новий код на іншому пристрої та повторіть спробу."
bg = "Този код за сдвояване изтече. Покажете нов код на другото устройство и опитайте отново."
pl = "Ten kod parowania wygasł. Wyświetl nowy kod na drugim urządzeniu i spróbuj ponownie."
cs = "Tento párovací kód vypršel. Zobrazte na druhém zařízení nový kód a zkuste to znovu."
hr = "Ovaj kod za uparivanje je istekao. Prikažite novi kod na drugom uređaju i pokušajte ponovno."
zh-Hant = "此配對碼已過期。請在另一台裝置上顯示新的配對碼後再試一次。"
it = "Questo codice di abbinamento è scaduto. Mostra un nuovo codice sull’altro dispositivo e riprova."
tr = "Bu eşleştirme kodunun süresi doldu. Diğer aygıtta yeni bir kod gösterip yeniden deneyin."
vi = "Mã ghép đôi này đã hết hạn. Hãy hiện mã mới trên thiết bị kia rồi thử lại."
nl = "Deze koppelingscode is verlopen. Toon een nieuwe code op het andere apparaat en probeer het opnieuw."
hi = "यह पेयरिंग कोड समाप्त हो गया। दूसरे डिवाइस पर नया कोड दिखाएं और दोबारा कोशिश करें।"
bn = "এই পেয়ারিং কোডের মেয়াদ শেষ হয়েছে। অন্য ডিভাইসে নতুন কোড দেখিয়ে আবার চেষ্টা করুন।"
ta = "இந்த இணைத்தல் குறியீடு காலாவதியானது. மற்ற சாதனத்தில் புதிய குறியீட்டைக் காட்டி மீண்டும் முயற்சிக்கவும்."
te = "ఈ జత చేసే కోడ్ గడువు ముగిసింది. మరో పరికరంలో కొత్త కోడ్‌ను చూపి మళ్లీ ప్రయత్నించండి."
mr = "हा पेअरिंग संकेत कालबाह्य झाला. दुसऱ्या डिव्हाइसवर नवीन संकेत दाखवा आणि पुन्हा प्रयत्न करा."
ur = "اس جوڑی بنانے کے رمز کی میعاد ختم ہو گئی۔ دوسرے آلے پر نیا رمز دکھائیں اور دوبارہ کوشش کریں۔"
gu = "આ પેરિંગ કોડની મુદત પૂરી થઈ. બીજા ઉપકરણ પર નવો કોડ બતાવો અને ફરી પ્રયાસ કરો."
kn = "ಈ ಜೋಡಣೆ ಕೋಡ್ ಅವಧಿ ಮುಗಿದಿದೆ. ಇನ್ನೊಂದು ಸಾಧನದಲ್ಲಿ ಹೊಸ ಕೋಡ್ ತೋರಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ."
ml = "ഈ പെയറിംഗ് കോഡിന്റെ കാലാവധി കഴിഞ്ഞു. മറ്റേ ഉപകരണത്തിൽ പുതിയ കോഡ് കാണിച്ച് വീണ്ടും ശ്രമിക്കുക."
pa = "ਇਸ ਪੇਅਰਿੰਗ ਕੋਡ ਦੀ ਮਿਆਦ ਪੁੱਗ ਗਈ। ਦੂਜੇ ਡਿਵਾਈਸ ਉੱਤੇ ਨਵਾਂ ਕੋਡ ਦਿਖਾਓ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।"
th = "รหัสจับคู่นี้หมดอายุแล้ว แสดงรหัสใหม่บนอุปกรณ์อีกเครื่องแล้วลองอีกครั้ง"

[messages."core.error.join.owner_offline"]
comment = "The device-pairing join ended because the inviting device never took its next step; both devices must run the join at once."
value = "The other device isn't running this join. Open bae on it, show a pairing code, and try again."

[messages."core.error.join.owner_offline".translations]
es = "El otro dispositivo no está ejecutando este emparejamiento. Abre bae en él, muestra un código y vuelve a intentarlo."
fr = "L’autre appareil n’exécute pas cette association. Ouvrez bae dessus, affichez un code, puis réessayez."
de = "Das andere Gerät führt diese Kopplung nicht aus. Öffne bae dort, zeige einen Code an und versuche es erneut."
pt-BR = "O outro dispositivo não está executando este pareamento. Abra o bae nele, mostre um código e tente novamente."
ja = "もう一方のデバイスでこのペアリングが実行されていません。そちらでbaeを開き、ペアリングコードを表示してから、もう一度お試しください。"
ko = "다른 기기에서 이 페어링이 실행되고 있지 않습니다. 그 기기에서 bae를 열고 페어링 코드를 표시한 다음 다시 시도하세요."
zh-Hans = "另一台设备未在进行此配对。请在该设备上打开 bae 并显示配对码后重试。"
ar = "الجهاز الآخر لا يشغّل هذا الاقتران. افتح bae عليه واعرض رمز اقتران ثم أعد المحاولة."
he = "המכשיר האחר לא מריץ את הצימוד הזה. פתח בו את bae, הצג קוד צימוד ונסה שוב."
uk = "Інший пристрій не виконує це сполучення. Відкрийте на ньому bae, покажіть код і повторіть спробу."
bg = "Другото устройство не изпълнява това сдвояване. Отворете bae на него, покажете код и опитайте отново."
pl = "Drugie urządzenie nie prowadzi tego parowania. Otwórz na nim bae, wyświetl kod i spróbuj ponownie."
cs = "Druhé zařízení toto párování neprovádí. Otevřete na něm bae, zobrazte kód a zkuste to znovu."
hr = "Drugi uređaj ne izvodi ovo uparivanje. Otvorite bae na njemu, prikažite kod i pokušajte ponovno."
zh-Hant = "另一台裝置未在進行此配對。請在該裝置上開啟 bae 並顯示配對碼後再試一次。"
it = "L’altro dispositivo non sta eseguendo questo abbinamento. Apri bae su di esso, mostra un codice e riprova."
tr = "Diğer aygıt bu eşleştirmeyi yürütmüyor. Orada bae’yi açın, bir eşleştirme kodu gösterip yeniden deneyin."
vi = "Thiết bị kia không đang chạy phiên ghép đôi này. Hãy mở bae trên đó, hiện mã ghép đôi rồi thử lại."
nl = "Het andere apparaat voert deze koppeling niet uit. Open bae daarop, toon een koppelingscode en probeer het opnieuw."
hi = "दूसरा डिवाइस यह पेयरिंग नहीं चला रहा। उस पर bae खोलें, पेयरिंग कोड दिखाएं और दोबारा कोशिश करें।"
bn = "অন্য ডিভাইসটি এই পেয়ারিং চালাচ্ছে না। সেখানে bae খুলে পেয়ারিং কোড দেখিয়ে আবার চেষ্টা করুন।"
ta = "மற்ற சாதனம் இந்த இணைத்தலை இயக்கவில்லை. அதில் bae-ஐத் திறந்து, இணைத்தல் குறியீட்டைக் காட்டி மீண்டும் முயற்சிக்கவும்."
te = "మరో పరికరం ఈ జత చేయడాన్ని అమలు చేయడం లేదు. దానిలో baeని తెరిచి, జత చేసే కోడ్‌ను చూపి మళ్లీ ప్రయత్నించండి."
mr = "दुसरे डिव्हाइस हे पेअरिंग चालवत नाही. त्यावर bae उघडा, पेअरिंग संकेत दाखवा आणि पुन्हा प्रयत्न करा."
ur = "دوسرا آلہ یہ جوڑی بنانا نہیں چلا رہا۔ اس پر bae کھولیں، جوڑی بنانے کا رمز دکھائیں اور دوبارہ کوشش کریں۔"
gu = "બીજું ઉપકરણ આ પેરિંગ ચલાવતું નથી. તેના પર bae ખોલો, પેરિંગ કોડ બતાવો અને ફરી પ્રયાસ કરો."
kn = "ಇನ್ನೊಂದು ಸಾಧನ ಈ ಜೋಡಣೆಯನ್ನು ನಡೆಸುತ್ತಿಲ್ಲ. ಅದರಲ್ಲಿ bae ತೆರೆದು, ಜೋಡಣೆ ಕೋಡ್ ತೋರಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ."
ml = "മറ്റേ ഉപകരണം ഈ പെയറിംഗ് നടത്തുന്നില്ല. അതിൽ bae തുറന്ന്, പെയറിംഗ് കോഡ് കാണിച്ച് വീണ്ടും ശ്രമിക്കുക."
pa = "ਦੂਜਾ ਡਿਵਾਈਸ ਇਹ ਪੇਅਰਿੰਗ ਨਹੀਂ ਚਲਾ ਰਿਹਾ। ਉਸ ਉੱਤੇ bae ਖੋਲ੍ਹੋ, ਪੇਅਰਿੰਗ ਕੋਡ ਦਿਖਾਓ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।"
th = "อุปกรณ์อีกเครื่องไม่ได้กำลังทำการจับคู่นี้ เปิด bae บนเครื่องนั้น แสดงรหัสจับคู่ แล้วลองอีกครั้ง"

[messages."core.error.join.owner_ended"]
comment = "The device-pairing join ended because the inviting device withdrew the attempt."
value = "The other device ended this pairing. Start it again from there if you still want to join."

[messages."core.error.join.owner_ended".translations]
es = "El otro dispositivo finalizó este emparejamiento. Vuelve a iniciarlo desde allí si aún quieres unirte."
fr = "L’autre appareil a mis fin à cette association. Relancez-la depuis celui-ci si vous voulez toujours rejoindre."
de = "Das andere Gerät hat diese Kopplung beendet. Starte sie dort erneut, wenn du noch beitreten willst."
pt-BR = "O outro dispositivo encerrou este pareamento. Inicie-o novamente por lá se ainda quiser entrar."
ja = "もう一方のデバイスがこのペアリングを終了しました。参加を続けるなら、そちらからやり直してください。"
ko = "다른 기기가 이 페어링을 종료했습니다. 계속 참여하려면 그 기기에서 다시 시작하세요."
zh-Hans = "另一台设备结束了此配对。若仍要加入，请从该设备重新开始。"
ar = "أنهى الجهاز الآخر هذا الاقتران. ابدأه من هناك مرة أخرى إذا كنت لا تزال تريد الانضمام."
he = "המכשיר האחר סיים את הצימוד הזה. התחל אותו שוב משם אם אתה עדיין רוצה להצטרף."
uk = "Інший пристрій завершив це сполучення. Почніть його звідти знову, якщо ще хочете приєднатися."
bg = "Другото устройство прекрати това сдвояване. Започнете го отново оттам, ако още искате да се присъедините."
pl = "Drugie urządzenie zakończyło to parowanie. Rozpocznij je tam ponownie, jeśli nadal chcesz dołączyć."
cs = "Druhé zařízení toto párování ukončilo. Pokud se stále chcete připojit, spusťte ho tam znovu."
hr = "Drugi uređaj je završio ovo uparivanje. Pokrenite ga ondje ponovno ako se i dalje želite pridružiti."
zh-Hant = "另一台裝置結束了此配對。若仍要加入，請從該裝置重新開始。"
it = "L’altro dispositivo ha terminato questo abbinamento. Riavvialo da lì se vuoi ancora unirti."
tr = "Diğer aygıt bu eşleştirmeyi sonlandırdı. Hâlâ katılmak istiyorsanız oradan yeniden başlatın."
vi = "Thiết bị kia đã kết thúc phiên ghép đôi này. Hãy bắt đầu lại từ đó nếu bạn vẫn muốn tham gia."
nl = "Het andere apparaat heeft deze koppeling beëindigd. Start hem daar opnieuw als je nog wilt deelnemen."
hi = "दूसरे डिवाइस ने यह पेयरिंग समाप्त कर दी। अगर आप अब भी जुड़ना चाहते हैं तो इसे वहीं से दोबारा शुरू करें।"
bn = "অন্য ডিভাইসটি এই পেয়ারিং শেষ করেছে। এখনও যোগ দিতে চাইলে সেখান থেকে আবার শুরু করুন।"
ta = "மற்ற சாதனம் இந்த இணைத்தலை முடித்தது. இன்னும் இணைய விரும்பினால், அங்கிருந்து மீண்டும் தொடங்கவும்."
te = "మరో పరికరం ఈ జత చేయడాన్ని ముగించింది. ఇంకా చేరాలనుకుంటే అక్కడి నుంచి మళ్లీ ప్రారంభించండి."
mr = "दुसऱ्या डिव्हाइसने हे पेअरिंग संपवले. तुम्हाला अजूनही सामील व्हायचे असल्यास ते तिथून पुन्हा सुरू करा."
ur = "دوسرے آلے نے یہ جوڑی بنانا ختم کر دیا۔ اگر آپ اب بھی شامل ہونا چاہتے ہیں تو وہاں سے دوبارہ شروع کریں۔"
gu = "બીજા ઉપકરણે આ પેરિંગ સમાપ્ત કર્યું. જો તમે હજી જોડાવા માંગતા હો, તો ત્યાંથી ફરી શરૂ કરો."
kn = "ಇನ್ನೊಂದು ಸಾಧನ ಈ ಜೋಡಣೆಯನ್ನು ಕೊನೆಗೊಳಿಸಿತು. ಇನ್ನೂ ಸೇರಬೇಕಿದ್ದರೆ ಅಲ್ಲಿಂದ ಮತ್ತೆ ಪ್ರಾರಂಭಿಸಿ."
ml = "മറ്റേ ഉപകരണം ഈ പെയറിംഗ് അവസാനിപ്പിച്ചു. ഇനിയും ചേരണമെങ്കിൽ അവിടെ നിന്ന് വീണ്ടും ആരംഭിക്കുക."
pa = "ਦੂਜੇ ਡਿਵਾਈਸ ਨੇ ਇਹ ਪੇਅਰਿੰਗ ਖ਼ਤਮ ਕਰ ਦਿੱਤੀ। ਜੇ ਤੁਸੀਂ ਹਾਲੇ ਵੀ ਸ਼ਾਮਲ ਹੋਣਾ ਚਾਹੁੰਦੇ ਹੋ ਤਾਂ ਉੱਥੋਂ ਦੁਬਾਰਾ ਸ਼ੁਰੂ ਕਰੋ।"
th = "อุปกรณ์อีกเครื่องยุติการจับคู่นี้แล้ว หากยังต้องการเข้าร่วม ให้เริ่มใหม่จากเครื่องนั้น"

[messages."core.error.keyring.locked"]
comment = "The OS keychain refused the read because the session is locked or the display is asleep; the key is present and the read succeeds again after unlock."
value = "This device's keychain is locked. Unlock the device and bae will pick up where it left off."

[messages."core.error.keyring.locked".translations]
es = "El llavero de este dispositivo está bloqueado. Desbloquea el dispositivo y bae continuará donde lo dejó."
fr = "Le trousseau de cet appareil est verrouillé. Déverrouillez l’appareil et bae reprendra où il s’est arrêté."
de = "Der Schlüsselbund dieses Geräts ist gesperrt. Entsperre das Gerät, und bae macht dort weiter, wo es aufgehört hat."
pt-BR = "As chaves deste dispositivo estão bloqueadas. Desbloqueie o dispositivo e o bae continuará de onde parou."
ja = "このデバイスのキーチェーンがロックされています。デバイスのロックを解除すると、baeは中断したところから再開します。"
ko = "이 기기의 키체인이 잠겨 있습니다. 기기를 잠금 해제하면 bae가 중단된 지점부터 이어서 진행합니다."
zh-Hans = "此设备的钥匙串已锁定。解锁设备后，bae 会从中断处继续。"
ar = "سلسلة مفاتيح هذا الجهاز مقفلة. ألغِ قفل الجهاز وسيتابع bae من حيث توقف."
he = "מחזיק המפתחות של המכשיר הזה נעול. שחרר את נעילת המכשיר ו-bae ימשיך מהנקודה שבה עצר."
uk = "В’язку ключів цього пристрою заблоковано. Розблокуйте пристрій, і bae продовжить із того місця, де зупинився."
bg = "Ключодържателят на това устройство е заключен. Отключете устройството и bae ще продължи оттам, докъдето е стигнал."
pl = "Pęk kluczy tego urządzenia jest zablokowany. Odblokuj urządzenie, a bae wznowi pracę w miejscu, w którym przerwał."
cs = "Klíčenka tohoto zařízení je uzamčená. Odemkněte zařízení a bae bude pokračovat tam, kde skončil."
hr = "Privjesak ključeva ovog uređaja je zaključan. Otključajte uređaj i bae će nastaviti gdje je stao."
zh-Hant = "此裝置的鑰匙圈已鎖定。解鎖裝置後，bae 會從中斷處繼續。"
it = "Il portachiavi di questo dispositivo è bloccato. Sblocca il dispositivo e bae riprenderà da dove si era fermato."
tr = "Bu aygıtın anahtar zinciri kilitli. Aygıtın kilidini açın; bae kaldığı yerden devam edecek."
vi = "Chuỗi khóa của thiết bị này đang bị khóa. Hãy mở khóa thiết bị và bae sẽ tiếp tục từ chỗ đang dở."
nl = "De sleutelhanger van dit apparaat is vergrendeld. Ontgrendel het apparaat, dan gaat bae verder waar het gebleven was."
hi = "इस डिवाइस का किचेन लॉक है। डिवाइस अनलॉक करें और bae वहीं से जारी रखेगा जहां छोड़ा था।"
bn = "এই ডিভাইসের কীচেইন লক করা আছে। ডিভাইস আনলক করুন, bae যেখানে থেমেছিল সেখান থেকেই চালিয়ে যাবে।"
ta = "இந்தச் சாதனத்தின் கீசெயின் பூட்டப்பட்டுள்ளது. சாதனத்தைத் திறந்தால், bae நிறுத்திய இடத்திலிருந்து தொடரும்."
te = "ఈ పరికరం కీచైన్ లాక్ చేయబడింది. పరికరాన్ని అన్‌లాక్ చేయండి, bae ఆగిన చోటి నుంచి కొనసాగుతుంది."
mr = "या डिव्हाइसची कीचेन लॉक आहे. डिव्हाइस अनलॉक करा, bae जिथे थांबले तिथून पुढे चालू ठेवेल."
ur = "اس آلے کی کی چین مقفل ہے۔ آلہ اَن لاک کریں، bae وہیں سے جاری رکھے گا جہاں رکا تھا۔"
gu = "આ ઉપકરણની કીચેન લૉક છે. ઉપકરણ અનલૉક કરો, bae જ્યાં અટક્યું હતું ત્યાંથી ચાલુ રહેશે."
kn = "ಈ ಸಾಧನದ ಕೀಚೈನ್ ಲಾಕ್ ಆಗಿದೆ. ಸಾಧನವನ್ನು ಅನ್‌ಲಾಕ್ ಮಾಡಿ, bae ನಿಲ್ಲಿಸಿದಲ್ಲಿಂದ ಮುಂದುವರಿಯುತ್ತದೆ."
ml = "ഈ ഉപകരണത്തിന്റെ കീചെയിൻ ലോക്ക് ചെയ്തിരിക്കുന്നു. ഉപകരണം അൺലോക്ക് ചെയ്യുക, നിർത്തിയിടത്തുനിന്ന് bae തുടരും."
pa = "ਇਸ ਡਿਵਾਈਸ ਦੀ ਕੀਚੇਨ ਲਾਕ ਹੈ। ਡਿਵਾਈਸ ਅਨਲਾਕ ਕਰੋ, bae ਉੱਥੋਂ ਜਾਰੀ ਰੱਖੇਗਾ ਜਿੱਥੇ ਰੁਕਿਆ ਸੀ।"
th = "พวงกุญแจของอุปกรณ์นี้ถูกล็อกอยู่ ปลดล็อกอุปกรณ์แล้ว bae จะทำต่อจากจุดที่ค้างไว้"

[messages."core.error.category.membership"]
comment = "Generic error line: a library-sharing membership operation failed."
value = "Something went wrong updating library sharing."

[messages."core.error.category.membership".translations]
es = "Algo salió mal al actualizar el uso compartido de la biblioteca."
fr = "Une erreur s'est produite lors de la mise à jour du partage de la bibliothèque."
de = "Beim Aktualisieren der Bibliotheksfreigabe ist etwas schiefgelaufen."
pt-BR = "Algo deu errado ao atualizar o compartilhamento da biblioteca."
ja = "ライブラリの共有を更新する際に問題が発生しました。"
ko = "라이브러리 공유를 업데이트하는 중 문제가 발생했습니다."
zh-Hans = "更新媒体库共享时出现问题。"
ar = "حدث خطأ أثناء تحديث مشاركة المكتبة."
he = "משהו השתבש בעדכון שיתוף הספרייה."
uk = "Під час оновлення спільного доступу до бібліотеки сталася помилка."
bg = "Възникна проблем при обновяването на споделянето на библиотеката."
pl = "Coś poszło nie tak podczas aktualizacji udostępniania biblioteki."
cs = "Při aktualizaci sdílení knihovny došlo k chybě."
hr = "Nešto je pošlo po zlu pri ažuriranju dijeljenja biblioteke."
zh-Hant = "更新資料庫共享時發生問題。"
it = "Si è verificato un problema durante l'aggiornamento della condivisione della libreria."
tr = "Kitaplık paylaşımı güncellenirken bir sorun oluştu."
vi = "Đã xảy ra lỗi khi cập nhật chia sẻ thư viện."
nl = "Er is iets misgegaan bij het bijwerken van het delen van de bibliotheek."
hi = "लाइब्रेरी साझाकरण अपडेट करते समय कुछ गलत हुआ।"
bn = "লাইব্রেরি শেয়ারিং আপডেট করার সময় কিছু ভুল হয়েছে।"
ta = "நூலக பகிர்வைப் புதுப்பிக்கும்போது ஏதோ தவறு ஏற்பட்டது."
te = "లైబ్రరీ షేరింగ్‌ను నవీకరించడంలో ఏదో తప్పు జరిగింది."
mr = "लायब्ररी शेअरिंग अपडेट करताना काहीतरी चूक झाली."
ur = "لائبریری شیئرنگ اپ ڈیٹ کرتے وقت کچھ غلط ہو گیا۔"
gu = "લાઇબ્રેરી શેરિંગ અપડેટ કરતી વખતે કંઈક ખોટું થયું."
kn = "ಗ್ರಂಥಾಲಯ ಹಂಚಿಕೆಯನ್ನು ನವೀಕರಿಸುವಾಗ ಏನೋ ತಪ್ಪಾಗಿದೆ."
ml = "ലൈബ്രറി പങ്കിടൽ അപ്ഡേറ്റ് ചെയ്യുമ്പോൾ എന്തോ പിശക് സംഭവിച്ചു."
pa = "ਲਾਇਬ੍ਰੇਰੀ ਸਾਂਝ ਨੂੰ ਅੱਪਡੇਟ ਕਰਦੇ ਸਮੇਂ ਕੁਝ ਗੜਬੜ ਹੋਈ।"
th = "เกิดข้อผิดพลาดขณะอัปเดตการแชร์คลัง"
