pl = "Zezwól tym danym logowania na odczyt, zapis, wyświetlanie i usuwanie obiektów w tym zasobniku."
cs = "Povolte těmto přihlašovacím údajům číst, zapisovat, vypisovat a mazat objekty v tomto bucketu."
hr = "Dopustite ovim vjerodajnicama čitanje, pisanje, popisivanje i brisanje objekata u ovom spremniku."
