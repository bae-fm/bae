nl = "De hoes en andere bestanden naast deze mappen zouden bij meer dan één gecombineerde uitgave horen. Splits ze allemaal op één na."
sk = "Obal a ďalšie súbory vedľa týchto priečinkov by patrili k viac ako jednému spojenému vydaniu. Rozdeľte všetky okrem jedného."
hu = "A mappák melletti borító és többi fájl több egyesített kiadáshoz is tartozna. Egy kivételével bontsd szét őket."
ro = "Coperta și celelalte fișiere de lângă aceste dosare ar aparține mai multor lansări combinate. Separă-le pe toate, cu excepția uneia."
el = "Το εξώφυλλο και τα άλλα αρχεία δίπλα σε αυτούς τους φακέλους θα ανήκαν σε περισσότερες από μία συνδυασμένες κυκλοφορίες. Διαχωρίστε όλες εκτός από μία."
pt-PT = "A capa e os outros ficheiros junto a estas pastas pertenceriam a mais do que um lançamento combinado. Separe todos exceto um."
sv = "Omslaget och andra filer bredvid de här mapparna skulle höra till mer än en kombinerad utgåva. Dela upp alla utom en."
da = "Coveret og de andre filer ved siden af disse mapper ville høre til mere end én kombineret udgivelse. Del alle undtagen én op."
nb = "Omslaget og de andre filene ved siden av disse mappene ville høre til mer enn én kombinert utgivelse. Del opp alle unntatt én."
