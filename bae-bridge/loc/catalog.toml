zh-Hant = "無法取消還原：此裝置已加入音樂庫。請完成還原以使用音樂庫。"
it = "Il ripristino non può essere annullato: questo dispositivo è già stato aggiunto alla libreria. Completa il ripristino per usare la libreria."
tr = "Geri yükleme iptal edilemez: bu cihaz kitaplığa zaten eklendi. Kitaplığı kullanmak için geri yüklemeyi tamamlayın."
nl = "Het herstellen kan niet worden geannuleerd: dit apparaat is al aan de bibliotheek toegevoegd. Voltooi het herstellen om de bibliotheek te gebruiken."
sk = "Obnovenie sa nedá zrušiť: toto zariadenie už bolo pridané do knižnice. Dokonči obnovenie a knižnicu budeš môcť používať."
hu = "A visszaállítás nem szakítható meg: ez az eszköz már hozzá lett adva a könyvtárhoz. A könyvtár használatához fejezd be a visszaállítást."
ro = "Restaurarea nu poate fi anulată: acest dispozitiv a fost deja adăugat la bibliotecă. Finalizează restaurarea pentru a folosi biblioteca."
el = "Η επαναφορά δεν μπορεί να ακυρωθεί: αυτή η συσκευή έχει ήδη προστεθεί στη βιβλιοθήκη. Ολοκληρώστε την επαναφορά για να χρησιμοποιήσετε τη βιβλιοθήκη."
pt-PT = "O restauro não pode ser cancelado: este dispositivo já foi adicionado à biblioteca. Conclua o restauro para usar a biblioteca."
sv = "Återställningen kan inte avbrytas: den här enheten har redan lagts till i biblioteket. Slutför återställningen för att använda biblioteket."
da = "Gendannelsen kan ikke annulleres: denne enhed er allerede føjet til biblioteket. Fuldfør gendannelsen for at bruge biblioteket."
nb = "Gjenopprettingen kan ikke avbrytes: denne enheten er allerede lagt til i biblioteket. Fullfør gjenopprettingen for å bruke biblioteket."
fi = "Palautusta ei voi perua: tämä laite on jo lisätty kirjastoon. Viimeistele palautus, jotta voit käyttää kirjastoa."

[messages."core.error.member_keys_replaced"]
comment = "Why a restore or a reset of this device's copy failed: another of the person's devices replaced their keys, which the restore code used, or this device's copy, doesn't hold. Only the person's current restore code restores the library."
value = "Your keys were replaced on another of your devices. Restore this library with your current restore code."

[messages."core.error.member_keys_replaced".translations]
es = "Tus claves se reemplazaron en otro de tus dispositivos. Restaura esta biblioteca con tu código de restauración actual."
fr = "Vos clés ont été remplacées sur un autre de vos appareils. Restaurez cette bibliothèque avec votre code de restauration actuel."
de = "Deine Schlüssel wurden auf einem anderen deiner Geräte ersetzt. Stelle diese Mediathek mit deinem aktuellen Wiederherstellungscode wieder her."
pt-BR = "Suas chaves foram substituídas em outro dos seus dispositivos. Restaure esta biblioteca com seu código de restauração atual."
ja = "あなたのキーは別のデバイスで置き換えられました。現在の復元コードでこのライブラリを復元してください。"
ko = "다른 기기에서 키가 교체되었습니다. 현재 복원 코드로 이 라이브러리를 복원하세요."
zh-Hans = "你的密钥已在你的另一台设备上被替换。请使用你当前的恢复码恢复此音乐库。"
ar = "استُبدلت مفاتيحك على جهاز آخر من أجهزتك. استعِد هذه المكتبة باستخدام رمز الاستعادة الحالي."
