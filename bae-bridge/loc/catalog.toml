ro = "Permite acestor date de autentificare să citească, să scrie, să listeze și să șteargă obiecte din acest container."
el = "Επιτρέψτε σε αυτά τα διαπιστευτήρια να διαβάζουν, να γράφουν, να απαριθμούν και να διαγράφουν αντικείμενα σε αυτόν τον κάδο."
pt-PT = "Permita que estas credenciais leiam, escrevam, listem e eliminem objetos neste contentor."
sv = "Ge de här uppgifterna rätt att läsa, skriva, lista och radera objekt i den här bucketen."
