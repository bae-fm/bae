he = "אפשר לפרטי הגישה האלה לקרוא, לכתוב, להציג ולמחוק אובייקטים במכל הזה."
uk = "Надайте цим обліковим даним дозвіл читати, записувати, переглядати й видаляти об’єкти в цьому сховищі."
