ja = "この復元はキャンセルできません。このデバイスはすでにライブラリに追加されています。ライブラリを使うには復元を完了してください。"
ko = "복원을 취소할 수 없습니다. 이 기기는 이미 라이브러리에 추가되었습니다. 라이브러리를 사용하려면 복원을 완료하세요."
zh-Hans = "无法取消恢复：此设备已被添加到音乐库。请完成恢复以使用音乐库。"
ar = "لا يمكن إلغاء الاستعادة: أُضيف هذا الجهاز إلى المكتبة بالفعل. أنهِ الاستعادة لاستخدام المكتبة."
he = "אי אפשר לבטל את השחזור: המכשיר הזה כבר נוסף לספרייה. סיים את השחזור כדי להשתמש בספרייה."
uk = "Відновлення не можна скасувати: цей пристрій уже додано до бібліотеки. Завершіть відновлення, щоб користуватися бібліотекою."
bg = "Възстановяването не може да бъде отменено: това устройство вече е добавено към библиотеката. Завършете възстановяването, за да използвате библиотеката."
pl = "Nie można anulować przywracania: to urządzenie zostało już dodane do biblioteki. Dokończ przywracanie, aby korzystać z biblioteki."
cs = "Obnovení nelze zrušit: toto zařízení už bylo do knihovny přidáno. Dokončete obnovení, abyste mohli knihovnu používat."
