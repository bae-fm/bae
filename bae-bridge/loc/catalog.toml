pa = "{count, plural, one {# ਰਿਲੀਜ਼ ਸਿਰਫ਼ ਕਲਾਉਡ ਵਿੱਚ ਸਟੋਰ ਹੈ — ਦੁਬਾਰਾ ਕਨੈਕਟ ਕਰਨ ਤੱਕ ਇਹ ਚਲਾਈ ਨਹੀਂ ਜਾ ਸਕੇਗੀ।} other {# ਰਿਲੀਜ਼ਾਂ ਸਿਰਫ਼ ਕਲਾਉਡ ਵਿੱਚ ਸਟੋਰ ਹਨ — ਦੁਬਾਰਾ ਕਨੈਕਟ ਕਰਨ ਤੱਕ ਇਹ ਚਲਾਈਆਂ ਨਹੀਂ ਜਾ ਸਕਣਗੀਆਂ।}}"
