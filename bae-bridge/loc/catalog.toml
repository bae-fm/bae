comment = "Error line shown in the device picker when an AirPlay receiver can't be driven — it demands a PIN, or offers only audio encryption the sender doesn't implement."
value = "This AirPlay receiver isn't supported."

[messages."core.error.category.airplay_unsupported".translations]
es = "Este receptor AirPlay no es compatible."
fr = "Ce récepteur AirPlay n’est pas pris en charge."
de = "Dieser AirPlay-Empfänger wird nicht unterstützt."
pt-BR = "Este receptor AirPlay não é compatível."
ja = "このAirPlayレシーバーはサポートされていません。"
ko = "이 AirPlay 수신 기기는 지원되지 않습니다."
zh-Hans = "不支持此 AirPlay 接收设备。"
ar = "جهاز استقبال AirPlay هذا غير مدعوم."
he = "מקלט ה‑AirPlay הזה אינו נתמך."
uk = "Цей приймач AirPlay не підтримується."
bg = "Този приемник AirPlay не се поддържа."
pl = "Ten odbiornik AirPlay nie jest obsługiwany."
cs = "Tento přijímač AirPlay není podporován."
hr = "Ovaj AirPlay prijamnik nije podržan."
zh-Hant = "不支援此 AirPlay 接收裝置。"
it = "Questo ricevitore AirPlay non è supportato."
tr = "Bu AirPlay alıcısı desteklenmiyor."
nl = "Deze AirPlay-ontvanger wordt niet ondersteund."
sk = "Tento prijímač AirPlay nie je podporovaný."
hu = "Ez az AirPlay-vevő nem támogatott."
ro = "Acest receptor AirPlay nu este acceptat."
el = "Αυτός ο δέκτης AirPlay δεν υποστηρίζεται."
pt-PT = "Este recetor AirPlay não é suportado."
sv = "Den här AirPlay-mottagaren stöds inte."
da = "Denne AirPlay-modtager understøttes ikke."
nb = "Denne AirPlay-mottakeren støttes ikke."
fi = "Tätä AirPlay-vastaanotinta ei tueta."

[messages."core.error.join.expired"]
comment = "The device-pairing join ended because the pairing code passed its deadline; a retry needs a fresh code."
value = "This pairing code expired. Show a new code on the other device and try again."

[messages."core.error.join.expired".translations]
es = "Este código de emparejamiento caducó. Muestra un código nuevo en el otro dispositivo e inténtalo de nuevo."
fr = "Ce code d’association a expiré. Affichez un nouveau code sur l’autre appareil, puis réessayez."
de = "Dieser Kopplungscode ist abgelaufen. Zeige auf dem anderen Gerät einen neuen Code an und versuche es erneut."
pt-BR = "Este código de pareamento expirou. Mostre um novo código no outro dispositivo e tente novamente."
ja = "このペアリングコードは期限切れです。もう一方のデバイスで新しいコードを表示して、もう一度お試しください。"
ko = "이 페어링 코드가 만료되었습니다. 다른 기기에서 새 코드를 표시한 다음 다시 시도하세요."
zh-Hans = "此配对码已过期。请在另一台设备上显示新的配对码后重试。"
ar = "انتهت صلاحية رمز الاقتران هذا. اعرض رمزًا جديدًا على الجهاز الآخر ثم أعد المحاولة."
he = "קוד הצימוד הזה פג. הצג קוד חדש במכשיר האחר ונסה שוב."
uk = "Цей код сполучення застарів. Покажіть новий код на іншому пристрої та повторіть спробу."
bg = "Този код за сдвояване изтече. Покажете нов код на другото устройство и опитайте отново."
pl = "Ten kod parowania wygasł. Wyświetl nowy kod na drugim urządzeniu i spróbuj ponownie."
cs = "Tento párovací kód vypršel. Zobrazte na druhém zařízení nový kód a zkuste to znovu."
hr = "Ovaj kod za uparivanje je istekao. Prikažite novi kod na drugom uređaju i pokušajte ponovno."
zh-Hant = "此配對碼已過期。請在另一台裝置上顯示新的配對碼後再試一次。"
it = "Questo codice di abbinamento è scaduto. Mostra un nuovo codice sull’altro dispositivo e riprova."
tr = "Bu eşleştirme kodunun süresi doldu. Diğer aygıtta yeni bir kod gösterip yeniden deneyin."
nl = "Deze koppelingscode is verlopen. Toon een nieuwe code op het andere apparaat en probeer het opnieuw."
sk = "Platnosť tohto párovacieho kódu vypršala. Zobraz na druhom zariadení nový kód a skús to znova."
hu = "Ez a párosítási kód lejárt. Jeleníts meg új kódot a másik eszközön, és próbáld újra."
ro = "Acest cod de asociere a expirat. Afișează un cod nou pe celălalt dispozitiv și încearcă din nou."
el = "Αυτός ο κωδικός σύζευξης έληξε. Εμφανίστε νέο κωδικό στην άλλη συσκευή και δοκιμάστε ξανά."
pt-PT = "Este código de emparelhamento expirou. Mostre um código novo no outro dispositivo e tente novamente."
sv = "Den här parkopplingskoden har gått ut. Visa en ny kod på den andra enheten och försök igen."
da = "Denne parringskode er udløbet. Vis en ny kode på den anden enhed, og prøv igen."
nb = "Denne paringskoden er utløpt. Vis en ny kode på den andre enheten, og prøv på nytt."
fi = "Tämä pariliitoskoodi on vanhentunut. Näytä uusi koodi toisella laitteella ja yritä uudelleen."

[messages."core.error.join.owner_offline"]
comment = "The device-pairing join ended because the inviting device never took its next step; both devices must run the join at once."
value = "The other device isn't running this join. Open bae on it, show a pairing code, and try again."

[messages."core.error.join.owner_offline".translations]
es = "El otro dispositivo no está ejecutando este emparejamiento. Abre bae en él, muestra un código y vuelve a intentarlo."
fr = "L’autre appareil n’exécute pas cette association. Ouvrez bae dessus, affichez un code, puis réessayez."
de = "Das andere Gerät führt diese Kopplung nicht aus. Öffne bae dort, zeige einen Code an und versuche es erneut."
pt-BR = "O outro dispositivo não está executando este pareamento. Abra o bae nele, mostre um código e tente novamente."
ja = "もう一方のデバイスでこのペアリングが実行されていません。そちらでbaeを開き、ペアリングコードを表示してから、もう一度お試しください。"
ko = "다른 기기에서 이 페어링이 실행되고 있지 않습니다. 그 기기에서 bae를 열고 페어링 코드를 표시한 다음 다시 시도하세요."
zh-Hans = "另一台设备未在进行此配对。请在该设备上打开 bae 并显示配对码后重试。"
ar = "الجهاز الآخر لا يشغّل هذا الاقتران. افتح bae عليه واعرض رمز اقتران ثم أعد المحاولة."
he = "המכשיר האחר לא מריץ את הצימוד הזה. פתח בו את bae, הצג קוד צימוד ונסה שוב."
uk = "Інший пристрій не виконує це сполучення. Відкрийте на ньому bae, покажіть код і повторіть спробу."
bg = "Другото устройство не изпълнява това сдвояване. Отворете bae на него, покажете код и опитайте отново."
pl = "Drugie urządzenie nie prowadzi tego parowania. Otwórz na nim bae, wyświetl kod i spróbuj ponownie."
cs = "Druhé zařízení toto párování neprovádí. Otevřete na něm bae, zobrazte kód a zkuste to znovu."
hr = "Drugi uređaj ne izvodi ovo uparivanje. Otvorite bae na njemu, prikažite kod i pokušajte ponovno."
zh-Hant = "另一台裝置未在進行此配對。請在該裝置上開啟 bae 並顯示配對碼後再試一次。"
it = "L’altro dispositivo non sta eseguendo questo abbinamento. Apri bae su di esso, mostra un codice e riprova."
tr = "Diğer aygıt bu eşleştirmeyi yürütmüyor. Orada bae’yi açın, bir eşleştirme kodu gösterip yeniden deneyin."
nl = "Het andere apparaat voert deze koppeling niet uit. Open bae daarop, toon een koppelingscode en probeer het opnieuw."
sk = "Druhé zariadenie toto pripojenie nevykonáva. Otvor na ňom bae, zobraz párovací kód a skús to znova."
hu = "A másik eszköz nem futtatja ezt a csatlakozást. Nyisd meg rajta a bae-t, jeleníts meg egy párosítási kódot, és próbáld újra."
ro = "Celălalt dispozitiv nu rulează această alăturare. Deschide bae pe el, afișează un cod de asociere și încearcă din nou."
el = "Η άλλη συσκευή δεν εκτελεί αυτή τη σύνδεση. Ανοίξτε το bae σε αυτήν, εμφανίστε κωδικό σύζευξης και δοκιμάστε ξανά."
pt-PT = "O outro dispositivo não está a executar esta adesão. Abra o bae nesse dispositivo, mostre um código de emparelhamento e tente novamente."
sv = "Den andra enheten kör inte den här anslutningen. Öppna bae där, visa en parkopplingskod och försök igen."
da = "Den anden enhed kører ikke denne tilslutning. Åbn bae på den, vis en parringskode, og prøv igen."
nb = "Den andre enheten kjører ikke denne tilknytningen. Åpne bae på den, vis en paringskode, og prøv på nytt."
fi = "Toinen laite ei suorita tätä liittymistä. Avaa bae siinä, näytä pariliitoskoodi ja yritä uudelleen."

[messages."core.error.join.owner_ended"]
comment = "The device-pairing join ended because the inviting device withdrew the attempt."
value = "The other device ended this pairing. Start it again from there if you still want to join."

[messages."core.error.join.owner_ended".translations]
es = "El otro dispositivo finalizó este emparejamiento. Vuelve a iniciarlo desde allí si aún quieres unirte."
fr = "L’autre appareil a mis fin à cette association. Relancez-la depuis celui-ci si vous voulez toujours rejoindre."
de = "Das andere Gerät hat diese Kopplung beendet. Starte sie dort erneut, wenn du noch beitreten willst."
pt-BR = "O outro dispositivo encerrou este pareamento. Inicie-o novamente por lá se ainda quiser entrar."
ja = "もう一方のデバイスがこのペアリングを終了しました。参加を続けるなら、そちらからやり直してください。"
ko = "다른 기기가 이 페어링을 종료했습니다. 계속 참여하려면 그 기기에서 다시 시작하세요."
zh-Hans = "另一台设备结束了此配对。若仍要加入，请从该设备重新开始。"
ar = "أنهى الجهاز الآخر هذا الاقتران. ابدأه من هناك مرة أخرى إذا كنت لا تزال تريد الانضمام."
he = "המכשיר האחר סיים את הצימוד הזה. התחל אותו שוב משם אם אתה עדיין רוצה להצטרף."
uk = "Інший пристрій завершив це сполучення. Почніть його звідти знову, якщо ще хочете приєднатися."
bg = "Другото устройство прекрати това сдвояване. Започнете го отново оттам, ако още искате да се присъедините."
pl = "Drugie urządzenie zakończyło to parowanie. Rozpocznij je tam ponownie, jeśli nadal chcesz dołączyć."
cs = "Druhé zařízení toto párování ukončilo. Pokud se stále chcete připojit, spusťte ho tam znovu."
hr = "Drugi uređaj je završio ovo uparivanje. Pokrenite ga ondje ponovno ako se i dalje želite pridružiti."
zh-Hant = "另一台裝置結束了此配對。若仍要加入，請從該裝置重新開始。"
it = "L’altro dispositivo ha terminato questo abbinamento. Riavvialo da lì se vuoi ancora unirti."
tr = "Diğer aygıt bu eşleştirmeyi sonlandırdı. Hâlâ katılmak istiyorsanız oradan yeniden başlatın."
nl = "Het andere apparaat heeft deze koppeling beëindigd. Start hem daar opnieuw als je nog wilt deelnemen."
sk = "Druhé zariadenie toto párovanie ukončilo. Ak sa stále chceš pripojiť, spusti ho odtiaľ znova."
hu = "A másik eszköz befejezte ezt a párosítást. Ha még csatlakoznál, indítsd el onnan újra."
ro = "Celălalt dispozitiv a încheiat această asociere. Dacă tot vrei să te alături, pornește-o din nou de acolo."
el = "Η άλλη συσκευή τερμάτισε αυτή τη σύζευξη. Αν εξακολουθείτε να θέλετε να συνδεθείτε, ξεκινήστε την ξανά από εκεί."
pt-PT = "O outro dispositivo terminou este emparelhamento. Se ainda quiser aderir, inicie-o novamente a partir daí."
sv = "Den andra enheten avslutade den här parkopplingen. Om du fortfarande vill ansluta dig, starta den därifrån igen."
da = "Den anden enhed afsluttede denne parring. Hvis du stadig vil deltage, skal du starte den derfra igen."
nb = "Den andre enheten avsluttet denne paringen. Vil du fortsatt bli med, må du starte den derfra på nytt."
fi = "Toinen laite päätti tämän pariliitoksen. Jos haluat yhä liittyä, käynnistä se sieltä uudelleen."

[messages."core.error.keyring.locked"]
comment = "The OS keychain refused the read because the session is locked or the display is asleep; the key is present and the read succeeds again after unlock."
value = "This device's keychain is locked. Unlock the device and bae will pick up where it left off."

[messages."core.error.keyring.locked".translations]
es = "El llavero de este dispositivo está bloqueado. Desbloquea el dispositivo y bae continuará donde lo dejó."
fr = "Le trousseau de cet appareil est verrouillé. Déverrouillez l’appareil et bae reprendra où il s’est arrêté."
de = "Der Schlüsselbund dieses Geräts ist gesperrt. Entsperre das Gerät, und bae macht dort weiter, wo es aufgehört hat."
pt-BR = "As chaves deste dispositivo estão bloqueadas. Desbloqueie o dispositivo e o bae continuará de onde parou."
ja = "このデバイスのキーチェーンがロックされています。デバイスのロックを解除すると、baeは中断したところから再開します。"
ko = "이 기기의 키체인이 잠겨 있습니다. 기기를 잠금 해제하면 bae가 중단된 지점부터 이어서 진행합니다."
zh-Hans = "此设备的钥匙串已锁定。解锁设备后，bae 会从中断处继续。"
ar = "سلسلة مفاتيح هذا الجهاز مقفلة. ألغِ قفل الجهاز وسيتابع bae من حيث توقف."
he = "מחזיק המפתחות של המכשיר הזה נעול. שחרר את נעילת המכשיר ו-bae ימשיך מהנקודה שבה עצר."
uk = "В’язку ключів цього пристрою заблоковано. Розблокуйте пристрій, і bae продовжить із того місця, де зупинився."
bg = "Ключодържателят на това устройство е заключен. Отключете устройството и bae ще продължи оттам, докъдето е стигнал."
pl = "Pęk kluczy tego urządzenia jest zablokowany. Odblokuj urządzenie, a bae wznowi pracę w miejscu, w którym przerwał."
cs = "Klíčenka tohoto zařízení je uzamčená. Odemkněte zařízení a bae bude pokračovat tam, kde skončil."
hr = "Privjesak ključeva ovog uređaja je zaključan. Otključajte uređaj i bae će nastaviti gdje je stao."
zh-Hant = "此裝置的鑰匙圈已鎖定。解鎖裝置後，bae 會從中斷處繼續。"
it = "Il portachiavi di questo dispositivo è bloccato. Sblocca il dispositivo e bae riprenderà da dove si era fermato."
tr = "Bu aygıtın anahtar zinciri kilitli. Aygıtın kilidini açın; bae kaldığı yerden devam edecek."
nl = "De sleutelhanger van dit apparaat is vergrendeld. Ontgrendel het apparaat, dan gaat bae verder waar het gebleven was."
sk = "Kľúčenka tohto zariadenia je zamknutá. Odomkni zariadenie a bae bude pokračovať tam, kde skončil."
hu = "Ennek az eszköznek a kulcstartója zárolva van. Oldd fel az eszközt, és a bae ott folytatja, ahol abbahagyta."
ro = "Brelocul acestui dispozitiv este blocat. Deblochează dispozitivul și bae va continua de unde a rămas."
el = "Το μπρελόκ αυτής της συσκευής είναι κλειδωμένο. Ξεκλειδώστε τη συσκευή και το bae θα συνεχίσει από εκεί που σταμάτησε."
pt-PT = "O porta-chaves deste dispositivo está bloqueado. Desbloqueie o dispositivo e o bae continua de onde ficou."
sv = "Den här enhetens nyckelring är låst. Lås upp enheten så fortsätter bae där den slutade."
da = "Denne enheds nøglering er låst. Lås enheden op, så fortsætter bae, hvor den slap."
nb = "Nøkkelringen på denne enheten er låst. Lås opp enheten, så fortsetter bae der den slapp."
fi = "Tämän laitteen avainnippu on lukittu. Avaa laitteen lukitus, niin bae jatkaa siitä, mihin se jäi."

[messages."core.error.category.membership"]
comment = "Generic error line: a library-sharing membership operation failed."
value = "Something went wrong updating library sharing."

[messages."core.error.category.membership".translations]
es = "Algo salió mal al actualizar el uso compartido de la biblioteca."
fr = "Une erreur s'est produite lors de la mise à jour du partage de la bibliothèque."
de = "Beim Aktualisieren der Bibliotheksfreigabe ist etwas schiefgelaufen."
pt-BR = "Algo deu errado ao atualizar o compartilhamento da biblioteca."
ja = "ライブラリの共有を更新する際に問題が発生しました。"
ko = "라이브러리 공유를 업데이트하는 중 문제가 발생했습니다."
zh-Hans = "更新媒体库共享时出现问题。"
ar = "حدث خطأ أثناء تحديث مشاركة المكتبة."
he = "משהו השתבש בעדכון שיתוף הספרייה."
uk = "Під час оновлення спільного доступу до бібліотеки сталася помилка."
bg = "Възникна проблем при обновяването на споделянето на библиотеката."
pl = "Coś poszło nie tak podczas aktualizacji udostępniania biblioteki."
cs = "Při aktualizaci sdílení knihovny došlo k chybě."
hr = "Nešto je pošlo po zlu pri ažuriranju dijeljenja biblioteke."
zh-Hant = "更新資料庫共享時發生問題。"
it = "Si è verificato un problema durante l'aggiornamento della condivisione della libreria."
tr = "Kitaplık paylaşımı güncellenirken bir sorun oluştu."
nl = "Er is iets misgegaan bij het bijwerken van het delen van de bibliotheek."
sk = "Pri aktualizácii zdieľania knižnice sa niečo pokazilo."
hu = "Hiba történt a könyvtármegosztás frissítésekor."
ro = "Ceva nu a mers bine la actualizarea partajării bibliotecii."
el = "Κάτι πήγε στραβά κατά την ενημέρωση της κοινής χρήσης της βιβλιοθήκης."
pt-PT = "Algo correu mal ao atualizar a partilha da biblioteca."
sv = "Något gick fel när bibliotekets delning uppdaterades."
da = "Noget gik galt, da bibliotekets deling blev opdateret."
nb = "Noe gikk galt da delingen av biblioteket ble oppdatert."
fi = "Jokin meni pieleen kirjaston jakamista päivitettäessä."
[messages."core.error.not_found.library"]
comment = "Error line: the requested library no longer exists."
value = "That library could not be found."

[messages."core.error.not_found.library".translations]
es = "No se pudo encontrar esa biblioteca."
fr = "Cette bibliothèque est introuvable."
de = "Diese Bibliothek wurde nicht gefunden."
pt-BR = "Não foi possível encontrar essa biblioteca."
ja = "そのライブラリが見つかりませんでした。"
ko = "그 라이브러리를 찾을 수 없습니다."
zh-Hans = "找不到该媒体库。"
ar = "تعذّر العثور على تلك المكتبة."
he = "לא ניתן היה למצוא את הספרייה הזו."
uk = "Цю бібліотеку не вдалося знайти."
bg = "Тази библиотека не може да бъде намерена."
pl = "Nie znaleziono tej biblioteki."
cs = "Tuto knihovnu se nepodařilo najít."
hr = "Tu biblioteku nije moguće pronaći."
zh-Hant = "找不到該資料庫。"
it = "That Libreria could not be found."
tr = "That Kitaplık could not be found."
nl = "That Bibliotheek could not be found."
sk = "Táto knižnica sa nenašla."
hu = "Ez a könyvtár nem található."
ro = "Acea bibliotecă nu a putut fi găsită."
el = "Δεν ήταν δυνατή η εύρεση εκείνης της βιβλιοθήκης."
pt-PT = "Não foi possível encontrar essa biblioteca."
sv = "Det biblioteket kunde inte hittas."
da = "Det bibliotek kunne ikke findes."
nb = "Fant ikke det biblioteket."
fi = "Kyseistä kirjastoa ei löytynyt."

# Actionable playback failures: the user can do something to fix these.

[messages."core.playback.error.sync_disconnected"]
comment = "Playback error: a cloud-only track isn't downloaded and sync is offline."
value = "Reconnect to play this release. It isn't downloaded to this device yet."

[messages."core.playback.error.sync_disconnected".translations]
es = "Vuelve a conectarte para reproducir esta edición: aún no se ha descargado en este dispositivo."
fr = "Reconnectez-vous pour lire cette édition. Elle n'est pas encore téléchargée sur cet appareil."
de = "Stelle die Verbindung wieder her, um diese Veröffentlichung abzuspielen. Sie ist noch nicht auf dieses Gerät heruntergeladen."
pt-BR = "Reconecte-se para reproduzir esta edição. Ela ainda não foi baixada neste dispositivo."
ja = "このリリースを再生するには再接続してください。まだこのデバイスにダウンロードされていません。"
ko = "이 릴리스를 재생하려면 다시 연결하세요. 아직 이 기기에 다운로드되지 않았습니다."
zh-Hans = "请重新连接以播放此发行版。。它尚未下载到此设备。"
ar = "أعد الاتصال لتشغيل هذا الإصدار. لم يُنزَّل إلى هذا الجهاز بعد."
he = "התחבר מחדש כדי לנגן את ההוצאה הזו. היא עדיין לא הורדה למכשיר הזה."
uk = "Підключіться знову, щоб відтворити це видання. Воно ще не завантажене на цей пристрій."
bg = "Свържете се отново, за да възпроизведете това издание. То още не е изтеглено на това устройство."
pl = "Połącz się ponownie, aby odtworzyć to wydanie. Nie zostało jeszcze pobrane na to urządzenie."
cs = "Pro přehrání tohoto vydání se znovu připojte. Ještě není staženo do tohoto zařízení."
hr = "Ponovno se povežite za reprodukciju ovog izdanja. Još nije preuzeto na ovaj uređaj."
zh-Hant = "重新連線以播放此發行。尚未下載到此裝置。"
it = "Riconnettiti per riprodurre questa pubblicazione. Non è ancora scaricata su questo dispositivo."
tr = "Bu yayını çalmak için yeniden bağlanın. Henüz bu cihaza indirilmedi."
nl = "Maak opnieuw verbinding om deze release af te spelen. Deze is nog niet naar dit apparaat gedownload."
sk = "Ak chceš toto vydanie prehrať, znova sa pripoj. Zatiaľ nie je stiahnuté do tohto zariadenia."
hu = "A kiadás lejátszásához kapcsolódj újra. Erre az eszközre még nincs letöltve."
ro = "Reconectează-te pentru a reda această ediție. Încă nu este descărcată pe acest dispozitiv."
el = "Επανασυνδεθείτε για να αναπαραγάγετε αυτή την κυκλοφορία. Δεν έχει ληφθεί ακόμη σε αυτή τη συσκευή."
pt-PT = "Volte a ligar-se para reproduzir esta edição. Ainda não está transferida para este dispositivo."
sv = "Anslut igen för att spela den här utgåvan. Den är inte hämtad till den här enheten än."
da = "Forbind igen for at afspille denne udgivelse. Den er ikke hentet til denne enhed endnu."
nb = "Koble til på nytt for å spille av denne utgivelsen. Den er ikke lastet ned til denne enheten ennå."
fi = "Yhdistä uudelleen, jotta voit toistaa tämän julkaisun. Sitä ei ole vielä ladattu tälle laitteelle."
[messages."core.playback.error.upload_pending"]
comment = "Playback error: a track's cloud upload is still queued."
value = "This release is still uploading. Try again when it finishes."

[messages."core.playback.error.upload_pending".translations]
es = "Esta edición todavía se está subiendo: inténtalo de nuevo cuando termine."
fr = "Cette édition est encore en cours d'envoi. Réessayez une fois terminé."
de = "Diese Veröffentlichung wird noch hochgeladen. Versuche es erneut, wenn sie fertig ist."
pt-BR = "Esta edição ainda está sendo enviada. Tente novamente quando terminar."
ja = "このリリースはまだアップロード中です。完了してからもう一度お試しください。"
ko = "이 릴리스는 아직 업로드 중입니다. 완료되면 다시 시도하세요."
zh-Hans = "此发行版仍在上传中。。完成后请重试。"
ar = "لا يزال هذا الإصدار قيد الرفع. أعد المحاولة عند انتهائه."
he = "ההוצאה הזו עדיין מועלית. נסה שוב כשהיא תסתיים."
uk = "Це видання ще вивантажується. Спробуйте знову, коли завершиться."
bg = "Това издание още се качва. Опитайте отново, когато приключи."
pl = "To wydanie jest jeszcze przesyłane. Spróbuj ponownie po zakończeniu."
cs = "Toto vydání se ještě nahrává. Zkuste to znovu po dokončení."
hr = "Ovo izdanje se još učitava. Pokušajte ponovno kad završi."
zh-Hant = "此發行仍在上傳。完成後再試一次。"
it = "Questa pubblicazione è ancora in caricamento. Riprova al termine."
tr = "Bu yayın hâlâ yükleniyor. Bittiğinde yeniden deneyin."
nl = "Deze release wordt nog geüpload. Probeer het opnieuw wanneer dit klaar is."
sk = "Toto vydanie sa ešte odosiela. Skús to znova, keď sa to dokončí."
hu = "Ez a kiadás még feltöltés alatt áll. Próbáld újra, amikor befejeződik."
ro = "Această ediție se încarcă încă. Încearcă din nou când se termină."
el = "Αυτή η κυκλοφορία μεταφορτώνεται ακόμη. Δοκιμάστε ξανά όταν ολοκληρωθεί."
pt-PT = "Esta edição ainda está a ser enviada. Tente novamente quando terminar."
sv = "Den här utgåvan laddas fortfarande upp. Försök igen när det är klart."
da = "Denne udgivelse uploades stadig. Prøv igen, når det er færdigt."
nb = "Denne utgivelsen lastes fortsatt opp. Prøv på nytt når den er ferdig."
fi = "Tätä julkaisua lähetetään vielä. Yritä uudelleen, kun lähetys on valmis."
