[messages."ui.import.artist_identity_conflict.explanation"]
comment = "Import artist identity conflict: explanation above the two survivor choices."
value = "This source identity is linked to two artists in your library. Choose the record to keep; its albums, tracks, credits, and source links will be combined with the other record."

[messages."ui.import.artist_identity_conflict.explanation".translations]
es = "Esta identidad de origen está vinculada a dos artistas de tu biblioteca. Elige el registro que quieres conservar; sus álbumes, pistas, créditos y enlaces de origen se combinarán con el otro registro."
fr = "Cette identité de source est liée à deux artistes de votre bibliothèque. Choisissez la fiche à conserver ; ses albums, morceaux, crédits et liens de source seront regroupés avec l’autre fiche."
de = "Diese Quellidentität ist mit zwei Künstlern in deiner Mediathek verknüpft. Wähle den Datensatz aus, der behalten werden soll; seine Alben, Titel, Mitwirkungsangaben und Quellverknüpfungen werden mit dem anderen Datensatz zusammengeführt."
"pt-BR" = "Esta identidade da fonte está vinculada a dois artistas na sua biblioteca. Escolha o registro que deseja manter; os álbuns, faixas, créditos e links de fonte dele serão combinados com o outro registro."
ja = "このソースIDはライブラリ内の2人のアーティストに関連付けられています。残すレコードを選択してください。そのアルバム、トラック、クレジット、ソースリンクがもう一方のレコードと統合されます。"
ko = "이 소스 식별자가 보관함의 아티스트 두 명에 연결되어 있습니다. 유지할 레코드를 선택하세요. 해당 레코드의 앨범, 트랙, 크레딧 및 소스 링크가 다른 레코드와 병합됩니다."
"zh-Hans" = "此来源身份关联到了资料库中的两位艺术家。请选择要保留的记录；其专辑、曲目、署名和来源链接将与另一条记录合并。"
ar = "ترتبط هوية المصدر هذه بفنانين في مكتبتك. اختر السجل الذي تريد الاحتفاظ به؛ سيتم دمج ألبوماته ومقاطعه واعتماداته وروابط مصادره مع السجل الآخر."
he = "זהות מקור זו מקושרת לשני אמנים בספרייה שלך. יש לבחור איזו רשומה לשמור; האלבומים, הרצועות, הקרדיטים וקישורי המקור שלה ימוזגו עם הרשומה האחרת."
uk = "Цей ідентифікатор джерела пов’язано з двома виконавцями у вашій медіатеці. Виберіть запис, який слід зберегти; його альбоми, композиції, авторські дані та посилання на джерела буде об’єднано з іншим записом."
bg = "Тази самоличност от източника е свързана с двама изпълнители във вашата библиотека. Изберете кой запис да запазите; неговите албуми, песни, авторски данни и връзки към източници ще бъдат обединени с другия запис."
pl = "Ta tożsamość źródłowa jest powiązana z dwoma wykonawcami w bibliotece. Wybierz rekord, który chcesz zachować; jego albumy, utwory, informacje o udziale i łącza źródłowe zostaną połączone z drugim rekordem."
cs = "Tato identita ze zdroje je propojena se dvěma interprety ve vaší knihovně. Vyberte záznam, který chcete ponechat; jeho alba, skladby, údaje o účasti a odkazy na zdroje se sloučí s druhým záznamem."
hr = "Ovaj identitet izvora povezan je s dvama izvođačima u vašoj fonoteci. Odaberite zapis koji želite zadržati; njegovi albumi, pjesme, zasluge i poveznice na izvore spojit će se s drugim zapisom."
"zh-Hant" = "此來源身分連結到資料庫中的兩位藝人。請選擇要保留的記錄；其專輯、曲目、製作名單和來源連結將與另一筆記錄合併。"
it = "Questa identità della fonte è collegata a due artisti nella tua libreria. Scegli il record da mantenere; i relativi album, brani, crediti e collegamenti alle fonti verranno uniti all’altro record."
tr = "Bu kaynak kimliği arşivinizdeki iki sanatçıya bağlı. Korumak istediğiniz kaydı seçin; albümleri, parçaları, katkı bilgileri ve kaynak bağlantıları diğer kayıtla birleştirilecek."
nl = "Deze bronidentiteit is gekoppeld aan twee artiesten in je bibliotheek. Kies welke vermelding je wilt behouden; de albums, nummers, credits en bronkoppelingen worden samengevoegd met de andere vermelding."
sk = "Táto zdrojová identita je prepojená s dvoma interpretmi v tvojej knižnici. Vyber záznam, ktorý sa má ponechať; jeho albumy, skladby, podiely a prepojenia na zdroje sa spoja s druhým záznamom."
hu = "Ez a forrásazonosság két előadóhoz kapcsolódik a könyvtáradban. Válaszd ki a megtartandó rekordot; albumai, számai, közreműködései és forráskapcsolatai egyesülnek a másikkal."
ro = "Această identitate din sursă este legată de doi artiști din biblioteca ta. Alege înregistrarea de păstrat; albumele, piesele, creditele și legăturile ei către surse vor fi combinate cu cealaltă."
el = "Αυτή η ταυτότητα πηγής συνδέεται με δύο καλλιτέχνες στη βιβλιοθήκη σας. Επιλέξτε την εγγραφή που θα διατηρηθεί· τα άλμπουμ, τα κομμάτια, οι συντελεστές και οι σύνδεσμοι πηγής της θα συνενωθούν με την άλλη εγγραφή."
pt-PT = "Esta identidade de origem está associada a dois artistas na sua biblioteca. Escolha o registo a manter; os álbuns, faixas, créditos e ligações de origem dele serão combinados com o outro registo."
sv = "Den här källidentiteten är länkad till två artister i ditt bibliotek. Välj posten som ska behållas; dess album, spår, medverkanden och källänkar slås ihop med den andra posten."
da = "Denne kildeidentitet er knyttet til to kunstnere i dit bibliotek. Vælg den post, der skal beholdes; dens album, spor, medvirkende og kildelinks lægges sammen med den anden post."
nb = "Denne kildeidentiteten er knyttet til to artister i biblioteket ditt. Velg posten som skal beholdes; albumene, sporene, bidragene og kildekoblingene dens slås sammen med den andre posten."
fi = "Tämä lähdeidentiteetti on kytketty kahteen esittäjään kirjastossasi. Valitse säilytettävä tietue; sen albumit, raidat, tekijätiedot ja lähdelinkit yhdistetään toiseen tietueeseen."

