uk = "Ваші ключі замінено на іншому вашому пристрої. Відновіть цю бібліотеку за поточним кодом відновлення."
bg = "Ключовете ви бяха заменени на друго ваше устройство. Възстановете тази библиотека с текущия си код за възстановяване."
pl = "Twoje klucze zostały zastąpione na innym Twoim urządzeniu. Przywróć tę bibliotekę przy użyciu bieżącego kodu przywracania."
cs = "Vaše klíče byly nahrazeny na jiném vašem zařízení. Obnovte tuto knihovnu pomocí aktuálního kódu pro obnovení."
hr = "Vaši su ključevi zamijenjeni na drugom vašem uređaju. Vratite ovu fonoteku trenutačnim kodom za vraćanje."
zh-Hant = "你的金鑰已在你的另一部裝置上被替換。請使用你目前的還原碼還原此音樂庫。"
it = "Le tue chiavi sono state sostituite su un altro dei tuoi dispositivi. Ripristina questa libreria con il tuo codice di ripristino attuale."
tr = "Anahtarlarınız diğer cihazlarınızdan birinde değiştirildi. Bu kitaplığı geçerli geri yükleme kodunuzla geri yükleyin."
nl = "Je sleutels zijn vervangen op een ander apparaat van je. Herstel deze bibliotheek met je huidige herstelcode."
sk = "Tvoje kľúče boli nahradené na inom tvojom zariadení. Obnov túto knižnicu pomocou aktuálneho kódu na obnovenie."
hu = "A kulcsaidat lecserélték egy másik eszközödön. Állítsd vissza ezt a könyvtárat a jelenlegi visszaállítási kódoddal."
ro = "Cheile tale au fost înlocuite pe alt dispozitiv al tău. Restaurează această bibliotecă cu codul tău de restaurare actual."
el = "Τα κλειδιά σας αντικαταστάθηκαν σε άλλη συσκευή σας. Επαναφέρετε αυτή τη βιβλιοθήκη με τον τρέχοντα κωδικό επαναφοράς σας."
pt-PT = "As suas chaves foram substituídas noutro dos seus dispositivos. Restaure esta biblioteca com o seu código de restauração atual."
sv = "Dina nycklar har ersatts på en annan av dina enheter. Återställ biblioteket med din nuvarande återställningskod."
da = "Dine nøgler er blevet erstattet på en anden af dine enheder. Gendan dette bibliotek med din nuværende gendannelseskode."
nb = "Nøklene dine ble erstattet på en annen av enhetene dine. Gjenopprett dette biblioteket med den gjeldende gjenopprettingskoden din."
fi = "Avaimesi korvattiin toisella laitteellasi. Palauta tämä kirjasto nykyisellä palautuskoodillasi."

