[messages."core.sync.restore_device.warning".translations]
es = "Al restaurar se vuelve a cargar la biblioteca desde el almacenamiento con tu código de restauración actual y se descartan los cambios de este dispositivo que no se hayan sincronizado."
fr = "La restauration recharge la bibliothèque depuis le stockage avec votre code de restauration actuel et supprime les modifications de cet appareil qui n’ont pas été synchronisées."
de = "Beim Wiederherstellen wird die Mediathek mit deinem aktuellen Wiederherstellungscode erneut aus dem Speicher geladen, und Änderungen auf diesem Gerät, die noch nicht synchronisiert wurden, werden verworfen."
pt-BR = "A restauração carrega a biblioteca do armazenamento novamente com seu código de restauração atual e descarta as alterações deste dispositivo que não foram sincronizadas."
ja = "復元すると、現在の復元コードでストレージからライブラリが再度読み込まれ、このデバイスで同期されていない編集は破棄されます。"
ko = "복원하면 현재 복원 코드로 저장소에서 라이브러리를 다시 불러오며, 이 기기에서 동기화되지 않은 편집은 삭제됩니다."
zh-Hans = "恢复会使用你当前的恢复码从存储空间重新载入音乐库，并丢弃此设备上尚未同步的编辑。"
ar = "تؤدي الاستعادة إلى تحميل المكتبة من التخزين مجددًا باستخدام رمز الاستعادة الحالي، وتتجاهل التعديلات على هذا الجهاز التي لم تُزامَن."
he = "השחזור טוען שוב את הספרייה מהאחסון עם קוד השחזור הנוכחי שלך, ומבטל עריכות במכשיר זה שלא סונכרנו."
uk = "Відновлення знову завантажує бібліотеку зі сховища за вашим поточним кодом відновлення й відкидає зміни на цьому пристрої, які не синхронізовано."
bg = "Възстановяването зарежда отново библиотеката от хранилището с текущия ви код за възстановяване и отхвърля промените на това устройство, които не са синхронизирани."
pl = "Przywracanie ponownie wczytuje bibliotekę z magazynu przy użyciu bieżącego kodu przywracania i odrzuca zmiany na tym urządzeniu, które nie zostały zsynchronizowane."
cs = "Obnovení znovu načte knihovnu z úložiště pomocí vašeho aktuálního kódu pro obnovení a zahodí úpravy na tomto zařízení, které nebyly synchronizovány."
hr = "Vraćanje ponovno učitava fonoteku iz pohrane s vašim trenutačnim kodom za vraćanje i odbacuje izmjene na ovom uređaju koje nisu sinkronizirane."
zh-Hant = "還原會使用你目前的還原碼從儲存空間重新載入音樂庫，並捨棄此裝置上尚未同步的編輯。"
it = "Il ripristino ricarica la libreria dall’archivio con il tuo codice di ripristino attuale e scarta le modifiche di questo dispositivo non ancora sincronizzate."
tr = "Geri yükleme, kitaplığı geçerli geri yükleme kodunuzla depolamadan yeniden yükler ve bu cihazda eşitlenmemiş düzenlemeleri atar."
nl = "Herstellen laadt de bibliotheek opnieuw uit de opslag met je huidige herstelcode en verwijdert bewerkingen op dit apparaat die nog niet zijn gesynchroniseerd."
sk = "Obnovenie znova načíta knižnicu z úložiska pomocou vášho aktuálneho kódu na obnovenie a zahodí úpravy na tomto zariadení, ktoré neboli synchronizované."
hu = "A visszaállítás a jelenlegi visszaállítási kódoddal újra betölti a könyvtárat a tárhelyről, és elveti az ezen az eszközön végzett, még nem szinkronizált módosításokat."
ro = "Restaurarea reîncarcă biblioteca din stocare cu codul tău de restaurare actual și renunță la modificările de pe acest dispozitiv care nu au fost sincronizate."
el = "Η επαναφορά φορτώνει ξανά τη βιβλιοθήκη από τον χώρο αποθήκευσης με τον τρέχοντα κωδικό επαναφοράς σας και απορρίπτει τις επεξεργασίες σε αυτή τη συσκευή που δεν έχουν συγχρονιστεί."
pt-PT = "O restauro volta a carregar a biblioteca do armazenamento com o seu código de restauração atual e descarta as alterações deste dispositivo que não foram sincronizadas."
sv = "Återställningen läser in biblioteket från lagringen igen med din nuvarande återställningskod och tar bort ändringar på den här enheten som inte har synkroniserats."
da = "Gendannelsen indlæser biblioteket fra lageret igen med din nuværende gendannelseskode og kasserer ændringer på denne enhed, som ikke er synkroniseret."
nb = "Gjenoppretting laster inn biblioteket fra lagringen på nytt med den gjeldende gjenopprettingskoden din og forkaster endringer på denne enheten som ikke er synkronisert."
fi = "Palauttaminen lataa kirjaston tallennustilasta uudelleen nykyisellä palautuskoodillasi ja hylkää tällä laitteella tehdyt muokkaukset, joita ei ole synkronoitu."

