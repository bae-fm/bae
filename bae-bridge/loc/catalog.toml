value = "Allow these credentials to read, write, list, and delete objects in this bucket."

[messages."core.error.cloud_setup.permission_denied".translations]
es = "Permite que estas credenciales lean, escriban, enumeren y eliminen objetos de este bucket."
fr = "Autorisez ces identifiants à lire, écrire, répertorier et supprimer les objets de ce bucket."
de = "Erlaube diesen Zugangsdaten, Objekte in diesem Bucket zu lesen, zu schreiben, aufzulisten und zu löschen."
