# bae localization catalog — the single source of truth for strings that
# originate in shared Rust logic (`core.*`) and shared chrome opted in by the UI
# (`ui.*`). Source language: English. Each `value` is an ICU MessageFormat 1
# string; `args` declares each placeholder's type so `loc-gen check` can verify
# the catalog (and, once message enums exist, cross-check them).

[messages."core.import.error.candidate_import_in_progress"]
comment = "Import edit rejected because the import worker has already claimed this candidate."
value = "This import is already running and can no longer be edited."

[messages."core.import.error.candidate_import_in_progress".translations]
es = "Esta importación ya está en curso y ya no se puede editar."
fr = "Cette importation est déjà en cours et ne peut plus être modifiée."
de = "Dieser Import läuft bereits und kann nicht mehr bearbeitet werden."
pt-BR = "Esta importação já está em andamento e não pode mais ser editada."
ja = "このインポートはすでに実行中のため、編集できません。"
ko = "이 가져오기는 이미 진행 중이므로 더 이상 편집할 수 없습니다."
zh-Hans = "此导入已在进行中，无法再编辑。"
ar = "عملية الاستيراد هذه قيد التشغيل بالفعل ولم يعد من الممكن تعديلها."
he = "הייבוא הזה כבר מתבצע ולא ניתן עוד לערוך אותו."
uk = "Це імпортування вже виконується, тому його більше не можна редагувати."
bg = "Това импортиране вече се изпълнява и повече не може да се редактира."
pl = "Ten import jest już w toku i nie można go już edytować."
cs = "Tento import již probíhá a nelze jej dále upravovat."
hr = "Ovaj je uvoz već u tijeku i više se ne može uređivati."
zh-Hant = "此匯入已在進行中，無法再編輯。"
it = "Questa importazione è già in corso e non può più essere modificata."
tr = "Bu içe aktarma zaten devam ediyor ve artık düzenlenemez."
nl = "Deze import wordt al uitgevoerd en kan niet meer worden bewerkt."
sk = "Tento import už prebieha a nedá sa ďalej upravovať."
hu = "Ez az importálás már fut, és nem szerkeszthető tovább."
ro = "Acest import rulează deja și nu mai poate fi editat."
el = "Αυτή η εισαγωγή εκτελείται ήδη και δεν μπορεί πλέον να επεξεργαστεί."
pt-PT = "Esta importação já está a decorrer e não pode continuar a ser editada."
sv = "Den här importen körs redan och kan inte längre redigeras."
da = "Denne import kører allerede og kan ikke længere redigeres."
nb = "Denne importen kjører allerede og kan ikke redigeres lenger."
fi = "Tämä tuonti on jo käynnissä, eikä sitä voi enää muokata."

[messages."core.import.error.candidate_being_identified"]
comment = "A bulk import skipped this release because identification was still running for it when the import reached it."
value = "This release is still being identified. Import it once identification finishes."

[messages."core.import.error.candidate_being_identified".translations]
es = "Esta publicación aún se está identificando. Impórtala cuando termine la identificación."
fr = "Cette parution est encore en cours d’identification. Importez-la une fois l’identification terminée."
de = "Diese Veröffentlichung wird noch identifiziert. Importiere sie, sobald die Identifizierung abgeschlossen ist."
pt-BR = "Este lançamento ainda está sendo identificado. Importe-o quando a identificação terminar."
ja = "このリリースはまだ識別中です。識別が終わってからインポートしてください。"
ko = "이 릴리스는 아직 식별 중입니다. 식별이 끝나면 가져오세요."
zh-Hans = "此发行版仍在识别中。识别完成后再导入。"
ar = "لا يزال التعرف على هذا الإصدار جاريًا. استورده بعد انتهاء التعرف."
he = "ההוצאה הזו עדיין מזוהה. ייבא אותה כשהזיהוי יסתיים."
uk = "Цей реліз ще розпізнається. Імпортуйте його, коли розпізнавання завершиться."
bg = "Това издание все още се идентифицира. Импортирайте го, след като идентифицирането приключи."
pl = "To wydanie jest wciąż identyfikowane. Zaimportuj je po zakończeniu identyfikacji."
cs = "Toto vydání se stále identifikuje. Importujte ho, až identifikace skončí."
hr = "Ovo se izdanje još identificira. Uvezite ga kad identifikacija završi."
zh-Hant = "此發行版本仍在辨識中。辨識完成後再匯入。"
it = "Questa pubblicazione è ancora in fase di identificazione. Importala al termine dell’identificazione."
tr = "Bu yayın hâlâ tanımlanıyor. Tanımlama bittiğinde içe aktarın."
nl = "Deze uitgave wordt nog geïdentificeerd. Importeer haar zodra de identificatie klaar is."
sk = "Toto vydanie sa stále identifikuje. Importujte ho, keď sa identifikácia skončí."
hu = "Ennek a kiadásnak az azonosítása még folyamatban van. Importáld, ha az azonosítás befejeződött."
ro = "Această lansare este încă în curs de identificare. Importă-o după ce identificarea se încheie."
el = "Αυτή η κυκλοφορία αναγνωρίζεται ακόμη. Εισαγάγετέ την μόλις ολοκληρωθεί η αναγνώριση."
pt-PT = "Este lançamento ainda está a ser identificado. Importe-o quando a identificação terminar."
sv = "Den här utgåvan identifieras fortfarande. Importera den när identifieringen är klar."
da = "Denne udgivelse bliver stadig identificeret. Importér den, når identificeringen er færdig."
nb = "Denne utgivelsen blir fortsatt identifisert. Importer den når identifiseringen er ferdig."
fi = "Tätä julkaisua tunnistetaan vielä. Tuo se, kun tunnistus on valmis."

[messages."core.import.error.candidate_already_imported"]
comment = "Import edit rejected because this candidate has already completed importing."
value = "This import has already completed and can no longer be edited."

[messages."core.import.error.candidate_already_imported".translations]
es = "Esta importación ya ha finalizado y ya no se puede editar."
fr = "Cette importation est déjà terminée et ne peut plus être modifiée."
de = "Dieser Import ist bereits abgeschlossen und kann nicht mehr bearbeitet werden."
pt-BR = "Esta importação já foi concluída e não pode mais ser editada."
ja = "このインポートはすでに完了しているため、編集できません。"
ko = "이 가져오기는 이미 완료되어 더 이상 편집할 수 없습니다."
zh-Hans = "此导入已完成，无法再编辑。"
ar = "اكتملت عملية الاستيراد هذه بالفعل ولم يعد من الممكن تعديلها."
he = "הייבוא הזה כבר הושלם ולא ניתן עוד לערוך אותו."
uk = "Це імпортування вже завершено, тому його більше не можна редагувати."
bg = "Това импортиране вече е завършено и повече не може да се редактира."
pl = "Ten import został już ukończony i nie można go już edytować."
cs = "Tento import již byl dokončen a nelze jej dále upravovat."
hr = "Ovaj je uvoz već dovršen i više se ne može uređivati."
zh-Hant = "此匯入已完成，無法再編輯。"
it = "Questa importazione è già terminata e non può più essere modificata."
tr = "Bu içe aktarma zaten tamamlandı ve artık düzenlenemez."
nl = "Deze import is al voltooid en kan niet meer worden bewerkt."
sk = "Tento import je už dokončený a nedá sa ďalej upravovať."
hu = "Ez az importálás már befejeződött, és nem szerkeszthető tovább."
ro = "Acest import s-a încheiat deja și nu mai poate fi editat."
el = "Αυτή η εισαγωγή έχει ήδη ολοκληρωθεί και δεν μπορεί πλέον να επεξεργαστεί."
pt-PT = "Esta importação já terminou e não pode continuar a ser editada."
sv = "Den här importen är redan klar och kan inte längre redigeras."
da = "Denne import er allerede afsluttet og kan ikke længere redigeres."
nb = "Denne importen er allerede fullført og kan ikke redigeres lenger."
fi = "Tämä tuonti on jo valmis, eikä sitä voi enää muokata."

[messages."core.import.grouping.source_changed"]
comment = "A release read from several folders can't be worked on: one of its folders changed after the folders were combined."
value = "A folder this release is read from has changed. Separate the release and combine its folders again."

[messages."core.import.grouping.source_changed".translations]
es = "Una de las carpetas de las que se lee esta publicación ha cambiado. Separa la publicación y vuelve a combinar sus carpetas."
fr = "Un dossier à partir duquel cette parution est lue a changé. Séparez la parution et combinez de nouveau ses dossiers."
de = "Ein Ordner, aus dem diese Veröffentlichung gelesen wird, hat sich geändert. Trenne die Veröffentlichung und fasse ihre Ordner erneut zusammen."
pt-BR = "Uma pasta da qual este lançamento é lido foi alterada. Separe o lançamento e combine as pastas dele novamente."
ja = "このリリースの読み込み元フォルダのひとつが変更されました。リリースを分割してから、フォルダをもう一度結合してください。"
ko = "이 릴리스를 읽어 오는 폴더 중 하나가 변경되었습니다. 릴리스를 분리한 다음 폴더를 다시 결합하세요."
zh-Hans = "此发行版读取的某个文件夹已更改。请拆分此发行版，然后重新合并其文件夹。"
ar = "تغيّر أحد المجلدات التي يُقرأ منها هذا الإصدار. افصل الإصدار ثم ادمج مجلداته من جديد."
he = "אחת התיקיות שמהן ההוצאה הזו נקראת השתנתה. פצל את ההוצאה ושלב שוב את התיקיות שלה."
uk = "Одна з папок, з яких читається цей реліз, змінилася. Розділіть реліз і знову об’єднайте його папки."
bg = "Една от папките, от които се чете това издание, е променена. Разделете изданието и отново обединете папките му."
pl = "Jeden z folderów, z których odczytywane jest to wydanie, zmienił się. Rozdziel wydanie i ponownie połącz jego foldery."
cs = "Jedna ze složek, ze kterých se toto vydání čte, se změnila. Rozdělte vydání a znovu spojte jeho složky."
hr = "Jedna od mapa iz kojih se čita ovo izdanje promijenila se. Razdvojite izdanje i ponovno spojite njegove mape."
zh-Hant = "此發行版本讀取的某個資料夾已變更。請拆分此發行版本，然後重新合併其資料夾。"
it = "Una delle cartelle da cui viene letta questa pubblicazione è cambiata. Separa la pubblicazione e combina di nuovo le sue cartelle."
tr = "Bu yayının okunduğu klasörlerden biri değişti. Yayını ayırın ve klasörlerini yeniden birleştirin."
nl = "Een map waaruit deze uitgave wordt gelezen, is gewijzigd. Splits de uitgave en combineer de mappen opnieuw."
sk = "Jeden z priečinkov, z ktorých sa toto vydanie číta, sa zmenil. Rozdeľte vydanie a znova spojte jeho priečinky."
hu = "A kiadás egyik forrásmappája megváltozott. Bontsd szét a kiadást, és egyesítsd újra a mappáit."
ro = "Unul dintre dosarele din care este citită această lansare s-a schimbat. Separă lansarea și combină din nou dosarele ei."
el = "Ένας από τους φακέλους από τους οποίους διαβάζεται αυτή η κυκλοφορία άλλαξε. Διαχωρίστε την κυκλοφορία και συνδυάστε ξανά τους φακέλους της."
pt-PT = "Uma das pastas a partir das quais este lançamento é lido foi alterada. Separe o lançamento e combine novamente as respetivas pastas."
sv = "En mapp som den här utgåvan läses från har ändrats. Dela upp utgåvan och kombinera dess mappar igen."
da = "En mappe, som denne udgivelse læses fra, er blevet ændret. Del udgivelsen op, og kombinér dens mapper igen."
nb = "En mappe denne utgivelsen leses fra, er endret. Del opp utgivelsen og kombiner mappene på nytt."
fi = "Yksi kansioista, joista tämä julkaisu luetaan, on muuttunut. Erota julkaisu ja yhdistä sen kansiot uudelleen."

[messages."core.import.grouping.source_gone"]
comment = "A release read from several folders can't be worked on: one of its folders is no longer there."
value = "A folder this release is read from is no longer there. Separate the release and combine its folders again."

[messages."core.import.grouping.source_gone".translations]
es = "Una de las carpetas de las que se lee esta publicación ya no existe. Separa la publicación y vuelve a combinar sus carpetas."
fr = "Un dossier à partir duquel cette parution est lue n’existe plus. Séparez la parution et combinez de nouveau ses dossiers."
de = "Ein Ordner, aus dem diese Veröffentlichung gelesen wird, ist nicht mehr vorhanden. Trenne die Veröffentlichung und fasse ihre Ordner erneut zusammen."
pt-BR = "Uma pasta da qual este lançamento é lido não existe mais. Separe o lançamento e combine as pastas dele novamente."
ja = "このリリースの読み込み元フォルダのひとつが見つかりません。リリースを分割してから、フォルダをもう一度結合してください。"
ko = "이 릴리스를 읽어 오는 폴더 중 하나가 더 이상 없습니다. 릴리스를 분리한 다음 폴더를 다시 결합하세요."
zh-Hans = "此发行版读取的某个文件夹已不存在。请拆分此发行版，然后重新合并其文件夹。"
ar = "لم يعد أحد المجلدات التي يُقرأ منها هذا الإصدار موجودًا. افصل الإصدار ثم ادمج مجلداته من جديد."
he = "אחת התיקיות שמהן ההוצאה הזו נקראת כבר לא קיימת. פצל את ההוצאה ושלב שוב את התיקיות שלה."
uk = "Однієї з папок, з яких читається цей реліз, більше немає. Розділіть реліз і знову об’єднайте його папки."
bg = "Една от папките, от които се чете това издание, вече не съществува. Разделете изданието и отново обединете папките му."
pl = "Jednego z folderów, z których odczytywane jest to wydanie, już nie ma. Rozdziel wydanie i ponownie połącz jego foldery."
cs = "Jedna ze složek, ze kterých se toto vydání čte, už neexistuje. Rozdělte vydání a znovu spojte jeho složky."
hr = "Jedna od mapa iz kojih se čita ovo izdanje više ne postoji. Razdvojite izdanje i ponovno spojite njegove mape."
zh-Hant = "此發行版本讀取的某個資料夾已不存在。請拆分此發行版本，然後重新合併其資料夾。"
it = "Una delle cartelle da cui viene letta questa pubblicazione non esiste più. Separa la pubblicazione e combina di nuovo le sue cartelle."
tr = "Bu yayının okunduğu klasörlerden biri artık yok. Yayını ayırın ve klasörlerini yeniden birleştirin."
nl = "Een map waaruit deze uitgave wordt gelezen, bestaat niet meer. Splits de uitgave en combineer de mappen opnieuw."
sk = "Jeden z priečinkov, z ktorých sa toto vydanie číta, už neexistuje. Rozdeľte vydanie a znova spojte jeho priečinky."
hu = "A kiadás egyik forrásmappája már nem létezik. Bontsd szét a kiadást, és egyesítsd újra a mappáit."
ro = "Unul dintre dosarele din care este citită această lansare nu mai există. Separă lansarea și combină din nou dosarele ei."
el = "Ένας από τους φακέλους από τους οποίους διαβάζεται αυτή η κυκλοφορία δεν υπάρχει πια. Διαχωρίστε την κυκλοφορία και συνδυάστε ξανά τους φακέλους της."
pt-PT = "Uma das pastas a partir das quais este lançamento é lido já não existe. Separe o lançamento e combine novamente as respetivas pastas."
sv = "En mapp som den här utgåvan läses från finns inte längre. Dela upp utgåvan och kombinera dess mappar igen."
da = "En mappe, som denne udgivelse læses fra, findes ikke længere. Del udgivelsen op, og kombinér dens mapper igen."
nb = "En mappe denne utgivelsen leses fra, finnes ikke lenger. Del opp utgivelsen og kombiner mappene på nytt."
fi = "Yhtä kansioista, joista tämä julkaisu luetaan, ei enää ole. Erota julkaisu ja yhdistä sen kansiot uudelleen."

[messages."core.import.grouping.folder_files_taken"]
comment = "Folders picked to combine sit in one folder whose own files (a cover, a booklet) already go with another combined release; a folder's files go with one release at most."
value = "The cover and other files beside these folders already go with another combined release. Separate that release first."

[messages."core.import.grouping.folder_files_taken".translations]
es = "La portada y los demás archivos junto a estas carpetas ya pertenecen a otra publicación combinada. Separa primero esa publicación."
fr = "La pochette et les autres fichiers à côté de ces dossiers appartiennent déjà à une autre parution combinée. Séparez d’abord cette parution."
de = "Das Cover und die anderen Dateien neben diesen Ordnern gehören bereits zu einer anderen zusammengefassten Veröffentlichung. Trenne zuerst diese Veröffentlichung."
pt-BR = "A capa e os outros arquivos ao lado destas pastas já pertencem a outro lançamento combinado. Separe esse lançamento primeiro."
ja = "これらのフォルダと同じ場所にあるカバーなどのファイルは、すでに別の結合したリリースに含まれています。先にそのリリースを分割してください。"
ko = "이 폴더들과 같은 위치에 있는 커버와 기타 파일은 이미 결합된 다른 릴리스에 속해 있습니다. 먼저 그 릴리스를 분리하세요."
zh-Hans = "这些文件夹旁边的封面和其他文件已属于另一个合并的发行版。请先拆分那个发行版。"
ar = "الغلاف والملفات الأخرى بجانب هذه المجلدات تابعة بالفعل لإصدار مدمج آخر. افصل ذلك الإصدار أولًا."
he = "העטיפה ושאר הקבצים שליד התיקיות האלה כבר שייכים להוצאה משולבת אחרת. פצל קודם את ההוצאה ההיא."
uk = "Обкладинка та інші файли поруч із цими папками вже належать іншому об’єднаному релізу. Спочатку розділіть той реліз."
bg = "Обложката и другите файлове до тези папки вече принадлежат на друго обединено издание. Първо разделете това издание."
pl = "Okładka i inne pliki obok tych folderów należą już do innego połączonego wydania. Najpierw rozdziel tamto wydanie."
cs = "Obal a další soubory vedle těchto složek už patří k jinému spojenému vydání. Nejprve rozdělte toto vydání."
hr = "Omot i ostale datoteke uz ove mape već pripadaju drugom spojenom izdanju. Najprije razdvojite to izdanje."
zh-Hant = "這些資料夾旁的封面和其他檔案已屬於另一個合併的發行版本。請先拆分那個發行版本。"
it = "La copertina e gli altri file accanto a queste cartelle appartengono già a un’altra pubblicazione combinata. Separa prima quella pubblicazione."
tr = "Bu klasörlerin yanındaki kapak ve diğer dosyalar zaten birleştirilmiş başka bir yayına ait. Önce o yayını ayırın."
nl = "De hoes en andere bestanden naast deze mappen horen al bij een andere gecombineerde uitgave. Splits eerst die uitgave."
sk = "Obal a ďalšie súbory vedľa týchto priečinkov už patria k inému spojenému vydaniu. Najprv rozdeľte toto vydanie."
hu = "A mappák melletti borító és többi fájl már egy másik egyesített kiadáshoz tartozik. Előbb bontsd szét azt a kiadást."
ro = "Coperta și celelalte fișiere de lângă aceste dosare aparțin deja altei lansări combinate. Separă mai întâi acea lansare."
el = "Το εξώφυλλο και τα άλλα αρχεία δίπλα σε αυτούς τους φακέλους ανήκουν ήδη σε άλλη συνδυασμένη κυκλοφορία. Διαχωρίστε πρώτα εκείνη την κυκλοφορία."
pt-PT = "A capa e os outros ficheiros junto a estas pastas já pertencem a outro lançamento combinado. Separe primeiro esse lançamento."
sv = "Omslaget och andra filer bredvid de här mapparna hör redan till en annan kombinerad utgåva. Dela upp den utgåvan först."
da = "Coveret og de andre filer ved siden af disse mapper hører allerede til en anden kombineret udgivelse. Del den udgivelse op først."
nb = "Omslaget og de andre filene ved siden av disse mappene hører allerede til en annen kombinert utgivelse. Del opp den utgivelsen først."
fi = "Näiden kansioiden vieressä olevat kansikuva ja muut tiedostot kuuluvat jo toiseen yhdistettyyn julkaisuun. Erota ensin se julkaisu."

[messages."core.import.grouping.folder_files_contested"]
comment = "Several combined releases sit in one folder whose own files (a cover, a booklet) can go with only one of them."
value = "The cover and other files beside these folders would go with more than one combined release. Separate all but one of them."

[messages."core.import.grouping.folder_files_contested".translations]
es = "La portada y los demás archivos junto a estas carpetas pertenecerían a más de una publicación combinada. Separa todas menos una."
fr = "La pochette et les autres fichiers à côté de ces dossiers appartiendraient à plusieurs parutions combinées. Séparez-les toutes sauf une."
de = "Das Cover und die anderen Dateien neben diesen Ordnern würden zu mehr als einer zusammengefassten Veröffentlichung gehören. Trenne alle bis auf eine."
pt-BR = "A capa e os outros arquivos ao lado destas pastas pertenceriam a mais de um lançamento combinado. Separe todos, menos um."
