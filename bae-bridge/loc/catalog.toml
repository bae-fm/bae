ja = "接続できません：このAirPlayレシーバーは、baeが読み取れない設定を通知しています。"
ko = "연결할 수 없음: 이 AirPlay 수신 기기가 bae가 읽을 수 없는 설정을 알리고 있습니다."
zh-Hans = "无法连接：此 AirPlay 接收设备通告了 bae 无法读取的设置。"
ar = "تعذّر الاتصال: يعلن جهاز استقبال AirPlay هذا عن إعدادات لا يستطيع bae قراءتها."
he = "לא ניתן להתחבר: מקלט ה‑AirPlay הזה מפרסם הגדרות ש‑bae לא יכול לקרוא."
uk = "Не вдається підключитися: цей приймач AirPlay оголошує налаштування, які bae не може прочитати."
bg = "Не може да се свърже: този приемник AirPlay обявява настройки, които bae не може да прочете."
pl = "Nie można połączyć: ten odbiornik AirPlay ogłasza ustawienia, których bae nie potrafi odczytać."
cs = "Nelze se připojit: tento přijímač AirPlay ohlašuje nastavení, která bae neumí přečíst."
hr = "Povezivanje nije moguće: ovaj AirPlay prijamnik oglašava postavke koje bae ne može pročitati."
zh-Hant = "無法連線：此 AirPlay 接收裝置通告了 bae 無法讀取的設定。"
it = "Impossibile connettersi: questo ricevitore AirPlay annuncia impostazioni che bae non riesce a leggere."
tr = "Bağlanılamıyor: bu AirPlay alıcısı bae'nin okuyamadığı ayarlar bildiriyor."
nl = "Kan geen verbinding maken: deze AirPlay-ontvanger meldt instellingen die bae niet kan lezen."
sk = "Nedá sa pripojiť: tento prijímač AirPlay ohlasuje nastavenia, ktoré bae nedokáže prečítať."
hu = "Nem lehet csatlakozni: ez az AirPlay-vevő olyan beállításokat hirdet, amelyeket a bae nem tud beolvasni."
ro = "Nu se poate conecta: acest receptor AirPlay anunță setări pe care bae nu le poate citi."
el = "Δεν είναι δυνατή η σύνδεση: αυτός ο δέκτης AirPlay ανακοινώνει ρυθμίσεις που το bae δεν μπορεί να διαβάσει."
pt-PT = "Não é possível ligar: este recetor AirPlay anuncia definições que o bae não consegue ler."
sv = "Kan inte ansluta: den här AirPlay-mottagaren annonserar inställningar som bae inte kan läsa."
da = "Kan ikke oprette forbindelse: denne AirPlay-modtager annoncerer indstillinger, som bae ikke kan læse."
nb = "Kan ikke koble til: denne AirPlay-mottakeren annonserer innstillinger som bae ikke kan lese."
fi = "Yhteyttä ei voi muodostaa: tämä AirPlay-vastaanotin ilmoittaa asetuksia, joita bae ei pysty lukemaan."

[messages."core.error.keyring.locked"]
comment = "The OS keychain refused the read because the session is locked or the display is asleep; the key is present and the read succeeds again after unlock."
value = "This device's keychain is locked. Unlock the device and bae will pick up where it left off."

[messages."core.error.keyring.locked".translations]
es = "El llavero de este dispositivo está bloqueado. Desbloquea el dispositivo y bae continuará donde lo dejó."
fr = "Le trousseau de cet appareil est verrouillé. Déverrouillez l’appareil et bae reprendra où il s’est arrêté."
de = "Der Schlüsselbund dieses Geräts ist gesperrt. Entsperre das Gerät, und bae macht dort weiter, wo es aufgehört hat."
pt-BR = "As chaves deste dispositivo estão bloqueadas. Desbloqueie o dispositivo e o bae continuará de onde parou."
ja = "このデバイスのキーチェーンがロックされています。デバイスのロックを解除すると、baeは中断したところから再開します。"
ko = "이 기기의 키체인이 잠겨 있습니다. 기기를 잠금 해제하면 bae가 중단된 지점부터 이어서 진행합니다."
zh-Hans = "此设备的钥匙串已锁定。解锁设备后，bae 会从中断处继续。"
ar = "سلسلة مفاتيح هذا الجهاز مقفلة. ألغِ قفل الجهاز وسيتابع bae من حيث توقف."
he = "מחזיק המפתחות של המכשיר הזה נעול. שחרר את נעילת המכשיר ו-bae ימשיך מהנקודה שבה עצר."
uk = "В’язку ключів цього пристрою заблоковано. Розблокуйте пристрій, і bae продовжить із того місця, де зупинився."
bg = "Ключодържателят на това устройство е заключен. Отключете устройството и bae ще продължи оттам, докъдето е стигнал."
pl = "Pęk kluczy tego urządzenia jest zablokowany. Odblokuj urządzenie, a bae wznowi pracę w miejscu, w którym przerwał."
cs = "Klíčenka tohoto zařízení je uzamčená. Odemkněte zařízení a bae bude pokračovat tam, kde skončil."
hr = "Privjesak ključeva ovog uređaja je zaključan. Otključajte uređaj i bae će nastaviti gdje je stao."
zh-Hant = "此裝置的鑰匙圈已鎖定。解鎖裝置後，bae 會從中斷處繼續。"
it = "Il portachiavi di questo dispositivo è bloccato. Sblocca il dispositivo e bae riprenderà da dove si era fermato."
tr = "Bu cihazın anahtar zinciri kilitli. Cihazın kilidini açın; bae kaldığı yerden devam edecek."
nl = "De sleutelhanger van dit apparaat is vergrendeld. Ontgrendel het apparaat, dan gaat bae verder waar het gebleven was."
sk = "Kľúčenka tohto zariadenia je zamknutá. Odomkni zariadenie a bae bude pokračovať tam, kde skončil."
hu = "Ennek az eszköznek a kulcstartója zárolva van. Oldd fel az eszközt, és a bae ott folytatja, ahol abbahagyta."
ro = "Brelocul acestui dispozitiv este blocat. Deblochează dispozitivul și bae va continua de unde a rămas."
el = "Το μπρελόκ αυτής της συσκευής είναι κλειδωμένο. Ξεκλειδώστε τη συσκευή και το bae θα συνεχίσει από εκεί που σταμάτησε."
pt-PT = "O porta-chaves deste dispositivo está bloqueado. Desbloqueie o dispositivo e o bae continua de onde ficou."
sv = "Den här enhetens nyckelring är låst. Lås upp enheten så fortsätter bae där den slutade."
da = "Denne enheds nøglering er låst. Lås enheden op, så fortsætter bae, hvor den slap."
nb = "Nøkkelringen på denne enheten er låst. Lås opp enheten, så fortsetter bae der den slapp."
fi = "Tämän laitteen avainnippu on lukittu. Avaa laitteen lukitus, niin bae jatkaa siitä, mihin se jäi."

[messages."core.error.keyring.entitlement_missing"]
comment = "Apple's keychain refused every call because this copy of the app was signed without its keychain entitlement. A packaging fault: the person's keychain is fine, and retrying or unlocking doesn't help."
value = "This build of bae was signed without permission to use the keychain, so it can't read or save your keys."

[messages."core.error.keyring.entitlement_missing".translations]
es = "Esta versión de bae se firmó sin permiso para usar el llavero, así que no puede leer ni guardar tus claves."
fr = "Cette version de bae a été signée sans l’autorisation d’utiliser le trousseau : elle ne peut ni lire ni enregistrer vos clés."
de = "Dieser Build von bae wurde ohne die Berechtigung signiert, den Schlüsselbund zu verwenden, und kann deine Schlüssel daher weder lesen noch speichern."
pt-BR = "Esta versão do bae foi assinada sem permissão para usar as chaves, então não consegue ler nem salvar suas chaves."
ja = "このビルドのbaeはキーチェーンを使用する権限なしで署名されているため、キーを読み込むことも保存することもできません。"
ko = "이 bae 빌드는 키체인 사용 권한 없이 서명되어 키를 읽거나 저장할 수 없습니다."
zh-Hans = "此 bae 版本在签名时未获得使用钥匙串的权限，因此无法读取或保存你的密钥。"
ar = "وُقِّع هذا الإصدار من bae دون إذن باستخدام سلسلة المفاتيح، لذا لا يمكنه قراءة مفاتيحك أو حفظها."
he = "גרסה זו של bae נחתמה ללא הרשאה להשתמש במחזיק המפתחות, ולכן היא לא יכולה לקרוא או לשמור את המפתחות שלך."
uk = "Цю збірку bae підписано без дозволу на використання в’язки ключів, тому вона не може читати чи зберігати ваші ключі."
bg = "Тази версия на bae е подписана без разрешение за използване на ключодържателя, затова не може да чете или запазва ключовете ви."
pl = "Ta wersja bae została podpisana bez uprawnienia do korzystania z pęku kluczy, więc nie może odczytywać ani zapisywać twoich kluczy."
cs = "Tato verze bae byla podepsána bez oprávnění používat klíčenku, takže nemůže číst ani ukládat vaše klíče."
hr = "Ova verzija aplikacije bae potpisana je bez dopuštenja za korištenje privjeska ključeva pa ne može čitati ni spremati vaše ključeve."
zh-Hant = "此 bae 版本在簽署時未取得使用鑰匙圈的權限，因此無法讀取或儲存你的密鑰。"
it = "Questa versione di bae è stata firmata senza il permesso di usare il portachiavi, quindi non può leggere né salvare le tue chiavi."
tr = "bae'nin bu sürümü anahtar zincirini kullanma izni olmadan imzalandığı için anahtarlarınızı okuyamaz veya kaydedemez."
nl = "Deze versie van bae is ondertekend zonder toestemming om de sleutelhanger te gebruiken, dus kan ze je sleutels niet lezen of bewaren."
sk = "Táto verzia bae bola podpísaná bez povolenia používať kľúčenku, takže nemôže čítať ani ukladať tvoje kľúče."
hu = "A bae ezen verzióját a kulcstartó használatára vonatkozó engedély nélkül írták alá, ezért nem tudja olvasni vagy menteni a kulcsaidat."
ro = "Această versiune bae a fost semnată fără permisiunea de a folosi brelocul, așa că nu îți poate citi sau salva cheile."
el = "Αυτή η έκδοση του bae υπογράφηκε χωρίς άδεια χρήσης του μπρελόκ, οπότε δεν μπορεί να διαβάσει ή να αποθηκεύσει τα κλειδιά σας."
pt-PT = "Esta versão do bae foi assinada sem permissão para usar o porta-chaves, por isso não consegue ler nem guardar as suas chaves."
sv = "Den här versionen av bae signerades utan behörighet att använda nyckelringen, så den kan inte läsa eller spara dina nycklar."
da = "Denne version af bae blev signeret uden tilladelse til at bruge nøgleringen, så den kan ikke læse eller gemme dine nøgler."
nb = "Denne versjonen av bae ble signert uten tillatelse til å bruke nøkkelringen, så den kan ikke lese eller lagre nøklene dine."
fi = "Tämä bae-versio on allekirjoitettu ilman lupaa käyttää avainnippua, joten se ei voi lukea eikä tallentaa avaimiasi."

[messages."core.error.keyring.saved_codes_full"]
comment = "Android's Block Store, where coven saves the person's restore codes on a device, already holds as many entries as Android keeps for an app, so this library's restore code couldn't be saved."
value = "This device already keeps as many restore codes as Android allows, so this library's code can't be saved on it."

[messages."core.error.keyring.saved_codes_full".translations]
es = "Este dispositivo ya guarda tantos códigos de restauración como permite Android, así que no se puede guardar el de esta biblioteca."
fr = "Cet appareil conserve déjà autant de codes de restauration qu’Android le permet : celui de cette bibliothèque ne peut pas y être enregistré."
de = "Dieses Gerät speichert bereits so viele Wiederherstellungscodes, wie Android erlaubt, daher kann der Code dieser Bibliothek nicht darauf gespeichert werden."
pt-BR = "Este dispositivo já guarda tantos códigos de restauração quanto o Android permite, então o código desta biblioteca não pode ser salvo nele."
ja = "このデバイスには Android が許可する上限まで復元コードが保存されているため、このライブラリのコードを保存できません。"
ko = "이 기기에는 Android가 허용하는 최대 개수의 복원 코드가 이미 저장되어 있어 이 라이브러리의 코드를 저장할 수 없습니다."
zh-Hans = "此设备保存的恢复码已达到 Android 允许的上限，因此无法保存此库的恢复码。"
ar = "يحتفظ هذا الجهاز بالفعل بأكبر عدد من رموز الاستعادة يسمح به Android، لذا لا يمكن حفظ رمز هذه المكتبة عليه."
he = "המכשיר הזה כבר שומר את מספר קודי השחזור המרבי ש-Android מאפשר, ולכן לא ניתן לשמור בו את הקוד של הספרייה הזו."
uk = "Цей пристрій уже зберігає стільки кодів відновлення, скільки дозволяє Android, тому код цієї бібліотеки не можна на ньому зберегти."
bg = "Това устройство вече пази толкова кодове за възстановяване, колкото позволява Android, затова кодът на тази библиотека не може да бъде запазен на него."
pl = "To urządzenie przechowuje już tyle kodów przywracania, ile pozwala Android, więc nie można na nim zapisać kodu tej biblioteki."
cs = "Toto zařízení už uchovává tolik kódů pro obnovení, kolik Android dovoluje, takže kód této knihovny na něj nelze uložit."
hr = "Ovaj uređaj već čuva onoliko kodova za vraćanje koliko Android dopušta pa se kod ove fonoteke ne može spremiti na njega."
zh-Hant = "此裝置儲存的還原碼已達 Android 允許的上限，因此無法儲存此資料庫的還原碼。"
it = "Questo dispositivo conserva già tutti i codici di ripristino consentiti da Android, quindi non è possibile salvarvi il codice di questa libreria."
tr = "Bu cihaz Android'in izin verdiği kadar geri yükleme kodunu zaten saklıyor, bu yüzden bu kitaplığın kodu kaydedilemiyor."
nl = "Dit apparaat bewaart al zoveel herstelcodes als Android toestaat, dus de code van deze bibliotheek kan er niet op worden bewaard."
sk = "Toto zariadenie už uchováva toľko kódov na obnovenie, koľko Android dovoľuje, takže kód tejto knižnice doň nemožno uložiť."
hu = "Ez az eszköz már annyi visszaállítási kódot tárol, amennyit az Android enged, ezért ennek a könyvtárnak a kódja nem menthető rá."
ro = "Acest dispozitiv păstrează deja câte coduri de restaurare permite Android, așa că nu se poate salva pe el codul acestei biblioteci."
el = "Αυτή η συσκευή κρατά ήδη όσους κωδικούς επαναφοράς επιτρέπει το Android, οπότε ο κωδικός αυτής της βιβλιοθήκης δεν μπορεί να αποθηκευτεί σε αυτή."
pt-PT = "Este dispositivo já guarda tantos códigos de restauração quanto o Android permite, por isso o código desta biblioteca não pode ser guardado nele."
sv = "Den här enheten sparar redan så många återställningskoder som Android tillåter, så det här bibliotekets kod kan inte sparas på den."
da = "Denne enhed gemmer allerede så mange gendannelseskoder, som Android tillader, så dette biblioteks kode kan ikke gemmes på den."
nb = "Denne enheten lagrer allerede så mange gjenopprettingskoder som Android tillater, så koden til dette biblioteket kan ikke lagres på den."
fi = "Tähän laitteeseen on jo tallennettu niin monta palautuskoodia kuin Android sallii, joten tämän kirjaston koodia ei voi tallentaa siihen."

[messages."core.error.keyring.saved_code_too_large"]
comment = "The restore code coven saves for the person doesn't fit in one entry of Android's Block Store, even with the library's name shortened."
value = "This library's restore code is too large to save on this device."

[messages."core.error.keyring.saved_code_too_large".translations]
es = "El código de restauración de esta biblioteca es demasiado grande para guardarlo en este dispositivo."
fr = "Le code de restauration de cette bibliothèque est trop volumineux pour être enregistré sur cet appareil."
de = "Der Wiederherstellungscode dieser Bibliothek ist zu groß, um auf diesem Gerät gespeichert zu werden."
pt-BR = "O código de restauração desta biblioteca é grande demais para ser salvo neste dispositivo."
ja = "このライブラリの復元コードは大きすぎるため、このデバイスに保存できません。"
ko = "이 라이브러리의 복원 코드가 너무 커서 이 기기에 저장할 수 없습니다."
zh-Hans = "此库的恢复码太大，无法保存在此设备上。"
ar = "رمز استرداد هذه المكتبة أكبر من أن يُحفظ على هذا الجهاز."
he = "קוד השחזור של הספרייה הזו גדול מכדי לשמור אותו במכשיר הזה."
uk = "Код відновлення цієї бібліотеки завеликий, щоб зберегти його на цьому пристрої."
bg = "Кодът за възстановяване на тази библиотека е твърде голям, за да бъде запазен на това устройство."
pl = "Kod przywracania tej biblioteki jest za duży, aby zapisać go na tym urządzeniu."
cs = "Kód pro obnovení této knihovny je příliš velký na to, aby se dal uložit do tohoto zařízení."
hr = "Kod za vraćanje ove fonoteke prevelik je da bi se spremio na ovaj uređaj."
zh-Hant = "此資料庫的還原碼太大，無法儲存在此裝置上。"
it = "Il codice di ripristino di questa libreria è troppo grande per essere salvato su questo dispositivo."
tr = "Bu kitaplığın geri yükleme kodu bu cihaza kaydedilemeyecek kadar büyük."
nl = "De herstelcode van deze bibliotheek is te groot om op dit apparaat te bewaren."
sk = "Kód na obnovenie tejto knižnice je príliš veľký na to, aby sa dal uložiť do tohto zariadenia."
hu = "Ennek a könyvtárnak a visszaállítási kódja túl nagy ahhoz, hogy erre az eszközre menthető legyen."
ro = "Codul de restaurare al acestei biblioteci este prea mare pentru a fi salvat pe acest dispozitiv."
el = "Ο κωδικός επαναφοράς αυτής της βιβλιοθήκης είναι πολύ μεγάλος για να αποθηκευτεί σε αυτή τη συσκευή."
pt-PT = "O código de restauração desta biblioteca é demasiado grande para ser guardado neste dispositivo."
sv = "Det här bibliotekets återställningskod är för stor för att sparas på den här enheten."
da = "Dette biblioteks gendannelseskode er for stor til at blive gemt på denne enhed."
nb = "Gjenopprettingskoden til dette biblioteket er for stor til å lagres på denne enheten."
fi = "Tämän kirjaston palautuskoodi on liian suuri tallennettavaksi tähän laitteeseen."

[messages."core.error.category.membership"]
comment = "Generic error line: a library-sharing membership operation failed."
value = "Something went wrong updating library sharing."

[messages."core.error.category.membership".translations]
es = "Algo salió mal al actualizar el uso compartido de la biblioteca."
fr = "Une erreur s'est produite lors de la mise à jour du partage de la bibliothèque."
de = "Beim Aktualisieren der Bibliotheksfreigabe ist etwas schiefgelaufen."
pt-BR = "Algo deu errado ao atualizar o compartilhamento da biblioteca."
ja = "ライブラリの共有を更新する際に問題が発生しました。"
ko = "라이브러리 공유를 업데이트하는 중 문제가 발생했습니다."
zh-Hans = "更新媒体库共享时出现问题。"
ar = "حدث خطأ أثناء تحديث مشاركة المكتبة."
he = "משהו השתבש בעדכון שיתוף הספרייה."
uk = "Під час оновлення спільного доступу до бібліотеки сталася помилка."
bg = "Възникна проблем при обновяването на споделянето на библиотеката."
pl = "Coś poszło nie tak podczas aktualizacji udostępniania biblioteki."
cs = "Při aktualizaci sdílení knihovny došlo k chybě."
hr = "Nešto je pošlo po zlu pri ažuriranju dijeljenja fonoteke."
zh-Hant = "更新資料庫共享時發生問題。"
it = "Si è verificato un problema durante l'aggiornamento della condivisione della libreria."
tr = "Kitaplık paylaşımı güncellenirken bir sorun oluştu."
nl = "Er is iets misgegaan bij het bijwerken van het delen van de bibliotheek."
sk = "Pri aktualizácii zdieľania knižnice sa niečo pokazilo."
hu = "Hiba történt a könyvtármegosztás frissítésekor."
ro = "Ceva nu a mers bine la actualizarea partajării bibliotecii."
el = "Κάτι πήγε στραβά κατά την ενημέρωση της κοινής χρήσης της βιβλιοθήκης."
pt-PT = "Algo correu mal ao atualizar a partilha da biblioteca."
sv = "Något gick fel när bibliotekets delning uppdaterades."
da = "Noget gik galt, da bibliotekets deling blev opdateret."
nb = "Noe gikk galt da delingen av biblioteket ble oppdatert."
fi = "Jokin meni pieleen kirjaston jakamista päivitettäessä."
[messages."core.error.category.invite_joining"]
comment = "Error line when cancelling an invite fails because the inviting device has already begun letting the invited person into the library."
value = "This person is already joining."

[messages."core.error.category.invite_joining".translations]
es = "Esta persona ya se está uniendo."
