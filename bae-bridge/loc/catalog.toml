[messages."core.sync.reset_device.warning".translations]
es = "Al restablecer se descartan los cambios de este dispositivo que no se hayan sincronizado."
fr = "La réinitialisation supprime les modifications de cet appareil qui n’ont pas été synchronisées."
de = "Das Zurücksetzen verwirft Änderungen auf diesem Gerät, die noch nicht synchronisiert wurden."
pt-BR = "A redefinição descarta as alterações deste dispositivo que não foram sincronizadas."
ja = "リセットすると、このデバイスの未同期の変更は破棄されます。"
ko = "초기화하면 이 기기에서 동기화되지 않은 편집 내용이 삭제됩니다."
zh-Hans = "重置将丢弃此设备上尚未同步的编辑。"
ar = "تؤدي إعادة التعيين إلى تجاهل تعديلات هذا الجهاز التي لم تتم مزامنتها."
he = "האיפוס ימחק שינויים במכשיר זה שטרם סונכרנו."
uk = "Скидання відкине зміни на цьому пристрої, які ще не синхронізовано."
bg = "Нулирането отхвърля промените на това устройство, които не са синхронизирани."
pl = "Resetowanie odrzuci zmiany na tym urządzeniu, które nie zostały zsynchronizowane."
cs = "Resetování zahodí úpravy na tomto zařízení, které nebyly synchronizovány."
hr = "Ponovno postavljanje odbacuje izmjene na ovom uređaju koje nisu sinkronizirane."
zh-Hant = "重設將捨棄此裝置上尚未同步的編輯。"
it = "La reimpostazione elimina le modifiche su questo dispositivo che non sono state sincronizzate."
tr = "Sıfırlama, bu aygıttaki eşitlenmemiş düzenlemeleri siler."
nl = "Herstellen verwijdert wijzigingen op dit apparaat die nog niet zijn gesynchroniseerd."
sk = "Obnovenie zahodí úpravy na tomto zariadení, ktoré neboli synchronizované."
hu = "Az alaphelyzetbe állítás elveti az eszközön lévő, még nem szinkronizált módosításokat."
ro = "Resetarea elimină modificările de pe acest dispozitiv care nu au fost sincronizate."
el = "Η επαναφορά απορρίπτει τις αλλαγές σε αυτή τη συσκευή που δεν έχουν συγχρονιστεί."
pt-PT = "A reposição elimina as alterações neste dispositivo que não tenham sido sincronizadas."
sv = "Återställning tar bort ändringar på enheten som inte har synkroniserats."
da = "Nulstilling kasserer ændringer på denne enhed, som ikke er synkroniseret."
nb = "Tilbakestilling forkaster endringer på denne enheten som ikke er synkronisert."
fi = "Nollaus hylkää tämän laitteen muutokset, joita ei ole synkronoitu."
[messages."core.sync.restore_device.warning"]
comment = "Shown before restoring a library over this device's copy with the person's recovery code, after another of their devices replaced their keys."
value = "Restoring loads the library from storage again with your current recovery code, and discards edits on this device that have not synced."

[messages."core.sync.restore_device.warning".translations]
es = "Al restaurar se vuelve a cargar la biblioteca desde el almacenamiento con tu código de recuperación actual y se descartan los cambios de este dispositivo que no se hayan sincronizado."
fr = "La restauration recharge la bibliothèque depuis le stockage avec votre code de récupération actuel et supprime les modifications de cet appareil qui n’ont pas été synchronisées."
de = "Beim Wiederherstellen wird die Mediathek mit deinem aktuellen Wiederherstellungscode erneut aus dem Speicher geladen, und Änderungen auf diesem Gerät, die noch nicht synchronisiert wurden, werden verworfen."
pt-BR = "A restauração carrega a biblioteca do armazenamento novamente com seu código de recuperação atual e descarta as alterações deste dispositivo que não foram sincronizadas."
ja = "復元すると、現在の復旧コードでストレージからライブラリが再度読み込まれ、このデバイスで同期されていない編集は破棄されます。"
ko = "복원하면 현재 복구 코드로 저장소에서 라이브러리를 다시 불러오며, 이 기기에서 동기화되지 않은 편집은 삭제됩니다."
zh-Hans = "恢复会使用你当前的恢复码从存储空间重新载入音乐库，并丢弃此设备上尚未同步的编辑。"
ar = "تؤدي الاستعادة إلى تحميل المكتبة من التخزين مجددًا باستخدام رمز الاسترداد الحالي، وتتجاهل التعديلات على هذا الجهاز التي لم تُزامَن."
he = "השחזור טוען שוב את הספרייה מהאחסון עם קוד השחזור הנוכחי שלך, ומבטל עריכות במכשיר זה שלא סונכרנו."
uk = "Відновлення знову завантажує бібліотеку зі сховища за вашим поточним кодом відновлення й відкидає зміни на цьому пристрої, які не синхронізовано."
bg = "Възстановяването зарежда отново библиотеката от хранилището с текущия ви код за възстановяване и отхвърля промените на това устройство, които не са синхронизирани."
pl = "Przywracanie ponownie wczytuje bibliotekę z magazynu przy użyciu bieżącego kodu odzyskiwania i odrzuca zmiany na tym urządzeniu, które nie zostały zsynchronizowane."
cs = "Obnovení znovu načte knihovnu z úložiště pomocí vašeho aktuálního kódu pro obnovení a zahodí úpravy na tomto zařízení, které nebyly synchronizovány."
hr = "Vraćanje ponovno učitava biblioteku iz pohrane s vašim trenutačnim kodom za oporavak i odbacuje izmjene na ovom uređaju koje nisu sinkronizirane."
zh-Hant = "還原會使用你目前的復原碼從儲存空間重新載入音樂庫，並捨棄此裝置上尚未同步的編輯。"
it = "Il ripristino ricarica la libreria dall’archivio con il tuo codice di recupero attuale e scarta le modifiche di questo dispositivo non ancora sincronizzate."
tr = "Geri yükleme, kitaplığı geçerli kurtarma kodunuzla depolamadan yeniden yükler ve bu aygıtta eşzamanlanmamış düzenlemeleri atar."
nl = "Herstellen laadt de bibliotheek opnieuw uit de opslag met je huidige herstelcode en verwijdert bewerkingen op dit apparaat die nog niet zijn gesynchroniseerd."
sk = "Obnovenie znova načíta knižnicu z úložiska pomocou vášho aktuálneho kódu na obnovenie a zahodí úpravy na tomto zariadení, ktoré neboli synchronizované."
hu = "A visszaállítás a jelenlegi helyreállítási kódoddal újra betölti a könyvtárat a tárhelyről, és elveti az ezen az eszközön végzett, még nem szinkronizált módosításokat."
ro = "Restaurarea reîncarcă biblioteca din stocare cu codul tău de recuperare actual și renunță la modificările de pe acest dispozitiv care nu au fost sincronizate."
el = "Η επαναφορά φορτώνει ξανά τη βιβλιοθήκη από τον χώρο αποθήκευσης με τον τρέχοντα κωδικό ανάκτησής σας και απορρίπτει τις επεξεργασίες σε αυτή τη συσκευή που δεν έχουν συγχρονιστεί."
pt-PT = "O restauro volta a carregar a biblioteca do armazenamento com o seu código de recuperação atual e descarta as alterações deste dispositivo que não foram sincronizadas."
sv = "Återställningen läser in biblioteket från lagringen igen med din nuvarande återställningskod och tar bort ändringar på den här enheten som inte har synkroniserats."
da = "Gendannelsen indlæser biblioteket fra lageret igen med din nuværende gendannelseskode og kasserer ændringer på denne enhed, som ikke er synkroniseret."
nb = "Gjenoppretting laster inn biblioteket fra lagringen på nytt med den gjeldende gjenopprettingskoden din og forkaster endringer på denne enheten som ikke er synkronisert."
fi = "Palauttaminen lataa kirjaston tallennustilasta uudelleen nykyisellä palautuskoodillasi ja hylkää tällä laitteella tehdyt muokkaukset, joita ei ole synkronoitu."

