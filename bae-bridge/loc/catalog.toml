he = "קבצים שליד התיקיות האלה עדיין בהורדה. ייבא את ההוצאה הזו כשההורדה תסתיים."
uk = "Файли поруч із цими папками ще завантажуються. Імпортуйте цей реліз, коли завантаження завершиться."
bg = "Файловете до тези папки все още се изтеглят. Импортирайте това издание, след като изтеглянето приключи."
pl = "Pliki obok tych folderów wciąż się pobierają. Zaimportuj to wydanie po zakończeniu pobierania."
cs = "Soubory vedle těchto složek se stále stahují. Importujte toto vydání, až stahování skončí."
hr = "Datoteke uz ove mape još se preuzimaju. Uvezite ovo izdanje kad preuzimanje završi."
