[messages."core.error.restore_registered".translations]
es = "La restauración no se puede cancelar: este dispositivo ya se añadió a la biblioteca. Termina la restauración para usar la biblioteca."
fr = "La restauration ne peut pas être annulée : cet appareil a déjà été ajouté à la bibliothèque. Terminez la restauration pour utiliser la bibliothèque."
