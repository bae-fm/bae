hu = "A mappák melletti fájlok letöltése még folyamatban van. Importáld ezt a kiadást, ha a letöltés befejeződött."
ro = "Fișierele de lângă aceste dosare încă se descarcă. Importă această lansare după ce descărcarea se încheie."
el = "Αρχεία δίπλα σε αυτούς τους φακέλους λαμβάνονται ακόμη. Εισαγάγετε αυτή την κυκλοφορία μόλις ολοκληρωθεί η λήψη."
pt-PT = "Os ficheiros junto a estas pastas ainda estão a ser transferidos. Importe este lançamento quando a transferência terminar."
sv = "Filer bredvid de här mapparna laddas fortfarande ned. Importera den här utgåvan när nedladdningen är klar."
