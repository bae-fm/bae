# Vendored copy of discid-sys 0.5.0, patched for the MSVC target (see src/lib.rs:
# the bitfield-enum field is signed under MSVC, so the From impl casts). Wired in
# via [patch.crates-io] in the workspace root. The only change from upstream is
# that cast; everything else is the published 0.5.0 source.

[package]
edition = "2018"
name = "discid-sys"
version = "0.5.0"
authors = ["Philipp Wolfer <ph.wolfer@gmail.com>"]
description = "Unsafe FFI bindings for MusicBrainz libdiscid"
keywords = [
    "musicbrainz",
    "discid",
    "audio",
    "bindings",
    "ffi",
]
categories = ["external-ffi-bindings"]
license = "LGPL-3.0-or-later"
repository = "https://git.sr.ht/~phw/rust-discid-sys"

[dependencies]

[build-dependencies.bindgen]
version = "^0.64.0"
