# SwiftLint enforces CODE QUALITY; swift-format owns LAYOUT. The two tools split
# the same way ktlint (format) and detekt (quality) split on Android. swift-format
# is the formatter of record — its `.swift-format` config is enforced in CI via
# `swift-format lint -s` — so every pure-layout SwiftLint rule (brace placement,
# else/catch position, line wrapping, trailing commas, whitespace) is disabled
# here. Enabling them makes two tools rewrite the same bytes in opposite
# directions; layout questions are settled by swift-format alone.
disabled_rules:
  # Layout — swift-format owns these (see above).
  - statement_position                 # swift-format positions else/catch
  - opening_brace                      # swift-format positions braces
  - closure_parameter_position         # swift-format positions closure params
  - line_length                        # swift-format wraps long lines
  - trailing_whitespace                # swift-format strips trailing whitespace
  - trailing_comma                     # swift-format manages multiline commas
  # Style/idiom — heuristics that fight SwiftUI idioms or our conventions rather
  # than measure real complexity. The structural rules (function/type body length,
  # cyclomatic complexity, parameter count) carry the code-quality load instead.
  - todo                                       # tracked in issues, not the linter
  - multiple_closures_with_trailing_closure    # SwiftUI's Button(action:){}label:{} etc.
  - identifier_name                            # length heuristic; flags idiomatic id/loop vars/fixtures
  - file_length                                # type_body_length catches oversized types; long view
                                               # files (many small subviews) and preview fixtures are fine

opt_in_rules:
  - force_unwrapping                   # flag optional force-unwraps (expr!)

# Match Android's detekt LongMethod threshold (60) so one function-size standard
# holds across both platforms. SwiftLint's default warning is 50, which under
# --strict would hold Swift to a stricter bar than the Kotlin it mirrors.
function_body_length:
  warning: 60

excluded:
  - bae-macos/bae/bae/bae_bridge.swift
  - bae-ios/bae/bae/bae_bridge.swift
  # Preview/sample-data scaffolding: one long sample-data namespace and
  # many-param sample builders that mirror the fixture rows they stand in for.
  # The structural rules measure production complexity, not fixture shape.
  - bae-macos/bae/bae/PreviewData.swift
  - .build
  - .claude
