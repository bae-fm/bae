# SwiftLint checks code quality; swift-format owns layout, so SwiftLint's
# layout rules are off.
disabled_rules:
  # Layout — swift-format owns these (see above).
  - statement_position                 # swift-format positions else/catch
  - opening_brace                      # swift-format positions braces
  - closure_parameter_position         # swift-format positions closure params
  - line_length                        # swift-format wraps long lines
  - trailing_whitespace                # swift-format strips trailing whitespace
  - trailing_comma                     # swift-format manages multiline commas
  # Heuristics that fight SwiftUI idioms; the structural rules carry the load.
  - multiple_closures_with_trailing_closure    # SwiftUI's Button(action:){}label:{} etc.
  - identifier_name                            # length heuristic; flags idiomatic id/loop vars/fixtures
  - file_length                                # type_body_length catches oversized types; long view
                                               # files (many small subviews) and preview fixtures are fine

opt_in_rules:
  - force_unwrapping                   # flag optional force-unwraps (expr!)

# A switch over an enum's cases, one view per case, is one choice however
# many cases the enum has; counting each case would split a flat switch into
# partial ones that each need a branch for the cases they can't be handed.
cyclomatic_complexity:
  ignores_case_statements: true

# detekt's LongMethod threshold, so both platforms share one limit.
function_body_length:
  warning: 60

excluded:
  # The generated uniffi bindings.
  - BaeKit/Sources/BaeBridge
  # The theme generated by theme-gen from design/theme.toml.
  - BaeKit/Sources/BaeKit/Generated
  - .build
  - .claude

custom_rules:
  # A failure core reported carries a diagnostic its line leaves out; state
  # that keeps only an error's `localizedDescription` (for a bridge error,
  # core's line) drops it, and with it the details disclosure and its copy
  # action. Hold the `DisplayError` and render `Notice`.
  error_state_keeps_its_detail:
    name: "Error state keeps its detail"
    regex: '=\s*[^=\n]*\.localizedDescription\b'
    excluded:
      - ".*/DisplayError\\.swift$"
      - ".*/DisplayErrorTests\\.swift$"
    message: "Hold the DisplayError (DisplayError(error)) and render Notice instead of keeping only its localizedDescription"
    severity: error

  # A link-style button draws in the system's link blue whatever accent the
  # person chose, so an action drawn with it reads as the one blue control on
  # its screen; the boards draw every action in the accent. An action is a
  # borderless button, which takes the window's accent; a web address is a
  # `Link`.
  actions_draw_in_the_accent:
    name: "Actions draw in the accent"
    regex: '\.buttonStyle\(\s*\.link\s*\)'
    message: "Use .buttonStyle(.borderless) for an action, or Link for a web address: a link-style button ignores the accent"
    severity: error
