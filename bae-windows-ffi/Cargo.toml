[package]
name = "bae-windows-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# A thin C ABI over bae-core for the native Windows (WinUI/C#) app to P/Invoke.
# Windows binds bae-core through this hand-written surface, the way macOS/Android
# bind it through uniffi (bae-bridge) — every platform reaches the same core, with
# its own binding. cdylib → bae_windows_ffi.dll.
[lib]
name = "bae_windows_ffi"
crate-type = ["cdylib"]

[dependencies]
bae-core = { path = "../bae-core" }
tracing = { workspace = true }
# Complex results cross the C ABI as JSON; the C# side deserializes them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "sync" for the event-bus broadcast receiver; "rt-multi-thread" for the
# one-off runtime that pre-init restore (no app handle yet) blocks on.
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }

[features]
# Enables the OAuth cloud-provider C-ABI surface (bae_oauth_authorize,
# bae_sign_in_cloud, bae_set_oauth_client_creds) via bae-core/coven. Off by
# default → the libre baeium build; the bae build turns it on.
oauth-providers = ["bae-core/oauth-providers"]
