[package]
name = "bae-catalogs"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false
# The `desktop` cfg, defined once in bae-util's build script for every crate
# with desktop-only code.
build = "../bae-util/build.rs"

[lib]
name = "bae_catalogs"
path = "src/lib.rs"

[dependencies]
# The shared transport, its retries and response cache, and the error text a
# request failure prints.
bae-util = { workspace = true }
# Every catalog request is an HTTPS GET with a query string.
reqwest = { workspace = true, features = ["query", "rustls"] }
serde = { workspace = true, features = ["derive"] }
# `raw_value`: a MusicBrainz Disc ID answer lists whole release documents,
# each kept as the bytes MusicBrainz sent for a read to start from.
serde_json = { workspace = true, features = ["raw_value"] }
# The rate limiter's waits and the image cache's disk work, which runs on the
# blocking pool.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
thiserror = { workspace = true }
tracing = { workspace = true }
# The remote-image cache spools a download to a temporary file before an
# atomic persist.
tempfile = { workspace = true }

# The catalog clients read releases into pressing values and compare their
# words, and only the import pipeline asks a catalog anything; the predicate is the
# `desktop` cfg's (bae-util/build.rs), which gates the clients.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
bae-types = { workspace = true }

[dev-dependencies]
# The test transport and the retry that sleeps no real time.
bae-util = { workspace = true, features = ["test-utils"] }
bae-types = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt-multi-thread", "test-util"] }
# The local HTTP servers tests stand in for catalogs and cover archives with.
axum = { workspace = true, features = ["http1", "tokio", "json", "form"] }
# The images the cache tests serve.
image = { workspace = true, features = ["png"] }
# The rate limiter's load model draws its request times.
rand = { workspace = true }
# The reset times the MusicBrainz rate tests state.
chrono = { workspace = true }

[features]
default = []
# The clients' `for_test` constructors and the image cache over a temporary
# directory, for the tests of every crate that builds on this one. Dev/test-only:
# a production build never enables it.
test-utils = ["bae-util/test-utils"]
# What bae-core's own unit tests read back: the MusicBrainz requests waiting
# for a slot and the order the rate limiter admitted them in. It records as it
# runs, so only bae-core's dev-dependency turns it on, never a build that ships
# or a debug app.
test-instrumentation = []

[lints]
workspace = true
