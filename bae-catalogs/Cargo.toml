[package]
name = "bae-catalogs"
version = "0.0.0-dev"
authors = ["dima"]
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_catalogs"
path = "src/lib.rs"

[build-dependencies]
# Sets the `desktop` cfg for the crate's desktop-only code.
bae-desktop-cfg = { workspace = true }

[dependencies]
# The pressing values the catalog clients read releases into and whose words
# they compare, and the credit line a stored artist credit is written as.
bae-types = { workspace = true }
# The shared transport, its retries and response cache, and the error text a
# request failure prints.
bae-util = { workspace = true }
# Where the image cache reports a panic in its disk work.
bae-diagnostics = { workspace = true }
# Every catalog request is an HTTPS GET with a query string.
reqwest = { workspace = true, features = ["query", "rustls"] }
serde = { workspace = true, features = ["derive"] }
# `raw_value`: a MusicBrainz Disc ID answer lists whole release documents,
# each kept as the bytes MusicBrainz sent for a read to start from.
serde_json = { workspace = true, features = ["raw_value"] }
# The clock the rate limiter stamps admissions on and waits out its spacing on.
coven = { workspace = true }
# The rate limiter's wakeups and the image cache's disk work, which runs on the
# blocking pool.
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
thiserror = { workspace = true }
tracing = { workspace = true }
# The remote-image cache spools a download to a temporary file before an
# atomic persist.
tempfile = { workspace = true }
# The local stand-in image host (src/test_image_host.rs), under test-utils.
axum = { workspace = true, features = ["http1", "tokio"], optional = true }
# The PNG the stand-in image host serves, under test-utils.
image = { workspace = true, features = ["png"], optional = true }
# The rate limiter's load model draws its request times, under test-utils.
rand = { workspace = true, optional = true }

[dev-dependencies]
# The test transport, whose waits between requests pass as they are armed.
bae-util = { workspace = true, features = ["test-utils"] }
# The clocks the tests' transports wait on.
coven = { workspace = true, features = ["test-utils"] }
bae-types = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt-multi-thread", "test-util"] }
# The local HTTP servers tests stand in for catalogs and cover archives with.
axum = { workspace = true, features = ["http1", "tokio", "json", "form"] }
# The images the cache tests serve.
image = { workspace = true, features = ["png"] }
# The rate limiter's load model draws its request times.
rand = { workspace = true }
# The reset times the MusicBrainz rate tests state.
chrono = { workspace = true }

[features]
default = []
# The clients' `for_test` constructors, the image cache over a temporary
# directory, the fakes a test's providers ask and the documents they answer
# with, a local stand-in for the hosts provider images come from, and the
# rate limiter's load model a provider's window is tested under, for the
# tests of every crate that builds on this one. Dev/test-only: a production
# build never enables it.
test-utils = ["bae-util/test-utils", "dep:axum", "dep:image", "dep:rand", "tokio/net", "tokio/time"]
# What bae-library's own unit tests read back: the MusicBrainz requests waiting
# for a slot and the order the rate limiter admitted them in. It records as it
# runs, so only bae-library's dev-dependency turns it on, never a build that ships
# or a debug app.
test-instrumentation = []

[lints]
workspace = true
