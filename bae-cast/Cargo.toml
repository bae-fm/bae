[package]
name = "bae-cast"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[dependencies]
# The app's services over an open library, which this crate calls.
bae-app = { workspace = true }
bae-library = { workspace = true }
# The store errors a setting write fails with, and the cover refs it serves.
bae-store = { workspace = true }
bae-records = { workspace = true }
# The renderer session, the cast picker and AirPlay's sink, which this crate's
# protocols drive.
bae-playback = { workspace = true }
# The Subsonic credential the session media server is reached with.
bae-preferences = { workspace = true }
bae-diagnostics = { workspace = true }
# Error text with its cause chain, for the protocol failures it reports.
bae-util = { workspace = true }
# The ephemeral Subsonic server the cast receiver fetches audio from: binds the
# bae-subsonic router on a random LAN port, authenticated by a per-session
# credential. This is why the controller is its own crate rather than part of
# bae-playback, which must not depend on bae-subsonic (see
# bae-playback/src/renderer).
bae-subsonic = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "net"] }
tracing = { workspace = true }
thiserror = { workspace = true }
# axum 0.8 matches the router bae-subsonic returns.
axum = { workspace = true, features = ["http1", "tokio"] }
tokio-util = { workspace = true }
# The fresh salt each minted media URL carries, and the AirPlay keys.
hex = { workspace = true }
rand = { workspace = true }
# The LAN IP the receiver reaches this device at (the ephemeral server binds
# 0.0.0.0, but the URL must name a routable address).
local-ip-address = { workspace = true }
# Google Cast sender (src/cast/): the CASTV2 protocol over TLS to Chromecast/Nest
# devices, and mDNS service discovery of them and of AirPlay receivers.
# `thread_safe` makes rust_cast's `CastDevice` Send so the session can own it on
# its own OS thread. Builds on every platform; the receiver fetches audio itself
# over HTTP.
rust_cast = { workspace = true, features = ["thread_safe"] }
mdns-sd = { workspace = true }
# UPnP/DLNA control point (src/dlna/): parses device-description and SOAP
# response XML. Read-only DOM, pure Rust (builds on every platform). Outgoing
# SOAP envelopes are hand-built with explicit escaping, so this is parse-only.
roxmltree = { workspace = true }
# `blocking` powers the DLNA control point (src/dlna/): its SSDP search thread
# and the SOAP channel drive blocking HTTP off the async runtime, the same way
# the Cast session owns its device on its own OS thread.
reqwest = { workspace = true, features = ["blocking"] }
# AirPlay 2 HomeKit pairing (src/airplay/pairing.rs). The password-less
# "transient" pair-setup is SRP6a with the 3072-bit group + SHA-512. The
# RustCrypto `srp` crate 0.6 can't be used: its M1 proof is `H(A|B|K)` (its own
# source calls this non-spec), whereas HomeKit receivers require the full
# `H(H(N)^H(g) | H(I) | s | A | B | K)` and PAD(A)|PAD(B) for u — the semantics
# pyatv pairs real HomePods with via `srptools`. `srp` 0.7.0-rc adds the RFC
# 5054 proof, but whether it pairs with a HomeKit receiver is unchecked. So the
# SRP math is written directly over `num-bigint` (bignum modexp) to those
# reference semantics.
num-bigint = { workspace = true }
sha2 = { workspace = true }
# RAOP (AirPlay 1) audio encryption (src/airplay/crypto.rs). Legacy `et=1`
# receivers take an AES-128 session key the sender RSA-OAEP(SHA-1)-wraps to a
# fixed public key baked into every AirPort Express, then AES-128-CBC-encrypt
# each audio packet's payload (per-packet IV reset, trailing `len%16` bytes left
# in the clear — openairplay spec §7.2). rsa on num-bigint-dig, aes/cbc on the
# cipher-0.4 stack `chacha20poly1305` already pulls in; base64 carries the
# wrapped key in the ANNOUNCE.
rsa = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
base64 = { workspace = true }
sha1 = { workspace = true }
# AirPlay 2 HomeKit pair-verify + audio-packet encryption (src/airplay/airplay2.rs).
# Pair-verify is X25519 ECDH + Ed25519 signatures with HKDF-SHA512-derived keys;
# the audio stream is ChaCha20-Poly1305 keyed from the pair-verify shared secret.
# All on the same digest-0.10 stack as `sha2`. rand_core 0.6 is the RNG trait
# these (and `rsa`) are built against — bae is on `rand` 0.9, so `secure_rng`
# adapts the current OS RNG to the older trait.
x25519-dalek = { workspace = true, features = ["static_secrets"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
rand_core = { workspace = true }
# The id source the AirPlay 2 SETUP's session and group ids come from.
coven = { workspace = true }

[dev-dependencies]
# The deterministic id source the sessions' tests use.
coven = { workspace = true, features = ["test-utils"] }
# The test libraries the session tests open and play.
# A test library's services, started through the app's own step.
bae-app = { workspace = true, features = ["test-utils"] }
bae-library = { workspace = true, features = ["test-utils"] }
# The bug reporter that keeps what it is handed.
bae-diagnostics = { workspace = true, features = ["test-utils"] }
# The AirPlay sender's wake a test rings itself.
bae-playback = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }

[lints]
workspace = true
