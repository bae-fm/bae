org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Enables the Compose Preview Screenshot Testing plugin's screenshotTest source
# set and render tasks (used by scripts/shots/android.sh).
android.experimental.enableScreenshotTest=true
# The Android toolchain and the ABIs the app ships, written only here.
# app/build.gradle.kts reads these, and bae-android/toolchain.sh reads them for
# the build scripts, check.sh, the pre-commit hook and CI.
bae.minSdk=26
bae.compileSdk=35
bae.targetSdk=35
bae.buildToolsVersion=35.0.0
bae.ndkVersion=29.0.14206865
bae.javaVersion=17
# bae-bridge/build-android.sh builds the bridge for these, and the APK packages
# only these.
bae.abis=arm64-v8a,x86_64
