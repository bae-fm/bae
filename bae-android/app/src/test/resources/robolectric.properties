# JVM unit tests run on the host, where the app's real Application cannot boot:
# BaeApp.onCreate loads the native bridge (setDataDir), the keyring NDK context,
# and the Android TLS runtime, none of which exist off-device. Robolectric reads
# the merged manifest (android.testOptions.unitTests.includeAndroidResources) and
# would otherwise instantiate BaeApp for every test, so the first native call
# throws UnsatisfiedLinkError, poisons the uniffi bindings' class initializer,
# and every later test in the run fails with ExceptionInInitializerError no
# matter what it asserts.
#
# These tests cover projections, stores, and view logic, not the app's native
# bootstrap, so a plain Application is the honest stand-in. The real BaeApp
# startup is exercised on-device by the instrumented tests.
application=android.app.Application
