# Overlay on top of detekt's built-in defaults (--build-upon-default-config).
# Only deviations from the defaults are listed here.

exceptions:
  # Kotlin coroutines surface arbitrary platform exceptions as `Exception`.
  # Catching the base type is the correct pattern when the caller cannot
  # enumerate all possible subtypes from a heterogeneous async call stack.
  TooGenericExceptionCaught:
    active: false
  # A caught exception is either handled with its cause kept (logged, shown,
  # rethrown wrapped) or the catch is wrong: dropping it silently loses why.
  SwallowedException:
    active: true

complexity:
  # @Composable functions take many parameters by design: Compose hoists state
  # and event callbacks into the parameter list, so the default threshold of 6
  # under-fits idiomatic Compose. Same Compose exemption already applied to
  # FunctionNaming/MatchingDeclarationName below. LongMethod stays on for
  # composables — an over-long composable is a real recomposition-scope smell.
  LongParameterList:
    ignoreAnnotated: ["Composable"]
  TooManyFunctions:
    ignoreOverridden: true
    # Library is a narrow projection of AppHandle's library read surface
    # (count/page/detail per browse mode — albums, composers, artists — plus
    # image and search), each method a thin delegating call. It is a cohesive
    # facade that grows one triad per browse mode, not a god-class, so the
    # default cap of 11 forces an artificial split.
    thresholdInClasses: 20
    # @Preview functions are dev-tooling previews, not API surface; a view file
    # accumulates one per state variant by design, so don't count them toward a
    # file's function total.
    ignoreAnnotatedFunctions: ["Preview"]
    # PreviewData is the cohesive fixture object every shot draws on — one
    # small builder per Bridge record, growing with the bridge surface, not a
    # god-object. It already carries one builder per record type, so it gets a
    # cap above the class facade's.
    thresholdInObjects: 30

naming:
  # Jetpack Compose @Composable functions use PascalCase by convention
  # (same exemption applied to ktlint via .editorconfig). detekt's
  # FunctionNaming needs the Compose annotations named explicitly.
  FunctionNaming:
    ignoreAnnotated: ["Composable", "Preview"]
  # Compose files commonly contain both a parameter data class and the
  # composable that uses it. detekt counts only class declarations (not
  # @Composable functions) as top-level declarations, so every such file
  # falsely fires this rule.
  MatchingDeclarationName:
    active: false

style:
  # ktlint 1.x has no unused-import rule, so detekt's is what catches them.
  UnusedImports:
    active: true
  # @Preview functions have no caller by design — the Compose tooling invokes
  # them — so the unused-private check would fire on every one.
  UnusedPrivateMember:
    ignoreAnnotated: ["Preview"]
  MagicNumber:
    # Property declarations are the naming point for constants: `val Foo = Color(0xFF…)`
    # names the value. Inline literals in expressions are still flagged.
    ignorePropertyDeclaration: true
  UtilityClassWithPublicConstructor:
    # Keyring.kt is the JNI bootstrap for the native keyring library; it uses
    # class + companion object to produce the correct JNI symbol names. Making
    # it an `object` would break the JNI ABI.
    active: false
