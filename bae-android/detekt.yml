# Overlay on top of detekt's built-in defaults (--build-upon-default-config).
# Only deviations from the defaults are listed here.

complexity:
  # Jetpack Compose screens are typically one large @Composable function. 60-line
  # and complexity-15 limits are not meaningful for this style of UI code.
  LongMethod:
    active: false
  CyclomaticComplexMethod:
    active: false
  # @Composable functions pass all their data as parameters; Kotlin data classes
  # and interface implementations are naturally parameter-heavy. The default
  # threshold of 6 fires on almost every screen and callback in the codebase.
  LongParameterList:
    active: false
  # BaeCorePlayer implements a media session which requires many methods.
  TooManyFunctions:
    active: false

exceptions:
  # Kotlin coroutines surface arbitrary platform exceptions as `Exception`.
  # Catching the base type is the correct pattern when the caller cannot
  # enumerate all possible subtypes from a heterogeneous async call stack.
  TooGenericExceptionCaught:
    active: false
  # UI error handlers deliberately catch and convert exceptions to display
  # state; logging every swallowed exception in UI code is unnecessary noise.
  SwallowedException:
    active: false
  # Using throw IllegalStateException() is equivalent to error(); the choice
  # is stylistic. Don't mandate one form over the other.
  UseCheckOrError:
    active: false

naming:
  # Jetpack Compose @Composable functions use PascalCase by convention
  # (same exemption applied to ktlint via .editorconfig). detekt's
  # FunctionNaming doesn't understand the Compose annotation.
  FunctionNaming:
    active: false

style:
  # Color and dimension literals in theme files (BaeTheme.kt) don't need
  # extraction to named constants — the literal IS the constant at that callsite.
  MagicNumber:
    active: false
  # Having 3 return statements in a function is normal Kotlin control flow;
  # the default limit of 2 fires on straightforward when-expression patterns.
  ReturnCount:
    active: false
  # Keyring.kt is the JNI bootstrap for the native keyring library; it uses
  # class + companion object to produce the correct JNI symbol names. Making
  # it an `object` would break the JNI ABI.
  UtilityClassWithPublicConstructor:
    active: false
