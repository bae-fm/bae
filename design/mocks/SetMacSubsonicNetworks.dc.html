<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS: Subsonic, where it listens</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--background)}

</style>
</helmet>
<div style="position:relative"><x-import component-from-global-scope="Bae.MacSettingsWindow" pane="Subsonic" title="Subsonic"><x-import component-from-global-scope="Bae.MacBox"><x-import component-from-global-scope="Bae.MacRow" label="Subsonic server" note="Running"><x-import component-from-global-scope="Bae.MacSwitch" on="{{ true }}" label="Subsonic server"></x-import></x-import><x-import component-from-global-scope="Bae.MacRow" label="Available on" note="Apps connect at" copy="http://192.168.1.20:4533"><x-import component-from-global-scope="Bae.MacPopUpButton">Wi-Fi</x-import></x-import><x-import component-from-global-scope="Bae.MacRow" label="Port"><x-import component-from-global-scope="Bae.MacPortField" value="4533"></x-import></x-import></x-import><x-import component-from-global-scope="Bae.MacSection" title="Sign-in"><x-import component-from-global-scope="Bae.MacBox"><x-import component-from-global-scope="Bae.MacRow" label="Username"><div style="width:180px"><x-import component-from-global-scope="Bae.MacTextField" label="Username" label-hidden="{{yes}}" value="mara"></x-import></div></x-import><x-import component-from-global-scope="Bae.MacRow" label="Password"><div style="width:180px"><x-import component-from-global-scope="Bae.MacTextField" label="Password" label-hidden="{{yes}}" value="secretpw" secret="{{yes}}"></x-import></div></x-import></x-import><x-import component-from-global-scope="Bae.MacNote">Subsonic apps sign in with this username and password. The password is kept in this Mac’s keychain.</x-import></x-import></x-import><div style="position: absolute; top: 75px; left: 452px; z-index: 50"><x-import component-from-global-scope="Bae.MacMenu"><x-import component-from-global-scope="Bae.MacMenuItem">This Mac only</x-import><x-import component-from-global-scope="Bae.MacMenuItem" divider="{{ true }}"></x-import><x-import component-from-global-scope="Bae.MacMenuItem" checked="{{ true }}">Wi-Fi · 192.168.1.20</x-import><x-import component-from-global-scope="Bae.MacMenuItem">Tailscale · 100.64.0.3</x-import><x-import component-from-global-scope="Bae.MacMenuItem" divider="{{ true }}"></x-import><x-import component-from-global-scope="Bae.MacMenuItem">Every network</x-import></x-import></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":690,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
