<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library home, grouped by artist</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ds/bae/tokens.css">
<link rel="stylesheet" href="../ds/bae/components/bundle.css">
<script src="../ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:#F6BFD9}
.ib{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;color:var(--text-primary);cursor:pointer}
.ib svg{fill:currentColor}
.tab{height:40px;padding:0 12px;border:0;background:none;color:var(--accent);font-family:Roboto,sans-serif;font-size:14px;cursor:pointer}
.cover{width:100%;aspect-ratio:1/1;border-radius:10px}
.t1{font-size:16px;font-weight:500;line-height:22px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary)}
.tl{width:48px;flex:none;text-align:center;font-family:Roboto,sans-serif;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-secondary)}
</style>
</helmet>
<x-import component-from-global-scope="Bae.AndroidScreen">
  <header style="padding: 8px 4px 0 16px; display: flex; align-items: center; flex: none">
<x-import component-from-global-scope="Bae.AndroidButton" kind="text">Albums</x-import>
<div style="flex: 1"></div>
<x-import component-from-global-scope="Bae.AndroidIconButton" icon="search" label="Search"></x-import>
<button class="ib" aria-label="More"><svg width="24" height="24" viewbox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path></svg></button>

</header>
  <h2 style="grid-column: 1 / -1; margin: 0; font-size: 16px; font-weight: 500">Artist Name</h2>
  <div><div class="cover" style="background: #6B2F2A"></div><div class="t1">A Long Album Title Cut Short Here</div><div class="t2">Artist Name</div></div>
  <div><div class="cover" style="background: #2F3B4F"></div><div class="t1">Album Title</div><div class="t2">Artist Name</div></div>
  <h2 style="grid-column: 1 / -1; margin: 0; font-size: 16px; font-weight: 500">Another Artist</h2>
  <div><div class="cover" style="background: #8A6A3A"></div><div class="t1">Album Title</div><div class="t2">Another Artist</div></div>
  <div></div>
  <h2 style="grid-column: 1 / -1; margin: 0; font-size: 16px; font-weight: 500">Third Artist</h2>
  <div><div class="cover" style="background: #2E5258"></div><div class="t1">Album Title</div><div class="t2">Third Artist</div></div>
  <div><div class="cover" style="background: #3A2E44"></div><div class="t1">Another Album Title</div><div class="t2">Third Artist</div></div>
  <section aria-label="Now playing" style="background: var(--surface); border-top: 1px solid var(--hairline); padding: 8px 12px; flex: none; display: flex; flex-direction: column">
<div style="display: flex; align-items: center">
<div style="width: 48px; height: 48px; flex: none; border-radius: 6px; background: #4A5A55"></div>
<div style="width: 12px; flex: none"></div>
<div style="flex: 1; min-width: 0">
<div style="font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Track Title</div>
<div style="font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Artist Name</div>
</div>
<button class="ib" aria-label="Previous track"><svg width="24" height="24" viewbox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg></button>
<button class="ib" aria-label="Play"><svg width="24" height="24" viewbox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg></button>
<button class="ib" aria-label="Next track"><svg width="24" height="24" viewbox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"></path></svg></button>
<button class="ib" aria-label="Queue"><svg width="24" height="24" viewbox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"></path></svg></button>
<button class="ib" aria-label="Repeat" style="color: var(--text-secondary)"><svg width="24" height="24" viewbox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"></path></svg></button>
</div>
<div style="display: flex; align-items: center; height: 32px">
<div class="tl">2:41</div>
<div style="flex: 1; position: relative; height: 16px; display: flex; align-items: center; margin: 0 4px">
<div style="position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: #20202C"></div>
<div style="position: absolute; left: 0; width: 62%; height: 3px; border-radius: 2px; background: var(--accent)"></div>
<div style="position: absolute; left: 62%; width: 14px; height: 14px; margin-left: -7px; border-radius: 7px; background: var(--accent)"></div>
</div>
<div class="tl">4:23</div>
</div>
</section>
  <div style="height: 24px; flex: none; display: flex; align-items: center; justify-content: center"><div style="width: 108px; height: 4px; border-radius: 2px; background: rgba(242,242,244,0.85)"></div></div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":916}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
