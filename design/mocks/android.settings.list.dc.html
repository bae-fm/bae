<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:#F6BFD9}
.ib{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;color:var(--text-primary);cursor:pointer}
.ib svg{fill:currentColor}
.row{display:flex;flex-direction:column;justify-content:center;min-height:72px;padding:12px 16px;color:var(--text-primary);text-decoration:none;box-sizing:border-box}
.rt{font-size:16px;line-height:24px}
.rs{font-size:14px;line-height:20px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{margin:0 16px;border-radius:16px;background:var(--surface);overflow:hidden}.card:first-child{margin-top:16px}:not(h2)+.card{margin-top:8px}.card>*+*{border-top:1px solid var(--hairline)}
</style>
</helmet>
<x-import component-from-global-scope="Bae.AndroidScreen" title="Settings" back="{{yes}}">
  <x-import component-from-global-scope="Bae.AndroidCard">
    <x-import component-from-global-scope="Bae.AndroidRow" title="Appearance" subtitle="System · Midnight · Pink"></x-import>
    <x-import component-from-global-scope="Bae.AndroidRow" title="Library" subtitle="Home music · Synced"></x-import>
    <x-import component-from-global-scope="Bae.AndroidRow" title="Playback" subtitle="Pauses between sides · Restores on launch"></x-import>
    <x-import component-from-global-scope="Bae.AndroidRow" title="Transfers" subtitle="3 pins at once"></x-import>
    <x-import component-from-global-scope="Bae.AndroidRow" title="Storage" subtitle="3.9 GB on this phone"></x-import>
    <x-import component-from-global-scope="Bae.AndroidRow" title="Casting" subtitle="Off"></x-import>
    <x-import component-from-global-scope="Bae.AndroidRow" title="About" subtitle="Version 0.0-dev"></x-import>
  </x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":916}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
