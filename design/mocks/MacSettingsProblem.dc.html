<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS settings: library sync problem</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.side{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text-primary);font:13px -apple-system,'SF Pro Text',system-ui,sans-serif;padding:5px 10px;border-radius:6px;cursor:pointer}
.box{background:var(--surface);border-radius:8px;display:flex;flex-direction:column}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:4px 12px;font-size:13px}
.r+.r{border-top:1px solid var(--hairline)}
.sec{margin:14px 4px 6px;font-size:13px;font-weight:600;color:var(--text-primary)}
.v{color:var(--text-secondary)}
.pop{height:22px;padding:0 8px;border-radius:5px;border:0;background:var(--tile);color:var(--text-primary);font:13px -apple-system,system-ui,sans-serif;display:flex;align-items:center;gap:6px}
.btn{height:22px;padding:0 10px;border-radius:5px;border:0;background:var(--tile);color:var(--text-primary);font:13px -apple-system,system-ui,sans-serif}
.foot{font-size:11px;color:var(--text-secondary);padding:6px 4px 0}
</style>
</helmet>
<x-import component-from-global-scope="Bae.MacSettingsWindow" pane="Appearance" title="Appearance" status-pane="Library" status="Storage full" status-tone="danger">
  <x-import component-from-global-scope="Bae.MacBox">
    <x-import component-from-global-scope="Bae.MacRow" label="Theme">
      <x-import component-from-global-scope="Bae.MacPopUpButton" value="Auto"></x-import>
    </x-import>
    <x-import component-from-global-scope="Bae.MacRow" label="Tone">
      <x-import component-from-global-scope="Bae.MacPopUpButton" value="Midnight"></x-import>
    </x-import>
    <x-import component-from-global-scope="Bae.MacRow" label="Accent">
      <div style="display: flex; gap: 8px"><button aria-label="accent 0" style="width: 18px; height: 18px; border-radius: 9px; border: 0; padding: 0; background: var(--accent-blue-fill); "></button><button aria-label="accent 1" style="width: 18px; height: 18px; border-radius: 9px; border: 0; padding: 0; background: var(--accent-indigo-fill); "></button><button aria-label="accent 2" style="width: 18px; height: 18px; border-radius: 9px; border: 0; padding: 0; background: var(--accent-purple-fill); "></button><button aria-label="accent 3" style="width: 18px; height: 18px; border-radius: 9px; border: 0; padding: 0; background: var(--accent-pink-fill); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--text-primary);"></button><button aria-label="accent 4" style="width: 18px; height: 18px; border-radius: 9px; border: 0; padding: 0; background: var(--accent-red-fill); "></button><button aria-label="accent 5" style="width: 18px; height: 18px; border-radius: 9px; border: 0; padding: 0; background: var(--accent-amber-fill); "></button><button aria-label="accent 6" style="width: 18px; height: 18px; border-radius: 9px; border: 0; padding: 0; background: var(--accent-green-fill); "></button><button aria-label="accent 7" style="width: 18px; height: 18px; border-radius: 9px; border: 0; padding: 0; background: var(--accent-teal-fill); "></button></div>
    </x-import>
  </x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":690,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
