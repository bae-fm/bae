<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S3 cloud home (Android)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--background)}
</style>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; gap: 8px; font-family: var(--font-android)">
<x-import component-from-global-scope="Bae.AndroidSection" title="Cloud home"></x-import>
<x-import component-from-global-scope="Bae.AndroidCard">
<x-import component-from-global-scope="Bae.AndroidRow" title="Provider" subtitle="S3-compatible"></x-import>
<x-import component-from-global-scope="Bae.AndroidRow" title="Endpoint" subtitle="https://s3.home.lan"></x-import>
<x-import component-from-global-scope="Bae.AndroidRow" title="Region" subtitle="us-east-1"></x-import>
<x-import component-from-global-scope="Bae.AndroidRow" title="Bucket" subtitle="my-bucket"></x-import>
<x-import component-from-global-scope="Bae.AndroidRow" title="Access key ID" subtitle="{{keyId}}"></x-import>
<x-import component-from-global-scope="Bae.AndroidRow" title="Replace key" button="{{yes}}"></x-import>
</x-import>
<sc-if value="{{oldKey}}" hint-placeholder-val="{{ false }}"><div style="padding: 0 16px"><x-import component-from-global-scope="Bae.AndroidNotice" tone="info" dismiss="{{yes}}" title="Saved the new S3 key." subtitle="{{deleteLine}}"></x-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      yes: true,
      keyId: p.keyId || 'AKIA4EXAMPLEOLD',
      oldKey: p.oldKey || '',
      deleteLine: 'Delete the old key, ' + (p.oldKey || '') + ', in your S3 provider\u2019s console.'
    };
  }
}
</script>
</body>
</html>
