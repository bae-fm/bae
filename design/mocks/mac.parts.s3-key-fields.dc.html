<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S3 key fields (macOS)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--elevated)}
</style>
</helmet>
<div class="bae-mac" style="width: 100%; display: flex; flex-direction: column; gap: 10px; color: var(--text-primary); font: 13px var(--font-sans)">
<sc-if value="{{refused}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.MacNotice" quiet="{{yes}}" tone="danger" title="Key refused" subtitle="S3 storage does not accept this access key."></x-import></sc-if>
<x-import component-from-global-scope="Bae.MacTextField" label="Access key ID" label-width="120" value="{{keyId}}" state="{{idState}}"></x-import>
<x-import component-from-global-scope="Bae.MacTextField" label="Secret access key" label-width="120" value="{{secret}}" secret="{{yes}}" state="{{secretState}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":392,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const focus = p.focus || 'secret';
    return {
      yes: true,
      refused: p.refused === 'true',
      keyId: p.keyId || '',
      secret: p.secret || '',
      idState: focus === 'id' ? 'focused' : 'normal',
      secretState: focus === 'secret' ? 'focused' : 'normal'
    };
  }
}
</script>
</body>
</html>
