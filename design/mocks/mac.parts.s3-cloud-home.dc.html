<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S3 cloud home (macOS)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--background)}
</style>
</helmet>
<div class="bae-mac" style="width: 100%; display: flex; flex-direction: column; gap: 8px; color: var(--text-primary); font: 13px var(--font-sans)">
<x-import component-from-global-scope="Bae.MacSection" title="Cloud home">
<x-import component-from-global-scope="Bae.MacBox">
<x-import component-from-global-scope="Bae.MacRow" label="Provider" value="S3-compatible"></x-import>
<x-import component-from-global-scope="Bae.MacRow" label="Endpoint" value="https://s3.home.lan"></x-import>
<x-import component-from-global-scope="Bae.MacRow" label="Region" value="us-east-1"></x-import>
<x-import component-from-global-scope="Bae.MacRow" label="Bucket" value="my-bucket"></x-import>
<x-import component-from-global-scope="Bae.MacRow" label="Access key ID" value="{{keyId}}"><x-import component-from-global-scope="Bae.MacButton">Replace key…</x-import></x-import>
</x-import>
<sc-if value="{{oldKey}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.MacNotice" tone="info" dismiss="{{yes}}" title="Saved the new S3 key." subtitle="{{deleteLine}}"></x-import></sc-if>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":650,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      yes: true,
      keyId: p.keyId || 'AKIA4EXAMPLEOLD',
      oldKey: p.oldKey || '',
      deleteLine: 'Delete the old key, ' + (p.oldKey || '') + ', in your S3 provider\u2019s console.'
    };
  }
}
</script>
</body>
</html>
