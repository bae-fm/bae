<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS settings: Sync: scanning another device for access</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.ks-text{font:400 13px/18px var(--font-sans);color:var(--text-primary);margin:0 0 12px}
.ks-cam{height:240px;border-radius:var(--radius-card);background:var(--well);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font:400 13px var(--font-sans)}
</style>
</helmet>
<div style="position:relative;height:600px;width:690px"><x-import component-from-global-scope="Bae.MacSettingsWindow" pane="Library" title="Sync" back="Library">
  <dc-import name="mac.parts.sync-status" status="Waiting for access" tone="warning" cause="This Mac needs access from your iPhone or Ana’s Pixel, which comes when either device syncs." remedy="To get it now, scan one of them." fix="Scan device…" last-synced="2 hours ago" hint-size="100%,150px"></dc-import>
  <x-import component-from-global-scope="Bae.MacSection" title="Cloud home">
    <x-import component-from-global-scope="Bae.MacBox">
      <x-import component-from-global-scope="Bae.MacRow" label="Provider" value="Dropbox"></x-import>
      <x-import component-from-global-scope="Bae.MacRow" label="Account" value="name@example.com"></x-import>
      <x-import component-from-global-scope="Bae.MacRow" label="Folder" value="Music"></x-import>
    </x-import>
  </x-import>
</x-import><x-import component-from-global-scope="Bae.MacSheet" title="Scan another device" overlay="{{yes}}" width="420"><p class="ks-text">On your iPhone or Ana’s Pixel, open bae’s Sync settings and choose Share access. Then hold its code up to this Mac’s camera.</p><div class="ks-cam">Starting camera…</div><x-import component-from-global-scope="Bae.MacSheetFooter"><x-import component-from-global-scope="Bae.MacButton">Cancel</x-import></x-import></x-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":690,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
