<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS settings: Listening history</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.side{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text-primary);font:13px -apple-system,'SF Pro Text',system-ui,sans-serif;padding:5px 10px;border-radius:6px;cursor:pointer}
.box{background:var(--surface);border-radius:8px;display:flex;flex-direction:column}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:4px 12px;font-size:13px}
.r+.r{border-top:1px solid var(--hairline)}
.sec{margin:14px 4px 6px;font-size:13px;font-weight:600;color:var(--text-primary)}
.v{color:var(--text-secondary)}
.pop{height:22px;padding:0 8px;border-radius:5px;border:0;background:var(--tile);color:var(--text-primary);font:13px -apple-system,system-ui,sans-serif;display:flex;align-items:center;gap:6px}
.btn{height:22px;padding:0 10px;border-radius:5px;border:0;background:var(--tile);color:var(--text-primary);font:13px -apple-system,system-ui,sans-serif}
.foot{font-size:11px;color:var(--text-secondary);padding:6px 4px 0}
</style>
</helmet>
<x-import component-from-global-scope="Bae.MacSettingsWindow" pane="Library" title="People and devices" back="Library">
  <x-import component-from-global-scope="Bae.MacSection" title="You">
    <x-import component-from-global-scope="Bae.MacBox">
      <x-import component-from-global-scope="Bae.MacRow" label="Name" value="Your Name">
        <x-import component-from-global-scope="Bae.MacButton">Change…</x-import>
      </x-import>
      <x-import component-from-global-scope="Bae.MacRow" label="Role" value="Admin"></x-import>
      <x-import component-from-global-scope="Bae.MacRow" label="Listening history">
        <span style="position: relative; display: inline-block"><x-import component-from-global-scope="Bae.MacPopUp" value="Only me"></x-import><span role="menu" style="position: absolute; right: 0; top: 26px; z-index: 2; min-width: 190px; padding: 5px; border-radius: 7px; background: var(--tile); box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: flex; flex-direction: column; font-size: 13px"><span role="menuitemradio" aria-checked="false" style="display: flex; gap: 6px; align-items: center; padding: 3px 8px"><span style="width: 11px"></span>Off</span><span role="menuitemradio" aria-checked="true" style="display: flex; gap: 6px; align-items: center; padding: 3px 8px; border-radius: 4px; background: var(--accent); color: var(--background)"><span style="width: 11px"><svg width="11" height="11" viewbox="0 0 24 24" aria-hidden="true" style="fill: var(--background)"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"></path></svg></span>Only me</span><span role="menuitemradio" aria-checked="false" style="display: flex; gap: 6px; align-items: center; padding: 3px 8px"><span style="width: 11px"></span>Everyone</span></span></span>
      </x-import>
    </x-import>
    <x-import component-from-global-scope="Bae.MacNote">Who sees what you play, or Off to keep no record. Applies to new plays; earlier plays keep who could see them.</x-import>
  </x-import>
  <x-import component-from-global-scope="Bae.MacSection" title="Devices">
    <x-import component-from-global-scope="Bae.MacBox">
      <x-import component-from-global-scope="Bae.MacRow" label="This Mac" value="This device">
        <x-import component-from-global-scope="Bae.MacButton" destructive="{{yes}}">Remove…</x-import>
      </x-import>
      <x-import component-from-global-scope="Bae.MacRow" label="Phone">
        <x-import component-from-global-scope="Bae.MacButton" destructive="{{yes}}">Remove…</x-import>
      </x-import>
      <x-import component-from-global-scope="Bae.MacRow" label="Add device…" action="{{yes}}"></x-import>
    </x-import>
  </x-import>
  <x-import component-from-global-scope="Bae.MacSection" title="People">
    <x-import component-from-global-scope="Bae.MacBox">
      <x-import component-from-global-scope="Bae.MacRow" label="Person Name" strong="{{yes}}" tag="Member">
        <x-import component-from-global-scope="Bae.MacButton">Make admin</x-import>
        <x-import component-from-global-scope="Bae.MacButton" destructive="{{yes}}">Remove…</x-import>
      </x-import>
      <x-import component-from-global-scope="Bae.MacRow" label="Tablet">
        <x-import component-from-global-scope="Bae.MacButton" destructive="{{yes}}">Remove…</x-import>
      </x-import>
    </x-import>
  </x-import>
  <div style="display: flex; justify-content: flex-end; margin-top: 10px"><x-import component-from-global-scope="Bae.MacButton">Invite…</x-import></div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":690,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
