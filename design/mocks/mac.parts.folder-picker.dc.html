<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folder picker</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--elevated)}
</style>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; gap: 10px; color: var(--text-primary); font: 13px var(--font-sans)">
<div style="color: var(--text-secondary); line-height: 17px">{{heading}}</div>
<sc-if value="{{showPath}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><div style="color: var(--text-secondary)">{{rootName}} › <span style="color: var(--text-primary)">Music</span></div><x-import component-from-global-scope="Bae.MacButton" kind="borderless" off="{{naming}}">Up</x-import></div></sc-if>
<x-import component-from-global-scope="Bae.MacBox" empty="{{emptyText}}">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="3"><x-import component-from-global-scope="Bae.MacRow" label="{{row.name}}" selected="{{row.selected}}" chevron="{{row.caret}}"></x-import></sc-for>
<sc-if value="{{naming}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.MacFieldRow" align-text="{{yes}}"><x-import component-from-global-scope="Bae.MacTextField" label="Folder name" label-hidden="{{yes}}" value="bae" state="focused"></x-import><x-import component-from-global-scope="Bae.MacButton">Create</x-import></x-import></sc-if>
</x-import>
<sc-if value="{{notEmpty}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.MacNotice" tone="danger" title="{{notEmptyText}}"></x-import></sc-if>

<x-import component-from-global-scope="Bae.MacSheetFooter" split="{{yes}}">
<div style="display: flex; gap: 8px"><x-import component-from-global-scope="Bae.MacButton" off="{{naming}}">New folder…</x-import><x-import component-from-global-scope="Bae.MacButton" off="{{naming}}">Look again</x-import></div>
<x-import component-from-global-scope="Bae.MacButton">Cancel</x-import>
<x-import component-from-global-scope="Bae.MacButton" kind="primary" off="{{setUpOff}}">Set up</x-import>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"provider":{"editor":"enum","options":["dropbox","onedrive"],"default":"dropbox"},"state":{"editor":"enum","options":["list","notEmpty","naming","made","empty"],"default":"naming"},"$preview":{"width":460,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const provider = this.props.provider ?? 'dropbox';
    const state = this.props.state ?? 'naming';
    const dropbox = provider === 'dropbox';
    const names = dropbox ? ['Family', 'Music', 'Photos'] : ['Live', 'Albums', 'Mixes'];
    const picked = state === 'made' ? 'bae' : (state === 'naming' ? null : names[1]);
    const list = state === 'empty' ? [] : (state === 'made' ? names.concat(['bae']) : names);
    return {
      yes: true,
      heading: dropbox ? 'Choose an empty shared folder for this library.' : 'Choose an empty folder for this library.',
      showPath: !dropbox,
      rootName: 'OneDrive',
      emptyText: dropbox ? 'No shared folders yet' : 'No folders here yet',
      rows: list.map((name) => ({ name, selected: name === picked, caret: !dropbox })),
      naming: state === 'naming',
      notEmpty: state === 'notEmpty',
      notEmptyText: `“${names[1]}” is not empty. Choose an empty folder, or make a new one.`,
      setUpOff: state === 'naming' || state === 'notEmpty' || state === 'empty'
    };
  }
}
</script>
</body>
</html>
