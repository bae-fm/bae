<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--background)}

</style>
</helmet>
<div style="position:relative;height:600px"><x-import component-from-global-scope="Bae.MacSettingsWindow" pane="Save as" title="Save as" height="960"><x-import component-from-global-scope="Bae.MacSection" title="Formats"><x-import component-from-global-scope="Bae.MacBox"><x-import component-from-global-scope="Bae.MacRow" label="FLAC"><x-import component-from-global-scope="Bae.MacIconButton" icon="ellipsis" size="15" label="More"></x-import></x-import><x-import component-from-global-scope="Bae.MacRow" label="MP3"><x-import component-from-global-scope="Bae.MacIconButton" icon="ellipsis" size="15" label="More"></x-import></x-import><x-import component-from-global-scope="Bae.MacRow" label="Phone"><x-import component-from-global-scope="Bae.MacIconButton" icon="ellipsis" size="15" label="More"></x-import></x-import></x-import><x-import component-from-global-scope="Bae.MacSheetFooter"><x-import component-from-global-scope="Bae.MacButton">Add format…</x-import></x-import></x-import><x-import component-from-global-scope="Bae.MacSection" title="Names"><x-import component-from-global-scope="Bae.MacBox"><x-import component-from-global-scope="Bae.MacFileNameField" label="File name" pattern="[Track №] [Title]" add="Artist,Album,Album year,Release year,Disc №,Track total" preview="04 Low Tide Hours.flac"></x-import><x-import component-from-global-scope="Bae.MacFileNameField" label="Folder name" pattern="[Artist] - [Album]" add="Album year,Release year,Label,Catalog number" preview="Mara Quill - Low Tide Hours"></x-import></x-import></x-import><x-import component-from-global-scope="Bae.MacSection" title="Extras"><x-import component-from-global-scope="Bae.MacBox"><x-import component-from-global-scope="Bae.MacRow" label="Embed cover art"><x-import component-from-global-scope="Bae.MacSwitch" on="{{ true }}" label="Embed cover art"></x-import></x-import><x-import component-from-global-scope="Bae.MacRow" label="Cover image in the folder" note="Adds cover.jpg, which many car stereos and </x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":690,"height":960}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
