<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS: Reset this device?</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--background)}

</style>
</helmet>
<x-import component-from-global-scope="Bae.MacWindow" width="900" height="600"><div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;box-sizing:border-box;text-align:center;font:400 13px var(--font-sans)"><div style="font:700 22px var(--font-sans)">Reset this device?</div><div class="bae-muted" style="max-width:400px">Resetting discards edits on this device that have not synced.</div><div style="text-align:left;max-width:400px"><div class="bae-strong" style="margin-bottom:4px">Why the library didn’t open</div><x-import component-from-global-scope="Bae.MacNotice" tone="danger" title="This device must be reset before it can sync." details="DeviceResetRequired: the library moved past this device’s last sync"></x-import></div><div style="display:flex;gap:12px"><x-import component-from-global-scope="Bae.MacButton">Cancel</x-import><x-import component-from-global-scope="Bae.MacButton" destructive="{{yes}}">Reset Device</x-import></div></div></x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
