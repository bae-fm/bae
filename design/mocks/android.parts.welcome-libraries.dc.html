<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome libraries</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--background)}
</style>
</helmet>
<div style="font-family: var(--font-android)"><x-import component-from-global-scope="Bae.AndroidSection" title="Your libraries"></x-import><x-import component-from-global-scope="Bae.AndroidCard">
  <sc-if value="{{resting}}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="Bae.AndroidRow" title="Home music"><x-import component-from-global-scope="Bae.AndroidMoreMenu"></x-import></x-import></sc-if>
  <sc-if value="{{removing}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.AndroidRow" title="Home music" subtitle="Leaving the library…"><div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="Bae.AndroidSpinner"></x-import></div></x-import></sc-if>
  <x-import component-from-global-scope="Bae.AndroidRow" title="Odile’s records"><x-import component-from-global-scope="Bae.AndroidMoreMenu"></x-import></x-import>
  <x-import component-from-global-scope="Bae.AndroidRow" title="Add library" action="{{yes}}" leading-icon="add"></x-import>
</x-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["","removing"],"default":""},"$preview":{"width":412,"height":290}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (this.props || {}).state || '';
    return { yes: true, resting: s === '', removing: s === 'removing' };
  }
}
</script>
</body>
</html>
