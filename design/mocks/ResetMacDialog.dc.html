<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS: Reset this device: confirm</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--background)}

</style>
</helmet>
<x-import component-from-global-scope="Bae.MacWindow" width="900" height="600"><div style="position:relative;height:100%;display:flex;flex-direction:column"><x-import component-from-global-scope="Bae.MacNotice" tone="danger" layout="centered" quiet="{{ true }}" title="This device must be reset before it can sync." action="Reset This Device…"></x-import><x-import component-from-global-scope="Bae.MacAlert" title="Reset this device?" message="Resetting discards edits on this device that have not synced."><x-import component-from-global-scope="Bae.MacButton" destructive="{{yes}}" size="alert">Reset</x-import><x-import component-from-global-scope="Bae.MacButton" size="alert">Cancel</x-import></x-import></div></x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
