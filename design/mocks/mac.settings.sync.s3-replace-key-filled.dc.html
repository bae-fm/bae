<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS: Sync: S3, replace key, filled</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<x-import component-from-global-scope="Bae.MacSettingsWindow" pane="Library" title="Sync" back="Library">
  <dc-import name="mac.parts.sync-status" status="Synced" tone="success" cause="" fix="" last-synced="" hint-size="100%,110px"></dc-import>
  <dc-import name="mac.parts.s3-cloud-home" key-id="AKIA4EXAMPLEOLD" hint-size="100%,210px"></dc-import>
<x-import component-from-global-scope="Bae.MacSection" title="Restore code"><dc-import name="mac.parts.restore-code" s3="true" hint-size="100%,150px"></dc-import></x-import>
  <x-import component-from-global-scope="Bae.MacSheet" title="S3 key" overlay="{{yes}}" width="440" message="Enter a key that can use this library’s S3 storage.">
    <dc-import name="mac.parts.s3-key-fields" key-id="AKIA4EXAMPLENEW" secret="abcdefghijkl" hint-size="100%,90px"></dc-import>
    <x-import component-from-global-scope="Bae.MacSheetFooter"><x-import component-from-global-scope="Bae.MacButton">Cancel</x-import><x-import component-from-global-scope="Bae.MacButton" kind="primary">Save</x-import></x-import>
  </x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":690,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
