<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Album: every storage state</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--background)}

</style>
</helmet>
<div style="width:412px;box-sizing:border-box;padding:0 0 16px;background:var(--background);font-family:var(--font-android)"><div style="display:flex;flex-direction:column"><div style="padding:8px 16px;font:600 13px/20px var(--font-android);color:var(--text-secondary)">Pin</div><div style="padding:8px 16px 12px;border-top:1px solid var(--hairline)"><div style="font:400 11px/16px var(--font-android);color:var(--text-secondary);padding-bottom:4px">Not pinned</div><x-import component-from-global-scope="Bae.AndroidDownloadControl" state="available"></x-import></div><div style="padding:8px 16px 12px;border-top:1px solid var(--hairline)"><div style="font:400 11px/16px var(--font-android);color:var(--text-secondary);padding-bottom:4px">Queued to pin</div><x-import component-from-global-scope="Bae.AndroidDownloadControl" state="queued"></x-import></div><div style="padding:8px 16px 12px;border-top:1px solid var(--hairline)"><div style="font:400 11px/16px var(--font-android);color:var(--text-secondary);padding-bottom:4px">Pinning</div><x-import component-from-global-scope="Bae.AndroidDownloadControl" state="downloading"></x-import></div><div style="padding:8px 16px 12px;border-top:1px solid var(--hairline)"><div style="font:400 11px/16px var(--font-android);color:var(--text-secondary);padding-bottom:4px">Could not pin</div><x-import component-from-global-scope="Bae.AndroidDownloadControl" state="failed"></x-import></div><div style="padding:8px 16px 12px;border-top:1px solid var(--hairline)"><div style="font:400 11px/16px var(--font-android);color:var(--text-secondary);padding-bottom:4px">Pinned</div><x-import component-from-global-scope="Bae.AndroidDownloadControl" state="downloaded"></x-import></div><div style="padding:8px 16px;font:600 13px/20px var(--font-android);color:var(--text-secondary)">Upload</div><div style="padding:8px 16px 12px;border-top:1px solid var(--hairline)"><div style="font:400 11px/16px var(--font-android);color:var(--text-secondary);padding-bottom:4px">Queued to upload</div><x-import component-from-global-scope="Bae.AndroidUploadLine" ></x-import></div><div style="padding:8px 16px 12px;border-top:1px solid var(--hairline)"><div style="font:400 11px/16px var(--font-android);color:var(--text-secondary);padding-bottom:4px">Held by a missing original</div><x-import component-from-global-scope="Bae.AndroidUploadLine" missing="01 Harbor Lights.flac"></x-import></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
