<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS: Invite fields</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--elevated)}
</style>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; gap: 10px; color: var(--text-primary); font: 13px var(--font-sans)">
<sc-if value="{{email}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.MacBox"><x-import component-from-global-scope="Bae.MacFieldRow" label="{{email}}" label-width="{{labelWidth}}"><x-import component-from-global-scope="Bae.MacTextField" value="person@example.com" state="focused" note="{{why}}"></x-import></x-import></x-import></sc-if>
<sc-if value="{{s3Theirs}}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="Bae.MacBox"><x-import component-from-global-scope="Bae.MacFieldRow" label="Access key ID" label-width="{{labelWidth}}"><x-import component-from-global-scope="Bae.MacTextField" value="AKIAEXAMPLEKEY" state="focused"></x-import></x-import><x-import component-from-global-scope="Bae.MacFieldRow" label="Secret access key" label-width="{{labelWidth}}"><x-import component-from-global-scope="Bae.MacTextField" value="abcdefghijkl" secret="{{yes}}" note="Their own key to the bucket, so they can join."></x-import></x-import></x-import></sc-if>
<sc-if value="{{s3Mine}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.MacNote">They’ll use your key. To remove them later, you make a new key for yourself and enter it on each of your devices.</x-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"storage":{"editor":"enum","options":["dropbox", "onedrive", "icloud", "s3"],"default":"s3"},"keyOwner":{"editor":"enum","options":["theirs","mine"],"default":"theirs"},"$preview":{"width":400,"height":140}}'>
class Component extends DCLogic {
  renderVals() {
    const storage = this.props.storage ?? 's3';
    const email = {"dropbox": "Dropbox email", "onedrive": "Microsoft account email", "icloud": "Apple Account email"}[storage] || '';
    const account = { dropbox: 'Dropbox account', onedrive: 'Microsoft account', icloud: 'Apple Account' }[storage] || '';
    const why = 'The library is shared with this ' + account + ' so they can join.';
    const mine = storage === 's3' && (this.props.keyOwner ?? 'theirs') === 'mine';
    return { yes: true, labelWidth: storage === 's3' ? 120 : 150, email, why, s3Mine: mine, s3Theirs: storage === 's3' && !mine };
  }
}
</script>
</body>
</html>
