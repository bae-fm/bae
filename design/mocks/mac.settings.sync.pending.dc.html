<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS settings: Sync: needs attention</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.side{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text-primary);font:13px -apple-system,'SF Pro Text',system-ui,sans-serif;padding:5px 10px;border-radius:6px;cursor:pointer}
.box{background:var(--surface);border-radius:8px;display:flex;flex-direction:column}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:4px 12px;font-size:13px}
.r+.r{border-top:1px solid var(--hairline)}
.sec{margin:14px 4px 6px;font-size:13px;font-weight:600;color:var(--text-primary)}
.v{color:var(--text-secondary)}
.pop{height:22px;padding:0 8px;border-radius:5px;border:0;background:var(--tile);color:var(--text-primary);font:13px -apple-system,system-ui,sans-serif;display:flex;align-items:center;gap:6px}
.btn{height:22px;padding:0 10px;border-radius:5px;border:0;background:var(--tile);color:var(--text-primary);font:13px -apple-system,system-ui,sans-serif}
.foot{font-size:11px;color:var(--text-secondary);padding:6px 4px 0}
</style>
</helmet>
<x-import component-from-global-scope="Bae.MacSettingsWindow" pane="Library" title="Sync" back="Library" height="820">
  <dc-import name="mac.parts.sync-status" status="Waiting to sync" tone="warning" cause="The cover of Low Tide Hours could not upload. Changes from this Mac wait for it." fix="Retry" last-synced="2 hours ago" hint-size="100%,110px"></dc-import>
  <x-import component-from-global-scope="Bae.MacSection" title="Cloud home">
    <x-import component-from-global-scope="Bae.MacBox">
      <x-import component-from-global-scope="Bae.MacRow" label="Provider" value="Dropbox"></x-import>
      <x-import component-from-global-scope="Bae.MacRow" label="Account" value="name@example.com"></x-import>
      <x-import component-from-global-scope="Bae.MacRow" label="Folder" value="Music"></x-import>
      <x-import component-from-global-scope="Bae.MacRow" label="">
        <x-import component-from-global-scope="Bae.MacButton">Open in browser</x-import>
      </x-import>
    </x-import>
  </x-import>
<x-import component-from-global-scope="Bae.MacSection" title="Restore code"><dc-import name="mac.parts.restore-code" hint-size="100%,150px"></dc-import></x-import>
<x-import component-from-global-scope="Bae.MacSection" title="Needs attention"><div style="display:flex;flex-direction:column;gap:8px"><x-import component-from-global-scope="Bae.MacNotice" quiet="{{yes}}" tone="warning" title="Library changes from the cloud" subtitle="Decryption key unavailable. Changes from other devices wait for it." secondary="Details" action="Restore with code"></x-import><x-import component-from-global-scope="Bae.MacNotice" quiet="{{yes}}" tone="warning" title="03 Second Floor.flac from Paper Lanterns" subtitle="Source file changed" secondary="Details" action="Restore source file"></x-import><x-import component-from-global-scope="Bae.MacNotice" quiet="{{yes}}" tone="warning" title="Removing a person" subtitle="Cloud request failed" secondary="Details" action="Retry"></x-import></div></x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":690,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
