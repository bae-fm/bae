<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS settings: Transfers, uploads paused</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.side{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text-primary);font:13px -apple-system,'SF Pro Text',system-ui,sans-serif;padding:5px 10px;border-radius:6px;cursor:pointer}
.box{background:var(--surface);border-radius:8px;display:flex;flex-direction:column}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:4px 12px;font-size:13px}
.r+.r{border-top:1px solid var(--hairline)}
.sec{margin:14px 4px 6px;font-size:13px;font-weight:600;color:var(--text-primary)}
.v{color:var(--text-secondary)}
.pop{height:22px;padding:0 8px;border-radius:5px;border:0;background:var(--tile);color:var(--text-primary);font:13px -apple-system,system-ui,sans-serif;display:flex;align-items:center;gap:6px}
.btn{height:22px;padding:0 10px;border-radius:5px;border:0;background:var(--tile);color:var(--text-primary);font:13px -apple-system,system-ui,sans-serif}
.foot{font-size:11px;color:var(--text-secondary);padding:6px 4px 0}
</style>
</helmet>
<x-import component-from-global-scope="Bae.MacSettingsWindow" pane="TransfersPaused" title="Transfers">
  <x-import component-from-global-scope="Bae.MacBox">
    <x-import component-from-global-scope="Bae.MacRow" label="Simultaneous uploads">
      <x-import component-from-global-scope="Bae.MacPopUp" value="3"></x-import>
    </x-import>
    <x-import component-from-global-scope="Bae.MacRow" label="Simultaneous downloads">
      <x-import component-from-global-scope="Bae.MacPopUp" value="3"></x-import>
    </x-import>
  </x-import>
  <x-import component-from-global-scope="Bae.MacNote">How many files upload to storage at once after an import, and how many download at once when a release is pinned.</x-import>
  <x-import component-from-global-scope="Bae.MacSection">
    <x-import component-from-global-scope="Bae.MacBox">
      <x-import component-from-global-scope="Bae.MacRow" label="Pause uploads">
        <button role="switch" aria-checked="true" aria-label="Pause uploads" style="width: 32px; height: 18px; border-radius: 9px; border: 0; background: var(--accent); position: relative; flex: none; cursor: pointer"><span style="position: absolute; top: 2px; left: 16px; width: 14px; height: 14px; border-radius: 7px; background: var(--text-primary)"></span></button>
      </x-import>
    </x-import>
    <x-import component-from-global-scope="Bae.MacNote">While paused, changes wait on this Mac and upload when you resume.</x-import>
  </x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":690,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
