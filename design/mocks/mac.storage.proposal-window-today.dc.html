<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storage Manager today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#e8a3c7}a:hover{color:#f2c1da}
</style>
</helmet>
<div style="width: 1040px; height: 654px; box-sizing: border-box; background: #1e1e1e; color: #e6e6e6; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px">
<div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #1b1b1b">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #ec5f57"></span>
<span style="width: 12px; height: 12px; border-radius: 6px; background: #f4bf4f"></span>
<span style="width: 12px; height: 12px; border-radius: 6px; background: #61c454"></span>
<span style="margin-left: 18px; font-size: 14px; font-weight: 600">Storage Manager</span>
<span style="flex-grow: 1"></span>
<button type="button" aria-label="Inspector" style="width: 32px; height: 32px; border-radius: 16px; border: 0; background: #e8a3c7; display: flex; align-items: center; justify-content: center"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="#fff" stroke-width="1.5" aria-hidden="true"><rect x="1" y="1" width="16" height="12" rx="2"></rect><path d="M11 1v12M13 4h2M13 6.5h2M13 9h2"></path></svg></button>
</div>
<div style="flex-grow: 1; display: flex; min-height: 0">
<div style="width: 600px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #0f0f0f">
<div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px">
<span style="color: #c9c9c9">Filter</span>
<div style="display: flex; background: #2b2b2b; border-radius: 6px; padding: 1px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<span style="width: 74px; text-align: center; padding: 3px 0; border-radius: 5px; color: {{f.color}}; background: {{f.fill}}">{{f.label}}</span>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: 236px 172px 76px minmax(0, 1fr); padding: 0 0 6px 14px; border-bottom: 1px solid #333; font-size: 12px; font-weight: 600">
<span>Album</span><span style="border-left: 1px solid #3a3a3a; padding-left: 8px">Artist</span><span style="border-left: 1px solid #3a3a3a; padding-left: 8px">Media</span><span style="border-left: 1px solid #3a3a3a; padding-left: 8px">Storage</span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden">
<sc-for list="{{releases}}" as="r" hint-placeholder-count="8">
<div style="height: 23px; flex-shrink: 0; display: grid; grid-template-columns: 236px 172px 76px minmax(0, 1fr); align-items: center; padding-left: 14px; background: {{r.fill}}">
<span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="width: 18px; height: 18px; border-radius: 3px; flex-shrink: 0; background: {{r.cover}}"></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.album}}</span></span>
<span style="padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.artist}}</span>
<span style="padding-left: 8px">{{r.media}}</span>
<span style="padding-left: 8px; display: flex; align-items: center; gap: 6px">
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; color: {{r.chipColor}}; background: {{r.chipFill}}">{{r.storage}}</span>
<sc-if value="{{r.uploading}}" hint-placeholder-val="{{false}}"><span style="width: 60px; height: 3px; border-radius: 2px; background: #3a3a3a; overflow: hidden"><span style="display: block; width: 62%; height: 3px; background: #7fd6cf"></span></span></sc-if>
</span>
</div>
</sc-for>
<sc-for list="{{empty}}" as="e" hint-placeholder-count="12">
<div style="height: 23px; flex-shrink: 0; background: {{e.fill}}"></div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-top: 1px solid #333; color: #9b9b9b">
<span>8 releases</span>
<span style="flex-grow: 1"></span>
<span style="font-variant-numeric: tabular-nums">6.4 MB/s</span>
<span>Total: 4.68 GB</span>
</div>
</div>
<div style="width: 440px; flex-shrink: 0; overflow: hidden">
<dc-import name="mac.storage.proposal-today" hint-size="440px,900px"></dc-import>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":654}}'>
class Component extends DCLogic {
renderVals() {
const pick = (label, on) => ({ label, color: on ? '#ffffff' : '#d6d6d6', fill: on ? '#e8a3c7' : 'transparent' });
const cloud = { storage: 'Cloud', chipColor: '#b8b8b8', chipFill: '#2f2f2f', uploading: false };
const rows = [
{ album: 'Harbor Lights Dub', artist: 'Mira Okonkwo', media: 'CD', cover: '#7a4a5c', ...cloud },
{ album: 'Paper Moons', artist: 'The Lantern Society', media: 'CD', cover: '#b08a4a', ...cloud },
{ album: 'Rockers at Dawn', artist: 'Mira Okonkwo', media: 'CD', cover: '#5a6a7a', ...cloud },
{ album: 'Static Bloom', artist: 'Grey Hollow', media: 'CD', cover: '#8a8a8a', ...cloud },
{ album: 'Saltmarsh', artist: 'Tin Roof Choir', media: '2×CD', cover: '#6a4a3a', storage: 'Uploading', chipColor: '#7fd6cf', chipFill: '#1f3533', uploading: true },
{ album: 'Northbound', artist: 'Delta Assembly', media: 'CD', cover: '#4a5a4a', storage: 'Local', chipColor: '#b8b8b8', chipFill: '#2f2f2f', uploading: false },
{ album: 'The Essential Wren Sisters', artist: 'The Wren Sisters', media: '2×CD', cover: '#9a9a8a', storage: 'Pinned', chipColor: '#b8b8b8', chipFill: '#2f2f2f', uploading: false },
{ album: 'Lantern Season: A Compilation of Northern…', artist: 'Various Artists', media: '4×CD', cover: '#7a6a5a', ...cloud }
];
return {
filters: [pick('All', true), pick('Local', false), pick('Cloud', false), pick('Sync queue', false)],
releases: rows.map((r, i) => ({ ...r, fill: i === 4 ? '#2456d0' : (i % 2 ? '#242424' : '#1e1e1e') })),
empty: Array.from({ length: 14 }, (_, i) => ({ fill: (i + 8) % 2 ? '#242424' : '#1e1e1e' }))
};
}
}
</script>
</body>
</html>
