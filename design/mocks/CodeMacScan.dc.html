<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS: scanning a code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--background)}

</style>
</helmet>
<div style="position:relative;height:600px"><x-import component-from-global-scope="Bae.MacWindow" width="900" height="600"><div style="height:100%;display:flex;flex-direction:column;align-items:center;padding:24px 32px;box-sizing:border-box;gap:2px;font:400 13px var(--font-sans)"><div style="font:700 22px var(--font-sans)">Add device</div><div class="bae-muted" style="max-width:520px;text-align:center;margin-bottom:16px">Scan or paste the code shown by Add Device… on one of your devices. If you’ve lost every device, use your recovery code.</div><div style="width:520px;display:flex;flex-direction:column;gap:12px"><x-import component-from-global-scope="Bae.MacSection" title="Code"><x-import component-from-global-scope="Bae.MacBox"><div style="display:flex;gap:8px;align-items:center;padding:8px 12px"><div style="flex:1"><x-import component-from-global-scope="Bae.MacTextField" label="Code" label-hidden="{{yes}}" placeholder="Paste a code"></x-import></div><x-import component-from-global-scope="Bae.MacButton">Scan</x-import></div></x-import></x-import></div><div style="flex:1"></div><div style="display:flex;gap:12px;margin-bottom:24px"><x-import component-from-global-scope="Bae.MacButton">Back</x-import><x-import component-from-global-scope="Bae.MacButton" kind="primary" off="{{yes}}">Add</x-import></div></div></x-import><div class="bae-m-scrim" style="align-items:flex-start"><div class="bae-m-sheet" style="width:400px;height:440px;overflow:hidden"><div style="display:flex;justify-content:space-between;padding:12px 16px;font:600 15px var(--font-sans)">Scan a code<x-import component-from-global-scope="Bae.MacButton" kind="borderless">Cancel</x-import></div><div class="bae-divider"></div><div style="flex:1;background:var(--well);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font:400 13px var(--font-sans)">Starting camera…</div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
