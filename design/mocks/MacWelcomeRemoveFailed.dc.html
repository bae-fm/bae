<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS: Welcome: removing failed</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.side{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text-primary);font:13px -apple-system,'SF Pro Text',system-ui,sans-serif;padding:5px 10px;border-radius:6px;cursor:pointer}
.box{background:var(--surface);border-radius:8px;display:flex;flex-direction:column}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:4px 12px;font-size:13px}
.r+.r{border-top:1px solid var(--hairline)}
.sec{margin:14px 4px 6px;font-size:13px;font-weight:600;color:var(--text-primary)}
.v{color:var(--text-secondary)}
.pop{height:22px;padding:0 8px;border-radius:5px;border:0;background:var(--tile);color:var(--text-primary);font:13px -apple-system,system-ui,sans-serif;display:flex;align-items:center;gap:6px}
.btn{height:22px;padding:0 10px;border-radius:5px;border:0;background:var(--tile);color:var(--text-primary);font:13px -apple-system,system-ui,sans-serif}
.foot{font-size:11px;color:var(--text-secondary);padding:6px 4px 0}
</style>
</helmet>
<x-import component-from-global-scope="Bae.MacWindow">
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 56px 0 24px"><div style="font-size: 34px; font-weight: 700; letter-spacing: -1px">bae</div><div style="margin-top: 6px; font-size: 15px">Get started with your music library.</div><div style="width: 420px; margin-top: 28px; display: flex; flex-direction: column; gap: 8px"><x-import component-from-global-scope="Bae.MacSection" title="Your libraries">
    <x-import component-from-global-scope="Bae.MacBox">
      <x-import component-from-global-scope="Bae.MacRow" label="Library Name" strong="{{yes}}" note="Couldn’t remove the library: [why it failed]" note-tone="danger">
        <x-import component-from-global-scope="Bae.MacButton">Retry</x-import>
        <x-import component-from-global-scope="Bae.MacButton" kind="borderless" destructive="{{yes}}">Remove</x-import>
      </x-import>
      <x-import component-from-global-scope="Bae.MacRow" label="Local Library" strong="{{yes}}" note="Not synced">
        <x-import component-from-global-scope="Bae.MacButton">Open</x-import>
        <x-import component-from-global-scope="Bae.MacButton" kind="borderless" destructive="{{yes}}">Remove</x-import>
      </x-import>
    </x-import>
  </x-import></div><div style="flex: 1"></div><div style="display: flex; gap: 8px"><x-import component-from-global-scope="Bae.MacButton">Create new library</x-import><x-import component-from-global-scope="Bae.MacButton">Scan a code</x-import><x-import component-from-global-scope="Bae.MacButton">Enter a code</x-import></div></div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":690,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
