<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS: a code half typed</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--background)}

</style>
</helmet>
<x-import component-from-global-scope="Bae.MacWelcomeWindow">
  <x-import component-from-global-scope="Bae.MacWelcomeHome" empty="{{yes}}"></x-import>
  <x-import component-from-global-scope="Bae.MacSheet" centred="{{yes}}" title="Enter code" overlay="{{yes}}" width="400" message="Enter your restore code, or an invite to a library.">
    <x-import component-from-global-scope="Bae.MacTextField" label="Restore code or invite" label-hidden="{{yes}}" code="{{yes}}" value="CVR1UJZDEGXDNCF32EPF3DHO" state="focused"></x-import>
    <x-import component-from-global-scope="Bae.MacSheetFooter"><x-import component-from-global-scope="Bae.MacButton">Cancel</x-import><x-import component-from-global-scope="Bae.MacButton" kind="primary">Continue</x-import></x-import>
  </x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":690,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
