<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS: Welcome libraries</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--background)}
</style>
</helmet>
<div class="bae-mac" style="font-family: var(--font-sans)"><x-import component-from-global-scope="Bae.MacSection" title="Your libraries">
  <x-import component-from-global-scope="Bae.MacBox">
    <sc-if value="{{resting}}" hint-placeholder-val="{{ true }}"><x-import component-from-global-scope="Bae.MacRow" label="Home music" strong="{{yes}}" button="{{yes}}"><x-import component-from-global-scope="Bae.MacMoreMenu"></x-import></x-import></sc-if>
    <sc-if value="{{openFailed}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.MacNested"><x-import component-from-global-scope="Bae.MacNotice" tone="danger" title="Could not open" subtitle="Something is wrong with this library’s data." secondary="Details" action="Reset from cloud…" buttons="below"></x-import></x-import></sc-if>
    <sc-if value="{{removing}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.MacRow" label="Home music" strong="{{yes}}" note="Leaving the library…"><div style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="Bae.MacSpinner"></x-import></div></x-import></sc-if>
    <x-import component-from-global-scope="Bae.MacRow" label="Odile’s records" strong="{{yes}}" button="{{yes}}" off="{{removing}}"><x-import component-from-global-scope="Bae.MacMoreMenu" off="{{removing}}"></x-import></x-import>
    <sc-if value="{{damagedJoin}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.MacRow" label="Unfinished join that cannot be read" strong="{{yes}}" note="3b9e07d4-51a2-4c8f-b6e3-0f2d9a7c4e81"><x-import component-from-global-scope="Bae.MacButton">Discard…</x-import></x-import></sc-if>
    <sc-if value="{{unreadable}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.MacRow" label="Library that cannot be read" strong="{{yes}}" note="6f1c2a9e-4b7d-4e21-9a0c-3d5e8b2f7c14"><x-import component-from-global-scope="Bae.MacButton">Remove…</x-import></x-import></sc-if>
  </x-import>
  <x-import component-from-global-scope="Bae.MacSheetFooter"><x-import component-from-global-scope="Bae.MacButton" off="{{removing}}" menu="{{yes}}">Add library…</x-import></x-import>
</x-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["","removing","open-failed","unreadable","damaged-join"],"default":""},"$preview":{"width":420,"height":170}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (this.props || {}).state || '';
    return { yes: true, resting: s === '' || s === 'open-failed' || s === 'unreadable' || s === 'damaged-join', unreadable: s === 'unreadable', damagedJoin: s === 'damaged-join', removing: s === 'removing', openFailed: s === 'open-failed' };
  }
}
</script>
</body>
</html>
