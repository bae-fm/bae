<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S3-compatible form</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--elevated)}
</style>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; gap: 10px; color: var(--text-primary); font: 13px var(--font-sans)">
<sc-if value="{{topError}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.Notice" tone="danger" set="mac" icon="{{ false }}">{{topError}}</x-import></sc-if>
<x-import component-from-global-scope="Bae.MacSection" title="Location">
<x-import component-from-global-scope="Bae.MacBox">
<x-import component-from-global-scope="Bae.MacFieldRow" label="Endpoint" label-width="120"><x-import component-from-global-scope="Bae.MacTextField" value="{{endpoint}}"></x-import></x-import>
<x-import component-from-global-scope="Bae.MacFieldRow" label="Region" label-width="120"><x-import component-from-global-scope="Bae.MacTextField" value="{{region}}" state="{{regionState}}" error="{{regionError}}"></x-import></x-import>
<x-import component-from-global-scope="Bae.MacFieldRow" label="Bucket" label-width="120"><x-import component-from-global-scope="Bae.MacTextField" value="{{bucket}}" state="{{bucketState}}" error="{{bucketError}}"></x-import></x-import>
</x-import>
</x-import>
<x-import component-from-global-scope="Bae.MacSection" title="Key">
<x-import component-from-global-scope="Bae.MacBox">
<x-import component-from-global-scope="Bae.MacFieldRow" label="Access key ID" label-width="120"><x-import component-from-global-scope="Bae.MacTextField" value="{{keyId}}"></x-import></x-import>
<x-import component-from-global-scope="Bae.MacFieldRow" label="Secret access key" label-width="120"><x-import component-from-global-scope="Bae.MacTextField" value="{{secret}}" secret="{{yes}}"></x-import></x-import>
</x-import>
</x-import>
<x-import component-from-global-scope="Bae.MacSheetFooter">
<x-import component-from-global-scope="Bae.MacButton">Cancel</x-import>
<x-import component-from-global-scope="Bae.MacButton" kind="primary">Set up</x-import>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"error":{"editor":"enum","options":["none","key","denied","region","bucket","occupied"],"default":"none"},"$preview":{"width":460,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const error = this.props.error ?? 'none';
    const top = {
      key: 'This key wasn\u2019t accepted. Check the access key ID and secret access key.',
      denied: 'This key can\u2019t use the bucket. Give it read and write access, or use another key.'
    }[error] || '';
    const bucketError = {
      bucket: 'The storage location was not found.',
      occupied: 'Use an empty bucket or folder that only this library uses.'
    }[error] || '';
    const regionError = error === 'region' ? 'The region or endpoint doesn\u2019t match this bucket.' : '';
    return {
      yes: true,
      topError: top,
      endpoint: 'https://s3.home.lan',
      region: 'us-east-1',
      regionState: regionError ? 'error' : 'normal',
      regionError,
      bucket: 'my-bucket',
      bucketState: bucketError ? 'error' : 'normal',
      bucketError,
      keyId: 'a1b2c3d4e5f6',
      secret: 'abcdefghijkl'
    };
  }
}
</script>
</body>
</html>
