<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S3-compatible form</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--elevated)}
</style>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; gap: 10px; color: var(--text-primary); font: 13px var(--font-sans)">
<x-import component-from-global-scope="Bae.MacSection" title="Location">
<x-import component-from-global-scope="Bae.MacBox">
<x-import component-from-global-scope="Bae.MacRow" label="Endpoint" label-width="120"><x-import component-from-global-scope="Bae.MacTextField" value="{{endpoint}}" note="{{serviceLine}}"></x-import></x-import>
<x-import component-from-global-scope="Bae.MacRow" label="Region" label-width="120"><x-import component-from-global-scope="Bae.MacTextField" value="{{region}}"></x-import></x-import>
<x-import component-from-global-scope="Bae.MacRow" label="Bucket" label-width="120"><x-import component-from-global-scope="Bae.MacTextField" value="{{bucket}}"></x-import></x-import>
</x-import>
</x-import>
<x-import component-from-global-scope="Bae.MacSection" title="Key">
<x-import component-from-global-scope="Bae.MacBox">
<x-import component-from-global-scope="Bae.MacRow" label="Access key ID" label-width="120"><x-import component-from-global-scope="Bae.MacTextField" value="{{keyId}}"></x-import></x-import>
<x-import component-from-global-scope="Bae.MacRow" label="Secret access key" label-width="120"><x-import component-from-global-scope="Bae.MacTextField" value="{{secret}}" secret="{{yes}}"></x-import></x-import>
</x-import>
</x-import>
<x-import component-from-global-scope="Bae.MacDisclosure" label="Advanced" open="{{open}}">
<x-import component-from-global-scope="Bae.MacBox">
<x-import component-from-global-scope="Bae.MacRow" label="Key prefix" label-width="120"><x-import component-from-global-scope="Bae.MacTextField" placeholder="None"></x-import></x-import>
</x-import>
</x-import>
<x-import component-from-global-scope="Bae.MacSheetFooter">
<x-import component-from-global-scope="Bae.MacButton">Cancel</x-import>
<x-import component-from-global-scope="Bae.MacButton" kind="primary" off="{{setUpOff}}">Set up</x-import>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"endpoint":{"editor":"enum","options":["blank","r2","gcs","custom"],"default":"r2"},"advanced":{"editor":"boolean","default":false},"$preview":{"width":460,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.endpoint ?? 'r2';
    const blank = kind === 'blank';
    const ends = {
      blank: ['', '', ''],
      r2: ['https://account-id.r2.cloudflarestorage.com', 'auto', 'Cloudflare R2'],
      gcs: ['https://storage.googleapis.com', 'us-central1', 'Google Cloud Storage'],
      custom: ['https://s3.home.lan', 'us-east-1', 'bae will detect this service’s settings during setup.']
    }[kind];
    return {
      yes: true,
      endpoint: ends[0],
      region: ends[1],
      serviceLine: ends[2],
      bucket: blank ? '' : 'my-bucket',
      keyId: blank ? '' : 'a1b2c3d4e5f6',
      secret: blank ? '' : 'abcdefghijkl',
      open: !!this.props.advanced,
      setUpOff: blank
    };
  }
}
</script>
</body>
</html>
