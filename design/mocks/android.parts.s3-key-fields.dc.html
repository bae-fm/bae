<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S3 key fields (Android)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--elevated)}
</style>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; gap: 12px; font-family: var(--font-android)">
<sc-if value="{{refused}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Bae.AndroidNotice" quiet="{{yes}}" tone="danger" title="Key refused" subtitle="S3 storage does not accept this access key."></x-import></sc-if>
<x-import component-from-global-scope="Bae.AndroidTextField" label="Access key ID" value="{{keyId}}" state="{{idState}}"></x-import>
<x-import component-from-global-scope="Bae.AndroidTextField" label="Secret access key" value="{{secret}}" state="{{secretState}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":292,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const focus = p.focus || 'secret';
    return {
      yes: true,
      refused: p.refused === 'true',
      keyId: p.keyId || '',
      secret: p.secret ? '\u2022'.repeat(p.secret.length) : '',
      idState: focus === 'id' ? 'focused' : 'normal',
      secretState: focus === 'secret' ? 'focused' : 'normal'
    };
  }
}
</script>
</body>
</html>
