<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storage Manager proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#e8a3c7}a:hover{color:#f2c1da}
</style>
</helmet>
<div style="width: 1040px; height: 654px; box-sizing: border-box; background: #1e1e1e; color: #e6e6e6; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px">
<div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #1b1b1b">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #ec5f57"></span>
<span style="width: 12px; height: 12px; border-radius: 6px; background: #f4bf4f"></span>
<span style="width: 12px; height: 12px; border-radius: 6px; background: #61c454"></span>
<span style="margin-left: 18px; font-size: 14px; font-weight: 600; width: 160px">Storage Manager</span>
<span style="flex-grow: 1"></span>
<div style="display: flex; background: #2b2b2b; border-radius: 7px; padding: 2px; gap: 2px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" style="font: inherit; border: 0; min-width: 78px; padding: 4px 10px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: {{f.color}}; background: {{f.fill}}">{{f.label}}</button>
</sc-for>
</div>
<span style="flex-grow: 1"></span>
<span style="width: 128px"></span>
<button type="button" aria-label="Inspector" style="width: 32px; height: 32px; border-radius: 16px; border: 0; background: #e8a3c7; display: flex; align-items: center; justify-content: center"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="#fff" stroke-width="1.5" aria-hidden="true"><rect x="1" y="1" width="16" height="12" rx="2"></rect><path d="M11 1v12M13 4h2M13 6.5h2M13 9h2"></path></svg></button>
</div>
<div style="flex-grow: 1; display: flex; min-height: 0">
<div style="width: 600px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #0f0f0f">
<div style="display: grid; grid-template-columns: 236px 172px 76px minmax(0, 1fr); padding: 8px 0 6px 14px; border-bottom: 1px solid #333; font-size: 12px; font-weight: 600">
<span>Release</span><span style="border-left: 1px solid #3a3a3a; padding-left: 8px">Artist</span><span style="border-left: 1px solid #3a3a3a; padding-left: 8px">Media</span><span style="border-left: 1px solid #3a3a3a; padding-left: 8px; display: flex; align-items: center; gap: 6px">Storage<svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="#c9c9c9" stroke-width="1.5" role="img" aria-label="Sorted by storage"><path d="M2 3.5l3 3 3-3"></path></svg></span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden">
<sc-for list="{{releases}}" as="r" hint-placeholder-count="8">
<div style="height: 23px; flex-shrink: 0; display: grid; grid-template-columns: 236px 172px 76px minmax(0, 1fr); align-items: center; padding-left: 14px; background: {{r.fill}}">
<span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="width: 18px; height: 18px; border-radius: 3px; flex-shrink: 0; background: {{r.cover}}"></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.album}}</span></span>
<span style="padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.artist}}</span>
<span style="padding-left: 8px">{{r.media}}</span>
<span style="padding-left: 8px; display: flex; align-items: center; gap: 6px">
<sc-if value="{{r.resting}}" hint-placeholder-val="{{true}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; color: {{r.chipColor}}; background: {{r.chipFill}}">{{r.storage}}</span></sc-if>
<sc-if value="{{r.uploading}}" hint-placeholder-val="{{false}}"><span style="position: relative; display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; color: #d9f5f2; background: #1f3533; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 62%; background: #2f6b65"></span><span style="position: relative">Uploading</span></span></sc-if>
</span>
</div>
</sc-for>
<sc-for list="{{empty}}" as="e" hint-placeholder-count="12">
<div style="height: 23px; flex-shrink: 0; background: {{e.fill}}"></div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-top: 1px solid #333; color: #9b9b9b">
<span>8 releases</span>
<span>·</span>
<span>Total: 4.68 GB</span>
<span style="flex-grow: 1"></span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 8px; border-radius: 6px; background: #262626"><span style="display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#7fd6cf" stroke-width="2.5" role="img" aria-label="Uploads"><path d="M12 20V5M5 12l7-7 7 7"></path></svg>6.4 MB/s</span><button type="button" aria-label="Pause uploads" style="width: 20px; height: 20px; border: 0; border-radius: 4px; background: #2c2a2c; color: #e8a3c7; display: flex; align-items: center; justify-content: center"><svg width="8" height="10" viewBox="0 0 8 10" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="2.5" height="10" rx="1"></rect><rect x="5.5" y="0" width="2.5" height="10" rx="1"></rect></svg></button></span>
</div>
</div>
<div style="width: 440px; flex-shrink: 0; overflow: hidden">
<dc-import name="mac.storage.proposal" hint-size="440px,900px"></dc-import>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":654}}'>
class Component extends DCLogic {
renderVals() {
const pick = (label, on, count) => ({ label, count, color: on ? '#ffffff' : '#d6d6d6', countColor: on ? '#fbe6f0' : '#8f8f8f', fill: on ? '#e8a3c7' : 'transparent' });
const cloud = { storage: 'Cloud', chipColor: '#b8b8b8', chipFill: '#2f2f2f', uploading: false, resting: true };
const rows = [
{ album: 'Harbor Lights Dub', artist: 'Mira Okonkwo', media: 'CD', cover: '#7a4a5c', ...cloud },
{ album: 'Paper Moons', artist: 'The Lantern Society', media: 'CD', cover: '#b08a4a', ...cloud },
{ album: 'Rockers at Dawn', artist: 'Mira Okonkwo', media: 'CD', cover: '#5a6a7a', ...cloud },
{ album: 'Static Bloom', artist: 'Grey Hollow', media: 'CD', cover: '#8a8a8a', ...cloud },
{ album: 'Saltmarsh', artist: 'Tin Roof Choir', media: '2×CD', cover: '#6a4a3a', storage: 'Uploading', chipColor: '#7fd6cf', chipFill: '#1f3533', uploading: true, resting: false },
{ album: 'Northbound', artist: 'Delta Assembly', media: 'CD', cover: '#4a5a4a', storage: 'Local', chipColor: '#b8b8b8', chipFill: '#2f2f2f', uploading: false, resting: true },
{ album: 'The Essential Wren Sisters', artist: 'The Wren Sisters', media: '2×CD', cover: '#9a9a8a', storage: 'Pinned', chipColor: '#b8b8b8', chipFill: '#2f2f2f', uploading: false, resting: true },
{ album: 'Lantern Season: A Compilation of Northern…', artist: 'Various Artists', media: '4×CD', cover: '#7a6a5a', ...cloud }
];
return {
filters: [pick('All', true, 8), pick('Local', false, 1), pick('Cloud', false, 7)],
releases: [4, 5, 6, 0, 1, 2, 3, 7].map((k, i) => ({ ...rows[k], fill: k === 4 ? '#2456d0' : (i % 2 ? '#242424' : '#1e1e1e') })),
empty: Array.from({ length: 14 }, (_, i) => ({ fill: (i + 8) % 2 ? '#242424' : '#1e1e1e' }))
};
}
}
</script>
</body>
</html>
