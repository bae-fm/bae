<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS: Import, Discogs connected</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--background)}

</style>
</helmet>
<div style="height:760px"><x-import component-from-global-scope="Bae.MacSettingsWindow" pane="Import" title="Import"><x-import component-from-global-scope="Bae.MacSection"><x-import component-from-global-scope="Bae.MacBox"><x-import component-from-global-scope="Bae.MacRow" label="Identify automatically" note="Looks up each new album as soon as it’s added."><x-import component-from-global-scope="Bae.MacSwitch" on="{{ true }}" label="Identify automatically"></x-import></x-import><x-import component-from-global-scope="Bae.MacRow" label="Search MusicBrainz" info="{{ true }}"><x-import component-from-global-scope="Bae.MacSwitch" on="{{ true }}" label="Search MusicBrainz"></x-import></x-import><x-import component-from-global-scope="Bae.MacRow" label="Search Discogs" info="{{ true }}" note="Key saved"><x-import component-from-global-scope="Bae.MacSwitch" on="{{ true }}" label="Search Discogs"></x-import></x-import></x-import><x-import component-from-global-scope="Bae.MacNote">Searching both MusicBrainz and Discogs helps bae recognise more of your albums automatically.</x-import></x-import><x-import component-from-global-scope="Bae.MacSection"><x-import component-from-global-scope="Bae.MacBox"><x-import component-from-global-scope="Bae.MacRow" label="Import automatically when identified" note="Adds the album to your library once bae is sure of the match."><x-import component-from-global-scope="Bae.MacSwitch" on="{{ true }}" label="Import automatically when identified"></x-import></x-import><x-import component-from-global-scope="Bae.MacRow" label="Import to" nested="{{ true }}"><x-import component-from-global-scope="Bae.MacImportDestination" to="Cloud, pinned"></x-import></x-import></x-import></x-import></x-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":690,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
