<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: Invite, cancel</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:#F6BFD9}
.ib{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;color:var(--text-primary);cursor:pointer}
.ib svg{fill:currentColor}
.row{display:flex;flex-direction:column;justify-content:center;min-height:72px;padding:12px 16px;color:var(--text-primary);text-decoration:none;box-sizing:border-box}
.rt{font-size:16px;line-height:24px}
.sec{margin:0;padding:24px 32px 8px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-secondary)}
.sw{width:52px;height:32px;border-radius:16px;flex:none;position:relative;border:0;cursor:pointer}
.foot{padding:0 16px 8px;font-size:12px;line-height:16px;color:var(--text-secondary)}
.rs{font-size:14px;line-height:20px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{margin:0 16px;border-radius:16px;background:var(--surface);overflow:hidden}:not(h2)+.card{margin-top:8px}.card>*+*{border-top:1px solid var(--hairline)}.person>.row{min-height:52px !important}.sub{padding:14px 16px 2px;font-size:12px;font-weight:600;letter-spacing:0.04em;color:var(--text-secondary)}.card>.sub+*{border-top:0}
</style>
</helmet>
<x-import component-from-global-scope="Bae.AndroidScreen" title="People and devices" back="{{yes}}">
  <x-import component-from-global-scope="Bae.AndroidSection" title="You"></x-import>
  <x-import component-from-global-scope="Bae.AndroidCard">
    <x-import component-from-global-scope="Bae.AndroidRow" title="Name" subtitle="Ana" icon="edit"></x-import>
    <x-import component-from-global-scope="Bae.AndroidRow" title="Role" subtitle="Admin"></x-import>
    <x-import component-from-global-scope="Bae.AndroidRow" title="Listening history" subtitle="Only me"></x-import>
    <x-import component-from-global-scope="Bae.AndroidRow" title="Devices" subtitle="2 devices" icon="chevron"></x-import>
  </x-import>
  <x-import component-from-global-scope="Bae.AndroidSection" title="People"></x-import>
  <x-import component-from-global-scope="Bae.AndroidCard">
    <x-import component-from-global-scope="Bae.AndroidRow" title="Ben" subtitle="Member · 1 device" icon="chevron"></x-import>
    <x-import component-from-global-scope="Bae.AndroidRow" title="dan@example.com" tag="Invited" icon="chevron"></x-import>
    <x-import component-from-global-scope="Bae.AndroidRow" title="Invite" action="{{yes}}" leading-icon="add"></x-import>
  </x-import>
  <x-import component-from-global-scope="Bae.AndroidDialog" title="Cancel this invite?" width="340" message="dan@example.com won’t be able to use this invite.">
    
    <x-import component-from-global-scope="Bae.AndroidDialogActions">
      <x-import component-from-global-scope="Bae.AndroidButton" kind="text" neutral="{{ true }}">Keep</x-import>
      <x-import component-from-global-scope="Bae.AndroidButton" kind="text">Cancel invite</x-import>
    </x-import>
  </x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":916}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
