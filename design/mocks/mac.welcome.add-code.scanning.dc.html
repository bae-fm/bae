<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS: scanning a code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bae/tokens.css">
<link rel="stylesheet" href="ds/bae/components/bundle.css">
<script src="ds/bae/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--background)}

</style>
</helmet>
<div style="position:relative;height:600px;width:900px"><x-import component-from-global-scope="Bae.MacWelcomeWindow">
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 0 36px"><x-import component-from-global-scope="Bae.Logo" size="120" bob="{{yes}}" glow="{{yes}}"></x-import><div style="margin-top: 12px; font-size: 15px; color: var(--text-secondary)">Your music, everywhere</div><div style="margin-top: 40px; width: 240px"><dc-import name="mac.parts.welcome-buttons" hint-size="100%,66px"></dc-import></div></div></x-import><x-import component-from-global-scope="Bae.MacSheet" title="Scan a code" overlay="{{yes}}" width="400"><div style="height:300px;border-radius:var(--radius-card);background:var(--well);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font:400 13px var(--font-sans)">Starting camera…</div><x-import component-from-global-scope="Bae.MacSheetFooter"><x-import component-from-global-scope="Bae.MacButton">Cancel</x-import></x-import></x-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
