<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text field</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#232333}
</style>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; gap: 4px; color: #F2F2F4; font: 13px -apple-system, 'SF Pro Text', system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 12px">
<sc-if value="{{showLabel}}" hint-placeholder-val="{{ true }}"><span style="{{labelStyle}}">{{label}}</span></sc-if>
<div aria-label="{{label}}" style="{{fieldStyle}}">{{shown}}</div>
</div>
<sc-if value="{{hasLine}}" hint-placeholder-val="{{ false }}"><div style="{{lineStyle}}">{{line}}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Bucket"},"value":{"editor":"text","default":""},"state":{"editor":"enum","options":["normal","focused","off","error"],"default":"normal"},"secret":{"editor":"boolean","default":false},"note":{"editor":"text","default":""},"error":{"editor":"text","default":""},"labelHidden":{"editor":"boolean","default":false},"labelWidth":{"editor":"int","default":90},"$preview":{"width":360,"height":50}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'normal';
    const value = this.props.value ?? '';
    const hidden = !!this.props.labelHidden;
    const lw = this.props.labelWidth ?? 90;
    const isError = state === 'error';
    const line = isError ? (this.props.error ?? '') : (this.props.note ?? '');
    const ring = state === 'focused' ? ' box-shadow: 0 0 0 1.5px #EE98C1;' : (isError ? ' box-shadow: 0 0 0 1.5px #F29C9F;' : '');
    return {
      label: this.props.label ?? 'Bucket',
      showLabel: !hidden,
      labelStyle: `width: ${lw}px; flex: none;`,
      shown: this.props.secret && value ? '••••••••••••' : (value || (hidden ? (this.props.label ?? '') : '')),
      fieldStyle: 'flex: 1; min-width: 0; height: 22px; border-radius: 5px; background: #11111B; color: #F2F2F4; font: 12px/22px -apple-system, system-ui, sans-serif; padding: 0 6px; box-sizing: border-box; white-space: nowrap; overflow: hidden;' + ring + (state === 'off' ? ' opacity: 0.4;' : '') + (!value && hidden ? ' color: #6A6A7A;' : ''),
      hasLine: !!line,
      line,
      lineStyle: `padding-left: ${hidden ? 0 : lw + 12}px; font-size: 11px; line-height: 15px; color: ${isError ? '#F29C9F' : '#B1B1BB'};`
    };
  }
}
</script>
</body>
</html>
