<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS controls: Text field states, with label</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.btn{height:22px;padding:0 10px;border-radius:5px;border:0;background:#2D2D40;color:#F2F2F4;font:13px -apple-system,system-ui,sans-serif}
.pri{background:#EE98C1;color:#11111B}
.off{opacity:0.4}
.inp{height:22px;border-radius:5px;background:#11111B;color:#F2F2F4;font:12px/22px -apple-system,system-ui,sans-serif;padding:0 6px;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.focus{box-shadow:0 0 0 1.5px #EE98C1}
.pop{height:22px;padding:0 8px;border-radius:5px;border:0;background:#2D2D40;color:#F2F2F4;font:12px -apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:space-between;gap:8px;box-sizing:border-box}
.box{background:#191925;border-radius:8px;display:flex;flex-direction:column}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:7px 12px;font-size:13px;box-sizing:border-box}
.r+.r{border-top:1px solid rgba(255,255,255,0.07)}
.cap{font:11px/15px ui-monospace,Menlo,monospace;color:#7E9CC9}
.h{font-size:15px;font-weight:700;margin:0 0 4px}
.sec{font-size:13px;font-weight:600}
.cell{display:flex;flex-direction:column;gap:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px}
</style>
</helmet>
<div style="width: 560px; height: 500px; box-sizing: border-box; padding: 28px; background: #232333; color: #F2F2F4; font: 13px -apple-system, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
<div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:22px 20px;align-items:start"><div class="cap">Empty</div><div style="flex: 1; min-width: 0"><dc-import name="TextField" label="Bucket" label-width="{{ 70 }}" hint-size="100%,22px"></dc-import></div><div class="cap">Filled</div><div style="flex: 1; min-width: 0"><dc-import name="TextField" label="Bucket" value="my-bucket" label-width="{{ 70 }}" hint-size="100%,22px"></dc-import></div><div class="cap">Focused</div><div style="flex: 1; min-width: 0"><dc-import name="TextField" label="Bucket" value="my-bucket" state="focused" label-width="{{ 70 }}" hint-size="100%,22px"></dc-import></div><div class="cap">Secret</div><div style="flex: 1; min-width: 0"><dc-import name="TextField" label="Secret" value="x" secret="{{ true }}" label-width="{{ 70 }}" hint-size="100%,22px"></dc-import></div><div class="cap">Off</div><div style="flex: 1; min-width: 0"><dc-import name="TextField" label="Bucket" value="my-bucket" state="off" label-width="{{ 70 }}" hint-size="100%,22px"></dc-import></div><div class="cap">With a note</div><div style="flex: 1; min-width: 0"><dc-import name="TextField" label="Endpoint" value="https://s3.home.lan" note="Your server’s address." label-width="{{ 70 }}" hint-size="100%,40px"></dc-import></div><div class="cap">With an error</div><div style="flex: 1; min-width: 0"><dc-import name="TextField" label="Endpoint" value="s3.home.lan" state="error" error="Not a valid address." label-width="{{ 70 }}" hint-size="100%,40px"></dc-import></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":500}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
