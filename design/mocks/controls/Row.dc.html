<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Row</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#191925}
</style>
</helmet>
<div style="{{rowStyle}}">
<span style="flex: 1; min-width: 0">{{label}}</span><span style="{{trailStyle}}">{{trail}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["text","chevron","choice"],"default":"text"},"label":{"editor":"text","default":"Provider"},"value":{"editor":"text","default":""},"selected":{"editor":"boolean","default":false},"first":{"editor":"boolean","default":true},"$preview":{"width":420,"height":36}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'text';
    const first = this.props.first ?? true;
    const selected = !!this.props.selected;
    return {
      rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 7px 12px; box-sizing: border-box; color: #F2F2F4; font: 13px -apple-system, \'SF Pro Text\', system-ui, sans-serif;' +
        (first ? '' : ' border-top: 1px solid rgba(255,255,255,0.07);') +
        (kind === 'choice' && selected ? ' background: rgba(238,152,193,0.18);' : ''),
      label: this.props.label ?? 'Provider',
      trail: kind === 'chevron' ? '›' : (kind === 'text' ? (this.props.value ?? '') : ''),
      trailStyle: kind === 'chevron' ? 'font-size: 11px; color: #B1B1BB;' : 'color: #B1B1BB;'
    };
  }
}
</script>
</body>
</html>
