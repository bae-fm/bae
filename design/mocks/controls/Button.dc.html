<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#232333}
</style>
</helmet>
<span style="display: inline-flex; align-items: center; font: 13px -apple-system, 'SF Pro Text', system-ui, sans-serif">
<sc-if value="{{isIcon}}" hint-placeholder-val="{{ false }}"><button aria-label="{{label}}" disabled="{{off}}" style="{{iconStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg></button></sc-if>
<sc-if value="{{isText}}" hint-placeholder-val="{{ true }}"><button disabled="{{off}}" style="{{textStyle}}">{{label}}</button></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["primary","secondary","icon"],"default":"secondary"},"label":{"editor":"text","default":"Cancel"},"off":{"editor":"boolean","default":false},"$preview":{"width":120,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'secondary';
    const off = !!this.props.off;
    const dim = off ? ' opacity: 0.4;' : '';
    return {
      label: this.props.label ?? (kind === 'icon' ? 'Copy' : 'Cancel'),
      off,
      isIcon: kind === 'icon',
      isText: kind !== 'icon',
      iconStyle: 'width: 20px; height: 20px; padding: 0; border: 0; border-radius: 4px; background: none; color: #B1B1BB; display: inline-flex; align-items: center; justify-content: center;' + dim,
      textStyle: 'height: 22px; padding: 0 10px; border-radius: 5px; border: 0; font: 13px -apple-system, system-ui, sans-serif; ' +
        (kind === 'primary' ? 'background: #EE98C1; color: #11111B;' : 'background: #2D2D40; color: #F2F2F4;') + dim
    };
  }
}
</script>
</body>
</html>
