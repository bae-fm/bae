<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macOS controls: Lists</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.btn{height:22px;padding:0 10px;border-radius:5px;border:0;background:#2D2D40;color:#F2F2F4;font:13px -apple-system,system-ui,sans-serif}
.pri{background:#EE98C1;color:#11111B}
.off{opacity:0.4}
.inp{height:22px;border-radius:5px;background:#11111B;color:#F2F2F4;font:12px/22px -apple-system,system-ui,sans-serif;padding:0 6px;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.focus{box-shadow:0 0 0 1.5px #EE98C1}
.pop{height:22px;padding:0 8px;border-radius:5px;border:0;background:#2D2D40;color:#F2F2F4;font:12px -apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:space-between;gap:8px;box-sizing:border-box}
.box{background:#191925;border-radius:8px;display:flex;flex-direction:column}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:7px 12px;font-size:13px;box-sizing:border-box}
.r+.r{border-top:1px solid rgba(255,255,255,0.07)}
.cap{font:11px/15px ui-monospace,Menlo,monospace;color:#7E9CC9}
.h{font-size:15px;font-weight:700;margin:0 0 4px}
.sec{font-size:13px;font-weight:600}
.cell{display:flex;flex-direction:column;gap:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px}
</style>
</helmet>
<div style="width: 560px; height: 420px; box-sizing: border-box; padding: 24px; background: #232333; color: #F2F2F4; font: 13px -apple-system, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
<div class="grid"><div class="cell"><div class="sec">Storage</div><div class="box"><div class="r"><span>Provider</span><span style="color:#B1B1BB">iCloud</span></div><div class="r"><span>Status</span><span style="color:#B1B1BB">Syncing…</span></div></div><div class="cap">Section heading over a box of rows</div></div><div class="cell"><div class="box"><div class="r">Family</div><div class="r" style="background:rgba(238,152,193,0.18)">Music</div><div class="r">Photos</div></div><div class="cap">Choice list: one row selected</div></div><div class="cell"><div class="box"><div class="r"><span>Albums</span><span style="font-size:11px;color:#B1B1BB">›</span></div><div class="r"><span>Mixes</span><span style="font-size:11px;color:#B1B1BB">›</span></div></div><div class="cap">Rows that open: ›</div></div><div class="cell"><div class="box" style="height:72px;align-items:center;justify-content:center;color:#B1B1BB">No shared folders yet</div><div class="cap">Empty list</div></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":420}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
