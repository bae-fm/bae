# The claude.ai canvases the boards publish to, split by page, named by
# title on whichever account Claude Code is signed in to.
# `builds design publish-files` reads this file.

[[canvas]]
title = "bae boards: welcome, settings, library"
launch = "welcome"
pages = ["welcome", "settings", "library", "logo"]

[[canvas]]
title = "bae boards: home, import, storage"
launch = "home"
pages = ["home", "loading", "search", "import", "storage", "explore"]

[design_system]
title = "bae"
