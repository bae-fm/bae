# The apps' colors, read by every platform through code theme-gen generates
# from this file and from design/system/tokens.json, which holds the accents
# (see notes/appearance.md). Tones are listed in the order the appearance
# settings offer them; the accents come in tokens.json's order.

# The tone and accent a new installation shows until the person chooses: a tone
# listed below, an accent tokens.json defines. The standard tone also colors
# Android's launch window before the app has read the chosen one.
[standard]
tone = "plum"
accent = "pink"

[[tones]]
name = "neutral"

[tones.light]
background = "#F5F5F5"
surface = "#FAFAFA"
elevated = "#FFFFFF"
field = "#FFFFFF"
fieldHover = "#F7F7F7"
placeholder = "#E5E5E5"
well = "#E8E8E8"
tile = "#FFFFFF"

[tones.dark]
background = "#1B1B1D"
surface = "#232325"
elevated = "#2B2B2E"
field = "#1D1D1F"
fieldHover = "#262629"
placeholder = "#343438"
well = "#151517"
tile = "#3B3B40"

[[tones]]
name = "slate"

