# The apps' colors and measures, read by every platform through code theme-gen
# generates from this file and from design/system/tokens.json, which holds the
# tones, the accents, the text styles, the opacities, the radii, the spacing
# and the icon and size roles (see notes/appearance.md). The appearance settings offer the
# tones and the accents in tokens.json's order.

# The tone and accent a new installation shows until the person chooses: a tone
# and an accent tokens.json defines. The standard tone also colors
# Android's launch window before the app has read the chosen one.
[standard]
tone = "plum"
accent = "pink"

# Colors that mean the same in every tone. Info, uploads and pins have none:
# they draw in the person's accent. `onFill` and `onFillSecondary` sit on
# accent and status fills, on artwork and on the image viewer's `backdrop`;
# `insetPanel` shades the panel inset in a dialog, such as an error's causes.
# `textSecondary` is the secondary text of the Mac and Android apps.
[semantics.light]
textPrimary = "#202124"
textSecondary = "#62656C"
textTertiary = "#42000000"
danger = "#B93A13"
success = "#255117"
warning = "#965818"
# A status icon in each tone: in light mode lighter and more saturated than the
# tone, since a filled shape needs less darkness than text; in dark mode the
# tone (design/system/tokens.json `danger-icon` and the rest).
dangerIcon = "#F84704"
warningIcon = "#C97414"
successIcon = "#029828"
# A toned notice's own colours, from design/system/tokens.json (`danger-notice`
# and the rest). Light: a pale, purer tone under `onNotice` text and the tone's
# icon. Dark: the neutral fill under the screen's text, the glyph alone in the
# tone.
successNotice = "#29029828"
warningNotice = "#2EC97414"
dangerNotice = "#29F84704"
onNotice = "#202124"
# The word under the sheep on Welcome: the outline's plum, which reads on the
# light background (design/system/tokens.json `logo-word`).
logoWord = "#40183D"
# The glow behind the sheep on Welcome, the pool of light under it, and the
# word's edge. The same in both modes; design/system/components/src/90-explorations.css
# draws them as .bae-logo-glow, .bae-logo-pool and .bae-word-lift.
logoGlowCentre = "#52F7A8C4"
logoGlowInner = "#38C98ADD"
logoGlowMiddle = "#1F9B6CF6"
logoGlowOuter = "#0A9B6CF6"
logoPoolCentre = "#29F7A8C4"
logoPoolMiddle = "#0F9B6CF6"
logoWordEdge = "#59FFFFFF"
# The fills made-up releases are drawn in on the Import screen's sheep, in
# every mode the same (design/system/tokens.json `accent-blue-fill` and the
# rest of its tones; they are not the accents the person chooses between).
releaseFillBlue = "#8CAAFE"
releaseFillOrchid = "#D28BFA"
releaseFillPink = "#FF7BB8"
releaseFillLime = "#99BF2C"
releaseFillMint = "#01CC96"
releaseFillSky = "#0DC3DF"
hairline = "#1A000000"
# A text field's edge, softer than hairline (design/system/tokens.json `field-edge`).
fieldEdge = "#14000000"
hairlineStrong = "#2E000000"
hover = "#0F000000"
insetPanel = "#12000000"
pressed = "#17000000"
scrim = "#59000000"
shadow = "#33000000"
backdrop = "#D9000000"
onFill = "#FFFFFF"
onFillSecondary = "#B3FFFFFF"

[semantics.dark]
textPrimary = "#F2F2F4"
textSecondary = "#A8A8B3"
textTertiary = "#6A6A7A"
danger = "#F26877"
success = "#A2F2A1"
warning = "#FBBD7A"
# A status icon in each tone, as in `semantics.light`.
dangerIcon = "#F26877"
warningIcon = "#FBBD7A"
successIcon = "#A2F2A1"
# A toned notice's own colours (see `semantics.light`): every tone has the
# neutral fill, and the text is the screen's.
successNotice = "#24B1B1BB"
warningNotice = "#24B1B1BB"
dangerNotice = "#24B1B1BB"
onNotice = "#F2F2F4"
# The word under the sheep on Welcome: the wool's cream.
logoWord = "#FFFCF4"
# The glow behind the sheep on Welcome, the pool of light under it, and the
# word's edge. The same in both modes; design/system/components/src/90-explorations.css
# draws them as .bae-logo-glow, .bae-logo-pool and .bae-word-lift.
logoGlowCentre = "#52F7A8C4"
logoGlowInner = "#38C98ADD"
logoGlowMiddle = "#1F9B6CF6"
logoGlowOuter = "#0A9B6CF6"
logoPoolCentre = "#29F7A8C4"
logoPoolMiddle = "#0F9B6CF6"
logoWordEdge = "#59FFFFFF"
# The fills made-up releases are drawn in on the Import screen's sheep, in
# every mode the same (design/system/tokens.json `accent-blue-fill` and the
# rest of its tones; they are not the accents the person chooses between).
releaseFillBlue = "#8CAAFE"
releaseFillOrchid = "#D28BFA"
releaseFillPink = "#FF7BB8"
releaseFillLime = "#99BF2C"
releaseFillMint = "#01CC96"
releaseFillSky = "#0DC3DF"
hairline = "#1AFFFFFF"
fieldEdge = "#00FFFFFF"
hairlineStrong = "#2EFFFFFF"
hover = "#0FFFFFFF"
insetPanel = "#47000000"
pressed = "#17FFFFFF"
scrim = "#73000000"
shadow = "#80000000"
backdrop = "#D9000000"
onFill = "#FFFFFF"
onFillSecondary = "#B3FFFFFF"
