# Colors that mean the same in every tone. `activity` marks work in progress,
# such as a transfer, an upload among them; `pinning` marks files downloading
# to stay on this device; `onFill` and `onFillSecondary` sit on accent and
# status fills, on artwork and on the image viewer's `backdrop`; `insetPanel`
# shades the panel inset in a dialog, such as an error's causes.
# `textSecondary` is Android's: macOS draws secondary text in the system's own
# secondary label colour, which follows Increase Contrast and vibrancy, and the
# design system's `mac-text-secondary` draws that colour on the canvas.
[semantics.light]
textPrimary = "#202124"
textSecondary = "#62656C"
textTertiary = "#42000000"
danger = "#B63B3B"
success = "#2D7447"
warning = "#8C5D14"
info = "#2463C7"
# A status icon in each tone: in light mode lighter and more saturated than the
# tone, since a filled shape needs less darkness than text; in dark mode the
# tone, danger mixed toward secondary text (design/system/tokens.json
# `danger-icon` and the rest).
dangerIcon = "#DB383D"
warningIcon = "#C17900"
infoIcon = "#1380FF"
successIcon = "#269F5A"
# A toned notice's own colours, from design/system/tokens.json (`info-notice`
# and the rest). Light: a pale, purer tone under `onNotice` text and the tone's
# icon. Dark: the neutral fill under the screen's text, the glyph alone in the
# tone.
infoNotice = "#293278F0"
successNotice = "#2E28AA5A"
warningNotice = "#38F0A500"
dangerNotice = "#29E63C3C"
onNotice = "#202124"
activity = "#1F7274"
pinning = "#4553B5"
# The word under the sheep on Welcome: the outline's plum, which reads on the
# light background (design/system/tokens.json `logo-word`).
logoWord = "#40183D"
# The glow behind the sheep on Welcome, the pool of light under it, and the
# word's edge. The same in both modes; design/system/components/src/90-explorations.css
# draws them as .bae-logo-glow, .bae-logo-pool and .bae-word-lift.
logoGlowCentre = "#52F7A8C4"
logoGlowInner = "#38C98ADD"
logoGlowMiddle = "#1F9B6CF6"
logoGlowOuter = "#0A9B6CF6"
logoPoolCentre = "#29F7A8C4"
logoPoolMiddle = "#0F9B6CF6"
logoWordEdge = "#59FFFFFF"
# The fills made-up releases are drawn in on the Import screen's sheep, in
# every mode the same (design/system/tokens.json `accent-blue-fill` and the
# rest of its tones; they are not the accents the person chooses between).
releaseFillBlue = "#8CAAFE"
releaseFillOrchid = "#D28BFA"
releaseFillPink = "#FF7BB8"
releaseFillCoral = "#FE8768"
releaseFillGold = "#DFA206"
releaseFillLime = "#99BF2C"
releaseFillMint = "#01CC96"
releaseFillSky = "#0DC3DF"
hairline = "#1A000000"
# A text field's edge, softer than hairline (design/system/tokens.json `field-edge`).
fieldEdge = "#14000000"
hairlineStrong = "#2E000000"
hover = "#0F000000"
insetPanel = "#12000000"
pressed = "#17000000"
scrim = "#59000000"
shadow = "#33000000"
backdrop = "#D9000000"
onFill = "#FFFFFF"
onFillSecondary = "#B3FFFFFF"

[semantics.dark]
textPrimary = "#F2F2F4"
textSecondary = "#A8A8B3"
textTertiary = "#6A6A7A"
danger = "#F06A7A"
success = "#8BCBA4"
warning = "#E6BE77"
info = "#87B5FF"
# A status icon in each tone: in light mode lighter and more saturated than the
# tone, since a filled shape needs less darkness than text; in dark mode the
# tone, danger mixed toward secondary text (design/system/tokens.json
# `danger-icon` and the rest).
dangerIcon = "#DB848E"
warningIcon = "#E6BE77"
infoIcon = "#87B5FF"
successIcon = "#8BCBA4"
# A toned notice's own colours (see `semantics.light`): every tone has the
# neutral fill, and the text is the screen's.
infoNotice = "#24B1B1BB"
successNotice = "#24B1B1BB"
warningNotice = "#24B1B1BB"
dangerNotice = "#24B1B1BB"
onNotice = "#F2F2F4"
activity = "#80CCCE"
pinning = "#A9B8FF"
# The word under the sheep on Welcome: the wool's cream.
logoWord = "#FFFCF4"
# The glow behind the sheep on Welcome, the pool of light under it, and the
# word's edge. The same in both modes; design/system/components/src/90-explorations.css
# draws them as .bae-logo-glow, .bae-logo-pool and .bae-word-lift.
logoGlowCentre = "#52F7A8C4"
logoGlowInner = "#38C98ADD"
logoGlowMiddle = "#1F9B6CF6"
logoGlowOuter = "#0A9B6CF6"
logoPoolCentre = "#29F7A8C4"
logoPoolMiddle = "#0F9B6CF6"
logoWordEdge = "#59FFFFFF"
# The fills made-up releases are drawn in on the Import screen's sheep, in
# every mode the same (design/system/tokens.json `accent-blue-fill` and the
# rest of its tones; they are not the accents the person chooses between).
releaseFillBlue = "#8CAAFE"
releaseFillOrchid = "#D28BFA"
releaseFillPink = "#FF7BB8"
releaseFillCoral = "#FE8768"
releaseFillGold = "#DFA206"
releaseFillLime = "#99BF2C"
releaseFillMint = "#01CC96"
releaseFillSky = "#0DC3DF"
hairline = "#1AFFFFFF"
fieldEdge = "#00FFFFFF"
hairlineStrong = "#2EFFFFFF"
hover = "#0FFFFFFF"
insetPanel = "#47000000"
pressed = "#17FFFFFF"
scrim = "#73000000"
shadow = "#80000000"
backdrop = "#D9000000"
onFill = "#FFFFFF"
onFillSecondary = "#B3FFFFFF"

# A color laid over a surface: `tint` behind that color's own text, as in a
# status chip, a notice or a selection; `tintStrong` where it must read stronger,
# as under the pointer.
[opacity]
tint = 0.14
tintStrong = 0.26

# Corner radii, in points on Apple and dp on Android. `artwork` is cover art in
# rows and lists, `cover` a release's cover shown large; `bar` rounds skeleton
# and progress bars; `field` rounds a text field.
[radius]
bar = 3
chip = 5
control = 7
field = 8
card = 10
panel = 20
artwork = 6
cover = 10

# Text styles. Weight, tracking (letter spacing) and monospacing are the
# same on every platform; the size is points on macOS, a Dynamic Type style on
# iOS so text follows the person's text size, and sp on Android.
[text.hero]
weight = "bold"
tracking = -0.5
macos = 30
ios = "title"
android = 24
android_line = 30

[text.title]
weight = "bold"
tracking = -0.3
macos = 22
ios = "title2"
android = 22
android_line = 28

[text.heading]
weight = "semibold"
macos = 15
ios = "headline"
android = 16

[text.rowTitle]
weight = "medium"
macos = 13
ios = "body"
android = 16
android_line = 24

[text.strong]
weight = "semibold"
macos = 13
ios = "body"
android = 14
android_line = 20

[text.body]
weight = "regular"
macos = 13
ios = "body"
android = 14
android_line = 20

[text.detail]
weight = "regular"
macos = 11.5
ios = "caption"
android = 12
android_line = 16

# A Mac alert's message: regular 11, a half point under `detail`, as the
# design's alert sets it.
[text.alertMessage]
weight = "regular"
macos = 11
ios = "caption"

[text.fine]
weight = "regular"
macos = 10
ios = "caption2"
android = 11

[text.chip]
weight = "semibold"
macos = 10.5
ios = "caption2"
android = 11

[text.eyebrow]
weight = "semibold"
macos = 11
ios = "caption2"

# A card's section heading on Android (Material's list section header), in the
# accent colour and sentence case. A role names only the platforms that use it:
# macOS and iOS together, and Android. `android_line` is Android's line height
# in sp, for a role whose lines are not the font's own height.
[text.section]
weight = "medium"
android = 14
android_line = 20

# Android's row title: regular, 16 over a 24 line, as the design's row sets it;
# an action row is medium, which is `rowTitle`.
[text.androidRowTitle]
weight = "regular"
android = 16
android_line = 24

# Android's eyebrow, the label that names a side or disc above its tracks:
# medium 14 over a 20 line in sentence case, with no letter spacing.
[text.androidEyebrow]
weight = "medium"
android = 14
android_line = 20

# Android's large body text: regular, 16 over a 24 line, with no letter spacing,
# as the design sets the welcome's tagline and a failed screen's centred notice.
[text.androidBodyLarge]
weight = "regular"
android = 16
android_line = 24

# Android's top bar title: regular, 22 over a 28 line, on the page colour.
[text.androidBarTitle]
weight = "regular"
android = 22
android_line = 28

[text.mono]
weight = "regular"
monospaced = true
macos = 12
ios = "footnote"
android = 15
android_line = 24

# The library's page heading at its largest, before it shrinks to `title` as
# the page scrolls.
[text.display]
weight = "heavy"
tracking = -1.1
macos = 46
ios = "largeTitle"
android = 32

# Gaps and insets, the same on every platform (points on Apple, dp on
# Android): `line` between the lines of one text block, `inline` between a
# glyph and its text, `related` between related items, `group` between groups,
# `fieldInset` from a text field's edge to its text, `edge` from a container's
# edge to its content, `section` between sections and `page` around a page.
[space]
hairline = 1
line = 2
inline = 4
compact = 6
related = 8
group = 12
fieldInset = 10
edge = 16
section = 24
page = 32

# Glyph sizes, which each platform sets by its own convention: SF Symbols in
# points on macOS and iOS, Material icons in dp. `hero` marks an empty or
# failed state.
[icon.badge]
weight = "bold"
macos = 8.5
ios = 9
android = 12

[icon.small]
weight = "semibold"
macos = 11
ios = 13
android = 16

[icon.medium]
weight = "semibold"
macos = 13
ios = 17
android = 20

[icon.large]
weight = "medium"
macos = 17
ios = 22
android = 24

# The lightbox's close glyph, arrows and "Browse all images" glyph, as the
# design's stage draws them.
[icon.stageClose]
weight = "semibold"
macos = 15
ios = 17
android = 20

[icon.stageBrowse]
weight = "regular"
macos = 12
ios = 13
android = 16

[icon.stageArrow]
weight = "medium"
macos = 22
ios = 22
android = 24

[icon.hero]
weight = "thin"
macos = 44
ios = 56
android = 56

# Sizes that recur across screens: cover art in a list row and in the
# now-playing bar, a text field's height, and the least an icon button takes to
# press.
[size.rowArtwork]
macos = 44
ios = 44
android = 48

[size.barArtwork]
macos = 56
ios = 44
android = 48

[size.field]
macos = 32
ios = 44
android = 56

[size.lead]
# The leading column of a list row: the icon or status glyph before its text.
# On macOS a notice's glyph column is as wide, so titles, a notice's words and
# file names share one edge; Android's is Material's list-item icon.
macos = 16
ios = 24
android = 24

[size.hitTarget]
macos = 28
ios = 44
android = 44
