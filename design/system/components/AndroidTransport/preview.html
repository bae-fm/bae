<!doctype html>
<html>
<head><meta charset="utf-8"><title>AndroidTransport</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap"></head>
<body class="bae-preview bae-preview-android" style="">
<div id="root" style="display: contents"></div>
<script>
  var B = window.Bae, h = React.createElement;
  function N(n, c) { return h('div', { className: 'bae-preview-row' }, h('div', { className: 'bae-preview-name', 'aria-hidden': true }, n), h('div', { className: 'bae-preview-cell' }, c)); }
  function W(n, c) { return h('div', { className: 'bae-preview-row bae-preview-row-wide' }, h('div', { className: 'bae-preview-name', 'aria-hidden': true }, n), h('div', { className: 'bae-preview-cell' }, c)); }
  function slot(t) { return h('div', { className: 'bae-preview-slot' }, t || 'Content'); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    N('Paused', h(B.AndroidTransport, {})),
    N('Playing', h(B.AndroidTransport, { playing: true })),
    N('Waiting', h(B.AndroidTransport, { playing: true, waiting: true })),
    W('Large', h(B.AndroidTransport, { large: true, playing: true }))));
</script>
</body>
</html>
