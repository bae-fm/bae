<!doctype html>
<html>
<head><meta charset="utf-8"><title>MacAlbumPicker</title></head>
<body class="bae-preview bae-mac" style="">
<div id="root" style="display: contents"></div>
<script>
  var B = window.Bae, h = React.createElement;
  function N(n, c) { return h('div', { className: 'bae-preview-row' }, h('div', { className: 'bae-preview-name', 'aria-hidden': true }, n), h('div', { className: 'bae-preview-cell' }, c)); }
  function W(n, c) { return h('div', { className: 'bae-preview-row bae-preview-row-wide' }, h('div', { className: 'bae-preview-name', 'aria-hidden': true }, n), h('div', { className: 'bae-preview-cell' }, c)); }
  function box(w, c) { return h('div', { style: { width: w, flex: 'none' } }, c); }

  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    N('New album', h(B.MacAlbumPicker, { album: 'New album' })),
    N('Library album', h(B.MacAlbumPicker, { album: 'Low Tide Hours · Mara Quill', inLibrary: true })),
    N('Open on a library album', h('div', { style: { height: 130 } }, h(B.MacAlbumPicker, { album: 'Low Tide Hours · Mara Quill', inLibrary: true, open: true }))),
    N('Open on a new album', h('div', { style: { height: 110 } }, h(B.MacAlbumPicker, { album: 'New album', open: true }))),
    N('Open on a picked album', h('div', { style: { height: 150 } }, h(B.MacAlbumPicker, { album: 'Small Hours · Tomas Brell', inLibrary: true, picked: true, open: true })))));
</script>
</body>
</html>
