<!doctype html>
<html>
<head><meta charset="utf-8"><title>MacPressingRow</title></head>
<body class="bae-preview" style="">
<div id="root" style="display: contents"></div>
<script>
  var B = window.Bae, h = React.createElement;
  function W(n, c) { return h('div', { className: 'bae-preview-row bae-preview-row-wide' }, h('div', { className: 'bae-preview-name', 'aria-hidden': true }, n), h('div', { className: 'bae-preview-cell' }, c)); }
  function box(w, c) { return h('div', { style: { width: w } }, c); }
  function row(props) {
    return box(900, h(B.MacPressingTable, { kinds: 'Disc ID,Barcode,Catalog #' }, h(B.MacPressingRow, Object.assign({ year: '1992', label: 'Harbor Records', catalog: 'HR-1042', country: 'US', format: 'CD', details: 'Club Edition' }, props))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    W('Plain', row({})),
    W('Matches', row({ matches: 'Disc ID,Barcode' })),
    W('Selected', row({ matches: 'Disc ID,Barcode', selected: true })),
    W('In library', row({ inLibrary: true })),
    W('Records differ', row({ year: '1992:MusicBrainz|1993:Discogs' })),
    W('Notes', row({ notes: 'first pressing' })),
    W('Year unknown', row({ year: '' }))));
</script>
</body>
</html>
