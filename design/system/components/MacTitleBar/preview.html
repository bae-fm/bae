<!doctype html>
<html>
<head><meta charset="utf-8"><title>MacTitleBar</title></head>
<body class="bae-preview" style="">
<div id="root" style="display: contents"></div>
<script>
  var B = window.Bae, h = React.createElement;
  function N(n, c) { return h('div', { className: 'bae-preview-row' }, h('div', { className: 'bae-preview-name', 'aria-hidden': true }, n), h('div', { className: 'bae-preview-cell' }, c)); }
  // Each bar is as wide as the main window's preview draws it, 1100pt, which is wider than the window's 900pt minimum, so the page scrolls sideways in a narrow column instead of squeezing the bar.
  function W(n, c) { return h('div', { className: 'bae-preview-row bae-preview-row-wide' }, h('div', { className: 'bae-preview-name', 'aria-hidden': true }, n), h('div', { className: 'bae-preview-cell bae-preview-cell-fit' }, h('div', { style: { width: 1100, flex: 'none' } }, c))); }
  function slot(t) { return h('div', { className: 'bae-preview-slot' }, t || 'Content'); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    W('Library', h(B.MacTitleBar, { section: 'Library' })),
    W('Import', h(B.MacTitleBar, { section: 'Import' })),
    W('Searching', h(B.MacTitleBar, Object.assign({ section: 'Library' }, { search: 'harbor', searchFocused: true }))),
    W('Moving', h(B.MacTitleBar, Object.assign({ section: 'Library' }, { sync: 'moving' }))),
    W('Attention', h(B.MacTitleBar, Object.assign({ section: 'Library' }, { sync: 'attention' }))),
    W('Paused', h(B.MacTitleBar, Object.assign({ section: 'Library' }, { sync: 'paused' }))),
    W('Picture', h(B.MacTitleBar, Object.assign({ section: 'Library' }, { avatarImage: 'Ana' })))));
</script>
</body>
</html>
