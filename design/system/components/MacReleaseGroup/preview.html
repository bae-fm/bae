<!doctype html>
<html>
<head><meta charset="utf-8"><title>MacReleaseGroup</title></head>
<body class="bae-preview" style="">
<div id="root" style="display: contents"></div>
<script>
  var B = window.Bae, h = React.createElement;
  function W(n, c) { return h('div', { className: 'bae-preview-row bae-preview-row-wide' }, h('div', { className: 'bae-preview-name', 'aria-hidden': true }, n), h('div', { className: 'bae-preview-cell' }, c)); }
  function box(w, c) { return h('div', { style: { width: w } }, c); }
  function group(rows) {
    return box(900, h(B.MacPressingTable, { kinds: 'Disc ID,Barcode' }, h(B.MacReleaseGroup, { title: 'Low Tide Hours', artist: 'Mara Quill' }, rows)));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    W('One pressing', group(h(B.MacPressingRow, { year: '1992', label: 'Harbor Records', catalog: 'HR-1042', country: 'US', format: 'CD', matches: 'Disc ID,Barcode', selected: true }))),
    W('Several pressings', group([
      h(B.MacPressingRow, { key: 1, year: '1992', label: 'Harbor Records', catalog: 'HR-1042', country: 'US', format: 'CD', matches: 'Disc ID,Barcode' }),
      h(B.MacPressingRow, { key: 2, year: '1992', label: 'Harbor Records', catalog: 'HR-1042', country: 'Europe', format: 'CD', details: 'Club edition', matches: 'Barcode' }),
      h(B.MacPressingRow, { key: 3, year: '2014', label: 'Harbor Records', catalog: 'HRLP-1042', format: 'Vinyl', details: 'Reissue', inLibrary: true })]))));
</script>
</body>
</html>
