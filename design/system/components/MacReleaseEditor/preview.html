<!-- @dsCard group="Import" height=11450 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>MacReleaseEditor</title></head>
<body class="bae-preview bae-mac" style="">
<div id="root" style="display: contents"></div>
<script>
  var B = window.Bae, h = React.createElement;
  function W(n, c) { return h('div', { className: 'bae-preview-row bae-preview-row-wide' }, h('div', { className: 'bae-preview-name', 'aria-hidden': true }, n), h('div', { className: 'bae-preview-cell' }, c)); }
  function box(w, c) { return h('div', { style: { width: w, flex: 'none' } }, c); }

  function editor(options) {
    if (options.unread) return box(720, h(B.MacReleaseEditor, { actions: 'import', blank: true }));
    var props = {
      actions: 'import', cover: 'Northbound', audio: 'FLAC · 44.1 kHz · 16-bit · Stereo',
      images: 'Northbound|cover.jpg', files: 'Northbound.flac|121 MB|other,Northbound.log|4 KB'
    };
    if (!options.blank) Object.assign(props, {
      album: 'Northbound · Mara Quill', albumInLibrary: true, title: 'Northbound', artist: 'Mara Quill',
      year: '1974', pressingYear: '1974', media: 'CD', labels: 'Harbor Records|HR-0412',
      country: 'United States', status: 'Official', records: 'MusicBrainz'
    });
    function track(start, position, title, length, listed) {
      return h(B.MacImportTrackRow, { start: start, position: position, title: options.blank ? '' : title,
        inherited: !options.blank, length: length, listed: options.check || options.blank ? null : listed });
    }
    return box(720, h(B.MacReleaseEditor, Object.assign(props, options),
      h(B.MacImportSheetCaption, { disc: 'Disc 1', sheet: 'Northbound.cue', bound: 'Northbound (2019 rip).flac' }),
      track('0:00', '1', 'Northbound', '4:51'), track('4:51', '2', 'Margins', '3:58'),
      track('8:49', '3', 'Salt Road', '5:20', '5:27'), track('14:09', '4', 'Winter Light', '4:07')));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    W('Import', editor({})),
    W('Two labels', editor({ labels: 'Harbor Records|HR-0412,Tidewater Music|TW-88' })),
    W('Import to the cloud', editor({ cloud: true, to: 'Cloud' })),
    W('Import with a folder check', editor({ check: 'The release lists no tracks' })),
    W('Import, audio left out', editor({ leftOut: '05 Northbound (demo).flac,06 Margins (live).flac' })),
    W('Retry import', editor({ retry: true })),
    W('Nothing to import', editor({ blank: true })),
    W('Import, nothing read', editor({ unread: true })),
    W('Save', editor({ actions: 'save' })),
    W('Save, changed', editor({ actions: 'save', changed: true })),
    W('Save, reading a file', editor({ actions: 'save', changed: true, reading: 'Reading Northbound (2019 rip).flac…' })),
    W('Save, album picker open', editor({ actions: 'save', albumOpen: true }))));
</script>
</body>
</html>
