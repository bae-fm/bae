<!-- @dsCard group="macOS" height=820 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>MacNotice</title></head>
<body class="bae-preview" style="">
<div id="root" style="display: contents"></div>
<script>
  var B = window.Bae, h = React.createElement, N = B.MacNotice;
  function W(n, c) { return h('div', { className: 'bae-preview-row bae-preview-row-wide' }, h('div', { className: 'bae-preview-name' }, n), h('div', { className: 'bae-preview-cell' }, c)); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    W('Info', h(N, { tone: 'info', title: 'A newer version of this release is on Discogs.' })),
    W('Success', h(N, { tone: 'success', title: 'Storage connected.' })),
    W('Warning', h(N, { tone: 'warning', title: 'Unsent changes will be lost' })),
    W('Neutral', h(N, { title: 'This library has no albums yet.' })),
    W('Danger', h(N, { tone: 'danger', title: 'Couldn’t reach your storage.' })),
    W('With Retry', h(N, { tone: 'danger', title: 'Couldn’t reach your storage.', action: 'Retry' })),
    W('Title and subtitle', h(N, { tone: 'warning', title: 'Mara Quill’s phone is out of date', subtitle: 'Update bae on it to keep syncing.' })),
    W('Quiet, with ×', h(N, { quiet: true, dismiss: true, tone: 'danger', title: 'Couldn’t close the library' })),
    W('Outlined, Dismiss and Retry', h(N, { outlined: true, dismiss: 'button', tone: 'danger', title: 'Couldn’t read the rest of the queue.', action: 'Retry' })),
    W('Title and subtitle, danger', h(N, { tone: 'danger', title: 'bae couldn’t open your library', subtitle: 'Check your connection, then quit and reopen bae.' }))));
</script>
</body>
</html>
