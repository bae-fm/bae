<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusChip</title></head>
<body class="bae-preview" style="flex-direction: row; align-items: center; flex-wrap: wrap;">
<div id="root" style="display: contents"></div>
<script>
  var B = window.Bae, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, h(B.StatusChip, { tone: 'success' }, 'Synced'), h(B.StatusChip, { tone: 'warning' }, 'Offline'), h(B.StatusChip, { tone: 'danger' }, 'Storage full'), h(B.StatusChip, { tone: 'activity' }, 'Uploading'), h(B.StatusChip, null, 'Owner')));
</script>
</body>
</html>
