<!doctype html>
<html>
<head><meta charset="utf-8"><title>MacFileNameField</title></head>
<body class="bae-preview bae-mac" style="">
<div id="root" style="display: contents"></div>
<script>
  var B = window.Bae, h = React.createElement;
  function W(n, c) { return h('div', { className: 'bae-preview-row bae-preview-row-wide' }, h('div', { className: 'bae-preview-name', 'aria-hidden': true }, n), h('div', { className: 'bae-preview-cell' }, c)); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    W('File name', h(B.MacBox, null, h(B.MacFileNameField, { label: 'File name', pattern: '[Track №] [Title]', add: 'Artist,Album,Album year,Release year,Disc №,Track total', preview: '04 Low Tide Hours.flac' }))),
    W('Typed text', h(B.MacBox, null, h(B.MacFileNameField, { label: 'Folder name', pattern: '[Artist] - [Album]', add: 'Album year,Release year,Label,Catalog number', preview: 'Mara Quill - Low Tide Hours' }))),
    W('Error', h(B.MacBox, null, h(B.MacFileNameField, { label: 'Folder name', pattern: '[Artist] / [Album]', add: 'Album year,Release year,Label,Catalog number', error: 'A name cannot contain “/”.' })))));
</script>
</body>
</html>
