<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusGlyph</title></head>
<body class="bae-preview" style="">
<div id="root" style="display: contents"></div>
<script>
  var B = window.Bae, h = React.createElement;
  function N(n, c) { return h('div', { className: 'bae-preview-row' }, h('div', { className: 'bae-preview-name', 'aria-hidden': true }, n), h('div', { className: 'bae-preview-cell', style: { display: 'flex', gap: 16, alignItems: 'center' } }, c)); }
  var tones = ['info', 'success', 'warning', 'danger'];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    N('macOS', tones.map(function (t) { return h(B.StatusGlyph, { key: t, tone: t, set: 'mac', size: 'large', weight: 'medium' }); })),
    N('Regular', tones.map(function (t) { return h(B.StatusGlyph, { key: t, tone: t, set: 'mac', size: 'large', weight: 'regular' }); })),
    N('Semibold', tones.map(function (t) { return h(B.StatusGlyph, { key: t, tone: t, set: 'mac', size: 'large', weight: 'semibold' }); })),
    N('Framed', tones.map(function (t) { return h(B.StatusGlyph, { key: t, tone: t, set: 'mac', size: 'large', weight: 'medium', frame: [24, 24] }); })),
    N('Muted', tones.map(function (t) { return h(B.StatusGlyph, { key: t, tone: t, set: 'mac', size: 'large', weight: 'medium', muted: true }); })),
    N('Android', tones.map(function (t) { return h(B.StatusGlyph, { key: t, tone: t, size: 'large' }); })),
    N('Ring', tones.map(function (t) { return h(B.StatusGlyph, { key: t, tone: t, set: 'ring', size: 'large' }); })),
    N('Inline', tones.map(function (t) { return h(B.StatusGlyph, { key: t, tone: t, set: 'ring', inline: true }); }))));
</script>
</body>
</html>
