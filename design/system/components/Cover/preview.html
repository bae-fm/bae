<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bae</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--background); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .accent { fill: var(--accent); }
  .bar { fill: var(--surface); }
  .tx { fill: var(--text-primary); opacity: .8; }
  .tx2 { fill: var(--text-secondary); opacity: .6; }
  .track { fill: var(--text-secondary); opacity: .3; }
  .held { fill: var(--text-secondary); opacity: .55; }
  .ph { fill: var(--placeholder); }
  .ok { fill: var(--success); }
  .cov { rx: var(--radius-artwork); }
  .chip { rx: var(--radius-chip); }
  .words { position: absolute; left: 0; top: 0; bottom: 0; width: 480px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .tag { margin: var(--space-related) 0 0; font-size: 14px; line-height: 20px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  library     one row of four covers at 80, a 104 pitch, the second in accent: the album playing
  bar         the now-playing bar floating under them on the surface: its cover, title and artist lines, the seek line (accent played, lighter downloaded, faint rest), the Synced chip
  scales      gutters space-edge; corners radius-artwork on covers, radius-chip on the chip, 14 on the bar
-->
<rect class="ph cov" x="40" y="64" width="80" height="80" rx="6"/>
<rect class="accent cov" x="144" y="64" width="80" height="80" rx="6"/>
<rect class="ph cov" x="248" y="64" width="80" height="80" rx="6"/>
<rect class="ph cov" x="352" y="64" width="80" height="80" rx="6"/>
<rect class="bar" x="24" y="184" width="432" height="56" rx="14"/>
<rect class="accent cov" x="34" y="192" width="40" height="40" rx="6"/>
<rect class="tx" x="86" y="200" width="88" height="8" rx="4"/>
<rect class="tx2" x="86" y="216" width="56" height="8" rx="4"/>
<rect class="track" x="194" y="210" width="192" height="4" rx="2"/>
<rect class="held" x="194" y="210" width="144" height="4" rx="2"/>
<rect class="accent" x="194" y="210" width="86" height="4" rx="2"/>
<circle class="accent" cx="280" cy="212" r="6"/>
<rect class="ok chip" x="398" y="204" width="44" height="16" rx="5"/>
</svg>
</div>
<div class="words">
<div id="logo"></div>
<p class="tag">Your music, everywhere</p>
</div>
</div>
<script>
  ReactDOM.createRoot(document.getElementById('logo')).render(React.createElement(window.Bae.Logo, { kind: 'pair', size: 150 }));
</script>
</body>
</html>
