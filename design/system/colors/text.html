<style>

</style>
<div class="t-win">

    <span style="font-size: 13px; color: var(--text-secondary)" data-color="text-secondary" data-point="below">Artist Name</span>
    <span style="font-size: 13px; color: var(--text-tertiary)" data-color="text-tertiary" data-point="below">Search</span>
  </div>
  <span class="t-word" data-color="logo-word"><span data-component="Bae.Logo" data-props='{"kind": "word", "size": 100}'></span></span>
