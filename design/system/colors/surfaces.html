<style>
.s-win { width: 300px; box-sizing: border-box; padding: 16px 16px 40px; background: var(--background); border-radius: 8px; }
.s-box { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 12px 14px; background: var(--surface); border-radius: 8px; }
.s-field { height: 24px; padding: 0 8px; border-radius: 6px; background: var(--field); box-shadow: inset 0 0 0 1px var(--field-edge); font-size: 12px; line-height: 24px; }
.s-row { display: flex; gap: 10px; align-items: center; }
.s-art { width: 36px; height: 36px; border-radius: 4px; background: var(--placeholder); }
.s-title { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.s-sub { font-size: 12px; color: var(--text-secondary); }
.s-well { height: 4px; border-radius: 2px; background: var(--well); }
.s-well div { width: 40%; height: 4px; border-radius: 2px; background: var(--accent-fill); }
.s-button { width: 64px; height: 24px; border-radius: 6px; background: var(--control); box-shadow: 0 0 0 0.5px var(--control-edge), 0 0.5px 1px var(--control-edge); font-size: 12px; line-height: 24px; text-align: center; color: var(--text-primary); }
.s-pop { position: absolute; right: -10px; bottom: -28px; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; border-radius: 8px; background: var(--elevated); box-shadow: 0 6px 18px var(--shadow), 0 0 0 1px var(--hairline); font-size: 12px; white-space: nowrap; color: var(--text-primary); }
</style>
<div class="s-win" data-color="background">
  <div class="s-box" data-color="surface">
    <div class="s-field" data-color="field"><span style="color: var(--text-tertiary)" data-color="text-tertiary" data-point="below">Search</span></div>
    <div class="s-field"><span style="color: var(--text-primary)" data-color="text-primary" data-point="below">Album Title</span></div>
    <div class="s-row"><div class="s-art" data-color="placeholder"></div><div><div class="s-title">Album Title</div><div class="s-sub">Artist Name</div></div></div>
    <div class="s-well" data-color="well"><div></div></div>
    <div class="s-button" data-color="control">Edit</div>
    <div class="s-pop" data-color="elevated"><div>Play next</div><div>Add to playlist</div></div>
  </div>
</div>
