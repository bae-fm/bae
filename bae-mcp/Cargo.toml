[package]
name = "bae-mcp"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_mcp"
path = "src/lib.rs"

[dependencies]
bae-automation = { workspace = true }
bae-diagnostics = { workspace = true }
# The MCP server's settings.
bae-preferences = { workspace = true }
bae-util = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "rt", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
# The bug reporter a test reads what was reported from.
bae-diagnostics = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
