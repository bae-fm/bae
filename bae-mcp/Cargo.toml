[package]
name = "bae-mcp"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-UNLICENSED"
publish = false

[lib]
name = "bae_mcp"
path = "src/lib.rs"

[dependencies]
bae-automation = { path = "../bae-automation" }
bae-core = { path = "../bae-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "1.8.0", features = ["server", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "rt", "macros"] }
tokio-util = "0.7"
tracing = { workspace = true }

[lints]
workspace = true
